}

function VConvite({ estado, eu, executar }) {
  const [texto, setTexto] = useState('');
  const [erro, setErro] = useState(null);
  const pessoa = pessoaDaUnidade(estado, eu);

  function pedir() {
    const r = executar((e) => pedirParaVender(e, eu, texto, new Date()));
    setErro(r.erro || null);
  }

  if (pessoa.vendedor === 'pendente') {
    return html`<div class="cartao"><strong>Aguardando aprovação do síndico</strong><span class="sub">Você pediu para vender: ${pessoa.pedidoVenda.texto}</span></div>`;
  }
  if (pessoa.vendedor === 'suspenso') {
    return html`<p class="erro">Suas vendas estão suspensas pelo síndico. Motivo: ${pessoa.motivoVendedor}</p>`;
  }
  return html`<div class="pilha">
    <div class="convite">
      <${QuadroIcone} nome="loja" />
      <div><strong>Quer vender para os vizinhos?</strong><span class="sub">Doces, salgados, artesanato, desapego ou serviços. O síndico aprova e você começa a anunciar.</span></div>
    </div>
    ${pessoa.motivoVendedor && html`<p class="erro">Pedido anterior recusado: ${pessoa.motivoVendedor}</p>`}
    <${Campo} rotulo="O que você pretende vender?"><textarea id="convite-texto" rows="3" value=${texto} onInput=${(ev) => setTexto(ev.target.value)} placeholder="Ex.: bolos caseiros por encomenda"></textarea><//>
    <${Erro} texto=${erro} />
    <button type="button" class="btn primario bloco" onClick=${pedir}>Pedir para vender</button>
  </div>`;
}

// ---- src/ui/morador.js ----

const ABAS_MORADOR = [['inicio', 'Início', 'casa'], ['financeiro', 'Financeiro', 'cifrao'], ['reservas', 'Reservas', 'calendario'], ['ocorrencias', 'Ocorrências', 'prancheta'], ['vendas', 'Vendas', 'loja'], ['mais', 'Mais', 'menu']];

function relogio(d) {
  return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}

function lerConvidados(texto) {
  return texto.split('\n').map((l) => l.trim()).filter(Boolean).map((linha) => {
    const [nome, ...resto] = linha.split(',');
    return { nome: nome.trim(), documento: resto.join(',').trim() || 'não informado' };
  });
}

function textoAntecedencia(area) {
  const limite = area.limiteMes ? ` · até ${area.limiteMes} por mês` : '';
  return area.antecedenciaMin === 0
    ? `Reserve com até ${area.antecedenciaMax} dias de antecedência${limite}`
    : `Reserve de ${area.antecedenciaMin} a ${area.antecedenciaMax} dias antes${limite}`;
}

function tipoEtiquetaAviso(c) {
  return c.tipo === 'urgente' ? 'perigo' : 'info';
}

// Na demonstração, as três pessoas de sempre; num condomínio implantado, os moradores ativos (até seis).
function personasMorador(estado) {
  if (estado.origem !== 'novo') return MORADORES_DEMO;
  const vistos = new Set();
  return estado.pessoas.filter((p) => p.situacao === 'ativo' && !vistos.has(p.unidade) && vistos.add(p.unidade)).slice(0, 6).map((p) => [p.unidade, p.nome.split(' ')[0]]);
}

function TelaMorador(props) {
  const eu = props.estado.moradorAtual;
  const telas = { inicio: MInicio, reservas: MReservas, avisos: MAvisos, ocorrencias: MOcorrencias, mais: MMais, documentos: MDocumentos, encomendas: MEncomendas, preferencias: MPreferencias, vendas: TelaVendas, financeiro: MFinanceiro, prestacao: MPrestacao, enquetes: MEnquetes, convite: MConvite };
  const Conteudo = telas[props.rota.tela] || MInicio;
  const aba = ['documentos', 'encomendas', 'preferencias', 'avisos', 'prestacao', 'enquetes'].includes(props.rota.tela) ? 'mais' : props.rota.tela;
  return html`<div class="celular">
    <div class="cel-status" aria-hidden="true"><span>${relogio(props.agora)}</span><span>CondoFácil</span></div>
    <div class="cel-pessoa" role="group" aria-label="Morador da demonstração">
      ${personasMorador(props.estado).map(([unidade, nome]) => html`<button type="button" key=${unidade} aria-pressed=${unidade === eu} onClick=${() => props.executar((e) => trocarMorador(e, unidade))}>${nome} · ${unidade}</button>`)}
    ${props.estado.origem === 'novo' && html`<a class="btn-link convite-link" href="#morador.convite">Entrar pelo convite</a>`}
    </div>
    <div class="cel-conteudo"><${Conteudo} ...${props} eu=${eu} /></div>
    <nav class="cel-abas" aria-label="Navegação do morador">
      ${ABAS_MORADOR.map(([id, nome, icone]) => html`<a key=${id} href=${`#morador.${id}`} class=${id === aba ? 'ativa' : ''} aria-current=${id === aba ? 'page' : undefined}><${Icone} nome=${icone} />${nome}</a>`)}
    </nav>
  </div>`;
}

function MCartaoEncomenda({ encomenda, agora }) {
  return html`<article class="cartao encomenda" data-codigo=${encomenda.codigo}>
    <div>
      <strong>${encomenda.transportadora}</strong>
      <span class="sub">Chegou ${haQuanto(encomenda.chegadaEm, agora)}</span>
      ${encomendaParada(encomenda, agora) && html`<${Etiqueta} tipo="alerta">Retire em breve<//>`}
      <span class="m-codigo">Código <b>${encomenda.codigo}</b></span>
      <small class="sub">Mostre o QR Code na portaria.</small>
    </div>
    <${QrFalso} texto=${encomenda.codigo} tamanho=${104} />
  </article>`;
}

function MInicio({ estado, agora, eu }) {
  const hoje = isoDia(agora);
  const pacotes = estado.encomendas.filter((e) => e.unidade === eu && e.status === 'aguardando');
  const fixado = comunicadosDaUnidade(estado, eu).find((c) => c.fixado);
  const novidades = anunciosVisiveis(estado).filter((a) => a.vendedor !== eu).slice(0, 2);
  const naoLidos = comunicadosDaUnidade(estado, eu).filter((c) => !c.leituras.includes(eu)).length;
  const proxima = estado.reservas
    .filter((r) => r.unidade === eu && STATUS_ATIVOS.includes(r.status) && r.data >= hoje)
    .sort((a, b) => a.data.localeCompare(b.data) || a.inicio - b.inicio)[0];
  return html`<section class="m-pagina">
    <h1 class="m-titulo">Olá, ${pessoaDaUnidade(estado, eu).nome.split(' ')[0]}</h1>
    <p class="m-sub">Apto ${eu} · ${estado.condominio.nome}</p>
    <${CartaoInfracaoInicio} estado=${estado} eu=${eu} agora=${agora} />
    <${CartaoCobrancaInicio} estado=${estado} eu=${eu} agora=${agora} />
    <${CartaoEnqueteInicio} estado=${estado} eu=${eu} agora=${agora} />
    <a class="cartao link com-icone" href="#morador.avisos"><${QuadroIcone} nome="megafone" /><span><strong>Avisos</strong><span class="sub">${naoLidos ? `${naoLidos} não ${naoLidos === 1 ? 'lido' : 'lidos'}` : 'Tudo lido'}</span></span></a>
    <h2>Encomendas na portaria</h2>
    ${pacotes.length ? pacotes.map((e) => html`<${MCartaoEncomenda} key=${e.id} encomenda=${e} agora=${agora} />`) : html`<${Vazio} texto="Nenhuma encomenda esperando por você." />`}
    ${fixado && html`<h2>Fixado pelo síndico</h2>
      <a class="cartao link" href=${`#morador.avisos.${fixado.id}`}>
        <${Etiqueta} tipo=${tipoEtiquetaAviso(fixado)}>${TIPOS_COMUNICADO[fixado.tipo]}<//>
        <strong>${fixado.titulo}</strong>
        ${!fixado.leituras.includes(eu) && html`<span class="m-nao-lido">Toque para confirmar a leitura</span>`}
      </a>`}
    <h2>Próxima reserva</h2>
    ${proxima
      ? html`<a class="cartao link" href="#morador.reservas">
          <div class="linha-entre"><strong>${areaPorId(estado, proxima.areaId).nome}</strong><${EtqReserva} status=${proxima.status} /></div>
          <span>${fmtDia(proxima.data)} · ${fmtHora(proxima.inicio)}–${fmtHora(proxima.fim)}</span>
        </a>`
      : html`<${Vazio} texto="Você não tem reservas futuras." />`}
    <h2>Novidades na vitrine</h2>
    ${novidades.length
      ? html`<ul class="anuncios">${novidades.map((a) => html`<li key=${a.id}><${CartaoAnuncio} estado=${estado} anuncio=${a} eu=${eu} /></li>`)}</ul>`
      : html`<${Vazio} texto="Nenhum anúncio na vitrine." />`}
    <a class="voltar" href="#morador.vendas">Ver a vitrine</a>
    <a class="btn primario bloco" href="#morador.ocorrencias.nova">Abrir ocorrência</a>
  </section>`;
}

function MReservas({ estado, executar, agora, eu }) {
  const hoje = isoDia(agora);
  const [areaId, setAreaId] = useState(null);
  const [anoMes, setAnoMes] = useState(hoje.slice(0, 7));
  const [data, setData] = useState(null);
  const [horario, setHorario] = useState(null);
  const [termo, setTermo] = useState(false);
  const [convidados, setConvidados] = useState('');
  const [erro, setErro] = useState(null);
  const [mensagem, setMensagem] = useState(null);
  const area = areaId ? areaPorId(estado, areaId) : null;

  function recomecar(texto) {
    setAreaId(null);
    setData(null);
    setHorario(null);
    setTermo(false);
    setConvidados('');
    setErro(null);
    setMensagem(texto || null);
  }

  function solicitar() {
    const pedido = { areaId, unidade: eu, data, inicio: horario.inicio, fim: horario.fim, convidados: lerConvidados(convidados), aceiteTermo: termo };
    const r = executar((e) => solicitarReserva(e, pedido, new Date()));
    if (r.erro) {
      setErro(r.erro);
      return;
    }
    const status = r.estado.reservas.find((x) => x.id === r.id).status;
    recomecar(status === 'pendente'
      ? 'Reserva solicitada! Aguardando aprovação do síndico. O horário já está guardado para você.'
      : 'Reserva confirmada!');
  }

  if (!area) {
    return html`<section class="m-pagina">
      <h1 class="m-titulo">Reservas</h1>
      <${Sucesso} texto=${mensagem} />
      <h2>Escolha a área</h2>
      ${estado.areas.map((a) => html`<button type="button" key=${a.id} class="cartao link" onClick=${() => { setAreaId(a.id); setMensagem(null); }}>
        <strong>${a.nome}</strong>
        <span>${a.tipo === 'periodo' ? 'Por período' : 'Por hora'} · ${a.taxa ? fmtMoeda(a.taxa) : 'Sem taxa'}</span>
        <small class="sub">${a.aprovacao === 'manual' ? 'Precisa de aprovação do síndico' : 'Confirmação na hora'}</small>
      </button>`)}
      <${MMinhasReservas} estado=${estado} executar=${executar} agora=${agora} eu=${eu} />
    </section>`;
  }

  if (!horario) {
    const horarios = data ? horariosDaArea(estado, area.id, data, agora) : [];
    const statusDe = (iso) => {
      const dias = diferencaDias(iso, hoje);
      return dias < area.antecedenciaMin || dias > area.antecedenciaMax ? 'indisponivel' : statusDia(estado, area.id, iso);
    };
    return html`<section class="m-pagina">
      <button type="button" class="voltar" onClick=${() => recomecar()}>‹ Áreas</button>
      <h1 class="m-titulo">${area.nome}</h1>
      <p class="m-sub">${textoAntecedencia(area)}</p>
      <${Calendario} anoMes=${anoMes} statusDe=${statusDe} selecionado=${data} aoEscolher=${(iso) => { setData(iso); setErro(null); }} aoMudarMes=${(n) => setAnoMes(somarMes(anoMes, n))} />
      ${data && html`<h2>${fmtDia(data)}</h2>
        <div class="m-horarios">
          ${horarios.map((h) => html`<button type="button" key=${h.inicio} class="btn opcao" disabled=${!h.livre} onClick=${() => setHorario(h)}>${h.rotulo}${h.motivo && html`<small>${h.motivo}</small>`}</button>`)}
        </div>`}
    </section>`;
  }

  return html`<section class="m-pagina">
    <button type="button" class="voltar" onClick=${() => { setHorario(null); setErro(null); }}>‹ Horários</button>
    <h1 class="m-titulo">Confirmar reserva</h1>
    <dl class="resumo">
      <dt>Área</dt><dd>${area.nome}</dd>
      <dt>Quando</dt><dd>${fmtDia(data)}, ${fmtHora(horario.inicio)}–${fmtHora(horario.fim)}</dd>
      <dt>Taxa</dt><dd>${area.taxa ? `${fmtMoeda(area.taxa)} no próximo boleto` : 'Sem taxa'}</dd>
      <dt>Aprovação</dt><dd>${area.aprovacao === 'manual' ? 'Pelo síndico em até 48 h; o horário fica guardado para você' : 'Automática'}</dd>
      <dt>Inclui</dt><dd>${area.itens}</dd>
    </dl>
    <p class="m-regulamento">${area.regulamento} Cancelamento sem multa até 72 h antes.</p>
    <${Campo} rotulo="Convidados (opcional)" dica="Um por linha: nome, documento. A lista vai para a portaria."><textarea id="reserva-convidados" rows="3" value=${convidados} onInput=${(ev) => setConvidados(ev.target.value)}></textarea><//>
    <label class="check"><input id="reserva-termo" type="checkbox" checked=${termo} onChange=${(ev) => setTermo(ev.target.checked)} /><span>Li e aceito o termo de responsabilidade</span></label>
    <${Erro} texto=${erro} />
    <button type="button" class="btn primario bloco" disabled=${!termo} onClick=${solicitar}>Solicitar reserva</button>
  </section>`;
}

function MMinhasReservas({ estado, executar, agora, eu }) {
  const [cancelando, setCancelando] = useState(null);
  const [aviso, setAviso] = useState(null);
  const hoje = isoDia(agora);
  const minhas = estado.reservas.filter((r) => r.unidade === eu).sort((a, b) => b.data.localeCompare(a.data));

  function confirmar(id) {
    const r = executar((e) => cancelarReserva(e, id, new Date()));
    setCancelando(null);
    setAviso(r.erro || (r.aviso.multa ? 'Reserva cancelada fora do prazo: a taxa será retida conforme o regulamento.' : 'Reserva cancelada sem multa.'));
  }

  return html`<h2>Minhas reservas</h2>
    <${Sucesso} texto=${aviso} />
    ${minhas.length
      ? html`<ul class="m-lista">${minhas.map((r) => {
          const podeCancelar = STATUS_ATIVOS.includes(r.status) && r.data >= hoje;
          return html`<li key=${r.id} class="cartao">
            <div class="linha-entre"><strong>${areaPorId(estado, r.areaId).nome}</strong><${EtqReserva} status=${r.status} /></div>
            <span>${fmtDia(r.data)} · ${fmtHora(r.inicio)}–${fmtHora(r.fim)}</span>
            ${r.motivo && html`<small class="sub">Motivo: ${r.motivo}</small>`}
            ${podeCancelar && (cancelando === r.id
              ? html`<div class="cartao">
                  <p class="m-texto">${avisoCancelamento(r, agora).texto}</p>
                  <div class="acoes">
                    <button type="button" class="btn perigo" onClick=${() => confirmar(r.id)}>Confirmar cancelamento</button>
                    <button type="button" class="btn secundario" onClick=${() => setCancelando(null)}>Manter reserva</button>
                  </div>
                </div>`
              : html`<button type="button" class="btn secundario" onClick=${() => setCancelando(r.id)}>Cancelar</button>`)}
          </li>`;
        })}</ul>`
      : html`<${Vazio} texto="Você ainda não fez reservas." />`}`;
}

function MAvisos({ estado, rota, executar, eu }) {
  const lista = comunicadosDaUnidade(estado, eu);
  const c = rota.id ? lista.find((x) => x.id === rota.id) : null;
  if (c) {
    const lido = c.leituras.includes(eu);
    return html`<section class="m-pagina">
      <a class="voltar" href="#morador.avisos">‹ Avisos</a>
      <div><${Etiqueta} tipo=${tipoEtiquetaAviso(c)}>${TIPOS_COMUNICADO[c.tipo]}<//></div>
      <h1 class="m-titulo">${c.titulo}</h1>
      <p class="m-sub">${fmtDataHora(c.publicadoEm)} · ${estado.condominio.sindico.nome}, síndico</p>
      <p class="m-texto">${c.texto}</p>
      ${c.anexo && html`<p class="anexo"><${Icone} nome="clipe" tamanho=${18} />${c.anexo}</p>`}
      ${lido
        ? html`<p class="sucesso">✓ Você confirmou a leitura</p>`
        : html`<button type="button" class="btn primario bloco" onClick=${() => executar((e) => marcarLido(e, c.id, eu))}>Li e estou ciente</button>`}
      <div class="reacoes" role="group" aria-label="Reações">
        ${[['util', 'Útil'], ['duvida', 'Tenho dúvida']].map(([tipo, nome]) => html`<button type="button" key=${tipo} class="btn secundario" aria-pressed=${c.reacoes[tipo].includes(eu)} onClick=${() => executar((e) => reagir(e, c.id, eu, tipo))}>${nome} · ${c.reacoes[tipo].length}</button>`)}
      </div>
    </section>`;
  }
  return html`<section class="m-pagina">
    <h1 class="m-titulo">Avisos</h1>
    <ul class="m-lista">${lista.map((x) => {
      const lido = x.leituras.includes(eu);
      return html`<li key=${x.id}><a class=${`cartao link${lido ? '' : ' nao-lido'}`} href=${`#morador.avisos.${x.id}`}>
        <div class="linha-entre"><${Etiqueta} tipo=${tipoEtiquetaAviso(x)}>${TIPOS_COMUNICADO[x.tipo]}<//>${x.fixado && html`<small class="fixado"><${Icone} nome="alfinete" tamanho=${16} />Fixado</small>`}</div>
        <strong>${x.titulo}</strong>
        <small class="sub">${fmtDataHora(x.publicadoEm)}${lido ? '' : ' · não lido'}</small>
      </a></li>`;
    })}</ul>
  </section>`;
}

function MOcorrencias(props) {
  const { estado, rota, eu } = props;
  if (rota.id === 'nova') return html`<${MNovaOcorrencia} ...${props} />`;
  const processo = rota.id ? infracaoPorId(estado, rota.id) : null;
  if (processo && processo.unidade === eu) return html`<${MDetalheInfracao} estado=${estado} executar=${props.executar} agora=${props.agora} p=${processo} eu=${eu} />`;
  const oc = rota.id ? estado.ocorrencias.find((o) => o.id === rota.id && (o.unidade === eu || o.publica || o.eutambem.includes(eu))) : null;
  if (oc) return html`<${MDetalheOcorrencia} estado=${estado} executar=${props.executar} oc=${oc} eu=${eu} />`;
  const minhas = estado.ocorrencias.filter((o) => o.unidade === eu);
  const publicas = estado.ocorrencias.filter((o) => o.publica && o.unidade !== eu);
  const item = (o) => html`<li key=${o.id}><a class="cartao link" href=${`#morador.ocorrencias.${o.id}`}>
    <div class="linha-entre"><strong>${CATEGORIAS[o.categoria].nome}</strong><${EtqOcorrencia} status=${o.status} arquivada=${o.arquivada} /></div>
    <span>${o.descricao}</span>
    <small class="sub">${o.id} · ${TIPOS_NOTIFICACAO[CATEGORIAS[o.categoria].tipo]}${o.publica ? ` · ${o.eutambem.length} "eu também"` : ''}</small>
  </a></li>`;
  return html`<section class="m-pagina">
    <h1 class="m-titulo">Notificações</h1>
    <a class="btn primario bloco" href="#morador.ocorrencias.nova">Abrir notificação</a>
    <${MBlocoInfracoes} estado=${estado} eu=${eu} agora=${props.agora} />
    <h2>Minhas</h2>
    ${minhas.length ? html`<ul class="m-lista">${minhas.map(item)}</ul>` : html`<${Vazio} texto="Você não abriu notificações." />`}
    <h2>Públicas do condomínio</h2>
    ${publicas.length ? html`<ul class="m-lista">${publicas.map(item)}</ul>` : html`<${Vazio} texto="Nenhuma notificação pública." />`}
  </section>`;
}

function MNovaOcorrencia({ estado, executar, eu }) {
  const [tipo, setTipo] = useState('');
  const [categoria, setCategoria] = useState('');
  const [local, setLocal] = useState('');
  const [descricao, setDescricao] = useState('');
  const [foto, setFoto] = useState(false);
  const [anonima, setAnonima] = useState(false);
  const [publica, setPublica] = useState(false);
  const [erro, setErro] = useState(null);
  const categorias = Object.entries(CATEGORIAS).filter(([, c]) => c.tipo === tipo);
  const iguais = categoria ? parecidas(estado, categoria, eu) : [];

  function escolherTipo(t) {
    setTipo(t);
    setCategoria('');
    if (t !== 'irregularidade') setAnonima(false);
  }

  function enviar() {
    const r = executar((e) => abrirOcorrencia(e, { categoria, local, descricao, foto, anonima, publica, unidade: eu }, new Date()));
    if (r.erro) {
      setErro(r.erro);
      return;
    }
    ir('morador', 'ocorrencias', r.id);
  }

  return html`<section class="m-pagina">

    </div>`}
    <${Campo} rotulo="Local"><input id="ocorrencia-local" value=${local} onInput=${(ev) => setLocal(ev.target.value)} placeholder="Ex.: garagem, 5º andar, salão" /><//>
    <${Campo} rotulo="Descrição"><textarea id="ocorrencia-descricao" rows="4" value=${descricao} onInput=${(ev) => setDescricao(ev.target.value)}></textarea><//>

    <${Erro} texto=${erro} />
    <button type="button" class="btn primario bloco" onClick=${enviar}>Enviar notificação</button>
  </section>`;
}

function MDetalheOcorrencia({ estado, executar, oc, eu }) {
  const [nota, setNota] = useState(0);
  const [erro, setErro] = useState(null);
  const minha = oc.unidade === eu;
  const podeAvaliar = minha && ['resolvida', 'fechada'].includes(oc.status) && !oc.avaliacao;
  const comPrazo = liberado(estado.plano, 'notificacoesPrazo');
  const solucao = prazosDe(oc).solucao;
  const reparo = oc.linha.some((l) => l.texto.startsWith('Reparo concluído'));

  function avaliar() {
    const r = executar((e) => avaliarOcorrencia(e, oc.id, nota));
    setErro(r.erro || null);
  }

  return html`<section class="m-pagina">
    <a class="voltar" href="#morador.ocorrencias">‹ Notificações</a>
    <p class="protocolo">Protocolo ${oc.id}</p>
    <h1 class="m-titulo">${CATEGORIAS[oc.categoria].nome}</h1>
    <div class="etq-linha"><${EtqOcorrencia} status=${oc.status} arquivada=${oc.arquivada} /><span class="sub">${TIPOS_NOTIFICACAO[CATEGORIAS[oc.categoria].tipo]}${comPrazo ? ` · prioridade ${PRIORIDADES[oc.prioridade].nome.toLowerCase()}` : ''}</span></div>
    ${comPrazo && solucao && !solucao.em && !oc.arquivada && html`<p class="m-sub">Previsão de solução: até ${fmtDataCurta(isoDia(new Date(solucao.limite)))}, ${new Date(solucao.limite).getHours()}h</p>`}
    <p class="m-texto">${oc.descricao}</p>
    ${oc.local && html`<p class="m-sub">Local: ${oc.local}</p>`}
    ${oc.foto && html`<${FotoFalsa} rotulo="Foto enviada" />`}
    ${oc.os && html`<p class="m-sub">Ordem de serviço ${oc.os} com o zelador</p>`}
    ${reparo && html`<div class="fotos-reparo"><${FotoFalsa} rotulo="Antes" /><${FotoFalsa} rotulo="Depois" /></div>`}
    ${(oc.publica || !minha) && html`<button type="button" class="btn secundario" aria-pressed=${oc.eutambem.includes(eu)} onClick=${() => executar((e) => euTambem(e, oc.id, eu))}>Eu também · ${oc.eutambem.length}</button>`}
    <h2>Andamento</h2>
    <${LinhaTempo} linha=${oc.linha} />
    ${podeAvaliar && html`<div class="cartao">
      <strong>Como foi o atendimento?</strong>
      <${Estrelas} valor=${nota} aoEscolher=${setNota} />
      <${Erro} texto=${erro} />
      <button type="button" class="btn primario" disabled=${!nota} onClick=${avaliar}>Enviar avaliação</button>
    </div>`}
    ${minha && oc.avaliacao && html`<div class="cartao"><strong>Sua avaliação</strong><${Estrelas} valor=${oc.avaliacao} /></div>`}
  </section>`;
}

const MENU_SINDICO = [['inicio', 'Início', 'grafico'], ['cobranca', 'Cobrança', 'cifrao'], ['financeiro', 'Financeiro', 'grafico'], ['reservas', 'Reservas', 'calendario'], ['comunicados', 'Comunicados', 'megafone'], ['enquetes', 'Enquetes', 'enquete'], ['ocorrencias', 'Notificações', 'prancheta'], ['manutencao', 'Manutenção', 'ferramenta'], ['escala', 'Escala', 'calendario'], ['documentos', 'Documentos', 'documento'], ['encomendas', 'Encomendas', 'pacote'], ['vendas', 'Vendas', 'loja']];
const EM_BREVE = [['Estoque, checklist e rondas', 'Avançado']];
const MOTIVOS_RECUSA = ['Data reservada para manutenção', 'Conflito com evento do condomínio', 'Unidade com pendência no regulamento', 'Documentação incompleta'];
const FILTROS_OCORRENCIA = [['ativas', 'Em aberto'], ['todas', 'Todas'], ...FLUXO_OCORRENCIA.map((s) => [s, NOMES_STATUS[s]]), ['arquivadas', 'Arquivadas']];

function textoAlerta(alerta) {
  const n = Math.abs(alerta.dias);
  const dias = n === 1 ? '1 dia' : `${n} dias`;
  if (alerta.dias < 0) return `Vencido há ${dias}`;
  if (alerta.dias === 0) return 'Vence hoje';
  return `Vence em ${dias}`;
}

function textoPrazo(oc) {
  const sla = PRIORIDADES[oc.prioridade].solucao;
  if (!sla) return 'Sem prazo';
  return oc.status === 'aberta' ? `${sla} h para atender` : 'Atendida';
}

function tipoEtiquetaComunicado(c) {
  return c.tipo === 'urgente' ? 'perigo' : 'info';
}

function TelaSindico(props) {
  const tela = MENU_SINDICO.some(([id]) => id === props.rota.tela) ? props.rota.tela : 'inicio';
  const Conteudo = { inicio: SInicio, reservas: SReservas, comunicados: SComunicados, enquetes: SEnquetes, ocorrencias: SOcorrencias, documentos: SDocumentos, encomendas: SEncomendas, vendas: SVendas, cobranca: SCobranca, financeiro: SFinanceiro, manutencao: SManutencao, escala: SEscala }[tela];
  return html`<div class="painel">
    <nav class="painel-menu" aria-label="Menu do síndico">
      <p class="painel-usuario"><strong>${props.estado.condominio.sindico.nome}</strong><small>Síndico · apto ${props.estado.condominio.sindico.unidade}</small></p>
      ${MENU_SINDICO.map(([id, nome, icone]) => html`<a key=${id} href=${`#sindico.${id}`} class=${id === tela ? 'ativa' : ''} aria-current=${id === tela ? 'page' : undefined}><${Icone} nome=${icone} tamanho=${20} />${nome}</a>`)}
      ${EM_BREVE.map(([nome, plano]) => html`<span key=${nome} class="em-breve" aria-disabled="true">${nome}<small>Em breve · ${plano}</small></span>`)}
    </nav>
    <div class="painel-conteudo"><${Conteudo} ...${props} /></div>
  </div>`;
}

function SInicio({ estado, agora, executar }) {
  const ind = indicadoresSindico(estado, agora);
  const pendentes = estado.reservas.filter((r) => r.status === 'pendente');
  const paradas = estado.encomendas.filter((e) => encomendaParada(e, agora));
  const alertas = alertasDocumentos(estado.documentos, isoDia(agora));
  const vendedoresPendentes = estado.pessoas.filter((p) => p.vendedor === 'pendente');
  const pendCobranca = [...pendenciasCobranca(estado, isoDia(agora)), ...(liberado(estado.plano, 'contasPagar') ? alertasContas(estado, isoDia(agora)) : []), ...(liberado(estado.plano, 'prestacaoContas') ? alertasPrestacao(estado, isoDia(agora)) : [])];
  const comPrazo = liberado(estado.plano, 'notificacoesPrazo');
  const pendOperacao = [...(comPrazo ? [...alertasNotificacoes(estado, agora), ...alertasManutencao(estado, agora)] : []), ...(liberado(estado.plano, 'escala') ? alertasEscala(estado, agora) : []), ...(liberado(estado.plano, 'multasDefesa') ? alertasInfracoes(estado, isoDia(agora)) : []), ...alertasEnquetes(estado, agora)];
  const pct = Math.round((ind.adesao.com / ind.adesao.total) * 100);
  const cartoes = [
    ['Reservas pendentes', ind.pendentes, '#sindico.reservas', ind.pendentes ? 'alerta' : 'ok', 'Aguardando sua aprovação', 'calendario'],
    comPrazo
      ? ['Notificações abertas', ind.abertas, '#sindico.ocorrencias', ind.slaVencidas ? 'perigo' : 'info', ind.slaVencidas ? `${ind.slaVencidas} com prazo vencido` : 'Todas dentro do prazo', 'prancheta']
      : ['Notificações abertas', ind.abertas, '#sindico.ocorrencias', 'info', 'Sem prazos no Básico', 'prancheta'],
    ['Encomendas paradas', ind.paradas, '#sindico.encomendas', ind.paradas ? 'alerta' : 'ok', 'Há mais de 3 dias na portaria', 'pacote'],
    ['Documentos vencendo', ind.vencendo, '#sindico.documentos', ind.vencendo ? 'perigo' : 'ok', 'Vencidos ou nos próximos 60 dias', 'documento'],
  ];
  if (liberado(estado.plano, 'indicadorAtendimento')) {
    const a = indicadorAtendimento(estado);
    cartoes.push(['Atendimento', `${a.pct}%`, '#sindico.ocorrencias', a.alerta ? 'perigo' : 'ok', `${a.abertas} abertas · ${a.noPrazo} de ${a.comPrazo} resolvidas no prazo`, 'prancheta']);
  }
  const semPendencias = !pendentes.length && !pendOperacao.length && !paradas.length && !alertas.length && !vendedoresPendentes.length && !pendCobranca.length;
  return html`<section>
    <h1>Olá, ${estado.condominio.sindico.nome.split(' ')[0]}</h1>
    <${AprovacaoMoradores} estado=${estado} executar=${executar} />
    <${PainelFinanceiro} estado=${estado} agora=${agora} />
    <h2>Precisa da sua atenção</h2>
    ${semPendencias
      ? html`<${Vazio} texto="Nada pendente. Bom trabalho!" />`
      : html`<ul class="atencao">
          ${pendCobranca.map((p) => html`<li key=${p.chave}><a href=${p.href}>${p.texto}</a></li>`)}
          ${pendentes.map((r) => html`<li key=${r.id}><a href="#sindico.reservas">Aprovar reserva: ${areaPorId(estado, r.areaId).nome}, apto ${r.unidade}, ${fmtDia(r.data)}</a></li>`)}
          ${pendOperacao.map((p) => html`<li key=${p.chave}><a href=${p.href}>${p.texto}</a></li>`)}
          ${paradas.map((e) => html`<li key=${e.id}><a href="#sindico.encomendas">Encomenda parada: apto ${e.unidade}, chegou ${haQuanto(e.chegadaEm, agora)}</a></li>`)}
          ${alertas.map((a) => html`<li key=${a.documento.id}><a href="#sindico.documentos">${textoAlerta(a)}: ${a.documento.titulo}</a></li>`)}
          ${vendedoresPendentes.map((p) => html`<li key=${`v${p.unidade}`}><a href="#sindico.vendas">Aprovar vendedor: ${p.nome}, apto ${p.unidade}</a></li>`)}
        </ul>`}
    <h2>Operação</h2>
    <div class="indicadores">
      ${cartoes.map(([rotulo, valor, href, tipo, detalhe, icone]) => html`<a key=${rotulo} class=${`indicador ind-${tipo}`} href=${href}><${QuadroIcone} nome=${icone} cheio=${tipo === 'perigo' || tipo === 'alerta'} /><span class="ind-rotulo">${rotulo}</span><strong>${valor}</strong><small>${detalhe}</small></a>`)}
    </div>
    <div class="cartao adesao">
      <div class="linha-entre"><strong>Adesão dos moradores</strong><span>${ind.adesao.com} de ${ind.adesao.total} unidades com app</span></div>
      <div class="barra" role="progressbar" aria-label="Adesão" aria-valuenow=${pct} aria-valuemin="0" aria-valuemax="100"><span style=${`width:${pct}%`}></span></div>
      <small class="sub">Meta do piloto: 60% das unidades em 30 dias. Hoje: ${pct}%.</small>
    </div>
  </section>`;
}

function SReservas({ estado, executar, agora }) {
  const hoje = isoDia(agora);
  const [areaId, setAreaId] = useState('salao');
  const [anoMes, setAnoMes] = useState(hoje.slice(0, 7));
  const [dia, setDia] = useState(hoje);
  const [recusando, setRecusando] = useState(null);
  const [motivo, setMotivo] = useState(MOTIVOS_RECUSA[0]);
  const [erro, setErro] = useState(null);
  const pendentes = estado.reservas.filter((r) => r.status === 'pendente').sort((a, b) => a.data.localeCompare(b.data));
  const doDia = estado.reservas.filter((r) => r.data === dia && r.areaId === areaId && r.status !== 'cancelada').sort((a, b) => a.inicio - b.inicio);
  const bloqueios = estado.bloqueios.filter((b) => b.data === dia && b.areaId === areaId);

  function aprovar(id) {
    const r = executar((e) => aprovarReserva(e, id));
    setErro(r.erro || null);
  }

  function recusar(id) {
    const r = executar((e) => recusarReserva(e, id, motivo));
    if (r.erro) {
      setErro(r.erro);
      return;
    }
    setRecusando(null);
    setErro(null);
  }

  return html`<section>
    <h1>Reservas</h1>
    <h2>Pendentes de aprovação</h2>
    <${Erro} texto=${erro} />
    ${pendentes.length
      ? html`<ul class="lista-cartoes">${pendentes.map((r) => html`<li key=${r.id} class="cartao">
          <div class="linha-entre"><strong>${areaPorId(estado, r.areaId).nome} · apto ${r.unidade}</strong><span>${fmtDia(r.data)}, ${fmtHora(r.inicio)}–${fmtHora(r.fim)}</span></div>
          <small class="sub">Solicitada ${haQuanto(r.criadaEm, agora)} · ${r.convidados.length} convidados · aprovação automática em 48 h se não houver resposta</small>
          ${recusando === r.id
            ? html`<div class="recusa">
                <${Campo} rotulo="Motivo da recusa"><select id=${`motivo-${r.id}`} value=${motivo} onChange=${(ev) => setMotivo(ev.target.value)}>${MOTIVOS_RECUSA.map((m) => html`<option key=${m} value=${m}>${m}</option>`)}</select><//>
                <button type="button" class="btn perigo" onClick=${() => recusar(r.id)}>Confirmar recusa</button>
                <button type="button" class="btn secundario" onClick=${() => setRecusando(null)}>Voltar</button>
              </div>`
            : html`<div class="acoes">
                <button type="button" class="btn primario" data-acao=${`aprovar-${r.id}`} onClick=${() => aprovar(r.id)}>Aprovar</button>
                <button type="button" class="btn secundario" data-acao=${`recusar-${r.id}`} onClick=${() => setRecusando(r.id)}>Recusar</button>
              </div>`}
        </li>`)}</ul>`
      : html`<${Vazio} texto="Nenhuma reserva aguardando aprovação." />`}
    <h2>Agenda</h2>
    <div class="chips" role="group" aria-label="Área">
      ${estado.areas.map((a) => html`<button type="button" key=${a.id} class="chip" aria-pressed=${a.id === areaId} onClick=${() => setAreaId(a.id)}>${a.nome}</button>`)}
    </div>
    <div class="agenda">
      <${Calendario} anoMes=${anoMes} statusDe=${(iso) => statusDia(estado, areaId, iso)} selecionado=${dia} aoEscolher=${setDia} aoMudarMes=${(n) => setAnoMes(somarMes(anoMes, n))} />
      <div>
        <h3>${fmtDia(dia)}</h3>
        ${bloqueios.map((b) => html`<p key=${b.id} class="cartao bloqueio">Bloqueado ${fmtHora(b.inicio)}–${fmtHora(b.fim)}: ${b.motivo}</p>`)}
        ${doDia.length
          ? html`<ul class="lista-cartoes">${doDia.map((r) => html`<li key=${r.id} class="cartao"><div class="linha-entre"><span>${fmtHora(r.inicio)}–${fmtHora(r.fim)} · apto ${r.unidade}</span><${EtqReserva} status=${r.status} /></div></li>`)}</ul>`
          : !bloqueios.length && html`<${Vazio} texto="Nenhuma reserva neste dia." />`}
      </div>
    </div>
    <h2>Regras das áreas</h2>
    <div class="tabela-rolagem"><table class="tabela">
      <thead><tr><th>Área</th><th>Tipo</th><th>Taxa</th><th>Aprovação</th><th>Antecedência</th><th>Limite</th></tr></thead>
      <tbody>${estado.areas.map((a) => html`<tr key=${a.id}>
        <td>${a.nome}</td>
        <td>${a.tipo === 'periodo' ? 'Período' : 'Por hora'}</td>
        <td>${a.taxa ? fmtMoeda(a.taxa) : '—'}</td>
        <td>${a.aprovacao === 'manual' ? 'Manual' : 'Automática'}</td>
        <td>${a.antecedenciaMin} a ${a.antecedenciaMax} dias</td>
        <td>${a.limiteMes ? `${a.limiteMes} por mês` : 'Sem limite'}</td>
      </tr>`)}</tbody>
    </table></div>
  </section>`;
}

function BarraLeitura({ lidas, total }) {
  const pct = total ? Math.round((lidas / total) * 100) : 0;
  return html`<div class="leitura">
    <div class="barra" role="progressbar" aria-label="Leitura" aria-valuenow=${pct} aria-valuemin="0" aria-valuemax="100"><span style=${`width:${pct}%`}></span></div>
    <small class="sub">${lidas} de ${total} unidades leram</small>
  </div>`;
}

function SComunicados(props) {
  const { estado, rota } = props;
  if (rota.id === 'novo') return html`<${SNovoComunicado} estado=${estado} executar=${props.executar} />`;
  const c = rota.id ? estado.comunicados.find((x) => x.id === rota.id) : null;
  if (c) return html`<${SDetalheComunicado} estado=${estado} c=${c} />`;
  const lista = [...estado.comunicados].sort((a, b) => b.publicadoEm.localeCompare(a.publicadoEm));
  return html`<section>
    <div class="linha-entre"><h1>Comunicados</h1><a class="btn primario" href="#sindico.comunicados.novo">Novo comunicado</a></div>
    <ul class="lista-cartoes">${lista.map((x) => html`<li key=${x.id}><a class="cartao link" href=${`#sindico.comunicados.${x.id}`}>
      <div class="linha-entre"><span class="etq-linha"><${Etiqueta} tipo=${tipoEtiquetaComunicado(x)}>${TIPOS_COMUNICADO[x.tipo]}<//>${x.fixado && html`<small class="fixado"><${Icone} nome="alfinete" tamanho=${16} />Fixado</small>`}</span><small class="sub">${fmtDataHora(x.publicadoEm)}</small></div>
      <strong>${x.titulo}</strong>
      <${BarraLeitura} lidas=${x.leituras.length} total=${destinatarios(estado, x.publico).length} />
    </a></li>`)}</ul>
  </section>`;
}

function SDetalheComunicado({ estado, c }) {
  const dest = destinatarios(estado, c.publico);
  return html`<section>
    <a class="voltar" href="#sindico.comunicados">‹ Comunicados</a>
    <div><${Etiqueta} tipo=${tipoEtiquetaComunicado(c)}>${TIPOS_COMUNICADO[c.tipo]}<//></div>
    <h1>${c.titulo}</h1>
    <p class="sub">Publicado em ${fmtDataHora(c.publicadoEm)} · ${c.canais.map((k) => NOMES_CANAL[k]).join(', ')}</p>
    <p class="texto-longo">${c.texto}</p>
    ${c.anexo && html`<p class="anexo"><${Icone} nome="clipe" tamanho=${18} />${c.anexo}</p>`}
    <h2>Confirmação de leitura</h2>
    <${BarraLeitura} lidas=${c.leituras.length} total=${dest.length} />
    <div class="grade-unidades">${dest.map((u) => {
      const lida = c.leituras.includes(u);
      return html`<span key=${u} class=${lida ? 'lida' : 'nao-lida'} aria-label=${`Apto ${u}: ${lida ? 'leu' : 'não leu'}`}>${u}</span>`;
    })}</div>
    <p class="legenda"><span class="lida">Leu</span> <span class="nao-lida">Não leu</span></p>
    <p class="sub">${c.reacoes.util.length} acharam útil · ${c.reacoes.duvida.length} com dúvida</p>
  </section>`;
}

function SNovoComunicado({ estado, executar }) {
  const [tipo, setTipo] = useState('geral');
  const [titulo, setTitulo] = useState(MODELOS_COMUNICADO.geral.titulo);
  const [texto, setTexto] = useState(MODELOS_COMUNICADO.geral.texto);
  const [publicoTipo, setPublicoTipo] = useState('todos');
  const [andar, setAndar] = useState('1');
  const [unidades, setUnidades] = useState('');
  const [canais, setCanais] = useState(['push', 'email', 'whatsapp']);
  const [fixado, setFixado] = useState(false);
  const [anexo, setAnexo] = useState(null);
  const [erro, setErro] = useState(null);
  const urgente = tipo === 'urgente';

  function trocarTipo(novo) {
    setTipo(novo);
    setTitulo(MODELOS_COMUNICADO[novo].titulo);
    setTexto(MODELOS_COMUNICADO[novo].texto.replace(/Roberto Lima/g, estado.condominio.sindico.nome));
  }

  function alternarCanal(k) {
    setCanais(canais.includes(k) ? canais.filter((x) => x !== k) : [...canais, k]);
  }

  function publicar() {
    let publico = { tipo: 'todos' };
    if (publicoTipo === 'andar') publico = { tipo: 'andar', valor: andar };
    if (publicoTipo === 'unidades') publico = { tipo: 'unidades', valor: unidades.split(/[\s,;]+/).filter(Boolean) };
    const r = executar((e) => publicarComunicado(e, { tipo, titulo, texto, publico, canais, fixado, anexo }, new Date()));
    if (r.erro) {
      setErro(r.erro);
      return;
    }
    ir('sindico', 'comunicados', r.id);
  }

  return html`<section class="formulario">
    <a class="voltar" href="#sindico.comunicados">‹ Comunicados</a>
    <h1>Novo comunicado</h1>
    <${Campo} rotulo="Tipo" dica="Trocar o tipo preenche um modelo pronto."><select id="comunicado-tipo" value=${tipo} onChange=${(ev) => trocarTipo(ev.target.value)}>${Object.entries(TIPOS_COMUNICADO).map(([id, nome]) => html`<option key=${id} value=${id}>${nome}</option>`)}</select><//>
    <${Campo} rotulo="Título"><input id="comunicado-titulo" value=${titulo} onInput=${(ev) => setTitulo(ev.target.value)} /><//>
    <${Campo} rotulo="Texto"><textarea id="comunicado-texto" rows="7" value=${texto} onInput=${(ev) => setTexto(ev.target.value)}></textarea><//>
    <fieldset>
      <legend>Público</legend>
      ${[['todos', 'Todo o condomínio'], ['andar', 'Um andar'], ['unidades', 'Unidades específicas']].map(([id, nome]) => html`<label key=${id} class="check"><input id=${`publico-${id}`} type="radio" name="publico" checked=${publicoTipo === id} onChange=${() => setPublicoTipo(id)} /><span>${nome}</span></label>`)}
      ${publicoTipo === 'andar' && html`<${Campo} rotulo="Andar"><select id="comunicado-andar" value=${andar} onChange=${(ev) => setAndar(ev.target.value)}>${[1, 2, 3, 4, 5, 6, 7, 8].map((n) => html`<option key=${n} value=${String(n)}>${n}º andar</option>`)}</select><//>`}
      ${publicoTipo === 'unidades' && html`<${Campo} rotulo="Unidades" dica="Separe por vírgula. Ex.: 302, 303"><input id="comunicado-unidades" value=${unidades} onInput=${(ev) => setUnidades(ev.target.value)} /><//>`}
    </fieldset>
    <fieldset>
      <legend>Canais</legend>
      ${Object.entries(NOMES_CANAL).map(([k, nome]) => {
        const travado = k === 'sms' && urgente;
        return html`<label key=${k} class="check"><input id=${`canal-${k}`} type="checkbox" checked=${travado || canais.includes(k)} disabled=${travado} onChange=${() => alternarCanal(k)} /><span>${nome}${travado ? ' (obrigatório em urgentes)' : ''}</span></label>`;
      })}
    </fieldset>
    <label class="check"><input id="comunicado-fixar" type="checkbox" checked=${fixado} onChange=${(ev) => setFixado(ev.target.checked)} /><span>Fixar no topo</span></label>
    ${anexo
      ? html`<p class="anexo"><${Icone} nome="clipe" tamanho=${18} />${anexo} <button type="button" class="btn-link" onClick=${() => setAnexo(null)}>remover</button></p>`
      : html`<button type="button" class="btn secundario" onClick=${() => setAnexo('comunicado-anexo.pdf')}>Anexar PDF</button>`}
    <${Erro} texto=${erro} />
    <button type="button" class="btn primario" onClick=${publicar}>Publicar comunicado</button>
  </section>`;
}

const ETQ_PRIORIDADE = { urgente: 'perigo', alta: 'alerta', normal: 'info', baixa: 'neutro' };
const FILTROS_TIPO = [['todos', 'Todos'], ...Object.entries(TIPOS_NOTIFICACAO)];
const FILTROS_PRIORIDADE = [['todas', 'Todas'], ...ORDEM_PRIORIDADE.map((p) => [p, PRIORIDADES[p].nome])];

function fmtLimite(iso) {
  const d = new Date(iso);
  return `até ${fmtDataCurta(isoDia(d))} ${String(d.getHours()).padStart(2, '0')}h`;
}

function CelulaPrazo({ prazo, atraso }) {
  if (!prazo) return 'Sem prazo';
  if (atraso !== null) return html`<${Etiqueta} tipo="perigo">vencida há ${textoAtraso(atraso)}<//>`;
  if (prazo.em) return html`<${Etiqueta} tipo="ok">${prazo.em <= prazo.limite ? 'no prazo' : 'fora do prazo'}<//>`;
  return fmtLimite(prazo.limite);
}

function SOcorrencias(props) {
  const { estado, rota, agora } = props;
  const [filtro, setFiltro] = useState('ativas');
  const [tipo, setTipo] = useState('todos');
  const [prioridade, setPrioridade] = useState('todas');
  const comPrazo = liberado(estado.plano, 'notificacoesPrazo');
  const processo = rota.id ? infracaoPorId(estado, rota.id) : null;
  if (processo) return html`<${SDetalheInfracao} estado=${estado} executar=${props.executar} agora=${agora} p=${processo} />`;
  const oc = rota.id ? estado.ocorrencias.find((o) => o.id === rota.id) : null;
  if (oc) return html`<${SDetalheOcorrencia} estado=${estado} executar=${props.executar} agora=${agora} oc=${oc} />`;
  const lista = comPrazo
    ? caixaDeEntrada(estado, agora, { status: filtro, tipo, prioridade })
    : estado.ocorrencias
      .filter((o) => {
        if (filtro === 'arquivadas') return o.arquivada;
        if (o.arquivada) return false;
        if (filtro === 'todas') return true;
        if (filtro === 'ativas') return !['resolvida', 'fechada'].includes(o.status);
        return o.status === filtro;
      })
      .sort((a, b) => b.criadaEm.localeCompare(a.criadaEm));
  return html`<section>
    <h1>Notificações</h1>
    <${BlocoProcessos} estado=${estado} agora=${agora} />
    <div class="edicao-anuncio filtros-notificacao">
      <${Campo} rotulo="Mostrar"><select id="notificacoes-status" value=${filtro} onChange=${(ev) => setFiltro(ev.target.value)}>${FILTROS_OCORRENCIA.map(([id, nome]) => html`<option key=${id} value=${id}>${nome}</option>`)}</select><//>
      ${comPrazo && html`<${Campo} rotulo="Tipo"><select id="notificacoes-tipo" value=${tipo} onChange=${(ev) => setTipo(ev.target.value)}>${FILTROS_TIPO.map(([id, nome]) => html`<option key=${id} value=${id}>${nome}</option>`)}</select><//>`}
      ${comPrazo && html`<${Campo} rotulo="Prioridade"><select id="notificacoes-prioridade" value=${prioridade} onChange=${(ev) => setPrioridade(ev.target.value)}>${FILTROS_PRIORIDADE.map(([id, nome]) => html`<option key=${id} value=${id}>${nome}</option>`)}</select><//>`}
    </div>
    <div class="tabela-rolagem"><table class="tabela">
      <thead><tr><th>Protocolo</th><th>Categoria</th><th>Unidade</th>${comPrazo && html`<th>Prioridade</th><th>1ª resposta</th><th>Solução</th>`}<th>Status</th><th>Aberta</th></tr></thead>
      <tbody>${lista.map((o) => {
        const p = comPrazo ? prazosDe(o) : null;
        const v = comPrazo ? prazosVencidos(o, agora) : null;
        return html`<tr key=${o.id} class="clicavel" onClick=${() => ir('sindico', 'ocorrencias', o.id)}>
          <td><a href=${`#sindico.ocorrencias.${o.id}`}>${o.id}</a></td>
          <td>${CATEGORIAS[o.categoria].nome}${o.publica && html` <${Etiqueta}>Pública<//>`}${comPrazo && html`<br /><small class="sub">${TIPOS_NOTIFICACAO[CATEGORIAS[o.categoria].tipo]}</small>`}</td>
          <td>${o.anonima ? 'Anônima' : o.unidade}</td>
          ${comPrazo && html`<td><${Etiqueta} tipo=${ETQ_PRIORIDADE[o.prioridade]}>${PRIORIDADES[o.prioridade].nome}<//></td>
            <td><${CelulaPrazo} prazo=${p.resposta} atraso=${v.resposta} /></td>
            <td><${CelulaPrazo} prazo=${p.solucao} atraso=${v.solucao} /></td>`}
          <td><${EtqOcorrencia} status=${o.status} arquivada=${o.arquivada} /></td>
          <td>${haQuanto(o.criadaEm, agora)}</td>
        </tr>`;
      })}</tbody>
    </table></div>
    ${!lista.length && html`<${Vazio} texto="Nenhuma notificação neste filtro." />`}
    ${comPrazo && html`<details class="composicao"><summary>Prazos por prioridade</summary>
      <div class="tabela-rolagem"><table class="tabela">
        <thead><tr><th>Prioridade</th><th>1ª resposta</th><th>Solução</th></tr></thead>
        <tbody>${ORDEM_PRIORIDADE.map((id) => html`<tr key=${id}><td>${PRIORIDADES[id].nome}</td><td>${PRIORIDADES[id].resposta} h</td><td>${PRIORIDADES[id].solucao ? (PRIORIDADES[id].solucao >= 48 ? `${PRIORIDADES[id].solucao / 24} dias` : `${PRIORIDADES[id].solucao} h`) : 'Sem prazo'}</td></tr>`)}</tbody>
      </table></div>
      <small class="sub">A 1ª resposta conta a partir da primeira ação do síndico: mudar o status, comentar, pedir informação ou gerar OS.</small>
    </details>`}
  </section>`;
}

function SDetalheOcorrencia({ estado, executar, agora, oc }) {
  const [texto, setTexto] = useState('');
  const [erro, setErro] = useState(null);
  const [mensagem, setMensagem] = useState(null);
  const [responsavel, setResponsavel] = useState('zelador');
  const [prestador, setPrestador] = useState('');
  const [motivo, setMotivo] = useState('');
  const comPrazo = liberado(estado.plano, 'notificacoesPrazo');
  const encerrada = ['resolvida', 'fechada'].includes(oc.status);
  const irregularidade = CATEGORIAS[oc.categoria].tipo === 'irregularidade';
  const acoes = acoesOcorrencia(oc).filter((a) => !comPrazo || a.id !== 'arquivar');
  const v = comPrazo ? prazosVencidos(oc, agora) : null;

  function rodar(acao, sucesso, limpar) {
    const r = executar(acao);
    if (r.erro) {
      setErro(r.erro);
      setMensagem(null);
      return;
    }
    setErro(null);
    setMensagem(sucesso);
    if (limpar) limpar();
  }

  function fazer(acao) {
    rodar((e) => {
      if (acao === 'avancar') return avancarOcorrencia(e, oc.id, new Date(), texto);
      if (acao === 'comentar') return comentarOcorrencia(e, oc.id, texto, new Date());
      return arquivarOcorrencia(e, oc.id);
    }, null, () => setTexto(''));
  }

  return html`<section>
    <a class="voltar" href="#sindico.ocorrencias">‹ Notificações</a>
    <p class="protocolo">Protocolo ${oc.id}</p>
    <div class="linha-entre"><h1>${CATEGORIAS[oc.categoria].nome}</h1><${EtqOcorrencia} status=${oc.status} arquivada=${oc.arquivada} /></div>
    <p class="sub">${TIPOS_NOTIFICACAO[CATEGORIAS[oc.categoria].tipo]} · ${oc.anonima ? 'autor anônimo' : `apto ${oc.unidade}`}${oc.local ? ` · ${oc.local}` : ''} · aberta ${haQuanto(oc.criadaEm, agora)}</p>
    ${comPrazo && (v.resposta !== null || v.solucao !== null) && html`<p class="erro">${v.resposta !== null ? `1ª resposta vencida há ${textoAtraso(v.resposta)}` : `Solução vencida há ${textoAtraso(v.solucao)}`}</p>`}
    <p class="texto-longo">${oc.descricao}</p>
    ${oc.foto && html`<${FotoFalsa} rotulo="Foto enviada pelo morador" />`}
    ${oc.publica && html`<p class="sub">Pública · ${oc.eutambem.length} moradores marcaram "eu também"</p>`}
    ${!oc.publica && oc.eutambem.length > 0 && html`<p class="sub">${oc.eutambem.length} moradores apoiaram ("eu também")</p>`}
    ${oc.avaliacao && html`<div><span class="sub">Avaliação do morador</span><${Estrelas} valor=${oc.avaliacao} /></div>`}
    ${oc.os && html`<p class="cartao"><span>Ordem de serviço <a href=${`#sindico.manutencao.${oc.os}`}>${oc.os}</a></span></p>`}
    ${oc.motivoArquivamento && html`<p class="sub">Arquivada: ${oc.motivoArquivamento}</p>`}
    <h2>Linha do tempo</h2>
    <${LinhaTempo} linha=${oc.linha} />
    ${oc.arquivada
      ? html`<p class="sub">Notificação arquivada. O histórico fica guardado para auditoria e não pode ser apagado.</p>`
      : html`<div class="pilha">
          ${comPrazo && html`<div class="cartao">
            <${Campo} rotulo="Prioridade"><select id="notificacao-prioridade" value=${oc.prioridade} onChange=${(ev) => rodar((e) => definirPrioridade(e, oc.id, ev.target.value, 'sindico', new Date()), 'Prioridade atualizada.')}>${ORDEM_PRIORIDADE.map((p) => html`<option key=${p} value=${p}>${PRIORIDADES[p].nome} · resposta ${PRIORIDADES[p].resposta} h</option>`)}</select><//>
          </div>`}
          <div class="cartao">
            <${Campo} rotulo="Mensagem ao morador" dica="Opcional ao mudar o status; obrigatória para comentar ou pedir informação."><textarea id="ocorrencia-mensagem" rows="2" value=${texto} onInput=${(ev) => setTexto(ev.target.value)}></textarea><//>
            <div class="acoes">
              ${acoes.map((a) => html`<button type="button" key=${a.id} class=${a.id === 'avancar' ? 'btn primario' : 'btn secundario'} onClick=${() => fazer(a.id)}>${a.rotulo}</button>`)}
              ${comPrazo && html`<button type="button" class="btn secundario" onClick=${() => rodar((e) => pedirInformacao(e, oc.id, texto, 'sindico', new Date()), 'Pedido enviado ao morador.', () => setTexto(''))}>Pedir mais informações</button>`}
            </div>
          </div>
          ${comPrazo && !oc.os && !encerrada && html`<div class="cartao">
            <strong>Gerar OS</strong>
            <div class="edicao-anuncio">
              <${Campo} rotulo="Responsável"><select id="os-responsavel" value=${responsavel} onChange=${(ev) => setResponsavel(ev.target.value)}><option value="zelador">Zelador (${ZELADOR})</option><option value="prestador">Prestador externo</option></select><//>
              ${responsavel === 'prestador' && html`<${Campo} rotulo="Prestador"><input id="os-prestador" value=${prestador} onInput=${(ev) => setPrestador(ev.target.value)} placeholder="Ex.: Elevadores Atlas" /><//>`}
            </div>
            <button type="button" class="btn primario" data-acao="gerar-os" onClick=${() => rodar((e) => gerarOS(e, oc.id, { responsavel, prestador }, 'sindico', new Date()), 'OS aberta.')}>Gerar OS</button>
          </div>`}
          ${irregularidade && html`<${CartaoProcessoOcorrencia} key=${oc.id} estado=${estado} executar=${executar} oc=${oc} />`}
          ${comPrazo && html`<div class="cartao">
            <strong>Arquivar com justificativa</strong>
            <${Campo} rotulo="Motivo do arquivamento"><input id="arquivar-motivo" value=${motivo} onInput=${(ev) => setMotivo(ev.target.value)} placeholder="Ex.: improcedente, duplicada da OC-0042" /><//>
            <button type="button" class="btn secundario" onClick=${() => rodar((e) => arquivarComJustificativa(e, oc.id, motivo, 'sindico', new Date()), 'Notificação arquivada.')}>Arquivar</button>
          </div>`}
          <${Erro} texto=${erro} />
          <${Sucesso} texto=${mensagem} />
        </div>`}
  </section>`;
}

function SDocumentos({ estado, agora }) {
  const [busca, setBusca] = useState('');
  const [aberto, setAberto] = useState(null);
  const [historico, setHistorico] = useState(null);
  const alertas = alertasDocumentos(estado.documentos, isoDia(agora));
  const termo = busca.trim().toLowerCase();
  const docs = estado.documentos.filter((d) => !termo || d.titulo.toLowerCase().includes(termo) || d.pasta.toLowerCase().includes(termo));
  const pastas = [...new Set(docs.map((d) => d.pasta))];
  const doc = aberto ? estado.documentos.find((d) => d.id === aberto) : null;
  if (doc) return html`<section><${PrevDoc} documento=${doc} aoFechar=${() => setAberto(null)} /></section>`;
  return html`<section>
    <h1>Documentos</h1>
    ${alertas.length > 0 && html`<div class="alertas">${alertas.map((a) => html`<p key=${a.documento.id} class=${`alerta-doc faixa-${a.faixa}`}><strong>${textoAlerta(a)}</strong> · ${a.documento.titulo} (${fmtDataCurta(a.documento.vencimento)})</p>`)}</div>`}
    <div class="formulario"><${Campo} rotulo="Buscar documento"><input id="documentos-busca" type="search" value=${busca} onInput=${(ev) => setBusca(ev.target.value)} placeholder="Ex.: ata, AVCB, regimento" /><//></div>
    ${pastas.map((p) => html`<div key=${p}>
      <h2>${p}</h2>
      <ul class="lista-cartoes">${docs.filter((d) => d.pasta === p).map((d) => {
        const atual = d.versoes[d.versoes.length - 1];
        return html`<li key=${d.id} class="cartao">
          <div class="linha-entre"><button type="button" class="btn-link" onClick=${() => setAberto(d.id)}>${d.titulo}</button>${d.visibilidade === 'conselho' && html`<${Etiqueta}>Só conselho<//>`}</div>
          <small class="sub">Vigente: versão ${atual.versao} de ${fmtDataCurta(atual.data)}${d.vencimento ? ` · vence em ${fmtDataCurta(d.vencimento)}` : ''}</small>
          ${d.versoes.length > 1 && html`<button type="button" class="btn-link" onClick=${() => setHistorico(historico === d.id ? null : d.id)}>${historico === d.id ? 'Ocultar histórico' : `Histórico (${d.versoes.length} versões)`}</button>`}
          ${historico === d.id && html`<ul class="historico">${[...d.versoes].reverse().map((v) => html`<li key=${v.versao}>Versão ${v.versao} · ${fmtDataCurta(v.data)}</li>`)}</ul>`}
        </li>`;
      })}</ul>
    </div>`)}
    ${!docs.length && html`<${Vazio} texto="Nenhum documento encontrado." />`}
  </section>`;
}

function SEncomendas({ estado, executar, agora }) {
  const [mensagem, setMensagem] = useState(null);
  const lista = [...estado.encomendas].sort((a, b) => b.chegadaEm.localeCompare(a.chegadaEm));

  function lembrar(id) {
    const r = executar((e) => lembrarEncomenda(e, id, new Date()));
    setMensagem(r.erro || 'Lembrete reenviado por WhatsApp.');
  }

  return html`<section>
    <h1>Encomendas</h1>
    <${Sucesso} texto=${mensagem} />
    <div class="tabela-rolagem"><table class="tabela">
      <thead><tr><th>Unidade</th><th>Morador</th><th>Transportadora</th><th>Chegada</th><th>Situação</th><th>Ação</th></tr></thead>
      <tbody>${lista.map((e) => {
        const parada = encomendaParada(e, agora);
        let situacao = html`<${Etiqueta} tipo="alerta">Aguardando<//>`;
        if (e.status === 'retirada') situacao = html`<${Etiqueta} tipo="ok">Retirada por ${e.retiradaPor}<//>`;
        else if (parada) situacao = html`<${Etiqueta} tipo="perigo">Parada, chegou ${haQuanto(e.chegadaEm, agora)}<//>`;
        return html`<tr key=${e.id}>
          <td>${e.unidade}</td>
          <td>${moradoresDaUnidade(estado, e.unidade).map((m) => m.nome).join(', ') || '—'}</td>
          <td>${e.transportadora}</td>
          <td>${fmtDataHora(e.chegadaEm)}</td>
          <td>${situacao}${e.lembretes ? html` <small class="sub">${e.lembretes} lembrete(s)</small>` : ''}</td>
          <td>${e.status === 'aguardando' && html`<button type="button" class="btn secundario" onClick=${() => lembrar(e.id)}>Reenviar lembrete</button>`}</td>
        </tr>`;
      })}</tbody>
    </table></div>
  </section>`;
}

function SVendas({ estado, executar, agora }) {
  const [editando, setEditando] = useState(null);
  const [motivo, setMotivo] = useState('');
  const [erro, setErro] = useState(null);
  const mes = isoDia(agora).slice(0, 7);
  const pendentes = estado.pessoas.filter((p) => p.vendedor === 'pendente');
  const vendedores = estado.pessoas.filter((p) => ['aprovado', 'suspenso'].includes(p.vendedor));
  const pedidosNoMes = (unidade) => estado.pedidos.filter((p) => (!unidade || p.vendedor === unidade) && isoDia(new Date(p.criadoEm)).slice(0, 7) === mes).length;

  function rodar(acao) {
    const r = executar(acao);
    if (r.erro) {
      setErro(r.erro);
      return;
    }
    setErro(null);
    setEditando(null);
    setMotivo('');
  }

  function abrir(tipo, id) {
    setEditando({ tipo, id });
    setMotivo('');
    setErro(null);
  }

  function confirmar() {
    const { tipo, id } = editando;
    if (tipo === 'recusar') rodar((e) => recusarVendedor(e, id, motivo));
    if (tipo === 'suspender') rodar((e) => suspenderVendedor(e, id, motivo));
    if (tipo === 'ocultar') rodar((e) => ocultarAnuncio(e, id, motivo));
  }

  const caixaMotivo = (tipo, id) => editando && editando.tipo === tipo && editando.id === id && html`<div class="recusa">
    <${Campo} rotulo="Motivo"><input id=${`motivo-${tipo}-${id}`} value=${motivo} onInput=${(ev) => setMotivo(ev.target.value)} /><//>
    <button type="button" class="btn perigo" onClick=${confirmar}>Confirmar</button>
    <button type="button" class="btn secundario" onClick=${() => setEditando(null)}>Voltar</button>
  </div>`;

  return html`<section>
    <h1>Vendas entre moradores</h1>
    <div class="indicadores">
      <div class="indicador"><${QuadroIcone} nome="sacola" /><span class="ind-rotulo">Pedidos no mês</span><strong>${pedidosNoMes()}</strong><small>Entre todos os vendedores</small></div>
      <div class="indicador"><${QuadroIcone} nome="loja" /><span class="ind-rotulo">Vendedores ativos</span><strong>${vendedores.filter((p) => p.vendedor === 'aprovado').length}</strong><small>${pendentes.length} aguardando aprovação</small></div>
    </div>
    <p class="sub">Por privacidade, conversas e detalhes dos pedidos ficam só entre comprador e vendedor.</p>
    <${Erro} texto=${erro} />
    <h2>Solicitações para vender</h2>
    ${pendentes.length
      ? html`<ul class="lista-cartoes">${pendentes.map((p) => html`<li key=${p.unidade} class="cartao">
          <div class="linha-entre"><strong>${p.nome} · apto ${p.unidade}</strong><small class="sub">${fmtDataHora(p.pedidoVenda.em)}</small></div>
          <span>${p.pedidoVenda.texto}</span>
          ${caixaMotivo('recusar', p.unidade) || html`<div class="acoes">
            <button type="button" class="btn primario" data-acao=${`aprovar-vendedor-${p.unidade}`} onClick=${() => rodar((e) => aprovarVendedor(e, p.unidade))}>Aprovar</button>
            <button type="button" class="btn secundario" onClick=${() => abrir('recusar', p.unidade)}>Recusar</button>
          </div>`}
        </li>`)}</ul>`
      : html`<${Vazio} texto="Nenhuma solicitação aguardando." />`}
    <h2>Vendedores</h2>
    <div class="tabela-rolagem"><table class="tabela">
      <thead><tr><th>Vendedor</th><th>Situação</th><th>Anúncios ativos</th><th>Pedidos no mês</th><th>Ação</th></tr></thead>
      <tbody>${vendedores.map((p) => html`<tr key=${p.unidade}>
        <td>${p.nome} · apto ${p.unidade}</td>
        <td>${p.vendedor === 'aprovado' ? html`<${Etiqueta} tipo="ok">Ativo<//>` : html`<${Etiqueta} tipo="perigo">Suspenso<//>`}</td>
        <td>${estado.anuncios.filter((a) => a.vendedor === p.unidade && a.ativo && !a.oculto).length}</td>
        <td>${pedidosNoMes(p.unidade)}</td>
        <td>${p.vendedor === 'aprovado'
          ? caixaMotivo('suspender', p.unidade) || html`<button type="button" class="btn secundario" onClick=${() => abrir('suspender', p.unidade)}>Suspender</button>`
          : html`<button type="button" class="btn secundario" onClick=${() => rodar((e) => reativarVendedor(e, p.unidade))}>Reativar</button>`}</td>
      </tr>`)}</tbody>
    </table></div>
    <h2>Anúncios</h2>
    <div class="tabela-rolagem"><table class="tabela">
      <thead><tr><th>Anúncio</th><th>Vendedor</th><th>Preço</th><th>Disponível</th><th>Situação</th><th>Ação</th></tr></thead>
      <tbody>${[...estado.anuncios].sort((a, b) => b.criadoEm.localeCompare(a.criadoEm)).map((a) => {
        let situacao = html`<${Etiqueta} tipo="ok">Na vitrine<//>`;
        if (a.oculto) situacao = html`<${Etiqueta} tipo="perigo">Oculto<//>`;
        else if (!a.ativo) situacao = html`<${Etiqueta}>Pausado<//>`;
        return html`<tr key=${a.id}>
          <td>${a.titulo}${a.oculto ? html`<br /><small class="sub">Motivo: ${a.motivoOculto}</small>` : ''}</td>
          <td>${nomeVizinho(estado, a.vendedor)} · apto ${a.vendedor}</td>
          <td>${fmtCentavos(a.preco)}</td>
          <td>${a.quantidade}</td>
          <td>${situacao}</td>
          <td>${a.oculto
            ? html`<button type="button" class="btn secundario" onClick=${() => rodar((e) => mostrarAnuncio(e, a.id))}>Mostrar</button>`
            : caixaMotivo('ocultar', a.id) || html`<button type="button" class="btn secundario" onClick=${() => abrir('ocultar', a.id)}>Ocultar</button>`}</td>
        </tr>`;
      })}</tbody>
    </table></div>
  </section>`;
}

// O zelador vê só as OS, as compras dele e o caixa pequeno: nada de receitas, inadimplência ou saldo do condomínio.
const ABAS_ZELADOR = [['os', 'OS', 'prancheta'], ['compras', 'Compras', 'sacola'], ['caixa', 'Caixa', 'cifrao']];

function relogioZelador(d) {
  return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}

function TelaZelador(props) {
  const { estado, rota } = props;
  const tela = ABAS_ZELADOR.some(([id]) => id === rota.tela) ? rota.tela : 'os';
  const liberadoZelador = liberado(estado.plano, 'zelador');
  const Conteudo = { os: ZOS, compras: ZCompras, caixa: ZCaixa }[tela];
  return html`<div class="celular">
    <div class="cel-status" aria-hidden="true"><span>${relogioZelador(props.agora)}</span><span>CondoFácil</span></div>
    <div class="cel-pessoa"><strong>${ZELADOR} · Zelador</strong></div>
    <div class="cel-conteudo">${liberadoZelador
      ? html`<${Conteudo} ...${props} />`
      : html`<section class="m-pagina"><h1 class="m-titulo">Zelador</h1><div class="bloqueado"><strong>Ordens de serviço, compras e caixa pequeno</strong><span>Módulo do zelador disponível no plano Intermediário</span></div></section>`}</div>
    <nav class="cel-abas zelador" aria-label="Navegação do zelador">
      ${ABAS_ZELADOR.map(([id, nome, icone]) => html`<a key=${id} href=${`#zelador.${id}`} class=${id === tela ? 'ativa' : ''} aria-current=${id === tela ? 'page' : undefined}><${Icone} nome=${icone} />${nome}</a>`)}
    </nav>
  </div>`;
}

function ZOS(props) {
  const { estado, rota } = props;
  if (rota.id === 'nova') return html`<${ZNovaOS} ...${props} />`;
  const os = rota.id ? estado.manutencao.os.find((o) => o.id === rota.id) : null;
  if (os) return html`<${ZDetalheOS} key=${os.id} ...${props} os=${os} />`;
  const lista = listaOS(estado).filter((o) => o.status !== 'validada');
  return html`<section class="m-pagina">
    <h1 class="m-titulo">Ordens de serviço</h1>
    <a class="btn primario bloco" href="#zelador.os.nova">Nova OS</a>
    ${lista.length
      ? html`<ul class="m-lista">${lista.map((o) => html`<li key=${o.id}><a class="cartao link" href=${`#zelador.os.${o.id}`}>
          <div class="linha-entre"><strong>${o.id} · ${o.local}</strong><${EtqPrioridade} prioridade=${o.prioridade} /></div>
          <span>${o.descricao}</span>
          <div class="linha-entre"><small class="sub">Prazo ${fmtPrazo(o.prazo)}</small><${EtqOS} status=${o.status} /></div>
        </a></li>`)}</ul>`
      : html`<${Vazio} texto="Nenhuma OS em aberto." />`}
  </section>`;
}

function ZNovaOS({ executar }) {
  const [local, setLocal] = useState('');
  const [descricao, setDescricao] = useState('');
  const [prioridade, setPrioridade] = useState('normal');
  const [erro, setErro] = useState(null);

  function registrar() {
    const r = executar((e) => abrirOS(e, { local, descricao, prioridade }, 'zelador', new Date()));
    if (r.erro) setErro(r.erro);
    else ir('zelador', 'os', r.id);
  }

  return html`<section class="m-pagina">
    <a class="voltar" href="#zelador.os">‹ OS</a>
    <h1 class="m-titulo">Nova OS (ronda)</h1>
    <${Campo} rotulo="Local"><input id="z-os-local" value=${local} onInput=${(ev) => setLocal(ev.target.value)} placeholder="Ex.: piscina, hall do 3º andar" /><//>
    <${Campo} rotulo="Descrição"><textarea id="z-os-descricao" rows="3" value=${descricao} onInput=${(ev) => setDescricao(ev.target.value)}></textarea><//>
    <${Campo} rotulo="Prioridade"><select id="z-os-prioridade" value=${prioridade} onChange=${(ev) => setPrioridade(ev.target.value)}>${ORDEM_PRIORIDADE.map((p) => html`<option key=${p} value=${p}>${PRIORIDADES[p].nome}</option>`)}</select><//>
    <${Erro} texto=${erro} />
    <button type="button" class="btn primario bloco" onClick=${registrar}>Registrar OS</button>
  </section>`;
}

function ZDetalheOS({ executar, os }) {
  const [concluindo, setConcluindo] = useState(false);
  const [fotoDepois, setFotoDepois] = useState(false);
  const [materiais, setMateriais] = useState('');
  const [horas, setHoras] = useState('');
  const [observacoes, setObservacoes] = useState('');
  const [erro, setErro] = useState(null);
  const [mensagem, setMensagem] = useState(null);
  const executando = ['em_execucao', 'aguardando_material', 'aguardando_prestador'].includes(os.status);

  function rodar(acao, sucesso) {
    const r = executar(acao);
    setErro(r.erro || null);
    setMensagem(r.erro ? null : sucesso);
    return r;
  }

  function concluir() {
    const r = rodar((e) => concluirOS(e, os.id, { fotoDepois, materiais, horas: Number(String(horas).replace(',', '.')), observacoes }, 'zelador', new Date()), 'OS concluída. O síndico vai validar.');
    if (!r.erro) setConcluindo(false);
  }

  return html`<section class="m-pagina">
    <a class="voltar" href="#zelador.os">‹ OS</a>
    <p class="protocolo">${os.id}${os.notificacao ? ` · ${os.notificacao}` : ''}</p>
    <h1 class="m-titulo">${os.local}</h1>
    <div class="etq-linha"><${EtqPrioridade} prioridade=${os.prioridade} /><${EtqOS} status=${os.status} /></div>
    <p class="m-texto">${os.descricao}</p>
    <small class="sub">Prazo ${fmtPrazo(os.prazo)}</small>
    <${FotosOS} os=${os} />
    ${osAtiva(os) && html`<div class="acoes">
      ${os.status !== 'em_execucao' && html`<button type="button" class="btn primario" onClick=${() => rodar((e) => iniciarOS(e, os.id, 'zelador', new Date()), 'OS em execução.')}>${os.status === 'aberta' ? 'Iniciar' : 'Retomar'}</button>`}
      ${os.status === 'em_execucao' && html`<button type="button" class="btn secundario" onClick=${() => rodar((e) => pausarOS(e, os.id, 'aguardando_material', 'zelador', new Date()), 'Marcada como aguardando material.')}>Aguardando material</button>`}
      ${os.status === 'em_execucao' && html`<button type="button" class="btn secundario" onClick=${() => rodar((e) => pausarOS(e, os.id, 'aguardando_prestador', 'zelador', new Date()), 'Marcada como aguardando prestador.')}>Aguardando prestador</button>`}
      ${executando && !concluindo && html`<button type="button" class="btn primario" onClick=${() => setConcluindo(true)}>Concluir</button>`}
    </div>`}
    ${concluindo && html`<div class="cartao pilha">
      <button type="button" class="btn secundario" aria-pressed=${fotoDepois} onClick=${() => setFotoDepois(true)}>${fotoDepois ? 'Foto do depois anexada' : 'Anexar foto do depois'}</button>
      <${Campo} rotulo="Materiais usados"><input id="z-os-materiais" value=${materiais} onInput=${(ev) => setMateriais(ev.target.value)} /><//>
      <${Campo} rotulo="Horas gastas"><input id="z-os-horas" type="number" step="0.5" min="0" value=${horas} onInput=${(ev) => setHoras(ev.target.value)} /><//>
      <${Campo} rotulo="Observações"><textarea id="z-os-observacoes" rows="2" value=${observacoes} onInput=${(ev) => setObservacoes(ev.target.value)}></textarea><//>
      <button type="button" class="btn primario bloco" data-acao="concluir-os" onClick=${concluir}>Concluir OS</button>
    </div>`}
    <${Erro} texto=${erro} />
    <${Sucesso} texto=${mensagem} />
    <h2>Andamento</h2>
    <${LinhaTempo} linha=${os.linha} nomes=${NOMES_STATUS_OS} />
  </section>`;
}

function ZCompras(props) {
  const { estado, executar, rota } = props;
  const [recebendo, setRecebendo] = useState(null);
  const [valorFinal, setValorFinal] = useState('');
  const [nota, setNota] = useState('');
  const [erro, setErro] = useState(null);
  if (rota.id === 'nova') return html`<${ZNovaCompra} ...${props} />`;
  const lista = [...estado.manutencao.compras].reverse();

  function confirmar(id) {
    const r = executar((e) => receberCompra(e, id, { valorFinal: lerPreco(valorFinal), nota }, 'zelador', new Date()));
    setErro(r.erro || null);
    if (!r.erro) {
      setRecebendo(null);
      setValorFinal('');
      setNota('');
    }
  }

  return html`<section class="m-pagina">
    <h1 class="m-titulo">Compras</h1>
    <a class="btn primario bloco" href="#zelador.compras.nova">Nova compra</a>
    ${lista.length
      ? html`<ul class="m-lista">${lista.map((c) => html`<li key=${c.id} class="cartao">
          <div class="linha-entre"><strong>${c.id} · ${c.item}</strong><${EtqCompra} status=${c.status} /></div>
          <small class="sub">${fmtReais(c.valorFinal || c.valorEstimado)}${c.os ? ` · ${c.os}` : ''}${c.motivoRecusa ? ` · recusada: ${c.motivoRecusa}` : ''}</small>
          ${c.status === 'aprovada' && recebendo !== c.id && html`<button type="button" class="btn secundario" data-compra-receber=${c.id} onClick=${() => { setRecebendo(c.id); setErro(null); }}>Registrar recebimento</button>`}
          ${recebendo === c.id && html`<div class="pilha">
            <${Campo} rotulo="Valor final (R$)"><input id=${`z-valor-final-${c.id}`} inputmode="decimal" value=${valorFinal} onInput=${(ev) => setValorFinal(ev.target.value)} /><//>
            <button type="button" class="btn secundario" onClick=${() => setNota(`nota-${c.id}.pdf`)}>${nota ? `Anexada: ${nota}` : 'Anexar nota fiscal'}</button>
            <button type="button" class="btn primario" onClick=${() => confirmar(c.id)}>Confirmar recebimento</button>
            <${Erro} texto=${erro} />
          </div>`}
        </li>`)}</ul>`
      : html`<${Vazio} texto="Nenhuma compra pedida." />`}
  </section>`;
}

function ZNovaCompra({ estado, executar }) {
  const comCotacao = liberado(estado.plano, 'cotacoes');
  const [item, setItem] = useState('');
  const [quantidade, setQuantidade] = useState('1');
  const [valor, setValor] = useState('');
  const [categoria, setCategoria] = useState('manutencao');
  const [os, setOs] = useState('');
  const [motivo, setMotivo] = useState('');
  const [fornecedor, setFornecedor] = useState('');
  const [valorCotacao, setValorCotacao] = useState('');
  const [erro, setErro] = useState(null);
  const ativas = estado.manutencao.os.filter(osAtiva);

  function pedir() {
    const cotacoes = comCotacao && fornecedor.trim() ? [{ fornecedor: fornecedor.trim(), valor: lerPreco(valorCotacao) }] : [];
    const r = executar((e) => solicitarCompra(e, { item, quantidade: Number(quantidade), valorEstimado: lerPreco(valor), categoria, os: os || null, motivo, cotacoes }, 'zelador', new Date()));
    if (r.erro) setErro(r.erro);
    else ir('zelador', 'compras');
  }

  return html`<section class="m-pagina">
    <a class="voltar" href="#zelador.compras">‹ Compras</a>
    <h1 class="m-titulo">Nova compra</h1>
    <${Campo} rotulo="Item"><input id="z-compra-item" value=${item} onInput=${(ev) => setItem(ev.target.value)} /><//>
    <div class="edicao-anuncio">
      <${Campo} rotulo="Quantidade"><input id="z-compra-quantidade" type="number" min="1" value=${quantidade} onInput=${(ev) => setQuantidade(ev.target.value)} /><//>
      <${Campo} rotulo="Valor estimado (R$)"><input id="z-compra-valor" inputmode="decimal" value=${valor} onInput=${(ev) => setValor(ev.target.value)} /><//>
    </div>
