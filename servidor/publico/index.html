// ---- src/assistente/regras.js ----

// Sr. Abel sem IA: entende algumas intenções com dados do próprio perfil e, no resto, busca a seção do manual.
// Mesmas regras de privacidade da versão com IA: cada perfil só recebe o que já pode ver no app.

const PERFIS_ABEL = {
  morador: { sugestoes: ['Tenho encomenda na portaria?', 'Tem enquete para eu votar?', 'Como pago o condomínio?', 'Minhas reservas', 'Como abro uma ocorrência?', 'Quem está devendo?', 'Como começo a vender?'] },
  sindico: { sugestoes: ['Quem está inadimplente?', 'Como está a enquete da academia?', 'Encomendas paradas', 'Como emito os boletos?', 'Como faço um acordo?', 'Como reajusto a taxa?', 'Multa com defesa'] },
  portaria: { sugestoes: ['Reservas de hoje', 'Encomendas aguardando', 'Morador perdeu o código', 'Como troco meu plantão?'] },
  zelador: { sugestoes: ['Minhas OS', 'Como concluo uma OS?', 'Preciso comprar material', 'Caixa pequeno'] },
  conselho: { sugestoes: ['Como aprovo a prestação de contas?', 'Onde vejo os balancetes?', 'O que é fluxo de caixa?'] },
};

const PALAVRAS_VAZIAS = new Set('a o e de da do das dos em no na nos nas um uma para por com como que eu meu minha qual quais quando onde tem ter ser se ao os as e posso faco fazer voce sr abel oi ola bom dia tarde noite favor'.split(' '));

function semAcentoAbel(texto) {
  return String(texto || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
}

function secoesManualAbel(manual = MANUAL_ABEL) {
  return manual.split(/\n(?=## )/).filter((s) => s.startsWith('## ')).map((s) => ({ titulo: s.split('\n')[0].replace(/^## \d+\.\s*/, ''), corpo: s }));
}

const SECOES = secoesManualAbel();

function intencaoAbel(pergunta) {
  const t = semAcentoAbel(pergunta);
  if (/incendio|fogo|fumaca|cheiro de gas|vazamento de gas|ferid|desmai|assalt|invas|socorro/.test(t)) return 'emergencia';
  if (/quem (esta|ta|anda)? ?devendo|inadimpl|devedor|quem deve|quem nao pagou|quem esta atrasad/.test(t)) return 'devedores';
  if (/quem reservou|de quem e a reserva|quem abriu|quem fez a (denuncia|ocorrencia)|telefone d[oa] (morador|vizinh)|onde mora/.test(t)) return 'dadoTerceiro';
  if (/encomenda|pacote|entrega|correio|mercado livre|amazon|shopee|codigo de retirada|perdeu o codigo/.test(t)) return 'encomendas';
  if (/(tem|ha|existe)\b.*(enquete|votacao)|enquetes? (da|de|do|aberta|pendente)|como (esta|anda|vai) a enquete|quero votar|minhas? enquetes?|participacao da enquete/.test(t)) return 'enquetes';
  if (/minhas? reservas?|reservas? de hoje|tenho reserva/.test(t)) return 'reservas';
  if (/minhas? os\b|ordens? de servico|minhas ordens/.test(t)) return 'os';
  if (/(meu|minha|quanto).*(boleto|condominio|taxa|cobranca)|(boleto|cobranca).*(aberto|vencid|atrasad|pagar)|2a via|segunda via/.test(t)) return 'cobranca';
  return null;
}

function linkAbel(rotulo, perfil, tela) {
  return { rotulo, perfil, tela };
}

function buscarNoManual(pergunta) {
  const termos = semAcentoAbel(pergunta).split(/[^a-z0-9]+/).filter((t) => t.length > 2 && !PALAVRAS_VAZIAS.has(t));
  let melhor = null;
  let nota = 0;
  for (const s of SECOES) {
    const corpo = semAcentoAbel(s.corpo);
    const titulo = semAcentoAbel(s.titulo);
    let n = 0;
    for (const t of termos) {
      const raiz = t.slice(0, Math.max(4, t.length - 2));
      n += Math.min(corpo.split(raiz).length - 1, 4) + (titulo.includes(raiz) ? 6 : 0);
    }
    if (n > nota) { nota = n; melhor = s; }
  }
  return nota >= 3 ? melhor : null;
}

function trechoSecao(secao, max = 9) {
  return secao.corpo.split('\n').slice(1).filter((l) => l.trim() && !l.startsWith('|') && !l.startsWith('**Mensagens')).slice(0, max).join('\n');
}

function nomeDaUnidade(estado, unidade) {
  const p = estado.pessoas.find((x) => x.unidade === unidade);
  return p ? p.nome.split(' ')[0] : `apto ${unidade}`;
}

function saudacaoAbel(estado, perfil) {
  if (perfil === 'morador') return `Oi, ${nomeDaUnidade(estado, estado.moradorAtual)}! Eu sou o **Sr. Abel** 🐝. Posso ajudar com encomendas, boletos, reservas, ocorrências e vendas. O que você precisa?`;
  if (perfil === 'sindico') return `Olá, ${estado.condominio.sindico.nome.split(' ')[0]}! **Sr. Abel** na área 🐝. Pergunte sobre inadimplência, encomendas paradas ou como usar qualquer tela.`;
  if (perfil === 'portaria') return 'Olá! Aqui é o **Sr. Abel** 🐝. Posso ajudar com encomendas, reservas de hoje e a escala.';
  if (perfil === 'zelador') return 'E aí, Seu Antônio! **Sr. Abel** por aqui 🐝. Quer ver suas OS ou tirar dúvida de compra?';
  return 'Olá! Eu sou o **Sr. Abel** 🐝. Posso explicar a prestação de contas e onde achar os documentos.';
}

// Devolve { texto, links } — texto com **negrito** e listas com "- ".
function responderAbel(estado, perfil, pergunta, agora) {
  const hoje = isoDia(agora);
  const intencao = intencaoAbel(pergunta);

  if (intencao === 'emergencia') {
    return { texto: 'Isso é uma emergência! Primeiro ligue:\n- **193** Bombeiros (fogo, gás, resgate)\n- **192** SAMU (pessoa ferida ou passando mal)\n- **190** Polícia\n\nDepois avise a portaria. Quando estiver seguro, abra uma ocorrência para registrar.', links: [] };
  }

  if (intencao === 'devedores' || intencao === 'dadoTerceiro') {
    if (perfil === 'sindico' && intencao === 'devedores') {
      const lista = devedores(estado, hoje);
      if (!lista.length) return { texto: 'Boa notícia: nenhuma unidade com cobrança vencida hoje. 🐝', links: [] };
      const linhas = lista.map((d) => `- **${d.unidade}**${d.responsavel ? ` · ${d.responsavel.nome}` : ''}: ${d.cobrancas} cobrança(s), ${fmtReais(d.valor)} atualizado, ${d.dias} dias${d.acordo ? ' · em acordo' : ''}`);
      return { texto: `Unidades com cobrança vencida (trate com discrição):\n${linhas.join('\n')}\n\nVocê pode disparar a régua ou propor um acordo em **Cobrança**.`, links: [linkAbel('Abrir Cobrança', 'sindico', 'cobranca')] };
    }
    return { texto: 'Essa informação é privada e eu não posso compartilhar 🐝. Cada morador só vê os próprios dados, e assuntos de outras unidades ficam com o síndico. Posso te ajudar com alguma coisa da sua unidade?', links: [] };
  }

  if (intencao === 'encomendas') {
    const aguardando = estado.encomendas.filter((e) => e.status === 'aguardando');
    if (perfil === 'morador') {
      const minhas = aguardando.filter((e) => e.unidade === estado.moradorAtual);
      if (!minhas.length) return { texto: 'Nenhuma encomenda sua aguardando na portaria agora. Quando chegar, eu te aviso pelo app. 📦', links: [] };
      const linhas = minhas.map((e) => `- ${e.transportadora}, chegou ${fmtDataCurta(e.chegadaEm.slice(0, 10))} · código **${e.codigo}**`);
      return { texto: `Você tem ${minhas.length} encomenda(s) na portaria:\n${linhas.join('\n')}\n\nMostre o QR Code ou o código na portaria para retirar.`, links: [linkAbel('Ver encomendas', 'morador', 'mais')] };
    }
    if (perfil === 'portaria' || perfil === 'sindico') {
      if (/perdeu|esqueceu/.test(semAcentoAbel(pergunta))) return { texto: 'Sem problema: em **Entregar**, busque pela **unidade** em vez do código, confirme com o morador e registre o nome de quem retirou. O morador também vê o código de novo no app, em Mais → Encomendas.', links: [linkAbel('Ir para Entregar', 'portaria', 'entregar')] };
      const porUnidade = {};
      for (const e of aguardando) porUnidade[e.unidade] = (porUnidade[e.unidade] || 0) + 1;
      const linhas = Object.entries(porUnidade).map(([u, n]) => `- apto **${u}**: ${n}`);
      return { texto: `${aguardando.length} encomenda(s) aguardando retirada:\n${linhas.join('\n')}`, links: perfil === 'portaria' ? [linkAbel('Ir para Entregar', 'portaria', 'entregar')] : [linkAbel('Abrir Encomendas', 'sindico', 'encomendas')] };
    }
  }

  if (intencao === 'reservas') {
    const nomeArea = (r) => (areaPorId(estado, r.areaId) || { nome: r.areaId }).nome;
    if (perfil === 'portaria' || /hoje/.test(semAcentoAbel(pergunta))) {
      const deHoje = estado.reservas.filter((r) => r.data === hoje && r.status === 'confirmada');
      if (perfil !== 'portaria' && perfil !== 'sindico') return { texto: 'Eu só mostro as reservas da sua unidade. Toque em **Reservas** para ver o calendário com os horários livres.', links: [linkAbel('Abrir Reservas', 'morador', 'reservas')] };
      if (!deHoje.length) return { texto: 'Nenhuma reserva confirmada para hoje.', links: [] };
      return { texto: `Reservas de hoje:\n${deHoje.map((r) => `- ${nomeArea(r)} · ${r.inicio}h–${r.fim}h · apto ${r.unidade} · ${r.convidados.length} convidado(s)`).join('\n')}`, links: perfil === 'portaria' ? [linkAbel('Ver lista de convidados', 'portaria', 'hoje')] : [] };
    }
    if (perfil === 'morador') {
      const minhas = estado.reservas.filter((r) => r.unidade === estado.moradorAtual && r.data >= hoje && (r.status === 'confirmada' || r.status === 'pendente'));
      if (!minhas.length) return { texto: 'Você não tem reservas futuras. Quer reservar? Vá em **Reservas**, escolha a área, o dia e o horário.', links: [linkAbel('Fazer uma reserva', 'morador', 'reservas')] };
      return { texto: `Suas próximas reservas:\n${minhas.map((r) => `- ${nomeArea(r)} · ${fmtDia(r.data)} · ${r.inicio}h–${r.fim}h · ${r.status === 'pendente' ? 'aguardando o síndico' : 'confirmada'}`).join('\n')}\n\nCancelar com menos de 72 h do início pode ter multa.`, links: [linkAbel('Abrir Reservas', 'morador', 'reservas')] };
    }
  }

  if (intencao === 'enquetes' && perfil === 'morador') {
    const { pendentes, respondidas } = enquetesDaUnidade(estado, estado.moradorAtual, agora);
    if (!pendentes.length) return { texto: `Nenhuma enquete esperando o seu voto. ${respondidas.length ? `Você já votou em ${respondidas.length} enquete(s) aberta(s) e pode trocar o voto até o encerramento.` : ''}`.trim(), links: [linkAbel('Ver enquetes', 'morador', 'enquetes')] };
    const lista = pendentes.map((e) => `- **${e.pergunta}** · ${textoDiasRestantes(e, agora)}`).join('\n');
    return { texto: `Enquete(s) esperando o seu voto:\n${lista}\n\nAbra a enquete, escolha a opção e toque em **Enviar voto**.`, links: [linkAbel('Votar agora', 'morador', 'enquetes')] };
  }

  if (intencao === 'enquetes' && perfil === 'sindico') {
    const abertas = estado.enquetes.filter((e) => situacaoEnquete(e, agora) === 'aberta');
    if (!abertas.length) return { texto: 'Nenhuma enquete aberta agora. Para criar, vá em **Enquetes** → **Nova enquete**.', links: [linkAbel('Abrir Enquetes', 'sindico', 'enquetes')] };
    const lista = abertas.map((e) => {
      const a = apuracao(estado, e);
      return `- **${e.pergunta}**: ${a.participantes} de ${a.total} responderam, ${textoDiasRestantes(e, agora)}, ${faltantes(estado, e).length} sem resposta`;
    }).join('\n');
    return { texto: `Enquetes abertas:\n${lista}\n\nNo painel da enquete você manda lembrete só para quem falta.`, links: [linkAbel('Abrir Enquetes', 'sindico', 'enquetes')] };
  }

  if (intencao === 'os' && (perfil === 'zelador' || perfil === 'sindico')) {
    const abertas = estado.manutencao.os.filter((o) => o.status !== 'concluida' && o.status !== 'validada');
    if (!abertas.length) return { texto: 'Nenhuma OS em aberto. Bom trabalho! 🐝', links: [] };
    return { texto: `OS em aberto:\n${abertas.map((o) => `- **${o.id}** · ${o.local}: ${o.descricao} · ${NOMES_STATUS_OS[o.status]} · prazo ${fmtDataCurta(o.prazo.slice(0, 10))}`).join('\n')}\n\nPara concluir, anexe a foto do depois e informe as horas gastas.`, links: [linkAbel('Abrir OS', perfil, perfil === 'zelador' ? 'os' : 'manutencao')] };
  }

  if (intencao === 'cobranca' && perfil === 'morador') {
    const fin = estado.financeiro;
    const minhas = fin.cobrancas.filter((c) => c.unidade === estado.moradorAtual && c.status === 'aberta');
    if (!minhas.length) return { texto: 'Você está em dia: nenhuma cobrança em aberto. 🎉 Quando a próxima for emitida, ela aparece em **Financeiro** para pagar por boleto, Pix ou cartão.', links: [linkAbel('Abrir Financeiro', 'morador', 'financeiro')] };
    const linhas = minhas.map((c) => {
      const v = valorAtualizado(c, fin.parametros, hoje);
      const vencida = situacaoCobranca(c, hoje) === 'vencida';
      return `- ${rotuloCobranca(c)} · ${fmtReais(v.total)} · ${vencida ? `vencida há ${v.dias} dias (com multa e juros)` : `vence ${fmtDataCurta(c.vencimento)}`}`;
    });
    return { texto: `Cobranças em aberto da sua unidade:\n${linhas.join('\n')}\n\nPague em **Financeiro** por boleto, Pix ou cartão. A baixa é automática.`, links: [linkAbel('Pagar agora', 'morador', 'financeiro')] };
  }

  const secao = buscarNoManual(pergunta);
  if (!secao) return { texto: 'Hmm, essa eu não sei responder 🐝. Eu entendo de reservas, boletos, encomendas, ocorrências, vendas, escala e planos do CondoFácil. Para outros assuntos, fale com o síndico.', links: [] };
  return { texto: `Sobre **${secao.titulo}**:\n\n${trechoSecao(secao)}`, links: [] };
}

// Sr. Abel com IA (Avançado): o que cada perfil pode ver, montado do estado real, e as instruções enviadas ao Claude.
function quandoReservaAbel(estado, r) {
  return `${areaPorId(estado, r.areaId).nome}, ${fmtDataCurta(r.data)}, ${fmtHora(r.inicio)}–${fmtHora(r.fim)} (${r.status})`;
}

function contextoMorador(estado, eu, agora) {
  const hoje = isoDia(agora);
  const pessoa = pessoaDaUnidade(estado, eu);
  const fin = estado.financeiro;
  const responsavel = fin.unidades[eu].responsavel;
  const souResponsavel = !!responsavel && !!pessoa && responsavel.nome === pessoa.nome;
  const linhas = [`Pessoa: ${pessoa ? pessoa.nome : `Apto ${eu}`}, morador(a) do apto ${eu}. Responsável financeiro da unidade: ${responsavel ? responsavel.nome : 'não cadastrado'}${souResponsavel ? ' (é a própria pessoa)' : ' (outra pessoa: ela não vê as cobranças)'}.`];
  const pacotes = estado.encomendas.filter((e) => e.unidade === eu && e.status === 'aguardando');
  linhas.push(pacotes.length ? `Encomendas aguardando retirada: ${pacotes.map((e) => `${e.transportadora}, código ${e.codigo}, chegou em ${fmtDataCurta(isoDia(new Date(e.chegadaEm)))}${encomendaParada(e, agora) ? ' (parada há mais de 3 dias)' : ''}`).join('; ')}.` : 'Nenhuma encomenda aguardando retirada.');
  const reservas = estado.reservas.filter((r) => r.unidade === eu && ['pendente', 'confirmada'].includes(r.status) && r.data >= hoje);
  linhas.push(reservas.length ? `Reservas futuras da unidade: ${reservas.map((r) => quandoReservaAbel(estado, r)).join('; ')}.` : 'Nenhuma reserva futura.');
  if (souResponsavel) {
    const abertas = fin.cobrancas.filter((c) => c.unidade === eu && c.status === 'aberta');
    linhas.push(abertas.length
      ? `Cobranças em aberto: ${abertas.map((c) => `${nomeMes(c.competencia)}, ${situacaoCobranca(c, hoje) === 'vencida' ? 'vencida' : 'a vencer'}, vencimento ${fmtDataCurta(c.vencimento)}, valor atualizado ${fmtReais(valorAtualizado(c, fin.parametros, hoje).total)} (id ${c.id})`).join('; ')}.`
      : 'Nenhuma cobrança em aberto: financeiro em dia.');
  }
  const ocorrencias = estado.ocorrencias.filter((o) => o.unidade === eu);
  if (ocorrencias.length) linhas.push(`Ocorrências abertas por esta unidade: ${ocorrencias.map((o) => `${o.id} ${CATEGORIAS[o.categoria].nome} (${o.arquivada ? 'arquivada' : NOMES_STATUS[o.status]})`).join('; ')}.`);
  const naoLidos = comunicadosDaUnidade(estado, eu).filter((c) => !c.leituras.includes(eu));
  if (naoLidos.length) linhas.push(`Avisos não lidos: ${naoLidos.map((c) => `"${c.titulo}"`).join(', ')}.`);
  const { pendentes, respondidas, encerradas } = enquetesDaUnidade(estado, eu, agora);
  for (const e of pendentes) linhas.push(`Enquete aberta sem voto da unidade: ${e.id} "${e.pergunta}". Opções: ${e.opcoes.map((o) => `"${o.texto}" (id ${o.id})`).join(', ')}. ${e.tipo === 'multipla' ? `Até ${e.maxEscolhas} opções` : 'Escolha única'}, ${e.secreto ? 'voto secreto' : 'voto aberto'}, ${textoDiasRestantes(e, agora)}.`);
  for (const e of respondidas) linhas.push(`Enquete aberta já votada pela unidade: ${e.id} "${e.pergunta}" (pode trocar o voto até o encerramento).`);
  for (const e of encerradas) linhas.push(`Enquete encerrada: ${e.id} "${e.pergunta}": ${textoResultado(estado, e)}.`);
  for (const p of infracoesDaUnidade(estado, eu)) linhas.push(`Processo ${p.id} contra a unidade: ${NOMES_TIPO_INFRACAO[p.tipo]}${p.valor ? ` de ${fmtReais(p.valor)}` : ''}, ${p.artigo}, fato: "${p.fato}", situação: ${situacaoInfracao(p, hoje)}, prazo de defesa até ${fmtDataCurta(p.prazoAte)}${p.defesa ? ', defesa já enviada' : ''}.`);
  linhas.push(`Áreas reserváveis: ${estado.areas.map((a) => a.nome).join(', ')}.`);
  linhas.push('Esta pessoa NÃO pode ver: quem reservou outras datas, dívidas de outras unidades, autor de ocorrência anônima, votos de outras unidades, pedidos e conversas de outros moradores.');
  return linhas.join('\n');
}

function contextoSindico(estado, agora) {
  const hoje = isoDia(agora);
  const ind = indicadoresFinanceiros(estado, hoje);
  const atencao = [
    ...estado.reservas.filter((r) => r.status === 'pendente').map((r) => `Reserva pendente: ${quandoReservaAbel(estado, r)}, apto ${r.unidade}`),
    ...alertasNotificacoes(estado, agora), ...alertasManutencao(estado, agora), ...alertasEscala(estado, agora), ...alertasInfracoes(estado, hoje),
    ...alertasEnquetes(estado, agora), ...alertasContas(estado, hoje), ...alertasPrestacao(estado, hoje),
  ].map((a) => (typeof a === 'string' ? a : a.texto));
  const docs = alertasDocumentos(estado.documentos, hoje).map((a) => `${a.documento.titulo}: ${a.dias < 0 ? `vencido há ${-a.dias} dias` : `vence em ${a.dias} dias`}`);
  const paradas = estado.encomendas.filter((e) => encomendaParada(e, agora)).map((e) => `encomenda do apto ${e.unidade} parada desde ${fmtDataCurta(isoDia(new Date(e.chegadaEm)))}`);
  const linhas = [`Pessoa: ${estado.condominio.sindico.nome}, síndico (apto ${estado.condominio.sindico.unidade}). Plano: ${estado.plano}. Condomínio: ${estado.condominio.nome}, ${estado.condominio.unidades.length} unidades.`];
  linhas.push(`Precisa da atenção: ${[...atencao, ...docs, ...paradas].join('; ') || 'nada pendente'}.`);
  linhas.push(`Financeiro: saldo ${fmtReais(ind.saldo.valor)}; arrecadação de ${nomeMes(ind.arrecadado.competencia)}: ${fmtReais(ind.arrecadado.recebido)} de ${fmtReais(ind.arrecadado.previsto)} (${ind.arrecadado.pct}%); despesas do mês ${fmtReais(ind.despesas.valor)} contra orçado ${fmtReais(ind.despesas.orcado)}; próxima competência ${nomeMes(proximaCompetencia(estado.financeiro))}.`);
  const lista = devedores(estado, hoje);
  linhas.push(`Inadimplência: ${lista.length} unidades (${ind.inadimplencia.pct}%): ${lista.map((d) => `${d.unidade} (${d.cobrancas} cobranças, ${fmtReais(d.valor)}, ${d.dias} dias${d.acordo ? `, acordo ${d.acordo}` : ''})`).join('; ')}.`);
  for (const e of estado.enquetes.filter((x) => x.situacao !== 'rascunho')) {
    const a = apuracao(estado, e);
    linhas.push(`Enquete ${e.id} "${e.pergunta}": ${a.participantes} de ${a.total} responderam; ${a.opcoes.map((o) => `${o.texto} ${o.votos}`).join(', ')}; ${textoResultado(estado, e)}; ${faltantes(estado, e).length} unidades sem resposta.`);
  }
  linhas.push('O síndico pode ver inadimplência e processos; trate esses dados com discrição. O Sr. Abel não aprova, não multa e não decide nada pelo síndico.');
  return linhas.join('\n');
}

function contextoPortaria(estado, agora) {
  const hoje = isoDia(agora);
  const plantao = plantaoAgora(estado, agora);
  const turnos = Object.entries(POSTOS).map(([id, p]) => {
    const { atual, proximo } = plantao[id];
    return `${p.nome}: ${atual ? (atual.porteiro ? porteiroPorId(atual.porteiro).nome : 'descoberto') : 'fechado agora'}${proximo ? `, próximo ${proximo.porteiro ? porteiroPorId(proximo.porteiro).nome : 'descoberto'} às ${Number(proximo.inicio.slice(11, 13))}h` : ''}`;
  });
  const reservas = estado.reservas.filter((r) => r.data === hoje && ['pendente', 'confirmada'].includes(r.status));
  const pacotes = estado.encomendas.filter((e) => e.status === 'aguardando');
  return [
    'Pessoa: equipe da portaria (tablet da portaria).',
    `Plantão agora: ${turnos.join('; ')}.`,
    `Reservas de hoje: ${reservas.length ? reservas.map((r) => `${quandoReservaAbel(estado, r)}, apto ${r.unidade}, ${r.convidados.length} convidados`).join('; ') : 'nenhuma'}.`,
    `Encomendas aguardando retirada: ${pacotes.length} (${pacotes.map((e) => `apto ${e.unidade}`).join(', ')}).`,
    'A portaria NÃO vê dados financeiros nem autor de ocorrência anônima.',
  ].join('\n');
}

function contextoZelador(estado) {
  const os = listaOS(estado).filter((o) => o.status !== 'validada');
  const compras = estado.manutencao.compras.filter((c) => c.status !== 'recebida');
  return [
    `Pessoa: ${ZELADOR}, zelador. Plano: ${estado.plano}.`,
    `Ordens de serviço: ${os.length ? os.map((o) => `${o.id} "${o.descricao}" em ${o.local} (${o.status}, prioridade ${o.prioridade}, prazo ${fmtDataCurta(isoDia(new Date(o.prazo)))})`).join('; ') : 'nenhuma'}.`,
    `Compras em andamento: ${compras.length ? compras.map((c) => `${c.id} ${c.item} (${c.status})`).join('; ') : 'nenhuma'}.`,
    'O zelador NÃO vê receitas, inadimplência, saldo do condomínio nem dados pessoais de moradores.',
  ].join('\n');
}

function contextoConselho(estado, agora) {
  const hoje = isoDia(agora);
  const meses = mesesDaPrestacao(estado, hoje).map((m) => {
    const b = balanceteDe(estado, m, hoje);
    return `${nomeMes(m)}: ${NOMES_SITUACAO_BALANCETE[b.situacao]}${b.parcial ? ' (parcial)' : ''}, saldo final ${fmtReais(saldoFinal(b))}${b.comentarios.length ? `, ${b.comentarios.length} comentários` : ''}`;
  });
  return [`Pessoa: ${CONSELHEIRO.nome}, ${CONSELHEIRO.papel.toLowerCase()} (apto ${CONSELHEIRO.unidade}). Plano: ${estado.plano}.`, `Prestação de contas: ${meses.join('; ')}.`].join('\n');
}

function contextoAbel(estado, perfil, agora) {
  if (perfil === 'morador') return contextoMorador(estado, estado.moradorAtual, agora);
  if (perfil === 'sindico') return contextoSindico(estado, agora);
  if (perfil === 'portaria') return contextoPortaria(estado, agora);
  if (perfil === 'zelador') return contextoZelador(estado);
  return contextoConselho(estado, agora);
}

function instrucoesAbel(estado, perfil, agora) {
  return `Você é o Sr. Abel, a abelhinha assistente do aplicativo CondoFácil (gestão de condomínios). Siga à risca o MANUAL abaixo: ele define personalidade, limites e o funcionamento do app.

=== MANUAL DO SR. ABEL ===
${MANUAL_ABEL}
=== FIM DO MANUAL ===

Agora responda à conversa a seguir como Sr. Abel.`;
}

// Ferramentas do Sr. Abel para o morador: as mesmas ações do app, com as mesmas regras e mensagens de erro.
function normalizarAbel(s) {
  return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
}

function areaDoTexto(estado, texto) {
  const t = normalizarAbel(texto);
  return estado.areas.find((a) => normalizarAbel(a.nome).includes(t) || t.includes(normalizarAbel(a.nome)) || a.id === t) || null;
}

function dataDoTexto(texto) {
  const t = String(texto || '').trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(t)) return t;
  const m = t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  return m ? `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}` : null;
}

function categoriaDoTexto(texto) {
  const t = normalizarAbel(texto);
  return Object.keys(CATEGORIAS).find((k) => k === t || normalizarAbel(CATEGORIAS[k].nome) === t || normalizarAbel(CATEGORIAS[k].nome).includes(t)) || null;
}

// obterEstado() devolve o estado atual; executar(fn) aplica a ação no app e devolve o resultado dela; aoAgir(titulo, texto) mostra o cartão no chat.
function ferramentasAbel({ obterEstado, executar, agora, aoAgir = () => {} }) {
  const eu = () => obterEstado().moradorAtual;
  const rodar = (acao) => {
    const r = executar(acao);
    if (r.erro) throw new Error(r.erro);
    return r;
  };
  return [
    {
      name: 'consultar_agenda',
      description: 'Mostra os horários de uma área comum numa data, com livre ou ocupado, sem revelar quem reservou. Use antes de propor uma reserva.',
      inputSchema: { type: 'object', properties: { area: { type: 'string', description: 'Nome da área, ex.: churrasqueira' }, data: { type: 'string', description: 'AAAA-MM-DD' } }, required: ['area', 'data'] },
      execute(input) {
        const estado = obterEstado();
        const area = areaDoTexto(estado, input.area);
        if (!area) throw new Error('Área inexistente');
        const data = dataDoTexto(input.data);
        if (!data) throw new Error('Data inválida, use AAAA-MM-DD');
        return { area: area.nome, data: fmtDataCurta(data), taxa: area.taxa ? `R$ ${area.taxa},00` : 'grátis', aprovacao: area.aprovacao === 'automatica' ? 'automática' : 'o síndico aprova', horarios: horariosDaArea(estado, area.id, data, agora()).map((h) => ({ horario: h.rotulo, inicio: h.inicio, situacao: h.livre ? 'livre' : h.motivo.toLowerCase() })) };
      },
    },
    {
      name: 'solicitar_reserva',
      description: 'Pede a reserva de uma área para a unidade da pessoa. SÓ chame depois que a pessoa confirmou área, data, horário e taxa. Devolve confirmada ou pendente, ou o erro de regra.',
      inputSchema: { type: 'object', properties: { area: { type: 'string' }, data: { type: 'string', description: 'AAAA-MM-DD' }, inicio: { type: 'number', description: 'Hora de início do horário escolhido, ex.: 18' } }, required: ['area', 'data', 'inicio'] },
      execute(input) {
        const estado = obterEstado();
        const area = areaDoTexto(estado, input.area);
        if (!area) throw new Error('Área inexistente');
        const data = dataDoTexto(input.data);
        if (!data) throw new Error('Data inválida, use AAAA-MM-DD');
        const horario = horariosDaArea(estado, area.id, data, agora()).find((h) => h.inicio === Number(input.inicio));
        if (!horario) throw new Error('Horário inexistente para esta área');
        const r = rodar((e) => solicitarReserva(e, { areaId: area.id, unidade: eu(), data, inicio: horario.inicio, fim: horario.fim, aceiteTermo: true, convidados: [] }, agora()));
        const reserva = obterEstado().reservas.find((x) => x.id === r.id);
        aoAgir('Reserva solicitada', `${area.nome} · ${fmtDataCurta(data)} · ${horario.rotulo} · ${reserva.status}`);
        return { ok: true, area: area.nome, data: fmtDataCurta(data), horario: horario.rotulo, situacao: reserva.status, observacao: 'A taxa entra no próximo boleto. Cancelar com menos de 72 h pode ter multa.' };
      },
    },
    {
      name: 'abrir_ocorrencia',
      description: 'Registra uma ocorrência da unidade e devolve o protocolo. SÓ chame depois de mostrar o resumo (categoria, descrição, local, anônima, pública) e a pessoa confirmar.',
      inputSchema: { type: 'object', properties: { categoria: { type: 'string', description: `Uma de: ${Object.values(CATEGORIAS).map((c) => c.nome).join(', ')}` }, descricao: { type: 'string' }, local: { type: 'string' }, anonima: { type: 'boolean' }, publica: { type: 'boolean' } }, required: ['categoria', 'descricao'] },
      execute(input) {
        const categoria = categoriaDoTexto(input.categoria);
        if (!categoria) throw new Error('Escolha o tipo e a categoria');
        const r = rodar((e) => abrirOcorrencia(e, { categoria, descricao: input.descricao, local: input.local || '', unidade: eu(), anonima: !!input.anonima, publica: !!input.publica, foto: false }, agora()));
        aoAgir(`Ocorrência ${r.id} aberta`, `${CATEGORIAS[categoria].nome}${input.local ? ` · ${input.local}` : ''}${input.anonima ? ' · anônima' : ''}${input.publica ? ' · pública' : ''}`);
        return { ok: true, protocolo: r.id, acompanhamento: 'Ocorrências → Minhas' };
      },
    },
    {
      name: 'votar_enquete',
      description: 'Registra ou troca o voto da unidade numa enquete aberta. SÓ chame depois que a pessoa confirmou a opção. Use os ids das opções que estão nos dados.',
      inputSchema: { type: 'object', properties: { enquete: { type: 'string', description: 'Ex.: EN-001' }, opcoes: { type: 'array', items: { type: 'string' }, description: 'Ids ou textos das opções escolhidas' }, comentario: { type: 'string' } }, required: ['enquete', 'opcoes'] },
      execute(input) {
        const estado = obterEstado();
        const e = enquetePorId(estado, String(input.enquete || '').toUpperCase());
        if (!e) throw new Error('Enquete não encontrada');
        const escolhidas = [].concat(input.opcoes || []).map((o) => {
          const t = normalizarAbel(o);
          const achada = e.opcoes.find((x) => x.id === o || normalizarAbel(x.texto) === t || normalizarAbel(x.texto).includes(t));
          return achada ? achada.id : String(o);
        });
        const pessoa = pessoaDaUnidade(estado, eu());
        const r = rodar((s) => votar(s, e.id, { unidade: eu(), autor: pessoa ? pessoa.nome : `Apto ${eu()}`, opcoes: escolhidas, comentario: input.comentario }, agora()));
        aoAgir(r.trocou ? 'Voto alterado' : 'Voto registrado', `${e.id} · ${escolhidas.map((id) => e.opcoes.find((o) => o.id === id).texto).join(', ')} · ${e.secreto ? 'voto secreto' : 'voto aberto'}`);
        return { ok: true, enquete: e.id, trocou: r.trocou, observacao: 'Dá para trocar até o encerramento.' };
      },
    },
    {
      name: 'segunda_via',
      description: 'Envia a 2ª via da cobrança em aberto mais antiga da unidade, com valor atualizado, para o app e o WhatsApp do responsável financeiro.',
      execute() {
        const estado = obterEstado();
        const responsavel = estado.financeiro.unidades[eu()].responsavel;
        const pessoa = pessoaDaUnidade(estado, eu());
        if (!responsavel || !pessoa || responsavel.nome !== pessoa.nome) throw new Error(`As cobranças do apto ${eu()} vão para o responsável financeiro${responsavel ? ` (${responsavel.nome})` : ''}`);
        const c = estado.financeiro.cobrancas.filter((x) => x.unidade === eu() && x.status === 'aberta').sort((a, b) => a.vencimento.localeCompare(b.vencimento))[0];
        if (!c) throw new Error('Nenhuma cobrança em aberto: o financeiro está em dia');
        const r = rodar((e) => enviarSegundaVia(e, c.id, agora()));
        aoAgir('2ª via enviada', r.notificacao.texto);
        return { ok: true, texto: r.notificacao.texto };
      },
    },
  ];
}

  return { plano: 'intermediario', escala };
}

function doDia(e, dia, posto) {
  return e.escala.meses['2026-10'].turnos.filter((t) => t.inicio.startsWith(dia) && t.posto === posto).map((t) => [t.porteiro, t.inicio.slice(11), t.fim]);
}

  return semana.linhas.find((l) => l.porteiro === porteiro).celulas.map((c) => c.map((x) => x.tipo + (x.trocado ? '↔' : '')).join('+'));

  try {
    const texto = localStorage.getItem(CHAVE_ESTADO);
    if (!texto) return null;
    const estado = JSON.parse(texto);
    return estado && estado.versao === 11 ? estado : null;
  } catch {
    return null;
  }
}

  try {
    localStorage.setItem(CHAVE_ESTADO, JSON.stringify(estado));
  } catch {
    // Sem armazenamento (aba privada, bloqueio): a demonstração segue só em memória.
  }
}

function limparEstado() {
  try {
    localStorage.removeItem(CHAVE_ESTADO);
  } catch {
    // Idem.
  }
}

// Conversa com o servidor do CondoFácil (condofacil.cloud/app). No claude.ai e em arquivo local nada disso roda: tudo fica simulado.
const CONEXAO = { ativa: false, codigo: null };
const CHAVE_PILOTO = 'condofacil-piloto-v1';
const HOSTS_CONECTADOS = ['condofacil.cloud', 'www.condofacil.cloud', 'localhost', '127.0.0.1'];

function hostPermitido(hostname) {
  return HOSTS_CONECTADOS.includes(hostname);
}

async function detectarServidor() {
  if (typeof location === 'undefined' || !hostPermitido(location.hostname)) return false;
  try {
    const r = await fetch('/api/saude', { signal: AbortSignal.timeout(3000) });
    return r.ok && (await r.json()).ok === true;
  } catch {
    return false;
  }
}

function lerCodigoPiloto() {
  try {
    return localStorage.getItem(CHAVE_PILOTO);
  } catch {
    return null;
  }
}

function guardarCodigoPiloto(codigo) {
  try {
    if (codigo) localStorage.setItem(CHAVE_PILOTO, codigo);
    else localStorage.removeItem(CHAVE_PILOTO);
  } catch {
    // Sem armazenamento, o código vale só até recarregar a página.
  }
}

async function chamarApi(metodo, caminho, corpo, codigo = CONEXAO.codigo) {
  let r;
  try {
    r = await fetch(caminho, {
      method: metodo,
      headers: { 'Content-Type': 'application/json', 'x-codigo-piloto': codigo || '' },
      body: corpo === undefined ? undefined : JSON.stringify(corpo),
      signal: AbortSignal.timeout(20000),
    });
  } catch {
    throw new Error('Sem conexão com o servidor do CondoFácil. Confira a internet e tente de novo');
  }
  const dados = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(dados.erro || `O servidor respondeu ${r.status}`);
  return dados;
}

function usaAsaasReal(estado) {
  return CONEXAO.ativa && !!CONEXAO.codigo && estado.origem === 'novo' && !!(estado.condominio.asaas && estado.condominio.asaas.real);
}

// Rotas no formato #perfil.tela.id: o link compartilhado de um Artifact só repassa âncoras com letras, dígitos, ".", "_", "~" e "-".
function lerRota() {
  const [perfil, tela, id] = location.hash.replace(/^#/, '').split('.');
  if (perfil === 'implantacao') return { perfil, tela: tela || 'condominio', id: id || null };
  const p = PERFIS.find((x) => x.id === perfil);
  if (!p) return { perfil: PERFIS[0].id, tela: PERFIS[0].inicial, id: null };
  return { perfil: p.id, tela: tela || p.inicial, id: id ? decodeURIComponent(id) : null };
}

function QrFalso({ texto, tamanho = 132 }) {
  // Desenho determinístico com cara de QR Code; não é um QR legível.
  let semente = [...texto].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);
  const sortear = () => {
    semente = (semente * 1103515245 + 12345) >>> 0;
    return semente / 4294967296;
  };
  const quadrados = [];
  for (let y = 0; y < 21; y++) {
    for (let x = 0; x < 21; x++) {
      const zona = (x < 8 || x > 12) && (y < 8 || y > 12) && !(x > 12 && y > 12);
      let escuro;
      if (zona) {
        const lx = x < 8 ? x : 20 - x;
        const ly = y < 8 ? y : 20 - y;
        escuro = lx !== 7 && ly !== 7 && (lx === 0 || lx === 6 || ly === 0 || ly === 6 || (lx >= 2 && lx <= 4 && ly >= 2 && ly <= 4));
      } else {
        escuro = sortear() < 0.5;
      }
      if (escuro) quadrados.push(html`<rect key=${`${x}-${y}`} x=${x} y=${y} width="1" height="1" />`);
    }
  }
  return html`<svg class="qr" viewBox="-2 -2 25 25" width=${tamanho} height=${tamanho} role="img" aria-label=${`QR Code de retirada ${texto}`}>
    <rect x="-2" y="-2" width="25" height="25" fill="#fff" />
    <g fill="#111">${quadrados}</g>
  </svg>`;
}

function SemanaEscala({ estado, agora, executar, editavel = false }) {
  const hoje = isoDia(agora);
  const semanas = semanasComEscala(estado);
  const [segunda, setSegunda] = useState(inicioDaSemana(hoje));
  const [editando, setEditando] = useState(null);
  const [erro, setErro] = useState(null);
  const [mensagem, setMensagem] = useState(null);
  const s = semanaDaEscala(estado, segunda);
  const pos = semanas.indexOf(segunda);
  const feriados = Object.fromEntries([...new Set(s.dias.map((d) => d.slice(0, 7)))].flatMap((m) => feriadosDoMes(m)).map((f) => [f.dia, f.nome]));
  const turnoEditado = editando && acharTurno(estado, editando);

  function irSemana(passo) {
    const alvo = semanas[pos + passo];
    if (alvo) { setSegunda(alvo); setEditando(null); }
  }

  function trocar(porteiro) {
    const r = executar((e) => ajustarTurno(e, editando, porteiro || null, 'sindico'));
    setErro(r.erro || r.alerta || null);
    setMensagem(r.erro ? null : 'Turno ajustado.');
    setEditando(null);
  }

  return html`<div class="pilha">
    <div class="linha-entre">
      <strong>Semana de ${fmtDataCurta(s.dias[0])} a ${fmtDataCurta(s.dias[6])}</strong>
      <span class="acoes">
        <button type="button" class="btn secundario" aria-label="Semana anterior" data-acao="semana-anterior" disabled=${pos <= 0} onClick=${() => irSemana(-1)}>‹</button>
        <button type="button" class="btn secundario" data-acao="semana-hoje" onClick=${() => { setSegunda(inicioDaSemana(hoje)); setEditando(null); }}>Hoje</button>
        <button type="button" class="btn secundario" aria-label="Próxima semana" data-acao="semana-proxima" disabled=${pos < 0 || pos >= semanas.length - 1} onClick=${() => irSemana(1)}>›</button>
      </span>
    </div>
    <ul class="legenda-turnos" aria-label="Legenda">${LEGENDA_TURNOS.map(([tipo, horas]) => html`<li key=${tipo}><span class=${`etq-turno t-${tipo}`}>${NOMES_CELULA[tipo]}</span>${horas && html`<small>${horas}</small>`}</li>`)}</ul>
    <${Erro} texto=${erro} />
    <${Sucesso} texto=${mensagem} />
    ${turnoEditado && html`<div class="cartao pilha">
      <strong>${POSTOS[turnoEditado.posto].nome} · ${fmtDataCurta(turnoEditado.inicio.slice(0, 10))} · ${horaDoLocal(turnoEditado.inicio)}–${horaDoLocal(turnoEditado.fim)}</strong>
      <label class="campo"><span>Porteiro do turno</span><select id="semana-porteiro" value=${turnoEditado.porteiro || ''} onChange=${(ev) => trocar(ev.target.value)}>
        <option value="">Ninguém (descoberto)</option>
        ${PORTEIROS.filter((p) => p.postos.includes(turnoEditado.posto)).map((p) => html`<option key=${p.id} value=${p.id}>${p.nome}</option>`)}
      </select></label>
      <div class="acoes"><button type="button" class="btn secundario" onClick=${() => setEditando(null)}>Fechar</button></div>
    </div>`}
    <div class="semana-rolagem"><table class="semana-escala">
      <thead><tr><th scope="col">Porteiro</th>${s.dias.map((d, i) => html`<th key=${d} scope="col" class=${d === hoje ? 'hoje' : ''}>${DIAS_SEMANA_CURTOS[i]}<small>${d.slice(8, 10)}/${d.slice(5, 7)}${feriados[d] ? ' · feriado' : ''}</small></th>`)}</tr></thead>
      <tbody>
        ${s.linhas.map((l) => {
          const p = porteiroPorId(l.porteiro);
          return html`<tr key=${l.porteiro}>
            <th scope="row">${p.nome}</th>
            ${l.celulas.map((c, i) => html`<td key=${s.dias[i]} class=${s.dias[i] === hoje ? 'hoje' : ''}>${c.map((item, n) => html`<${EtqTurno} key=${n} item=${item} mostrarPosto=${p.postos.length > 1} editavel=${editavel} aoClicar=${() => { setEditando(item.turno); setErro(null); setMensagem(null); }} />`)}</td>`)}
          </tr>`;
        })}
        <tr class="linha-descoberta">
          <th scope="row">Sem ninguém</th>
          ${s.descobertos.map((lista, i) => html`<td key=${s.dias[i]} class=${s.dias[i] === hoje ? 'hoje' : ''}>${lista.map((b) => html`<span key=${b.posto + b.inicio} class="etq-turno t-buraco">${NOMES_POSTO_CURTO[b.posto]} ${horaDoLocal(b.inicio)}–${horaDoLocal(b.fim)}</span>`)}</td>`)}

}

        <span>${porteiroPorId(x.de).nome} pede que você assuma ${fmtTurno(acharTurno(estado, x.turno))}</span>
        <span class="acoes">
          <button type="button" class="btn primario" onClick=${() => rodar((e) => aceitarTroca(e, x.id, porteiro), 'Troca aceita. Falta a aprovação do síndico.')}>Aceitar</button>
          <button type="button" class="btn secundario" onClick=${() => rodar((e) => recusarTroca(e, x.id, porteiro, 'portaria'), 'Troca recusada.')}>Recusar</button>
        </span>
      </div>`)}
    </div>`}
    ${meus.length
      ? html`<ul class="m-lista">${meus.map((t) => {
          const dia = t.inicio.slice(0, 10);
          const colegas = PORTEIROS.filter((p) => p.id !== porteiro && p.postos.includes(t.posto));
          return html`<li key=${t.id} class="cartao">
            <div class="linha-entre"><strong>${fmtTurno(t)}</strong><span>${POSTOS[t.posto].nome}${feriados[dia] ? html` <${Etiqueta} tipo="info">${feriados[dia]}<//>` : ''}${t.trocado ? html` <${Etiqueta}>troca<//>` : ''}</span></div>
            <div class="acoes">
              <button type="button" class="btn secundario" onClick=${() => { abrir(`troca-${t.id}`); setColega(colegas[0] ? colegas[0].id : ''); }}>Propor troca</button>
              <button type="button" class="btn secundario" onClick=${() => abrir(`falta-${t.id}`)}>Registrar falta</button>
            </div>
            ${abrindo === `troca-${t.id}` && html`<div class="pilha">
              <${Campo} rotulo="Colega"><select id="troca-colega" value=${colega} onChange=${(ev) => setColega(ev.target.value)}>${colegas.map((p) => html`<option key=${p.id} value=${p.id}>${p.nome}</option>`)}</select><//>
              <button type="button" class="btn primario" onClick=${() => rodar((e) => proporTroca(e, { turnoId: t.id, de: porteiro, para: colega }, 'portaria', new Date()), 'Proposta enviada ao colega.')}>Enviar proposta de troca</button>
            </div>`}
            ${abrindo === `falta-${t.id}` && html`<div class="pilha">
              <${Campo} rotulo="Motivo"><select id="falta-motivo" value=${motivo} onChange=${(ev) => setMotivo(ev.target.value)}><option value="falta">Falta</option><option value="atestado">Atestado</option></select><//>
              <button type="button" class="btn secundario" onClick=${() => setAnexo(`atestado-${porteiro}.pdf`)}>${anexo ? `Anexado: ${anexo}` : 'Anexar atestado'}</button>
              <button type="button" class="btn primario" onClick=${() => rodar((e) => registrarFalta(e, t.id, { quem: porteiro, motivo, anexo }, 'portaria'), 'Falta registrada. O síndico vai cobrir o turno.')}>Registrar</button>
            </div>`}
          </li>`;
        })}</ul>`
      : html`<${Vazio} texto="Nenhum plantão nos meses publicados." />`}
  </section>`;
}

// ---- src/ui/portaria.js ----

const ABAS_PORTARIA = [['registrar', 'Registrar', 'pacote'], ['entregar', 'Entregar', 'entrega'], ['hoje', 'Reservas de hoje', 'calendario'], ['escala', 'Escala', 'pessoa']];

function TelaPortaria(props) {
  const tela = ABAS_PORTARIA.some(([id]) => id === props.rota.tela) ? props.rota.tela : 'registrar';
  const Conteudo = { registrar: PRegistrar, entregar: PEntregar, hoje: PReservasHoje, escala: PEscala }[tela];
  return html`<div class="tablet">
    <header class="tab-topo">
      <strong>Portaria</strong>
      <nav class="tab-abas" aria-label="Portaria">
        ${ABAS_PORTARIA.map(([id, nome, icone]) => html`<a key=${id} href=${`#portaria.${id}`} class=${id === tela ? 'ativa' : ''} aria-current=${id === tela ? 'page' : undefined}><${Icone} nome=${icone} />${nome}</a>`)}
      </nav>
      <span class="tab-turno">${PORTEIRO_DIA} · turno do dia</span>
    </header>
    <div class="tab-conteudo">
      ${urgentesAbertas(props.estado).map((o) => html`<p class="faixa-urgente" key=${o.id}>Notificação urgente: ${o.id} · ${CATEGORIAS[o.categoria].nome} · ${o.local}</p>`)}
      <${Conteudo} ...${props} />
    </div>
  </div>`;
}

function PRegistrar({ estado, executar }) {
  const [unidade, setUnidade] = useState('');
  const [transportadora, setTransportadora] = useState('');
  const [foto, setFoto] = useState(false);
  const [lida, setLida] = useState(null);
  const [erro, setErro] = useState(null);
  const [registrada, setRegistrada] = useState(null);
  const numero = unidade.trim();
  const moradores = moradoresDaUnidade(estado, numero);

  function lerEtiqueta() {
    setUnidade('302');
    setTransportadora('Mercado Livre');
    setFoto(true);
    setErro(null);
    setLida('Etiqueta lida: ANA SOUZA · APTO 302 · MERCADO LIVRE');
  }

  function registrar() {
    const r = executar((e) => registrarEncomenda(e, { unidade: numero, transportadora, foto, porteiro: PORTEIRO_DIA }, new Date()));
    if (r.erro) {
      setErro(r.erro);
      return;
    }
    setRegistrada(r.estado.encomendas.find((x) => x.id === r.id));
    setUnidade('');
    setTransportadora('');
    setFoto(false);
    setLida(null);
    setErro(null);
  }

  return html`<section class="p-grade">
    <div class="p-coluna">
      <button type="button" class="btn grande destaque" onClick=${lerEtiqueta}><${Icone} nome="leitor" tamanho=${26} />Ler etiqueta</button>
      ${lida && html`<p class="dica-ocr">${lida}</p>`}
      <${Campo} rotulo="Unidade"><input id="portaria-unidade" class="entrada-grande" inputmode="numeric" maxlength="3" value=${unidade} onInput=${(ev) => setUnidade(ev.target.value)} placeholder="Ex.: 302" /><//>
      ${numero.length === 3 && html`<p class="dica-unidade">${moradores.length ? moradores.map((m) => m.nome).join(', ') : 'Unidade sem morador cadastrado'}</p>`}
      <p class="rotulo">Transportadora</p>
      <div class="opcoes-grandes" role="group" aria-label="Transportadora">
        ${TRANSPORTADORAS.map((t) => html`<button type="button" key=${t} class=${`btn grande opcao${t === transportadora ? ' sel' : ''}`} aria-pressed=${t === transportadora} onClick=${() => setTransportadora(t)}>${t}</button>`)}
      </div>
    </div>
    <div class="p-coluna">
      ${foto ? html`<${FotoFalsa} rotulo="Foto do volume e da etiqueta" />` : html`<button type="button" class="btn grande secundario" onClick=${() => setFoto(true)}>Fotografar volume</button>`}
      <${Erro} texto=${erro} />
      <button type="button" class="btn grande primario" disabled=${!numero || !transportadora} onClick=${registrar}>Registrar encomenda</button>
      ${registrada && html`<div class="cartao confirmacao" role="status" data-codigo=${registrada.codigo}>
        <strong>Encomenda registrada para o apto ${registrada.unidade}</strong>
        <span>Código de retirada: <b>${registrada.codigo}</b></span>
        <span>Morador avisado por WhatsApp com a foto.</span>
      </div>`}
    </div>
  </section>`;
}

function PEntregar({ estado, executar, agora }) {
  const [busca, setBusca] = useState('');
  const [selecionada, setSelecionada] = useState(null);
  const [codigo, setCodigo] = useState('');
  const [nome, setNome] = useState('');
  const [erro, setErro] = useState(null);
  const [entregue, setEntregue] = useState(null);
  const [lido, setLido] = useState(null);
  const termo = busca.trim();
  const lista = estado.encomendas
    .filter((e) => e.status === 'aguardando' && (!termo || e.unidade.includes(termo) || e.codigo === termo))
    .sort((a, b) => a.chegadaEm.localeCompare(b.chegadaEm));
  const encomenda = selecionada && estado.encomendas.find((e) => e.id === selecionada && e.status === 'aguardando');

  function escolher(id) {
    setSelecionada(id);
    setCodigo('');
    setNome('');
    setErro(null);
    setEntregue(null);
    setLido(null);
    // No celular o painel de entrega fica abaixo da lista: leva o porteiro até ele.
    setTimeout(() => {
      const painel = document.getElementById('painel-entrega');
      const reduzir = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (painel) painel.scrollIntoView({ behavior: reduzir ? 'auto' : 'smooth', block: 'start' });
    }, 0);
  }

  function escanear() {
    setCodigo(encomenda.codigo);
    setLido(`QR lido: código ${encomenda.codigo} (leitura simulada no protótipo)`);
  }

  function confirmar() {
    const r = executar((e) => entregarEncomenda(e, { id: encomenda.id, codigo, nome }, new Date()));
    if (r.erro) {
      setErro(r.erro);
      return;
    }
    setEntregue(`Entrega registrada: apto ${encomenda.unidade}, retirada por ${nome.trim()}.`);
    setSelecionada(null);
    setBusca('');
  }

  return html`<section class="p-grade">
    <div class="p-coluna">
      <${Campo} rotulo="Buscar por código ou unidade"><input id="portaria-busca" class="entrada-grande" inputmode="numeric" value=${busca} onInput=${(ev) => setBusca(ev.target.value)} placeholder="Ex.: 302 ou 481203" /><//>
      ${entregue && html`<p class="sucesso" role="status">${entregue}</p>`}
      <ul class="lista-encomendas">
        ${lista.length
          ? lista.map((e) => html`<li key=${e.id}><button type="button" class=${`item-encomenda${e.id === selecionada ? ' sel' : ''}`} onClick=${() => escolher(e.id)}>
              <strong>Apto ${e.unidade}</strong>
              <span>${e.transportadora} · chegou ${haQuanto(e.chegadaEm, agora)}</span>
              ${encomendaParada(e, agora) && html`<${Etiqueta} tipo="perigo">Parada<//>`}
            </button></li>`)
          : html`<li><${Vazio} texto="Nenhuma encomenda aguardando." /></li>`}
      </ul>
    </div>
    <div class="p-coluna">
      ${encomenda
        ? html`<div class="cartao" id="painel-entrega">
            <h2>Entregar: apto ${encomenda.unidade} · ${encomenda.transportadora}</h2>
            <${Campo} rotulo="Código de retirada"><input id="portaria-codigo" class="entrada-grande" inputmode="numeric" maxlength="6" value=${codigo} onInput=${(ev) => setCodigo(ev.target.value)} /><//>
            <button type="button" class="btn secundario" onClick=${escanear}>Escanear QR do morador</button>
            ${lido && html`<p class="dica-ocr" role="status">${lido}</p>`}
            <${Campo} rotulo="Quem retirou"><input id="portaria-quem" class="entrada-grande" value=${nome} onInput=${(ev) => setNome(ev.target.value)} /><//>
            <div class="sugestoes">${moradoresDaUnidade(estado, encomenda.unidade).map((m) => html`<button type="button" key=${m.id} class="btn secundario" onClick=${() => setNome(m.nome)}>${m.nome}</button>`)}</div>
            <${Erro} texto=${erro} />
            <button type="button" class="btn grande primario" onClick=${confirmar}>Confirmar entrega</button>
          </div>`
        : html`<${Vazio} texto="Escolha uma encomenda na lista." />`}
    </div>
  </section>`;
}

function PReservasHoje({ estado, agora }) {
  const hoje = isoDia(agora);
  const lista = estado.reservas.filter((r) => r.data === hoje && r.status === 'confirmada').sort((a, b) => a.inicio - b.inicio);
  return html`<section>
    <h1>Reservas de hoje</h1>
    ${lista.length
      ? html`<div class="grade-cartoes">${lista.map((r) => html`<article key=${r.id} class="cartao">
          <h3>${areaPorId(estado, r.areaId).nome}</h3>
          <p class="sub">${fmtHora(r.inicio)}–${fmtHora(r.fim)} · Apto ${r.unidade}</p>
          <p class="rotulo">Convidados (${r.convidados.length})</p>
          ${r.convidados.length
            ? html`<ul class="convidados">${r.convidados.map((c, i) => html`<li key=${i}>${c.nome} <small>${c.documento}</small></li>`)}</ul>`
            : html`<${Vazio} texto="Sem lista de convidados." />`}
        </article>`)}</div>`
      : html`<${Vazio} texto="Nenhuma reserva confirmada para hoje." />`}
  </section>`;
}

// ---- src/ui/financeiro-sindico.js ----

const ETQ_COBRANCA = { aberta: 'info', vencida: 'perigo', paga: 'ok', cancelada: 'neutro' };
const NOMES_SITUACAO_COBRANCA = { aberta: 'Em aberto', vencida: 'Vencida', paga: 'Paga', cancelada: 'Cancelada' };

function decimal(n) {
  return String(n).replace('.', ',');
}

function EtqCobranca({ situacao }) {
  return html`<${Etiqueta} tipo=${ETQ_COBRANCA[situacao]}>${NOMES_SITUACAO_COBRANCA[situacao]}<//>`;
}

function Bloqueado({ estado, recurso, titulo }) {
  const minimo = planoMinimo(recurso);
  const unidades = estado.condominio.unidades.length;
  const diferenca = mensalidade(minimo.id, unidades) - mensalidade(estado.plano, unidades);
  return html`<div class="bloqueado"><strong>${titulo}</strong><span>Disponível no plano ${minimo.nome} (+${fmtReais(diferenca)}/mês)</span></div>`;
}

function pendenciasCobranca(estado, hoje) {
  const fin = estado.financeiro;
  const proxima = proximaCompetencia(fin);
  const itens = [];
  if (!fin.emitidas.includes(proxima)) itens.push({ chave: 'emitir', texto: `Emitir cobranças de ${mesExtenso(proxima)} (fechamento dia ${fin.parametros.diaFechamento})`, href: '#sindico.cobranca.previa' });
  for (const d of devedores(estado, hoje).filter((x) => x.dias >= 60)) itens.push({ chave: `juridico-${d.unidade}`, texto: `${d.unidade}: débito há mais de 60 dias, avaliar cobrança jurídica`, href: '#sindico.cobranca.emitidas' });
  itens.push(...alertasAcordos(estado, hoje), ...alertasComposicao(estado));
  return itens;
}

// Duas séries (receitas e despesas): legenda sempre presente, rótulo direto só no mês em destaque, tabela para leitores de tela.
function GraficoReceitas({ estado, hoje }) {
  const serie = serieReceitasDespesas(estado, hoje);
  const maximo = Math.max(...serie.flatMap((m) => [m.receitas, m.despesas]));
  const altura = (valor) => `${Math.round((valor / maximo) * 140)}px`;
  return html`<section class="cartao">
    <p class="titulo-grafico">${tituloSerie(serie)}</p>
    <div class="legenda-serie" aria-hidden="true"><span class="leg-receita">Receitas</span><span class="leg-despesa">Despesas</span></div>
    <div class="barras-duplas" aria-hidden="true">
      ${serie.map((m) => {
        const destaque = m.despesas > m.receitas;
        return html`<div key=${m.mes} class=${`mes${destaque ? ' destaque' : ''}`} title=${`${mesExtenso(m.mes)}: receitas ${fmtReaisCurto(m.receitas)}, despesas ${fmtReaisCurto(m.despesas)}`}>
          <span class="valor-destaque">${destaque ? fmtReaisCurto(m.despesas) : ''}</span>
          <div class="par"><span class="b-receita" style=${`height:${altura(m.receitas)}`}></span><span class="b-despesa" style=${`height:${altura(m.despesas)}`}></span></div>
          <span class="rotulo-x">${mesCurto(m.mes)}</span>
        </div>`;
      })}
    </div>
    <table class="so-leitor">
      <caption>Receitas e despesas dos últimos 12 meses</caption>
      <thead><tr><th>Mês</th><th>Receitas</th><th>Despesas</th></tr></thead>
      <tbody>${serie.map((m) => html`<tr key=${m.mes}><td>${nomeMes(m.mes)}</td><td>${fmtReais(m.receitas)}</td><td>${fmtReais(m.despesas)}</td></tr>`)}</tbody>
    </table>
  </section>`;
}

function Categorias({ estado }) {
  const fin = estado.financeiro;
  const linhas = Object.entries(CATEGORIAS_DESPESA).map(([id, nome]) => [nome, fin.despesasMes[id]]).sort((a, b) => b[1] - a[1]);
  const maximo = linhas[0][1];
  return html`<section class="cartao">
    <p class="titulo-grafico">Para onde foi o dinheiro em ${mesExtenso(fin.vigente)}</p>
    <ul class="barras-h">${linhas.map(([nome, valor]) => html`<li key=${nome}><span>${nome}</span><span class="trilho"><span class="b-despesa" style=${`width:${maximo ? Math.round((valor / maximo) * 100) : 0}%`}></span></span><strong>${fmtReaisCurto(valor)}</strong></li>`)}</ul>
  </section>`;
}

function ListaDevedores({ estado, hoje }) {
  const lista = devedores(estado, hoje);
  return html`<section class="pilha">
    <h2>Devedores</h2>
    ${lista.length
      ? html`<div class="tabela-rolagem"><table class="tabela">
          <thead><tr><th>Unidade</th><th>Responsável</th><th>Cobranças</th><th>Valor atualizado</th><th>Atraso</th><th>Etapa da régua</th><th>Acordo</th></tr></thead>
          <tbody>${lista.map((d) => html`<tr key=${d.unidade}><td>${d.unidade}</td><td>${d.responsavel ? d.responsavel.nome : '—'}</td><td>${d.cobrancas}</td><td>${fmtReais(d.valor)}</td><td>${d.dias} dias</td><td>${d.etapa ? d.etapa.nome : '—'}</td><td>${d.acordo ? html`<${Etiqueta} tipo=${d.acordo === 'ativo' ? 'info' : 'alerta'}>${d.acordo === 'ativo' ? 'acordo ativo' : 'proposta enviada'}<//>` : liberado(estado.plano, 'acordos') ? html`<a class="btn-link" data-propor=${d.unidade} href=${`#sindico.cobranca.novoacordo-${d.unidade}`}>Propor acordo</a>` : '—'}</td></tr>`)}</tbody>
        </table></div>`
      : html`<${Vazio} texto="Nenhuma unidade em atraso." />`}
    <small class="sub">Lista visível só para quem tem acesso financeiro. Nunca aparece para os moradores.</small>
  </section>`;
}

function OrcadoRealizado({ estado }) {
  const fin = estado.financeiro;
  return html`<section class="pilha">
    <h2>Orçado × realizado em ${mesExtenso(fin.vigente)}</h2>
    <div class="tabela-rolagem"><table class="tabela">
      <thead><tr><th>Categoria</th><th>Orçado</th><th>Realizado</th><th>Desvio</th><th>%</th></tr></thead>
      <tbody>${Object.entries(CATEGORIAS_DESPESA).map(([id, nome]) => {
        const orcado = fin.orcamento[id];
        const realizado = fin.despesasMes[id];
        const desvio = realizado - orcado;
        const pct = Math.round((desvio / orcado) * 1000) / 10;
        const sinal = desvio > 0 ? '+' : '';
        return html`<tr key=${id}><td>${nome}</td><td>${fmtReais(orcado)}</td><td>${fmtReais(realizado)}</td><td class=${desvio > 0 ? 'desvio-ruim' : ''}>${sinal}${fmtReais(desvio)}</td><td>${sinal}${decimal(pct)}%</td></tr>`;
      })}</tbody>
    </table></div>
  </section>`;
}

function PainelFinanceiro({ estado, agora }) {
  const hoje = isoDia(agora);
  const ind = indicadoresFinanceiros(estado, hoje);
  const completo = liberado(estado.plano, 'dashboardCompleto');
  const a = ind.arrecadado;
  const numeros = [
    ['Saldo em caixa', fmtReaisCurto(ind.saldo.valor), 'Conta Asaas + banco', ind.saldo.alerta, 'cifrao'],
    [`Arrecadado em ${mesExtenso(a.competencia)}`, `${a.pct}%`, `${fmtReaisCurto(a.recebido)} de ${fmtReaisCurto(a.previsto)}${a.proxima ? ` · ${mesExtenso(a.proxima.competencia)}: ${a.proxima.pagas} de ${a.proxima.total} pagas` : ''}`, a.alerta, 'grafico'],
    ['Inadimplência', `${ind.inadimplencia.unidades} de ${ind.inadimplencia.total}`, `${decimal(ind.inadimplencia.pct)}% das unidades · ${fmtReaisCurto(ind.inadimplencia.valor)}`, ind.inadimplencia.alerta, 'pessoa'],
  ];
  if (completo) numeros.push(['Despesas do mês', fmtReaisCurto(ind.despesas.valor), `${ind.despesas.desvio > 0 ? '+' : ''}${decimal(ind.despesas.desvio)}% em relação ao orçado`, ind.despesas.alerta, 'documento']);
  return html`<div class="pilha">
    <div class="indicadores">
      ${numeros.map(([rotulo, valor, detalhe, alerta, icone]) => html`<div key=${rotulo} class=${`indicador fin ${alerta ? 'ind-perigo' : 'ind-ok'}`}><${QuadroIcone} nome=${icone} cheio=${alerta} /><span class="ind-rotulo">${rotulo}</span><strong>${valor}</strong><small>${detalhe}</small></div>`)}
    </div>
    ${completo
      ? html`<div class="graficos-fin"><${GraficoReceitas} estado=${estado} hoje=${hoje} /><${Categorias} estado=${estado} /></div><${ListaDevedores} estado=${estado} hoje=${hoje} />`
      : html`<${Bloqueado} estado=${estado} recurso="dashboardCompleto" titulo="Despesas do mês, receitas × despesas em 12 meses, para onde foi o dinheiro e lista de devedores" />`}
    ${liberado(estado.plano, 'orcadoRealizado')
      ? html`<${OrcadoRealizado} estado=${estado} />`
      : completo && html`<${Bloqueado} estado=${estado} recurso="orcadoRealizado" titulo="Orçado × realizado por categoria" />`}
  </div>`;
}

const ABAS_COBRANCA = [['previa', 'Prévia e emissão'], ['emitidas', 'Cobranças emitidas'], ['acordos', 'Acordos'], ['regua', 'Régua'], ['taxas', 'Taxa e reajustes'], ['orcamento', 'Orçamento'], ['parametros', 'Parâmetros']];
const FILTROS_COBRANCA = [['todas', 'Todas'], ['aberta', 'Em aberto'], ['vencida', 'Vencidas'], ['paga', 'Pagas'], ['cancelada', 'Canceladas']];

function SCobranca(props) {
  const idRota = props.rota.id || '';
  const deAcordo = idRota.startsWith('novoacordo') || idRota.startsWith('AC-');
  const aba = deAcordo ? 'acordos' : ABAS_COBRANCA.some(([id]) => id === idRota) ? idRota : 'previa';
  const Conteudo = { previa: CPrevia, emitidas: CEmitidas, acordos: CAcordos, regua: CRegua, taxas: CTaxas, orcamento: COrcamento, parametros: CParametros }[aba];
  return html`<section>
    <h1>Cobrança</h1>
    <p class="faixa-asaas">Conta Asaas ativa · subconta do condomínio. O dinheiro cai direto na conta do condomínio; o CondoFácil só organiza emissão, baixa e relatórios.</p>
    <nav class="chips" aria-label="Cobrança">${ABAS_COBRANCA.map(([id, nome]) => html`<a key=${id} class="chip" href=${`#sindico.cobranca.${id}`} aria-current=${aba === id ? 'page' : undefined}>${nome}</a>`)}</nav>
    <${Conteudo} ...${props} />
  </section>`;
}

function EditorComposicao({ linha, competencia, executar }) {
  const [itens, setItens] = useState(linha.itens.map((i) => ({ ...i, texto: (i.valor / 100).toFixed(2).replace('.', ',') })));
  const [descricao, setDescricao] = useState('');
  const [valor, setValor] = useState('');
  const [mensagem, setMensagem] = useState(null);
  const [erro, setErro] = useState(null);

  function salvar(lista) {
    const r = executar((e) => editarItemPrevia(e, competencia, linha.unidade, lista.map((i) => ({ tipo: i.tipo, descricao: i.descricao, valor: lerPreco(i.texto) }))));
    setErro(r.erro || null);
    setMensagem(r.erro ? null : 'Composição atualizada.');
    if (!r.erro) setItens(lista);
  }

  function incluir() {
    salvar([...itens, { tipo: 'avulso', descricao, texto: valor }]);
    setDescricao('');
    setValor('');
  }

  return html`<div class="pilha">
    <ul class="itens-sacola">${itens.map((i, n) => html`<li key=${`${n}-${i.descricao}`}>
      <span>${i.descricao}</span>
      <input id=${`valor-${linha.unidade}-${n}`} class="valor-item" aria-label=${`Valor de ${i.descricao}`} inputmode="decimal" value=${i.texto} onInput=${(ev) => setItens(itens.map((x, k) => (k === n ? { ...x, texto: ev.target.value } : x)))} />
      ${i.tipo !== 'ordinaria' && html`<button type="button" class="btn-link" onClick=${() => salvar(itens.filter((_, k) => k !== n))}>Remover</button>`}
    </li>`)}</ul>
    <div class="edicao-anuncio">
      <${Campo} rotulo="Novo item"><input id=${`novo-item-${linha.unidade}`} value=${descricao} onInput=${(ev) => setDescricao(ev.target.value)} placeholder="Ex.: Multa por infração" /><//>
      <${Campo} rotulo="Valor (R$)"><input id=${`novo-valor-${linha.unidade}`} inputmode="decimal" value=${valor} onInput=${(ev) => setValor(ev.target.value)} placeholder="Ex.: 120,00" /><//>
    </div>
    <div class="acoes">
      <button type="button" class="btn secundario" onClick=${incluir}>Incluir item</button>
      <button type="button" class="btn primario" onClick=${() => salvar(itens)}>Salvar composição</button>
    </div>
    <${Erro} texto=${erro} />
    <${Sucesso} texto=${mensagem} />
  </div>`;
}

function CPrevia({ estado, executar }) {
  const fin = estado.financeiro;
  const competencia = proximaCompetencia(fin);
  const real = usaAsaasReal(estado);
  const previa = real ? previaConectada(estado, competencia) : previaCompetencia(estado, competencia);
  const emitida = fin.emitidas.includes(competencia);
  const falhas = real ? (fin.falhasAsaas || {})[competencia] || [] : [];
  const [aberta, setAberta] = useState(null);
  const [erro, setErro] = useState(null);
  const [enviando, setEnviando] = useState(false);
  const [mensagem, setMensagem] = useState(null);
  const emitiveis = previa.linhas.filter((l) => !l.bloqueada);
  const total = emitiveis.reduce((soma, l) => soma + l.total, 0);

  // Modo conectado: o servidor cria as cobranças no Asaas sandbox e o app guarda só as que deram certo.
  async function emitirNoAsaas(apenas) {
    setEnviando(true);
    setErro(null);
    try {
      const resp = await chamarApi('POST', '/api/emissoes', { condominio: estado.condominio.id, competencia, linhas: linhasParaAsaas(estado, competencia, apenas) });
      const r = executar((e) => aplicarEmissao(e, competencia, resp.resultados, 'sindico', new Date()));
      setErro(r.erro || null);
      const certas = resp.resultados.filter((x) => x.ok).length;
      if (!r.erro) setMensagem(`${certas} ${certas === 1 ? 'cobrança emitida' : 'cobranças emitidas'} no Asaas sandbox${r.falhas.length ? ` · ${r.falhas.length} com falha` : ''}.`);
    } catch (e) {
      setErro(e.message);
    }
    setEnviando(false);
  }

  function emitir() {
    if (real) { emitirNoAsaas(null); return; }
    const r = executar((e) => emitirCompetencia(e, competencia, 'sindico', new Date()));
    setErro(r.erro || null);
  }

  return html`<div class="pilha">
    <h2>Competência de ${mesExtenso(competencia)} · vencimento ${fmtDataCurta(previa.vencimento)}</h2>
    ${emitida
      ? html`<p class="sucesso">Cobranças de ${mesExtenso(competencia)} emitidas. Acompanhe em Cobranças emitidas.</p>`
      : html`<p class="sub">Revise a composição antes de emitir. Cobrança emitida não é editada: alterações viram cancelamento e reemissão.</p>`}
    <div class="tabela-rolagem"><table class="tabela">
      <thead><tr><th>Unidade</th><th>Responsável financeiro</th><th>Total</th><th>Composição</th></tr></thead>
      <tbody>${previa.linhas.map((l) => [
        html`<tr key=${l.unidade} class=${l.bloqueada ? 'linha-bloqueada' : ''}>
          <td>${l.unidade}</td>
          <td>${l.bloqueada ? html`<strong class="texto-perigo">${l.motivo === 'Sem responsável financeiro' ? 'Sem responsável financeiro: não será emitida' : l.motivo}</strong>` : `${l.responsavel.nome} (${NOMES_RELACAO[l.responsavel.relacao]})`}</td>
          <td>${fmtReais(l.total)}</td>
          <td><button type="button" class="btn-link" onClick=${() => setAberta(aberta === l.unidade ? null : l.unidade)}>${aberta === l.unidade ? 'Fechar' : 'Ver composição'}</button></td>
        </tr>`,
        aberta === l.unidade && html`<tr key=${`${l.unidade}-composicao`}><td colspan="4">${emitida
          ? html`<ul class="itens-sacola">${l.itens.map((i, n) => html`<li key=${n}><span>${i.descricao}</span><span>${fmtReais(i.valor)}</span></li>`)}</ul>`
          : html`<${EditorComposicao} key=${l.unidade} linha=${l} competencia=${competencia} executar=${executar} />`}</td></tr>`,
      ])}</tbody>
    </table></div>
    <div class="linha-entre total"><span>${emitiveis.length} cobranças · ${previa.linhas.length - emitiveis.length} não emitida(s)</span><strong>${fmtReais(total)}</strong></div>
    <${Sucesso} texto=${mensagem} />
    ${falhas.length > 0 && html`<div class="cartao pilha">
      <strong>Não emitidas no Asaas</strong>
      <ul class="itens-sacola">${falhas.map((x) => html`<li key=${x.unidade}><span>Apto ${x.unidade}</span><span>${x.erro}</span></li>`)}</ul>
      <button type="button" class="btn secundario" data-acao="reenviar-falhas" disabled=${enviando} onClick=${() => emitirNoAsaas(falhas.map((x) => x.unidade))}>Reenviar as que falharam</button>
    </div>`}
    <${Erro} texto=${erro} />
    ${!emitida && html`<button type="button" class="btn primario" data-acao="emitir" disabled=${enviando} onClick=${emitir}>${enviando ? 'Emitindo no Asaas…' : `Emitir ${emitiveis.length} cobranças`}</button>`}
  </div>`;
}

function DetalheCobranca({ estado, cobranca, executar, hoje, aoFechar }) {
  const fin = estado.financeiro;
  const [comprovante, setComprovante] = useState('');
  const [data, setData] = useState(hoje);
  const [baixando, setBaixando] = useState(false);
  const [erro, setErro] = useState(null);
  const [mensagem, setMensagem] = useState(null);
  const situacao = situacaoCobranca(cobranca, hoje);
  const v = valorAtualizado(cobranca, fin.parametros, hoje);
  const responsavel = fin.unidades[cobranca.unidade].responsavel;

  function rodar(acao, sucesso) {
    const r = executar(acao);
    setErro(r.erro || null);
    if (!r.erro) {
      setMensagem(sucesso);
      setBaixando(false);
    }
  }

  return html`<article class="cartao">
    <div class="linha-entre"><strong>Apto ${cobranca.unidade} · ${rotuloCobranca(cobranca)}</strong><${EtqCobranca} situacao=${situacao} /></div>
    <small class="sub">${responsavel ? `${responsavel.nome} · ${responsavel.documento}` : 'Sem responsável'} · vencimento ${fmtDataCurta(cobranca.vencimento)}${cobranca.substituiu ? ` · substitui ${cobranca.substituiu}` : ''}</small>
    <ul class="itens-sacola">
      ${cobranca.itens.map((i, n) => html`<li key=${n}><span>${i.descricao}</span><span>${fmtReais(i.valor)}</span></li>`)}
      ${v.dias > 0 && html`<li><span>Multa (${decimal(fin.parametros.multaPct)}%) e juros (${v.dias} dias)</span><span>${fmtReais(v.multa + v.juros)}</span></li>`}
    </ul>
    <div class="linha-entre total"><span>${situacao === 'paga' ? `Pago em ${fmtDataHora(cobranca.pagaEm)} · ${NOMES_FORMA[cobranca.forma]}` : 'Valor atualizado'}</span><strong>${fmtReais(situacao === 'paga' ? cobranca.valorPago : v.total)}</strong></div>
    ${cobranca.baixaManual && html`<small class="sub">Baixa manual por ${cobranca.baixaManual.por} · ${cobranca.baixaManual.comprovante}</small>`}
    ${cobranca.regua.length > 0 && html`<small class="sub">Régua enviada: ${cobranca.regua.map((r) => ETAPAS_REGUA.find((e) => e.id === r.etapa).nome).join(' · ')}</small>`}
    ${['aberta', 'vencida'].includes(situacao) && html`<div class="acoes">
      <button type="button" class="btn secundario" onClick=${() => setBaixando(!baixando)}>Baixa manual</button>
      <button type="button" class="btn secundario" onClick=${() => rodar((e) => cancelarEReemitir(e, cobranca.id, 'sindico', new Date()), 'Cobrança cancelada e reemitida.')}>Cancelar e reemitir</button>
      <button type="button" class="btn secundario" onClick=${() => rodar((e) => enviarSegundaVia(e, cobranca.id, new Date()), '2ª via enviada com valor atualizado.')}>Enviar 2ª via</button>
    </div>`}
    ${baixando && html`<div class="recusa">
      <${Campo} rotulo="Data do pagamento"><input id="baixa-data" type="date" value=${data} onInput=${(ev) => setData(ev.target.value)} /><//>
      <button type="button" class="btn secundario" onClick=${() => setComprovante(`comprovante-${cobranca.unidade}.pdf`)}>${comprovante ? `Anexado: ${comprovante}` : 'Anexar comprovante'}</button>
      <button type="button" class="btn primario" onClick=${() => rodar((e) => baixaManual(e, cobranca.id, { data, comprovante }, 'sindico', new Date()), 'Baixa registrada.')}>Confirmar baixa</button>
    </div>`}
    <${Erro} texto=${erro} />
    <${Sucesso} texto=${mensagem} />
    <button type="button" class="btn-link" onClick=${aoFechar}>Fechar detalhes</button>
  </article>`;
}

function CEmitidas({ estado, executar, agora }) {
  const fin = estado.financeiro;
  const hoje = isoDia(agora);
  const competencias = [...new Set(fin.cobrancas.filter((c) => !c.acordo).map((c) => c.competencia))].sort().reverse();
  const [competencia, setCompetencia] = useState(competencias[0]);
  const [filtro, setFiltro] = useState('todas');
  const [aberta, setAberta] = useState(null);
  const lista = fin.cobrancas
    .filter((c) => !c.acordo && c.competencia === competencia && (filtro === 'todas' || situacaoCobranca(c, hoje) === filtro))
    .sort((a, b) => a.unidade.localeCompare(b.unidade) || a.id.localeCompare(b.id));
  const selecionada = aberta ? fin.cobrancas.find((c) => c.id === aberta) : null;
  return html`<div class="pilha">
    <div class="edicao-anuncio">
      <${Campo} rotulo="Competência"><select id="emitidas-competencia" value=${competencia} onChange=${(ev) => { setCompetencia(ev.target.value); setAberta(null); }}>${competencias.map((c) => html`<option key=${c} value=${c}>${nomeMes(c)}</option>`)}</select><//>
      <${Campo} rotulo="Situação"><select id="emitidas-situacao" value=${filtro} onChange=${(ev) => setFiltro(ev.target.value)}>${FILTROS_COBRANCA.map(([id, nome]) => html`<option key=${id} value=${id}>${nome}</option>`)}</select><//>
    </div>
    ${selecionada && html`<${DetalheCobranca} key=${selecionada.id} estado=${estado} cobranca=${selecionada} executar=${executar} hoje=${hoje} aoFechar=${() => setAberta(null)} />`}
    <div class="tabela-rolagem"><table class="tabela">
      <thead><tr><th>Unidade</th><th>Valor</th><th>Atualizado</th><th>Situação</th><th>Ação</th></tr></thead>
      <tbody>${lista.map((c) => html`<tr key=${c.id}>
        <td>${c.unidade}</td>
        <td>${fmtReais(c.valor)}</td>
        <td>${fmtReais(valorAtualizado(c, fin.parametros, hoje).total)}</td>
        <td><${EtqCobranca} situacao=${situacaoCobranca(c, hoje)} /></td>
        <td><button type="button" class="btn-link" data-cobranca=${c.id} onClick=${() => setAberta(c.id)}>Detalhes</button></td>
      </tr>`)}</tbody>
    </table></div>
    ${!lista.length && html`<${Vazio} texto="Nenhuma cobrança neste filtro." />`}
    <small class="sub">Baixas, cancelamentos e demais ações ficam em <a href="#sindico.financeiro.auditoria">Financeiro › Auditoria</a>.</small>
  </div>`;
}

function CRegua({ estado, executar }) {
  const permitidas = etapasNoPlano(estado.plano);
  const [resumo, setResumo] = useState(null);

  function executarHoje() {
    const r = executar((e) => executarRegua(e, new Date()));
    setResumo(r.resumo || []);
  }

  return html`<div class="pilha">
    <div class="tabela-rolagem"><table class="tabela">
      <thead><tr><th>Quando</th><th>Ação automática</th><th>Canais</th><th>No seu plano</th></tr></thead>
      <tbody>${ETAPAS_REGUA.map((e) => html`<tr key=${e.id}>
        <td>${e.nome}</td>
        <td>${e.acao}</td>
        <td>${e.canais.join(' + ')}</td>
        <td>${permitidas.includes(e.id) ? html`<${Etiqueta} tipo="ok">Ativa<//>` : html`<${Etiqueta}>Disponível no ${PLANOS.find((p) => etapasNoPlano(p.id).includes(e.id)).nome}<//>`}</td>
      </tr>`)}</tbody>
    </table></div>
    <small class="sub">A régua para sozinha quando a cobrança é paga.</small>
    <button type="button" class="btn primario" data-acao="executar-regua" onClick=${executarHoje}>Executar a régua de hoje</button>
    ${resumo && (resumo.length
      ? html`<div class="cartao"><strong>${resumo.length} avisos enviados</strong><ul class="itens-sacola">${resumo.map((r, n) => html`<li key=${n}><span>Apto ${r.unidade} · ${r.rotulo}</span><span>${r.etapa.nome}</span></li>`)}</ul></div>`
      : html`<p class="sucesso">Nenhum aviso pendente hoje.</p>`)}
  </div>`;
}

function CParametros({ estado, executar }) {
  const fin = estado.financeiro;
  const [form, setForm] = useState({ ...fin.parametros, formas: [...fin.parametros.formas] });
  const [erro, setErro] = useState(null);
  const [mensagem, setMensagem] = useState(null);
  const campo = (chave) => (ev) => setForm({ ...form, [chave]: ev.target.type === 'number' ? Number(ev.target.value) : ev.target.value });
  const alternarForma = (k) => setForm({ ...form, formas: form.formas.includes(k) ? form.formas.filter((x) => x !== k) : [...form.formas, k] });

  function salvar() {
    const r = executar((e) => salvarParametros(e, form, 'sindico', new Date()));
    setErro(r.erro || null);
    setMensagem(r.erro ? null : 'Parâmetros salvos.');
  }

  return html`<div class="pilha formulario">
    <h2>Parâmetros de cobrança</h2>
    <div class="edicao-anuncio">
      <${Campo} rotulo="Dia do vencimento"><input id="par-vencimento" type="number" min="1" max="28" value=${form.diaVencimento} onInput=${campo('diaVencimento')} /><//>
      <${Campo} rotulo="Dia do fechamento"><input id="par-fechamento" type="number" min="1" max="28" value=${form.diaFechamento} onInput=${campo('diaFechamento')} /><//>
      <${Campo} rotulo="Multa por atraso (%)" dica="Máximo de 2%"><input id="par-multa" type="number" step="0.1" min="0" value=${form.multaPct} onInput=${campo('multaPct')} /><//>
      <${Campo} rotulo="Juros ao mês (%)"><input id="par-juros" type="number" step="0.1" min="0" value=${form.jurosPct} onInput=${campo('jurosPct')} /><//>
      <${Campo} rotulo="Desconto de pontualidade (%)"><input id="par-desconto" type="number" step="0.5" min="0" value=${form.descontoPct} onInput=${campo('descontoPct')} /><//>
      <${Campo} rotulo="Desconto aprovado em" dica="Ata ou cláusula da convenção"><input id="par-desconto-ata" value=${form.descontoAprovadoEm} onInput=${campo('descontoAprovadoEm')} placeholder="Ex.: AGO de 28/03/2026, item 4" /><//>
    </div>
    <fieldset><legend>Formas aceitas</legend>
      ${[['boleto', 'Boleto'], ['pix', 'Pix'], ['cartao', 'Cartão']].map(([k, nome]) => html`<label key=${k} class="check"><input id=${`par-forma-${k}`} type="checkbox" checked=${form.formas.includes(k)} onChange=${() => alternarForma(k)} /><span>${nome}</span></label>`)}
    </fieldset>
    <${Campo} rotulo="Tarifa do Asaas"><select id="par-tarifa" value=${form.tarifa} onChange=${campo('tarifa')}><option value="condominio">Absorvida pelo condomínio</option><option value="despesa">Registrada como despesa bancária</option></select><//>
    <${Erro} texto=${erro} />
    <${Sucesso} texto=${mensagem} />
    <button type="button" class="btn primario" onClick=${salvar}>Salvar parâmetros</button>
    <small class="sub">Valores da taxa, reajustes e taxas extras ficam na aba <a href="#sindico.cobranca.taxas">Taxa e reajustes</a>.</small>
  </div>`;
}

// Aba "Taxa e reajustes" do síndico e o cartão "Mudanças na sua taxa" do morador.
function mesesAFrente(fin) {
  const p = primeiraNaoEmitida(fin);
  return Array.from({ length: 12 }, (_, n) => somarMes(p, n));
}

function lerNumero(texto) {
  const limpo = String(texto ?? '').trim().replace(',', '.');
  return limpo === '' ? '' : Number(limpo);
}

function textoDesfeitos(n) {
  return n ? ` ${n} ${n === 1 ? 'ajuste manual da prévia foi desfeito' : 'ajustes manuais da prévia foram desfeitos'}.` : '';
}

function unidadeDoTipo(fin, tipo) {
  return Object.keys(fin.unidades).find((u) => fin.unidades[u].tipo === tipo);
}

function ResumoEmVigor({ estado }) {
  const fin = estado.financeiro;
  const v = versaoVigente(fin);
  const competencia = somarMes(primeiraNaoEmitida(fin), -1);
  const ativas = fin.composicao.extras.filter((x) => parcelaDe(x, competencia));
  return html`<dl class="resumo">
    <dt>Modo</dt><dd>${NOMES_MODO[v.modo]}</dd>
    ${v.modo === 'fracao' && html`<dt>Orçamento mensal</dt><dd>${fmtReais(v.orcamento)}</dd>`}
    ${tiposPresentes(fin).map((tipo) => {
      const u = unidadeDoTipo(fin, tipo);
      return html`<dt key=${`t-${tipo}`}>${NOMES_TIPO_UNIDADE[tipo]}</dt><dd key=${`v-${tipo}`}>${fmtReais(ordinariaDe(fin, v, u))} + fundo ${fmtReais(fundoDe(fin, v, u))}</dd>`;
    })}
    <dt>Fundo de reserva</dt><dd>${v.fundoPct}% da ordinária</dd>
    ${ativas.map((x) => html`<dt key=${`x-${x.id}`}>Taxa extra</dt><dd key=${`d-${x.id}`}>${x.descricao} · parcela ${parcelaDe(x, competencia)}/${x.parcelas}</dd>`)}
    <dt>Aprovado em</dt><dd>${v.aprovadoEm}</dd>
  </dl>`;
}

    </table></div>
    <dl class="resumo">
