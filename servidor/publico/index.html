// Ações do zelador e do síndico sobre OS, compras e caixa pequeno. Cada uma devolve { estado, notificacao?, erro?, id? }.
const SO_EQUIPE = 'Somente o zelador ou o síndico pode fazer isso';
const SO_SINDICO_MAN = 'Somente o síndico pode fazer isso';
const DIA_MS = 86400000;
const LIMITE_CAIXA = 20000;

function erroMan(estado, mensagem) {
  return { estado, erro: mensagem };
}

function guardaMan(estado, perfil, soSindico = false) {
  if (soSindico ? perfil !== 'sindico' : !['sindico', 'zelador'].includes(perfil)) return soSindico ? SO_SINDICO_MAN : SO_EQUIPE;
  if (!liberado(estado.plano, 'zelador')) return 'Disponível no plano Intermediário';
  return null;
}

function comManutencao(estado, mudanca) {
  return { ...estado, manutencao: { ...estado.manutencao, ...mudanca } };
}

function autorDe(perfil) {
  return perfil === 'sindico' ? 'Síndico' : ZELADOR;
}

function novaOS(estado, campos, agora) {
  const id = `OS-${String(estado.manutencao.proximaOS).padStart(3, '0')}`;
  return { id, fotoAntes: true, fotoDepois: false, materiais: '', horas: 0, observacoes: '', prestador: null, criadaEm: agora.toISOString(), iniciadaEm: null, concluidaEm: null, validadaEm: null, status: 'aberta', ...campos };
}

function mudarOS(estado, id, mudanca, entrada) {
  const os = estado.manutencao.os.find((o) => o.id === id);
  return comManutencao(estado, { os: trocarItem(estado.manutencao.os, id, { ...mudanca, linha: [...os.linha, entrada] }) });
}

function gerarOS(estado, idNotificacao, { responsavel = 'zelador', prestador = null, prazo = null }, perfil, agora) {
  const falha = guardaMan(estado, perfil, true);
  if (falha) return erroMan(estado, falha);
  const oc = estado.ocorrencias.find((o) => o.id === idNotificacao);
  if (!oc) return erroMan(estado, 'Ocorrência não encontrada');
  if (oc.os) return erroMan(estado, `Esta notificação já tem a ${oc.os}`);
  if (responsavel === 'prestador' && !String(prestador || '').trim()) return erroMan(estado, 'Informe o prestador');
  const limite = PRIORIDADES[oc.prioridade].solucao;
  const prazoFinal = prazo || new Date(new Date(oc.criadaEm).getTime() + (limite || 168) * 3600000).toISOString();
  const quem = responsavel === 'prestador' ? `o prestador ${prestador.trim()}` : 'o zelador';
  const os = novaOS(estado, { origem: 'notificacao', notificacao: oc.id, local: oc.local || CATEGORIAS[oc.categoria].nome, descricao: oc.descricao, prioridade: oc.prioridade, prazo: prazoFinal, responsavel, prestador: responsavel === 'prestador' ? prestador.trim() : null, linha: [{ em: agora.toISOString(), status: 'aberta', texto: `OS aberta a partir da ${oc.id}`, autor: 'Síndico' }] }, agora);
  const entrada = { em: agora.toISOString(), status: oc.status === 'em_andamento' ? null : 'em_andamento', texto: `${os.id} aberta para ${quem}`, autor: 'Síndico' };
  return {
    estado: {
      ...comManutencao(estado, { os: [...estado.manutencao.os, os], proximaOS: estado.manutencao.proximaOS + 1 }),
      ocorrencias: trocarItem(estado.ocorrencias, oc.id, { os: os.id, status: 'em_andamento', linha: [...oc.linha, entrada] }),
    },
    id: os.id,
    notificacao: { canal: 'Push', para: responsavel === 'prestador' ? prestador.trim() : ZELADOR, texto: `Nova ${os.id}: ${os.local}` },
  };
}

function abrirOS(estado, { local, descricao, prioridade = 'normal', prazo = null }, perfil, agora) {
  const falha = guardaMan(estado, perfil);
  if (falha) return erroMan(estado, falha);
  if (!String(local || '').trim() || !String(descricao || '').trim()) return erroMan(estado, 'Informe o local e a descrição');
  const os = novaOS(estado, { origem: perfil === 'sindico' ? 'sindico' : 'ronda', notificacao: null, local: local.trim(), descricao: descricao.trim(), prioridade, prazo: prazo || new Date(agora.getTime() + 7 * DIA_MS).toISOString(), responsavel: 'zelador', linha: [{ em: agora.toISOString(), status: 'aberta', texto: perfil === 'sindico' ? 'OS aberta pelo síndico' : 'OS aberta na ronda do zelador', autor: autorDe(perfil) }] }, agora);
  return { estado: comManutencao(estado, { os: [...estado.manutencao.os, os], proximaOS: estado.manutencao.proximaOS + 1 }), id: os.id };
}

function iniciarOS(estado, id, perfil, agora) {
  const falha = guardaMan(estado, perfil);
  if (falha) return erroMan(estado, falha);
  const os = estado.manutencao.os.find((o) => o.id === id);
  if (!os || !['aberta', 'aguardando_material', 'aguardando_prestador'].includes(os.status)) return erroMan(estado, 'Esta OS não pode ser iniciada agora');
  return { estado: mudarOS(estado, id, { status: 'em_execucao', iniciadaEm: os.iniciadaEm || agora.toISOString() }, { em: agora.toISOString(), status: 'em_execucao', texto: os.status === 'aberta' ? 'Iniciada' : 'Retomada', autor: autorDe(perfil) }) };
}

function pausarOS(estado, id, motivo, perfil, agora) {
  const falha = guardaMan(estado, perfil);
  if (falha) return erroMan(estado, falha);
  const os = estado.manutencao.os.find((o) => o.id === id);
  if (!os || os.status !== 'em_execucao' || !['aguardando_material', 'aguardando_prestador'].includes(motivo)) return erroMan(estado, 'Só OS em execução podem aguardar');
  const texto = motivo === 'aguardando_material' ? 'Aguardando material' : 'Aguardando prestador';
  return { estado: mudarOS(estado, id, { status: motivo }, { em: agora.toISOString(), status: motivo, texto, autor: autorDe(perfil) }) };
}

function concluirOS(estado, id, { fotoDepois, materiais = '', horas, observacoes = '' }, perfil, agora) {
  const falha = guardaMan(estado, perfil);
  if (falha) return erroMan(estado, falha);
  const os = estado.manutencao.os.find((o) => o.id === id);
  if (!os || !['em_execucao', 'aguardando_material', 'aguardando_prestador'].includes(os.status)) return erroMan(estado, 'Inicie a OS antes de concluir');
  if (!fotoDepois) return erroMan(estado, 'Anexe a foto do depois');
  if (!(horas > 0)) return erroMan(estado, 'Informe as horas gastas');
  const em = agora.toISOString();
  let novo = mudarOS(estado, id, { status: 'concluida', fotoDepois: true, materiais: String(materiais).trim(), horas, observacoes: String(observacoes).trim(), concluidaEm: em }, { em, status: 'concluida', texto: 'Concluída com fotos do depois', autor: autorDe(perfil) });
  const oc = os.notificacao ? novo.ocorrencias.find((o) => o.id === os.notificacao) : null;
  if (!oc || ['resolvida', 'fechada'].includes(oc.status)) return { estado: novo, notificacao: { canal: 'Push', para: 'Síndico', texto: `${id} concluída: validar` } };
  // Em nome do condomínio: a entrada não cria autor novo e a 1ª resposta já existe (a OS foi gerada pelo síndico).
  novo = { ...novo, ocorrencias: trocarItem(novo.ocorrencias, oc.id, { status: 'resolvida', linha: [...oc.linha, { em, status: 'resolvida', texto: 'Reparo concluído pelo zelador (fotos do antes e depois)', autor: 'Síndico' }] }) };
  return { estado: novo, notificacao: { canal: 'Push', para: nomesDaUnidade(estado, oc.unidade), texto: `Seu chamado ${oc.id} foi resolvido` } };
}

function validarOS(estado, id, perfil, agora) {
  const falha = guardaMan(estado, perfil, true);
  if (falha) return erroMan(estado, falha);
  const os = estado.manutencao.os.find((o) => o.id === id);
  if (!os || os.status !== 'concluida') return erroMan(estado, 'Só OS concluídas podem ser validadas');
  return { estado: mudarOS(estado, id, { status: 'validada', validadaEm: agora.toISOString() }, { em: agora.toISOString(), status: 'validada', texto: 'Validada pelo síndico', autor: 'Síndico' }) };
}

function compraPorId(estado, id) {
  return estado.manutencao.compras.find((c) => c.id === id);
}

function lancarDespesa(estado, categoria, valor, agora, acao, detalhe) {
  const fin = estado.financeiro;
  return { ...estado, financeiro: { ...fin, despesasMes: { ...fin.despesasMes, [categoria]: fin.despesasMes[categoria] + valor }, saldo: fin.saldo - valor, auditoria: comAuditoria(estado, agora, acao, detalhe) } };
}

function solicitarCompra(estado, { item, quantidade, valorEstimado, motivo = '', categoria = 'manutencao', os = null, urgente = false, cotacoes = [] }, perfil, agora) {
  const falha = guardaMan(estado, perfil);
  if (falha) return erroMan(estado, falha);
  if (!String(item || '').trim() || !(quantidade >= 1) || !(valorEstimado > 0)) return erroMan(estado, 'Informe item, quantidade e valor');
  const id = `CP-${String(estado.manutencao.proximaCompra).padStart(3, '0')}`;
  const compra = { id, item: item.trim(), quantidade, motivo: String(motivo).trim(), valorEstimado, categoria, os, urgente, cotacoes: [...cotacoes], status: 'solicitada', motivoRecusa: null, valorFinal: null, nota: null, viaCaixa: false, criadaEm: agora.toISOString(), aprovadaEm: null, recebidaEm: null };
  return {
    estado: comManutencao(estado, { compras: [...estado.manutencao.compras, compra], proximaCompra: estado.manutencao.proximaCompra + 1 }),
    id,
    notificacao: { canal: 'Push', para: 'Síndico', texto: `${id} aguardando aprovação: ${compra.item}, ${fmtReais(valorEstimado)}` },
  };
}

function anexarCotacao(estado, id, { fornecedor, valor }, perfil) {
  const falha = guardaMan(estado, perfil);
  if (falha) return erroMan(estado, falha);
  const c = compraPorId(estado, id);
  if (!c || c.status !== 'solicitada') return erroMan(estado, 'Só compras aguardando aprovação recebem cotação');
  if (!String(fornecedor || '').trim() || !(valor > 0)) return erroMan(estado, 'Informe fornecedor e valor da cotação');
  return { estado: comManutencao(estado, { compras: trocarItem(estado.manutencao.compras, id, { cotacoes: [...c.cotacoes, { fornecedor: fornecedor.trim(), valor }] }) }) };
}

function aprovarCompra(estado, id, perfil, agora) {
  const falha = guardaMan(estado, perfil, true);
  if (falha) return erroMan(estado, falha);
  const c = compraPorId(estado, id);
  if (!c || c.status !== 'solicitada') return erroMan(estado, 'Esta compra não está aguardando aprovação');
  if (liberado(estado.plano, 'cotacoes') && c.cotacoes.length < cotacoesMinimas(c.valorEstimado).minimo) return erroMan(estado, textoCotacoes(c.valorEstimado));
  return {
    estado: comManutencao(estado, { compras: trocarItem(estado.manutencao.compras, id, { status: 'aprovada', aprovadaEm: agora.toISOString() }) }),
    notificacao: { canal: 'Push', para: ZELADOR, texto: `${id} aprovada: pode comprar` },
  };
}

function recusarCompra(estado, id, motivo, perfil) {
  const falha = guardaMan(estado, perfil, true);
  if (falha) return erroMan(estado, falha);
  const c = compraPorId(estado, id);
  if (!c || c.status !== 'solicitada') return erroMan(estado, 'Esta compra não está aguardando aprovação');
  if (!String(motivo || '').trim()) return erroMan(estado, 'Informe o motivo da recusa');
  return {
    estado: comManutencao(estado, { compras: trocarItem(estado.manutencao.compras, id, { status: 'recusada', motivoRecusa: motivo.trim() }) }),
    notificacao: { canal: 'Push', para: ZELADOR, texto: `${id} recusada: ${motivo.trim()}` },
  };
}

function receberCompra(estado, id, { valorFinal, nota }, perfil, agora) {
  const falha = guardaMan(estado, perfil);
  if (falha) return erroMan(estado, falha);
  const c = compraPorId(estado, id);
  if (!c || c.status !== 'aprovada') return erroMan(estado, 'Só compras aprovadas podem ser recebidas');
  if (!(valorFinal > 0)) return erroMan(estado, 'Informe o valor final');
  if (valorFinal > LIMITE_CAIXA && !String(nota || '').trim()) return erroMan(estado, 'Anexe a nota fiscal (obrigatória acima de R$ 200,00)');
  const recebida = comManutencao(estado, { compras: trocarItem(estado.manutencao.compras, id, { status: 'recebida', valorFinal, nota: String(nota || '').trim() || null, recebidaEm: agora.toISOString() }) });
  return {
    estado: lancarDespesa(recebida, c.categoria, valorFinal, agora, 'Compra lançada', `${id} · ${c.item} · ${fmtReais(valorFinal)}`),
    notificacao: { canal: 'App', para: 'Síndico', texto: `${id} recebida: ${fmtReais(valorFinal)} lançado em despesas` },
  };
}

function gastoCaixa(estado, { descricao, valor, cupom }, perfil, agora) {
  const falha = guardaMan(estado, perfil);
  if (falha) return erroMan(estado, falha);
  if (!liberado(estado.plano, 'caixaPequeno')) return erroMan(estado, 'Disponível no plano Avançado');
  const caixa = estado.manutencao.caixa;
  if (!String(descricao || '').trim() || !(valor > 0)) return erroMan(estado, 'Informe descrição e valor');
  if (!cupom) return erroMan(estado, 'Anexe a foto do cupom');
  if (valor > LIMITE_CAIXA) return erroMan(estado, 'Gasto acima de R$ 200,00: faça uma compra');
  if (valor > caixa.saldo) return erroMan(estado, 'Saldo do caixa pequeno insuficiente');
  const gasto = { id: `G${caixa.gastos.length + 1}`, descricao: descricao.trim(), valor, cupom: true, em: agora.toISOString() };
  return { estado: comManutencao(estado, { caixa: { ...caixa, saldo: caixa.saldo - valor, gastos: [...caixa.gastos, gasto] } }) };
}

function reporCaixa(estado, perfil, agora) {
  const falha = guardaMan(estado, perfil, true);
  if (falha) return erroMan(estado, falha);
  if (!liberado(estado.plano, 'caixaPequeno')) return erroMan(estado, 'Disponível no plano Avançado');
  const caixa = estado.manutencao.caixa;
  const valor = caixa.fundo - caixa.saldo;
  if (!valor) return erroMan(estado, 'O caixa pequeno já está completo');
  const reposto = comManutencao(estado, { caixa: { ...caixa, saldo: caixa.fundo, reposicoes: [...caixa.reposicoes, { em: agora.toISOString(), valor }] } });
  return {
    estado: lancarDespesa(reposto, 'manutencao', valor, agora, 'Caixa pequeno reposto', `${fmtReais(valor)} · ${caixa.gastos.length} gastos com cupom`),
    notificacao: { canal: 'App', para: ZELADOR, texto: `Caixa pequeno reposto: saldo ${fmtReais(caixa.fundo)}` },
  };
}

// ---- src/escala/regras.js ----

// Turnos com horas locais "AAAA-MM-DDTHH:MM": comparáveis como texto e sem fuso.
const DESCANSO_MINIMO = 11;
const HORA_MS_ESCALA = 3600000;

function dois(n) {
  return String(n).padStart(2, '0');
}

function modulo(n, m) {
  return ((n % m) + m) % m;
}

function horaLocal(dia, h) {
  return `${somarDias(dia, Math.floor(h / 24))}T${dois(h % 24)}:00`;
}

function instanteLocal(agora) {
  return `${isoDia(agora)}T${dois(agora.getHours())}:${dois(agora.getMinutes())}`;
}

function horasEntreLocal(a, b) {
  return (new Date(b) - new Date(a)) / HORA_MS_ESCALA;
}

function mesAtual(agora) {
  return isoDia(agora).slice(0, 7);
}

function porteiroPorId(id) {
  return PORTEIROS.find((p) => p.id === id);
}

function trabalha(a, dia) {
  if (MODELOS[a.modelo].ciclo === 2) return modulo(diferencaDias(dia, a.ancora), 2) === a.paridade;
  return deIso(dia).getDay() !== a.folga;
}

function deFerias(escala, porteiro, dia) {
  return escala.ferias.some((f) => f.porteiro === porteiro && dia >= f.de && dia <= f.ate);
}

function gerarTurnos(escala, mes) {
  const turnos = [];
  for (const a of escala.atribuicoes) {
    for (const dia of diasDoMes(mes)) {
      if (!trabalha(a, dia)) continue;
      const ferias = deFerias(escala, a.porteiro, dia);
      turnos.push({ id: `T-${dia}-${a.posto}-${dois(a.inicio)}`, posto: a.posto, porteiro: ferias ? null : a.porteiro, inicio: horaLocal(dia, a.inicio), fim: horaLocal(dia, a.inicio + MODELOS[a.modelo].horas), motivoDescoberto: ferias ? 'ferias' : null, porteiroOriginal: ferias ? a.porteiro : null, anexo: null, trocado: false, checkin: null, checkout: null });
    }
  }
  return turnos.sort((x, y) => x.inicio.localeCompare(y.inicio) || x.posto.localeCompare(y.posto));
}

function todosTurnos(estado) {
  return Object.values(estado.escala.meses).flatMap((m) => m.turnos);
}

function acharTurno(estado, id) {
  return todosTurnos(estado).find((t) => t.id === id);
}

function turnosComVespera(estado, mes) {
  const anterior = somarMes(mes, -1);
  const ultimo = somarDias(`${mes}-01`, -1);
  const guardado = estado.escala.meses[anterior];
  const vespera = (guardado ? guardado.turnos : gerarTurnos(estado.escala, anterior)).filter((t) => t.inicio.startsWith(ultimo));
  return [...vespera, ...(estado.escala.meses[mes] ? estado.escala.meses[mes].turnos : [])];
}

function buracos(estado, mes, posto) {
  const turnos = turnosComVespera(estado, mes).filter((t) => t.posto === posto && t.porteiro);
  const p = POSTOS[posto];
  const lista = [];
  let aberto = null;
  for (const dia of diasDoMes(mes)) {
    for (let h = 0; h < 24; h++) {
      const hora = horaLocal(dia, h);
      const dentro = h >= p.abre && h < p.fecha;
      if (dentro && !turnos.some((t) => t.inicio <= hora && hora < t.fim)) {
        if (aberto) aberto.fim = horaLocal(dia, h + 1);
        else aberto = { inicio: hora, fim: horaLocal(dia, h + 1) };
      } else if (aberto) {
        lista.push(aberto);
        aberto = null;
      }
    }
  }
  if (aberto) lista.push(aberto);
  return lista;
}

function feriadosDoMes(mes) {
  return diasDoMes(mes).filter((d) => FERIADOS[d.slice(5)]).map((d) => ({ dia: d, nome: FERIADOS[d.slice(5)] }));
}

function sobrepoeTurno(a, b) {
  return a.inicio < b.fim && b.inicio < a.fim;
}

function conflita(estado, porteiro, turno) {
  return todosTurnos(estado).some((t) => t.id !== turno.id && t.porteiro === porteiro && sobrepoeTurno(t, turno));
}

function menorDescanso(estado, porteiro, turno) {
  const outros = todosTurnos(estado).filter((t) => t.id !== turno.id && t.porteiro === porteiro && !sobrepoeTurno(t, turno));
  return outros.reduce((menor, t) => Math.min(menor, t.fim <= turno.inicio ? horasEntreLocal(t.fim, turno.inicio) : horasEntreLocal(turno.fim, t.inicio)), Infinity);
}

function descansoInsuficiente(estado, mes) {
  const lista = [];
  for (const p of PORTEIROS) {
    const meus = todosTurnos(estado).filter((t) => t.porteiro === p.id).sort((a, b) => a.inicio.localeCompare(b.inicio));
    for (let i = 1; i < meus.length; i++) {
      const horas = horasEntreLocal(meus[i - 1].fim, meus[i].inicio);
      if (horas < DESCANSO_MINIMO && meus[i].inicio.startsWith(mes)) lista.push({ porteiro: p.id, anterior: meus[i - 1].id, proximo: meus[i].id, horas });
    }
  }
  return lista;
}

function sugestoesCobertura(estado, turnoId) {
  const t = acharTurno(estado, turnoId);
  const folguista = (id) => (porteiroPorId(id).vinculo === 'folguista' ? 1 : 0);
  return PORTEIROS
    .filter((p) => p.postos.includes(t.posto) && p.id !== t.porteiroOriginal && !deFerias(estado.escala, p.id, t.inicio.slice(0, 10)) && !conflita(estado, p.id, t))
    .map((p) => {
      const descanso = menorDescanso(estado, p.id, t);
      return { porteiro: p.id, descanso, alerta11: descanso < DESCANSO_MINIMO };
    })
    .sort((a, b) => folguista(b.porteiro) - folguista(a.porteiro) || (b.descanso - a.descanso) || 0);
}

function plantaoAgora(estado, agora) {
  const atual = instanteLocal(agora);
  const seguinte = estado.escala.meses[somarMes(mesAtual(agora), 1)];
  const turnos = [...turnosComVespera(estado, mesAtual(agora)), ...(seguinte ? seguinte.turnos : [])];
  return Object.fromEntries(Object.keys(POSTOS).map((posto) => {
    const doPosto = turnos.filter((t) => t.posto === posto).sort((a, b) => a.inicio.localeCompare(b.inicio));
    return [posto, { atual: doPosto.find((t) => t.inicio <= atual && atual < t.fim) || null, proximo: doPosto.find((t) => t.inicio > atual) || null }];
  }));
}

function turnosDoPorteiro(estado, porteiro, agora) {
  const atual = instanteLocal(agora);
  return todosTurnos(estado).filter((t) => t.porteiro === porteiro && t.fim > atual).sort((a, b) => a.inicio.localeCompare(b.inicio));
}

function fmtTurno(t) {
  return `${fmtDataCurta(t.inicio.slice(0, 10)).slice(0, 5)} ${Number(t.inicio.slice(11, 13))}h–${Number(t.fim.slice(11, 13))}h`;
}

function relatorioHoras(estado, mes) {
  const doMes = estado.escala.meses[mes] ? estado.escala.meses[mes].turnos : [];
  const horas = (t) => horasEntreLocal(t.inicio, t.fim);
  return PORTEIROS.map((p) => {
    const meus = doMes.filter((t) => t.porteiro === p.id);
    return {
      porteiro: p.id,
      escaladas: meus.reduce((s, t) => s + horas(t), 0),
      comCheckin: meus.filter((t) => t.checkin && t.checkout).reduce((s, t) => s + horas(t), 0),
      atrasos: meus.filter((t) => t.checkin && t.checkin.atrasoMin > 0).length,
      faltas: doMes.filter((t) => t.porteiroOriginal === p.id && ['falta', 'atestado'].includes(t.motivoDescoberto)).length,
      trocas: estado.escala.trocas.filter((x) => x.situacao === 'aprovada' && x.turno.startsWith(`T-${mes}`) && (x.de === p.id || x.para === p.id)).length,
    };
  });
}

function nomeDoMesEscala(mes) {
  return nomeMes(mes).split(' de ')[0];
}

function alertasEscala(estado, agora) {
  const itens = [];
  const proximo = somarMes(mesAtual(agora), 1);
  const m = estado.escala.meses[proximo];
  if (!m) itens.push({ chave: 'esc-gerar', texto: `Gerar a escala de ${nomeDoMesEscala(proximo)}`, href: '#sindico.escala' });
  else if (m.situacao === 'rascunho') itens.push({ chave: 'esc-publicar', texto: `Escala de ${nomeDoMesEscala(proximo)} em rascunho: publicar`, href: '#sindico.escala' });
  for (const x of estado.escala.trocas.filter((t) => t.situacao === 'aceita')) {
    itens.push({ chave: `troca-${x.id}`, texto: `Troca aguardando aprovação: ${porteiroPorId(x.de).nome} → ${porteiroPorId(x.para).nome}, ${fmtTurno(acharTurno(estado, x.turno)).split('–')[0]}`, href: '#sindico.escala.pendencias' });
  }
  const atual = instanteLocal(agora);
  const limite = instanteLocal(new Date(agora.getTime() + 7 * 24 * HORA_MS_ESCALA));
  for (const t of todosTurnos(estado).filter((x) => !x.porteiro && x.fim > atual && x.inicio < limite).sort((a, b) => a.inicio.localeCompare(b.inicio))) {
    itens.push({ chave: `desc-${t.id}`, texto: `Turno descoberto: ${POSTOS[t.posto].nome} ${fmtTurno(t)} · ${NOMES_MOTIVO[t.motivoDescoberto] || 'sem porteiro'}${t.porteiroOriginal ? ` de ${porteiroPorId(t.porteiroOriginal).nome}` : ''}`, href: '#sindico.escala.pendencias' });
  }
  return itens;
}

// Visão da semana por porteiro: uma célula por dia com os turnos dele, o turno que ele perdeu (férias, falta, atestado) ou a folga.
const NOMES_CELULA = { dia: 'Dia', noite: 'Noite', manha: 'Manhã', tarde: 'Tarde', folga: 'Folga', ferias: 'Férias', falta: 'Falta', atestado: 'Atestado', semEscala: '—' };

function inicioDaSemana(dia) {
  return somarDias(dia, -modulo(deIso(dia).getDay() - 1, 7));
}

function tipoDoTurno(t) {
  const h = Number(t.inicio.slice(11, 13));
  if (h >= 18) return 'noite';
  if (horasEntreLocal(t.inicio, t.fim) >= 12) return 'dia';
  return h < 12 ? 'manha' : 'tarde';
}

function celulaEscala(estado, porteiro, dia) {
  if (!estado.escala.meses[dia.slice(0, 7)]) return [{ tipo: 'semEscala' }];
  const doDia = estado.escala.meses[dia.slice(0, 7)].turnos.filter((t) => t.inicio.startsWith(dia));
  const itens = [
    ...doDia.filter((t) => t.porteiro === porteiro).map((t) => ({ tipo: tipoDoTurno(t), turno: t.id, posto: t.posto, trocado: t.trocado })),
    ...doDia.filter((t) => t.porteiroOriginal === porteiro && t.porteiro !== porteiro && t.motivoDescoberto).map((t) => ({ tipo: t.motivoDescoberto, turno: t.id, posto: t.posto, trocado: false })),
  ];
  if (itens.length) return itens;
  return [{ tipo: deFerias(estado.escala, porteiro, dia) ? 'ferias' : 'folga' }];
}

function semanaDaEscala(estado, segunda) {
  const dias = Array.from({ length: 7 }, (_, i) => somarDias(segunda, i));
  const meses = [...new Set(dias.map((d) => d.slice(0, 7)))].filter((m) => estado.escala.meses[m]);
  const vazios = meses.flatMap((m) => Object.keys(POSTOS).flatMap((posto) => buracos(estado, m, posto).map((b) => ({ posto, ...b }))));
  return {
    dias,
    linhas: PORTEIROS.map((p) => ({ porteiro: p.id, celulas: dias.map((dia) => celulaEscala(estado, p.id, dia)) })),
    descobertos: dias.map((dia) => vazios.filter((b) => b.inicio.startsWith(dia))),
  };
}

function semanasComEscala(estado) {
  const meses = Object.keys(estado.escala.meses).sort();
  if (!meses.length) return [];
  const fim = diasDoMes(meses.at(-1)).at(-1);
  const semanas = [];
  for (let s = inicioDaSemana(`${meses[0]}-01`); s <= fim; s = somarDias(s, 7)) {
    if (Array.from({ length: 7 }, (_, i) => somarDias(s, i)).some((d) => estado.escala.meses[d.slice(0, 7)])) semanas.push(s);
  }
  return semanas;
}

// ---- src/escala/acoes.js ----

// Ações da escala: o síndico gera, publica, aprova e atribui; o porteiro propõe, aceita, registra falta e faz check-in.
const SO_SINDICO_ESC = 'Somente o síndico pode fazer isso';

function erroEsc(estado, mensagem) {
  return { estado, erro: mensagem };
}

function guardaEsc(estado, perfil, soSindico) {
  if (soSindico && perfil !== 'sindico') return SO_SINDICO_ESC;
  if (!liberado(estado.plano, 'escala')) return 'Disponível no plano Intermediário';
  return null;
}

function comEscala(estado, mudanca) {
  return { ...estado, escala: { ...estado.escala, ...mudanca } };
}

function mudarTurno(estado, id, mudanca) {
  const mes = id.slice(2, 9);
  const m = estado.escala.meses[mes];
  return comEscala(estado, { meses: { ...estado.escala.meses, [mes]: { ...m, turnos: m.turnos.map((t) => (t.id === id ? { ...t, ...mudanca } : t)) } } });
}

function alertaDescanso(estado, porteiro, turno) {
  return menorDescanso(estado, porteiro, turno) < 11 ? `Menos de 11 h de descanso para ${porteiroPorId(porteiro).nome}` : undefined;
}

function inicioDoTurno(t) {
  return fmtTurno(t).split('–')[0];
}

function gerarEscala(estado, mes, perfil) {
  const falha = guardaEsc(estado, perfil, true);
  if (falha) return erroEsc(estado, falha);
  if (estado.escala.meses[mes]) return erroEsc(estado, `A escala de ${nomeDoMesEscala(mes)} já foi gerada`);
  return { estado: comEscala(estado, { meses: { ...estado.escala.meses, [mes]: { situacao: 'rascunho', publicadaEm: null, turnos: gerarTurnos(estado.escala, mes) } } }) };
}

function publicarEscala(estado, mes, perfil, agora) {
  const falha = guardaEsc(estado, perfil, true);
  if (falha) return erroEsc(estado, falha);
  const m = estado.escala.meses[mes];
  if (!m) return erroEsc(estado, 'Gere a escala antes de publicar');
  if (m.situacao === 'publicada') return erroEsc(estado, 'Escala já publicada');
  const avisados = new Set(m.turnos.filter((t) => t.porteiro).map((t) => t.porteiro)).size;
  return {
    estado: comEscala(estado, { meses: { ...estado.escala.meses, [mes]: { ...m, situacao: 'publicada', publicadaEm: instanteLocal(agora) } } }),
    notificacao: { canal: 'App', para: 'Porteiros', texto: `Escala de ${nomeDoMesEscala(mes)} publicada: ${avisados} porteiros avisados` },
  };
}

function ajustarTurno(estado, turnoId, porteiro, perfil) {
  const falha = guardaEsc(estado, perfil, true);
  if (falha) return erroEsc(estado, falha);
  const t = acharTurno(estado, turnoId);
  if (!t) return erroEsc(estado, 'Turno não encontrado');
  if (porteiro && conflita(estado, porteiro, t)) return erroEsc(estado, 'Este colega já tem turno nesse horário');
  const novo = mudarTurno(estado, turnoId, porteiro ? { porteiro } : { porteiro: null, motivoDescoberto: t.motivoDescoberto || 'falta', porteiroOriginal: t.porteiroOriginal || t.porteiro });
  const nomes = [...new Set([t.porteiro, porteiro].filter(Boolean))].map((id) => porteiroPorId(id).nome);
  const publicada = estado.escala.meses[turnoId.slice(2, 9)].situacao === 'publicada';
  return {
    estado: novo,
    alerta: porteiro ? alertaDescanso(estado, porteiro, t) : undefined,
    notificacao: publicada && nomes.length ? { canal: 'App', para: nomes.join(' e '), texto: `Escala alterada: ${POSTOS[t.posto].nome} ${fmtTurno(t)}` } : undefined,
  };
}

function proporTroca(estado, { turnoId, de, para }, perfil, agora) {
  const falha = guardaEsc(estado, perfil, false);
  if (falha) return erroEsc(estado, falha);
  const t = turnoId ? acharTurno(estado, turnoId) : null;
  if (!t || !para) return erroEsc(estado, 'Escolha o turno e o colega');
  if (t.porteiro !== de) return erroEsc(estado, 'Só o porteiro do turno pode propor a troca');
  if (conflita(estado, para, t)) return erroEsc(estado, 'Este colega já tem turno nesse horário');
  const id = `TR-${String(estado.escala.proximaTroca).padStart(3, '0')}`;
  return {
    estado: comEscala(estado, { trocas: [...estado.escala.trocas, { id, turno: t.id, de, para, situacao: 'proposta', criadaEm: instanteLocal(agora) }], proximaTroca: estado.escala.proximaTroca + 1 }),
    id,
    notificacao: { canal: 'App', para: porteiroPorId(para).nome, texto: `${porteiroPorId(de).nome} propôs trocar o turno de ${fmtTurno(t)}` },
  };
}

function mudarTroca(estado, id, mudanca) {
  return comEscala(estado, { trocas: estado.escala.trocas.map((x) => (x.id === id ? { ...x, ...mudanca } : x)) });
}

function aceitarTroca(estado, id, quem) {
  const x = estado.escala.trocas.find((t) => t.id === id);
  if (!x || x.situacao !== 'proposta') return erroEsc(estado, 'Esta troca não está aguardando o colega');
  if (x.para !== quem) return erroEsc(estado, 'Só o colega convidado pode aceitar');
  return { estado: mudarTroca(estado, id, { situacao: 'aceita' }), notificacao: { canal: 'App', para: 'Síndico', texto: `Troca ${id} aceita: aguardando sua aprovação` } };
}

function recusarTroca(estado, id, quem, perfil) {
  const x = estado.escala.trocas.find((t) => t.id === id);
  if (!x || !['proposta', 'aceita'].includes(x.situacao)) return erroEsc(estado, 'Esta troca não pode mais ser recusada');
  if (perfil !== 'sindico' && x.para !== quem) return erroEsc(estado, 'Só o colega convidado pode aceitar');
  return { estado: mudarTroca(estado, id, { situacao: 'recusada' }), notificacao: { canal: 'App', para: porteiroPorId(x.de).nome, texto: `Troca ${id} recusada` } };
}

function aprovarTroca(estado, id, perfil) {
  const falha = guardaEsc(estado, perfil, true);
  if (falha) return erroEsc(estado, falha);
  const x = estado.escala.trocas.find((t) => t.id === id);
  if (!x || x.situacao !== 'aceita') return erroEsc(estado, 'Esta troca ainda não foi aceita pelo colega');
  const t = acharTurno(estado, x.turno);
  return {
    estado: mudarTurno(mudarTroca(estado, id, { situacao: 'aprovada' }), t.id, { porteiro: x.para, trocado: true }),
    alerta: alertaDescanso(estado, x.para, t),
    notificacao: { canal: 'App', para: `${porteiroPorId(x.de).nome} e ${porteiroPorId(x.para).nome}`, texto: `Troca aprovada: ${POSTOS[t.posto].nome} ${fmtTurno(t)} fica com ${porteiroPorId(x.para).nome}` },
  };
}

function registrarFalta(estado, turnoId, { quem, motivo, anexo = null }, perfil) {
  const falha = guardaEsc(estado, perfil, false);
  if (falha) return erroEsc(estado, falha);
  const t = turnoId ? acharTurno(estado, turnoId) : null;
  if (!t || !['falta', 'atestado'].includes(motivo)) return erroEsc(estado, 'Escolha o turno e o motivo');
  if (perfil !== 'sindico' && t.porteiro !== quem) return erroEsc(estado, 'Só o porteiro do turno pode registrar a falta');
  if (!t.porteiro) return erroEsc(estado, 'Este turno já está descoberto');
  const p = porteiroPorId(t.porteiro);
  const novo = mudarTurno(estado, t.id, { porteiro: null, motivoDescoberto: motivo, porteiroOriginal: t.porteiro, anexo });
  const notificacao = p.vinculo === 'terceirizado'
    ? { canal: 'WhatsApp', para: p.empresa, texto: `${p.empresa}: turno descoberto na ${POSTOS[t.posto].nome} ${inicioDoTurno(t)}` }
    : { canal: 'App', para: 'Síndico', texto: `Turno descoberto: ${POSTOS[t.posto].nome} ${inicioDoTurno(t)} (${motivo} de ${p.nome})` };
  return { estado: novo, notificacao };
}

function atribuirCobertura(estado, turnoId, porteiro, perfil) {
  const falha = guardaEsc(estado, perfil, true);
  if (falha) return erroEsc(estado, falha);
  const t = acharTurno(estado, turnoId);
  if (!t || t.porteiro) return erroEsc(estado, 'Este turno não está descoberto');
  if (conflita(estado, porteiro, t)) return erroEsc(estado, 'Este colega já tem turno nesse horário');
  return {
    estado: mudarTurno(estado, t.id, { porteiro }),
    alerta: alertaDescanso(estado, porteiro, t),
    notificacao: { canal: 'App', para: porteiroPorId(porteiro).nome, texto: `Você cobre ${POSTOS[t.posto].nome} ${fmtTurno(t)}` },
  };
}

function fazerCheckin(estado, porteiro, agora) {
  if (!liberado(estado.plano, 'checkin')) return erroEsc(estado, 'Disponível no plano Avançado');
  const atual = instanteLocal(agora);
  const t = todosTurnos(estado).find((x) => x.porteiro === porteiro && x.inicio <= atual && atual < x.fim);
  if (!t || t.checkin) return erroEsc(estado, 'Não há turno seu agora para fazer check-in');
  const minutos = Math.round((new Date(atual) - new Date(t.inicio)) / 60000);
  return { estado: mudarTurno(estado, t.id, { checkin: { em: atual, atrasoMin: minutos > 10 ? minutos : 0 } }) };
}

function fazerCheckout(estado, porteiro, agora) {
  if (!liberado(estado.plano, 'checkin')) return erroEsc(estado, 'Disponível no plano Avançado');
  const atual = instanteLocal(agora);
  const t = todosTurnos(estado).find((x) => x.porteiro === porteiro && x.checkin && !x.checkout && x.inicio <= atual);
  if (!t) return erroEsc(estado, 'Faça o check-in antes do check-out');
  return { estado: mudarTurno(estado, t.id, { checkout: { em: atual } }) };
}

// Seed: mês atual publicado no dia 25 do mês anterior, check-in nos turnos encerrados, atestado de amanhã e uma troca aceita.
function comEscalaInicial(estado, agora) {
  const mes = mesAtual(agora);
  const escala = { atribuicoes: atribuicoesIniciais(mes), ferias: [{ porteiro: 'rita', de: `${mes}-12`, ate: `${mes}-21` }], trocas: [], meses: {}, proximaTroca: 1 };
  const atual = instanteLocal(agora);
  const atrasos = { [`T-${mes}-02-portaria-07`]: 15, [`T-${mes}-03-portaria-19`]: 22 };
  const turnos = gerarTurnos(escala, mes).map((t) => {
    if (!t.porteiro || t.fim > atual) return t;
    const atraso = atrasos[t.id] || 0;
    return { ...t, checkin: { em: instanteLocal(new Date(new Date(t.inicio).getTime() + atraso * 60000)), atrasoMin: atraso }, checkout: { em: t.fim } };
  });
  let e = { ...estado, escala: { ...escala, meses: { [mes]: { situacao: 'publicada', publicadaEm: `${somarMes(mes, -1)}-25T18:00`, turnos } } } };
  const amanha = somarDias(isoDia(agora), 1);
  const atestado = turnos.find((t) => t.id === `T-${amanha}-guarita-07` && t.porteiro === 'claudia');
  if (atestado) e = mudarTurno(e, atestado.id, { porteiro: null, motivoDescoberto: 'atestado', porteiroOriginal: 'claudia', anexo: 'atestado-claudia.pdf' });
  const daTroca = turnos.find((t) => t.porteiro === 'marcos' && t.inicio > horaLocal(somarDias(isoDia(agora), 2), 23));
  if (daTroca) e = comEscala(e, { trocas: [{ id: 'TR-001', turno: daTroca.id, de: 'marcos', para: 'paulo', situacao: 'aceita', criadaEm: instanteLocal(new Date(agora.getTime() - 20 * 3600000)) }], proximaTroca: 2 });
  return e;
}

// ---- src/vendas/regras.js ----

const VENDA_OK = { ok: true };

function falhaVenda(motivo) {
  return { ok: false, motivo };
}

function restam(n) {
  return n === 1 ? 'Só resta 1 unidade' : `Só restam ${n} unidades`;
}

function fmtCentavos(centavos) {
  return `R$ ${(centavos / 100).toFixed(2).replace('.', ',')}`;
}

function lerPreco(texto) {
  const limpo = String(texto || '').replace(/R\$|\s/g, '').replace(/\./g, '').replace(',', '.');
  if (!limpo) return NaN;
  const valor = Number(limpo);
  return Number.isFinite(valor) ? Math.round(valor * 100) : NaN;
}

function pessoaDaUnidade(estado, unidade) {
  return estado.pessoas.find((p) => p.unidade === unidade);
}

function nomeVizinho(estado, unidade) {
  const p = pessoaDaUnidade(estado, unidade);
  return p ? p.nome : `Apto ${unidade}`;
}

function anuncioPorId(estado, id) {
  return estado.anuncios.find((a) => a.id === id);
}

function podePublicar(estado, unidade) {
  const p = pessoaDaUnidade(estado, unidade);
  return p && p.vendedor === 'aprovado' ? VENDA_OK : falhaVenda('Só vendedores aprovados pelo síndico podem anunciar');
}

function anuncioVisivel(estado, anuncio) {
  const p = pessoaDaUnidade(estado, anuncio.vendedor);
  return anuncio.ativo && !anuncio.oculto && !!p && p.vendedor === 'aprovado';
}

function anunciosVisiveis(estado) {
  return estado.anuncios.filter((a) => anuncioVisivel(estado, a)).sort((a, b) => b.criadoEm.localeCompare(a.criadoEm));
}

function quantidadeNaSacola(estado, anuncioId) {
  const item = estado.sacola.find((i) => i.anuncioId === anuncioId);
  return item ? item.quantidade : 0;
}

function podeAdicionar(estado, unidade, anuncioId, quantidade) {
  const a = anuncioPorId(estado, anuncioId);
  if (!a || !anuncioVisivel(estado, a)) return falhaVenda('Anúncio indisponível');
  if (a.vendedor === unidade) return falhaVenda('Você não pode comprar o próprio anúncio');
  if (!Number.isInteger(quantidade) || quantidade < 1) return falhaVenda('Escolha ao menos 1 unidade');
  if (a.quantidade === 0) return falhaVenda('Produto esgotado');
  if (quantidadeNaSacola(estado, anuncioId) + quantidade > a.quantidade) return falhaVenda(restam(a.quantidade));
  return VENDA_OK;
}

function intersecao(listas) {
  return listas.reduce((acc, lista) => acc.filter((x) => lista.includes(x)));
}

function sacolaPorVendedor(estado) {
  const grupos = [];
  for (const item of estado.sacola) {
    const anuncio = anuncioPorId(estado, item.anuncioId);
    if (!anuncio) continue;
    let grupo = grupos.find((g) => g.vendedor === anuncio.vendedor);
    if (!grupo) {
      grupo = { vendedor: anuncio.vendedor, nome: nomeVizinho(estado, anuncio.vendedor), itens: [], subtotal: 0 };
      grupos.push(grupo);
    }
    grupo.itens.push({ anuncio, quantidade: item.quantidade, subtotal: anuncio.preco * item.quantidade });
    grupo.subtotal += anuncio.preco * item.quantidade;
  }
  return grupos.map((g) => ({ ...g, pagamentos: intersecao(g.itens.map((i) => i.anuncio.pagamentos)), entregas: intersecao(g.itens.map((i) => i.anuncio.entregas)) }));
}

function validarAnuncio(dados) {
  const titulo = String(dados.titulo || '').trim();
  if (!titulo || !Number.isFinite(dados.preco) || !Number.isFinite(dados.quantidade)) return falhaVenda('Preencha título, preço e quantidade');
  if (dados.preco <= 0) return falhaVenda('Preço precisa ser maior que zero');
  if (!Number.isInteger(dados.quantidade) || dados.quantidade < 0) return falhaVenda('Quantidade precisa ser um número inteiro');
  if (!dados.pagamentos || !dados.pagamentos.length) return falhaVenda('Escolha ao menos uma forma de pagamento');
  if (!dados.entregas || !dados.entregas.length) return falhaVenda('Escolha ao menos uma forma de entrega');
  return VENDA_OK;
}

function acoesPedido(pedido, unidade) {
  const acoes = [];
  const encerrado = ['recusado', 'cancelado'].includes(pedido.status);
  if (unidade === pedido.vendedor) {
    if (pedido.status === 'novo') acoes.push('aceitar', 'recusar');
    if (pedido.status === 'aceito') acoes.push('entregar');
    if (!pedido.pago && !encerrado) acoes.push('pago');
  }
  if (unidade === pedido.comprador && pedido.status === 'novo') acoes.push('cancelar');
  if ((unidade === pedido.vendedor || unidade === pedido.comprador) && !encerrado) acoes.push('conversar');
  return acoes;
}

function totalPedido(pedido) {
  return pedido.itens.reduce((soma, i) => soma + i.preco * i.quantidade, 0);
}

function destinatariosOfertas(estado, vendedor) {
  return [...new Set(estado.pessoas.filter((p) => p.recebeOfertas && p.unidade !== vendedor).map((p) => p.unidade))];
}

function inicioPeriodo(periodo, hoje) {
  if (periodo === '7d') return somarDias(hoje, -6);
  if (periodo === '30d') return somarDias(hoje, -29);
  return `${hoje.slice(0, 7)}-01`;
}

function painelVendas(estado, vendedor, periodo, agora) {
  const hoje = isoDia(agora);
  const inicio = inicioPeriodo(periodo, hoje);
  const diaDe = (instante) => isoDia(new Date(instante));
  const doVendedor = estado.pedidos.filter((p) => p.vendedor === vendedor);
  const criados = doVendedor.filter((p) => diaDe(p.criadoEm) >= inicio && diaDe(p.criadoEm) <= hoje);
  const entregues = doVendedor.filter((p) => p.status === 'entregue' && p.entregueEm && diaDe(p.entregueEm) >= inicio && diaDe(p.entregueEm) <= hoje);
  const faturamento = entregues.reduce((soma, p) => soma + totalPedido(p), 0);
  const itens = entregues.reduce((soma, p) => soma + p.itens.reduce((t, i) => t + i.quantidade, 0), 0);
  const passo = periodo === '7d' ? 1 : 7;
  const barras = [];
  for (let dia = inicio; dia <= hoje; dia = somarDias(dia, passo)) {
    const fim = somarDias(dia, passo - 1);
    const valor = entregues.filter((p) => diaDe(p.entregueEm) >= dia && diaDe(p.entregueEm) <= fim).reduce((soma, p) => soma + totalPedido(p), 0);
    barras.push({ rotulo: dia, valor });
  }
  const porProduto = {};
  for (const p of entregues) for (const i of p.itens) porProduto[i.titulo] = (porProduto[i.titulo] || 0) + i.quantidade;
  const maisVendidos = Object.entries(porProduto).map(([titulo, quantidade]) => ({ titulo, quantidade })).sort((a, b) => b.quantidade - a.quantidade).slice(0, 3);
  return {
    pedidos: criados.length,
    faturamento,
    entregues: entregues.length,
    ticket: entregues.length ? Math.round(faturamento / entregues.length) : 0,
    itens,
    barras,
    maisVendidos,
    situacao: {
      entregues: criados.filter((p) => p.status === 'entregue').length,
      andamento: criados.filter((p) => ['novo', 'aceito'].includes(p.status)).length,
      recusados: criados.filter((p) => p.status === 'recusado').length,
      cancelados: criados.filter((p) => p.status === 'cancelado').length,
    },
  };
}

// Cada ação devolve { estado, notificacao?, erro?, id? } sem mutar nada.
function erroVenda(estado, mensagem) {
  return { estado, erro: mensagem };
}

function mudarPessoa(estado, unidade, mudanca) {
  return { ...estado, pessoas: estado.pessoas.map((p) => (p.unidade === unidade ? { ...p, ...mudanca } : p)) };
}

function mudarAnuncio(estado, id, mudanca) {
  return { ...estado, anuncios: estado.anuncios.map((a) => (a.id === id ? { ...a, ...mudanca } : a)) };
}

function mudarPedido(estado, id, mudanca) {
  return { ...estado, pedidos: estado.pedidos.map((p) => (p.id === id ? { ...p, ...mudanca } : p)) };
}

function moverEstoque(anuncios, itens, sinal) {
  return anuncios.map((a) => {
    const quantidade = itens.filter((i) => i.anuncioId === a.id).reduce((soma, i) => soma + i.quantidade, 0);
    return quantidade ? { ...a, quantidade: a.quantidade + sinal * quantidade } : a;
  });
}

function textoLimpo(texto) {
  return String(texto || '').trim();
}

function trocarMorador(estado, unidade) {
  const disponivel = estado.origem === 'novo' ? estado.pessoas.some((p) => p.unidade === unidade && p.situacao === 'ativo') : MORADORES_DEMO.some(([u]) => u === unidade);
  if (!disponivel) return erroVenda(estado, 'Morador indisponível na demonstração');
  return { estado: { ...estado, moradorAtual: unidade, sacola: [] } };
}

function alternarOfertas(estado, unidade) {
  const p = pessoaDaUnidade(estado, unidade);
  if (!p) return erroVenda(estado, 'Morador não encontrado');
  return { estado: mudarPessoa(estado, unidade, { recebeOfertas: !p.recebeOfertas }) };
}

function pedirParaVender(estado, unidade, texto, agora) {
  const p = pessoaDaUnidade(estado, unidade);
  if (!p || p.vendedor !== 'nao') return erroVenda(estado, 'Já existe um pedido para vender');
  const descricao = textoLimpo(texto);
  if (!descricao) return erroVenda(estado, 'Conte o que você pretende vender');
  return {
    estado: mudarPessoa(estado, unidade, { vendedor: 'pendente', pedidoVenda: { texto: descricao, em: agora.toISOString() }, motivoVendedor: null }),
    notificacao: { canal: 'Push', para: SINDICO, texto: `${p.nome} (apto ${unidade}) pediu para vender: ${descricao}` },
  };
}

function aprovarVendedor(estado, unidade) {
  const p = pessoaDaUnidade(estado, unidade);
  if (!p || p.vendedor !== 'pendente') return erroVenda(estado, 'Solicitação não está pendente');
  return {
    estado: mudarPessoa(estado, unidade, { vendedor: 'aprovado', motivoVendedor: null }),
    notificacao: { canal: 'WhatsApp', para: p.nome, texto: 'Seu pedido para vender foi aprovado pelo síndico. Você já pode anunciar.' },
  };
}

function recusarVendedor(estado, unidade, motivo) {
  const p = pessoaDaUnidade(estado, unidade);
  if (!p || p.vendedor !== 'pendente') return erroVenda(estado, 'Solicitação não está pendente');
  const texto = textoLimpo(motivo);
  if (!texto) return erroVenda(estado, 'Informe o motivo da recusa');
  return {
    estado: mudarPessoa(estado, unidade, { vendedor: 'nao', motivoVendedor: texto }),
    notificacao: { canal: 'WhatsApp', para: p.nome, texto: `Seu pedido para vender foi recusado: ${texto}` },
  };
}

function suspenderVendedor(estado, unidade, motivo) {
  const p = pessoaDaUnidade(estado, unidade);
  if (!p || p.vendedor !== 'aprovado') return erroVenda(estado, 'Vendedor não está ativo');
  const texto = textoLimpo(motivo);
  if (!texto) return erroVenda(estado, 'Informe o motivo da suspensão');
  return {
    estado: mudarPessoa(estado, unidade, { vendedor: 'suspenso', motivoVendedor: texto }),
    notificacao: { canal: 'WhatsApp', para: p.nome, texto: `Suas vendas foram suspensas pelo síndico: ${texto}` },
  };
}

function reativarVendedor(estado, unidade) {
  const p = pessoaDaUnidade(estado, unidade);
  if (!p || p.vendedor !== 'suspenso') return erroVenda(estado, 'Vendedor não está suspenso');
  return {
    estado: mudarPessoa(estado, unidade, { vendedor: 'aprovado', motivoVendedor: null }),
    notificacao: { canal: 'WhatsApp', para: p.nome, texto: 'Suas vendas foram reativadas pelo síndico.' },
  };
}

function publicarAnuncio(estado, unidade, dados, agora) {
  const pode = podePublicar(estado, unidade);
  if (!pode.ok) return erroVenda(estado, pode.motivo);
  const v = validarAnuncio(dados);
  if (!v.ok) return erroVenda(estado, v.motivo);
  const anuncio = { id: `a${estado.anuncios.length + 1}`, vendedor: unidade, titulo: textoLimpo(dados.titulo), descricao: textoLimpo(dados.descricao), categoria: dados.categoria || 'desapego', preco: dados.preco, quantidade: dados.quantidade, pagamentos: [...dados.pagamentos], entregas: [...dados.entregas], ativo: true, oculto: false, motivoOculto: null, criadoEm: agora.toISOString() };
  const destinatarios = destinatariosOfertas(estado, unidade);
  return {
    estado: { ...estado, anuncios: [...estado.anuncios, anuncio] },
    id: anuncio.id,
    notificacao: destinatarios.length ? { canal: 'Push', para: `${destinatarios.length} moradores que aceitam ofertas`, texto: `Novo na vitrine: ${anuncio.titulo}` } : undefined,
  };
}

function editarAnuncio(estado, unidade, id, mudanca) {
  const a = anuncioPorId(estado, id);
  if (!a) return erroVenda(estado, 'Anúncio não encontrado');
  if (a.vendedor !== unidade) return erroVenda(estado, 'Só o vendedor pode editar o anúncio');
  const v = validarAnuncio({ ...a, ...mudanca });
  if (!v.ok) return erroVenda(estado, v.motivo);
  return { estado: mudarAnuncio(estado, id, mudanca) };
}

function ocultarAnuncio(estado, id, motivo) {
  const a = anuncioPorId(estado, id);
  if (!a) return erroVenda(estado, 'Anúncio não encontrado');
  const texto = textoLimpo(motivo);
  if (!texto) return erroVenda(estado, 'Informe o motivo');
  return {
    estado: mudarAnuncio(estado, id, { oculto: true, motivoOculto: texto }),
    notificacao: { canal: 'WhatsApp', para: nomeVizinho(estado, a.vendedor), texto: `Seu anúncio "${a.titulo}" foi ocultado pelo síndico: ${texto}` },
  };
}

function mostrarAnuncio(estado, id) {
  if (!anuncioPorId(estado, id)) return erroVenda(estado, 'Anúncio não encontrado');
  return { estado: mudarAnuncio(estado, id, { oculto: false, motivoOculto: null }) };
}

function adicionarASacola(estado, anuncioId, quantidade) {
  const v = podeAdicionar(estado, estado.moradorAtual, anuncioId, quantidade);
  if (!v.ok) return erroVenda(estado, v.motivo);
  const existe = estado.sacola.some((i) => i.anuncioId === anuncioId);
  const sacola = existe
    ? estado.sacola.map((i) => (i.anuncioId === anuncioId ? { ...i, quantidade: i.quantidade + quantidade } : i))
    : [...estado.sacola, { anuncioId, quantidade }];
  return { estado: { ...estado, sacola } };
}

function removerDaSacola(estado, anuncioId) {
  return { estado: { ...estado, sacola: estado.sacola.filter((i) => i.anuncioId !== anuncioId) } };
}

function fecharPedido(estado, escolhas, agora) {
  const grupos = sacolaPorVendedor(estado);
  if (!grupos.length) return erroVenda(estado, 'Sua sacola está vazia');
  const comprador = estado.moradorAtual;
  for (const g of grupos) {
    const escolha = escolhas[g.vendedor] || {};
    if (!g.pagamentos.includes(escolha.pagamento)) return erroVenda(estado, 'Escolha a forma de pagamento');
    if (!g.entregas.includes(escolha.entrega)) return erroVenda(estado, 'Escolha a forma de entrega');
    for (const item of g.itens) {
      const v = podeAdicionar({ ...estado, sacola: [] }, comprador, item.anuncio.id, item.quantidade);
      if (!v.ok) return erroVenda(estado, `${item.anuncio.titulo}: ${v.motivo}`);
    }
  }
  const em = agora.toISOString();
  const novos = grupos.map((g, n) => ({
    id: `PD-${String(estado.proximoPedido + n).padStart(3, '0')}`,
    comprador,
    vendedor: g.vendedor,
    itens: g.itens.map((i) => ({ anuncioId: i.anuncio.id, titulo: i.anuncio.titulo, quantidade: i.quantidade, preco: i.anuncio.preco })),
    pagamento: escolhas[g.vendedor].pagamento,
    entrega: escolhas[g.vendedor].entrega,
    status: 'novo',
    pago: false,
    motivo: null,
    linha: [{ em, status: 'novo', texto: 'Pedido enviado' }],
    mensagens: [],
    criadoEm: em,
    entregueEm: null,
  }));
  const extras = novos.length - 1;
  const complemento = extras ? ` (e mais ${extras} pedido${extras > 1 ? 's' : ''} para outros vendedores)` : '';
  return {
    estado: { ...estado, anuncios: moverEstoque(estado.anuncios, novos.flatMap((p) => p.itens), -1), pedidos: [...estado.pedidos, ...novos], sacola: [], proximoPedido: estado.proximoPedido + novos.length },
    id: novos[0].id,
    ids: novos.map((p) => p.id),
    notificacao: { canal: 'WhatsApp', para: nomeVizinho(estado, novos[0].vendedor), texto: `Novo pedido ${novos[0].id} de ${nomeVizinho(estado, comprador)} (apto ${comprador})${complemento}` },
  };
}

function pedidoPermitido(estado, id, unidade, acao) {
  const pedido = estado.pedidos.find((p) => p.id === id);
  if (!pedido) return { erro: 'Pedido não encontrado' };
  if (!acoesPedido(pedido, unidade).includes(acao)) return { erro: 'Ação não permitida para este pedido' };
  return { pedido };
}

function comLinha(pedido, agora, status, texto) {
  return [...pedido.linha, { em: agora.toISOString(), status, texto }];
}

function aceitarPedido(estado, id, unidade, agora) {
  const { pedido, erro } = pedidoPermitido(estado, id, unidade, 'aceitar');
  if (erro) return erroVenda(estado, erro);
  return {
    estado: mudarPedido(estado, id, { status: 'aceito', linha: comLinha(pedido, agora, 'aceito', 'Pedido aceito pelo vendedor') }),
    notificacao: { canal: 'Push', para: nomeVizinho(estado, pedido.comprador), texto: `Pedido ${id} aceito por ${nomeVizinho(estado, pedido.vendedor)}` },
  };
}

function recusarPedido(estado, id, unidade, motivo, agora) {
  const { pedido, erro } = pedidoPermitido(estado, id, unidade, 'recusar');
  if (erro) return erroVenda(estado, erro);
  const texto = textoLimpo(motivo);
  if (!texto) return erroVenda(estado, 'Informe o motivo da recusa');
  const atualizado = mudarPedido(estado, id, { status: 'recusado', motivo: texto, linha: comLinha(pedido, agora, 'recusado', `Recusado: ${texto}`) });
  return {
    estado: { ...atualizado, anuncios: moverEstoque(estado.anuncios, pedido.itens, 1) },
    notificacao: { canal: 'Push', para: nomeVizinho(estado, pedido.comprador), texto: `Pedido ${id} recusado: ${texto}` },
  };
}

function marcarEntregue(estado, id, unidade, agora) {
  const { pedido, erro } = pedidoPermitido(estado, id, unidade, 'entregar');
  if (erro) return erroVenda(estado, erro);
  return {
    estado: mudarPedido(estado, id, { status: 'entregue', entregueEm: agora.toISOString(), linha: comLinha(pedido, agora, 'entregue', 'Pedido entregue') }),
    notificacao: { canal: 'Push', para: nomeVizinho(estado, pedido.comprador), texto: `Pedido ${id} marcado como entregue` },
  };
}

function marcarPago(estado, id, unidade, agora) {
  const { pedido, erro } = pedidoPermitido(estado, id, unidade, 'pago');
  if (erro) return erroVenda(estado, erro);
  return {
    estado: mudarPedido(estado, id, { pago: true, linha: comLinha(pedido, agora, null, 'Pagamento confirmado pelo vendedor') }),
    notificacao: { canal: 'Push', para: nomeVizinho(estado, pedido.comprador), texto: `Pagamento do pedido ${id} confirmado` },
  };
}

function cancelarPedido(estado, id, unidade, agora) {
  const { pedido, erro } = pedidoPermitido(estado, id, unidade, 'cancelar');
  if (erro) return erroVenda(estado, erro);
  const atualizado = mudarPedido(estado, id, { status: 'cancelado', linha: comLinha(pedido, agora, 'cancelado', 'Cancelado pelo comprador') });
  return {
    estado: { ...atualizado, anuncios: moverEstoque(estado.anuncios, pedido.itens, 1) },
    notificacao: { canal: 'Push', para: nomeVizinho(estado, pedido.vendedor), texto: `Pedido ${id} cancelado pelo comprador` },
  };
}

function enviarMensagem(estado, id, unidade, texto, agora) {
  const { pedido, erro } = pedidoPermitido(estado, id, unidade, 'conversar');
  if (erro) return erroVenda(estado, erro);
  const mensagem = textoLimpo(texto);
  if (!mensagem) return erroVenda(estado, 'Escreva a mensagem');
  const outro = unidade === pedido.vendedor ? pedido.comprador : pedido.vendedor;
  return {
    estado: mudarPedido(estado, id, { mensagens: [...pedido.mensagens, { autor: unidade, texto: mensagem, em: agora.toISOString() }] }),
    notificacao: { canal: 'Push', para: nomeVizinho(estado, outro), texto: `${nomeVizinho(estado, unidade)}: ${mensagem}` },
  };
}

// Manual do Sr. Abel: base de conhecimento do assistente. Fonte: docs/sr-abel/manual-sr-abel.md.
// Mantenha os dois iguais (o teste 'assistente: manual tem as seções' confere o essencial).
const MANUAL_ABEL = `# Manual do Sr. Abel — assistente do CondoFácil

## 1. Quem é o Sr. Abel

O Sr. Abel é a abelhinha assistente do CondoFácil. Usa capacete amarelo e colete, como quem trabalha no prédio, e conhece o aplicativo de ponta a ponta.

**Jeito de falar**
- Português do Brasil, simpático, direto e paciente. Trata a pessoa por "você".
- Respostas curtas: 2 a 6 frases ou uma lista de passos numerados. Nada de textão.
- Pode usar um toque de humor de abelha ("vamos zum-zum resolver isso") no máximo uma vez por conversa. Emojis com moderação (🐝 de vez em quando).
- Sempre termina com um próximo passo claro: onde tocar no app, o que preencher, ou quem procurar.

**O que ele faz**
- Explica como usar cada parte do CondoFácil, conforme o perfil de quem pergunta (morador, síndico, portaria, zelador, conselho).
- Consulta os dados da própria pessoa que o app permite ver (encomendas, reservas, cobranças, chamados).
- Ajuda a executar ações simples, sempre pedindo confirmação antes: abrir uma ocorrência, solicitar uma reserva, gerar a 2ª via.
- Explica regras do condomínio que estão no regimento interno e na convenção, citando o documento.

**O que ele NÃO faz (limites)**
- Não decide nada pelo síndico: aprovação de reserva, multa, acordo, aprovação de vendedor, desconto. Explica o caminho e encaminha.
- Nunca mostra dados de outros moradores: nome de quem reservou, quem deve, quem abriu ocorrência anônima, pedidos e conversas de outros vendedores. Responde: "Essa informação é privada, mas posso te ajudar com…".
- Não dá parecer jurídico nem contábil definitivo. Pode citar a regra do app (por exemplo, multa de 2% do Código Civil) e sugerir falar com o síndico ou a administradora.
- Não fala de assuntos fora do condomínio e do app. Redireciona com gentileza.
- Não inventa: se a informação não está no manual nem nos dados, diz que não sabe e indica quem sabe (síndico, portaria ou suporte comercial@condofacil.cloud).
- Em emergência (incêndio, gás, alguém ferido, crime em andamento), primeiro orienta ligar 193 (Bombeiros), 192 (SAMU) ou 190 (Polícia) e avisar a portaria. Depois oferece abrir a ocorrência.

## 2. Perfis do app

| Perfil | Onde usa | O que vê |
|---|---|---|
| Morador | Celular | Início, Financeiro, Reservas, Ocorrências, Vendas e Mais (Avisos, Documentos, Encomendas, Enquetes) |
| Síndico | Computador | Início com dashboard financeiro, Cobrança, Financeiro, Reservas, Comunicados, Ocorrências, Documentos, Encomendas, Escala, Enquetes, Vendas (moderação) |
| Portaria | Tablet | Registrar encomenda, Entregar encomenda, Reservas de hoje, Escala |
| Zelador | Celular | Ordens de serviço (OS), Compras, Caixa pequeno. Não vê receitas, inadimplência nem saldo |
| Conselho | Computador | Prestação de contas (revisar e aprovar) e Documentos, inclusive balancetes |

Proprietário que não mora no prédio (responsável financeiro) acessa o Financeiro da unidade dele.

## 3. Reservas de áreas comuns

**Como reservar (morador):** Reservas → escolha a área → escolha o dia no calendário → escolha período ou hora → confira o resumo com a taxa → aceite o termo de responsabilidade → (opcional) lista de convidados com nome e documento → Solicitar.

**Cores do calendário:** livre, reservado, pendente (aguardando o síndico, já trava o horário) e bloqueado (manutenção). O calendário não mostra qual unidade reservou.

**Áreas do Residencial Ipê Amarelo (exemplo):**

| Área | Como reserva | Taxa | Aprovação | Antecedência | Limite |
|---|---|---|---|---|---|
| Salão de festas | Período: tarde 13–18h ou noite 18–23h | R$ 150 | Síndico aprova | 2 a 60 dias | 2 por mês por unidade |
| Churrasqueira | Período: tarde ou noite | R$ 50 | Automática | 1 a 60 dias | 2 por mês |
| Quadra | Por hora, 8h–22h | grátis | Automática | 0 a 15 dias | 4 por mês |
| Academia | Por hora, 6h–23h | grátis | Automática | 0 a 7 dias | sem limite |

- Reservar o salão bloqueia a churrasqueira no mesmo período (são vinculados).
- Aprovação automática: a reserva já sai confirmada. Manual: fica pendente até o síndico aprovar ou recusar (a recusa sempre tem motivo).
- A taxa da reserva entra como item avulso no próximo boleto do condomínio.
- **Cancelamento:** Reservas → Minhas reservas → Cancelar. Com menos de 72 h do início, o app avisa que pode haver multa ou retenção da taxa, conforme o regimento.
- A portaria vê as reservas do dia com a lista de convidados.

**Mensagens comuns:** "Horário já reservado" · "Limite de 2 reservas/mês atingido para esta área" · "Reserve com pelo menos 2 dias de antecedência".

## 4. Avisos (comunicados)

- Morador: Início (cartão de avisos) ou Mais → Avisos. Abra o aviso e toque em "Li e estou ciente". Pode reagir com "útil" ou "dúvida".
- Síndico: Comunicados → Novo comunicado. Há modelos por tipo (manutenção, assembleia, evento, aviso geral, urgente), público (todos, um andar ou unidades), anexo, canais (push, e-mail, WhatsApp; SMS fica obrigatório no urgente) e opção de fixar. O síndico vê quem leu e quem não leu.

## 5. Ocorrências (notificações ao condomínio)

**Abrir (morador):** Ocorrências → Abrir → tipo (Manutenção, Irregularidade ou Sugestão/elogio) → categoria → descrição → foto → local → marque "anônima" e/ou "pública" se quiser → Enviar. Você recebe um protocolo (ex.: OC-0043).

- **Anônima:** o síndico não vê quem abriu.
- **Pública:** outros moradores podem ver e tocar em "eu também" (bom para problemas coletivos, como elevador parado).
- Acompanhe pela linha do tempo. Quando for resolvida, avalie de 1 a 5 estrelas.
- Ocorrência nunca é apagada; fechada, só pode ser arquivada.

**Categorias e prioridade padrão:**
- Manutenção: Vazamento (urgente); Elétrica/iluminação, Elevador, Portão/garagem (alta); Interfone, Limpeza, Piscina, Outros (normal); Jardim (baixa).
- Irregularidade: Segurança (alta); Barulho, Vaga ocupada, Lixo fora do lugar, Pet, Obra fora do horário, Uso indevido de área comum (normal).
- Outro: Sugestão, Elogio (baixa).

**Prazos (plano Intermediário ou superior):**

| Prioridade | 1ª resposta do síndico | Solução |
|---|---|---|
| Urgente | 1 h | 24 h |
| Alta | 4 h | 72 h |
| Normal | 24 h | 7 dias |
| Baixa | 72 h | sem prazo |

Status: aberta → em análise → em andamento → resolvida → fechada. O síndico pode pedir mais informações, comentar ou gerar uma OS para o zelador.

## 6. Encomendas

- A portaria registra (lendo a etiqueta ou digitando a unidade, transportadora e foto). O morador recebe aviso no app/WhatsApp.
- **Retirar (morador):** Início ou Mais → Encomendas mostra o QR Code e o código de 6 dígitos. Apresente na portaria.
- **Entregar (portaria):** busque pelo código ou pela unidade, informe o nome de quem retirou e confirme. Fica registrado quem retirou, data e hora.
- Encomenda parada há mais de 3 dias aparece em destaque para o síndico, que pode reenviar o lembrete.

**Mensagens:** "Código inválido" · "Informe quem retirou" · "Unidade inexistente".

## 7. Documentos

Mais → Documentos. Pastas como Convenção, Regimento interno, Atas, Balancetes, Enquetes e Previsão orçamentária. Cada documento mostra a versão vigente e o histórico. Alguns são restritos (balancete detalhado: síndico e conselho). O síndico recebe alertas de vencimento de documentos (AVCB, seguro, limpeza da caixa d'água) com 60, 30 e 7 dias de antecedência.

## 8. Financeiro do morador (taxa condominial)

- **Onde:** aba Financeiro. Mostra a cobrança do mês, o que compõe o valor (ordinária, fundo de reserva, taxa extra, avulsos como taxa do salão, créditos), o histórico e o card "Mudanças na sua taxa" quando há reajuste.
- **Como pagar:** dentro do app, por boleto, Pix (QR Code e copia-e-cola) ou cartão. O pagamento é processado pelo Asaas, parceiro de pagamentos, e a baixa é automática.
- **2ª via:** Financeiro → toque na cobrança → 2ª via. Se estiver vencida, o valor já vem atualizado.
- **Atraso:** multa de 2% (limite do Código Civil, art. 1.336) + juros de 1% ao mês, proporcionais aos dias de atraso.
- **Vencimento padrão:** dia 10 (configurado pelo condomínio).
- **Régua de lembretes:** 5 dias antes, no vencimento e, conforme o plano, 1, 15, 30 e 60 dias depois do vencimento.
- Paguei por fora (transferência, dinheiro)? Envie o comprovante ao síndico; ele dá a baixa manual.
- Pagamento em duplicidade vira crédito no boleto seguinte.

**Exemplo (Residencial Ipê Amarelo, apto tipo A):** ordinária R$ 650,00 + fundo de reserva 10% R$ 65,00 + parcela da pintura da fachada R$ 150,00 = R$ 865,00. Cobertura: R$ 1.228,00.

## 9. Acordos de inadimplência

- Quem tem taxas vencidas pode negociar. O síndico monta a proposta (perdão de multa, parte dos juros, entrada e número de parcelas) e envia.
- O morador ou o responsável financeiro vê a proposta no Financeiro, lê o termo e aceita. As cobranças antigas são substituídas pelas parcelas do acordo ("Acordo AC-001 · parcela 2/4").
- Só o síndico cria e altera propostas. O Sr. Abel explica como pedir: falar com o síndico ou abrir uma ocorrência tipo Sugestão pedindo negociação.

## 10. Multas e advertências (com direito de defesa)

- O síndico abre um processo de infração (PI-001…) a partir de uma ocorrência de irregularidade, citando o artigo do regimento, o fato e, se for multa, o valor.
- O morador da unidade recebe a notificação e tem um prazo (ex.: 10 dias) para apresentar defesa no app, com texto e anexo.
- Depois da defesa ou do fim do prazo, o síndico decide: manter, converter em advertência ou cancelar, sempre com justificativa.
- Multa mantida entra no próximo boleto.
- O Sr. Abel ajuda o morador a encontrar o processo e a escrever uma defesa clara e educada, mas não promete resultado.

## 11. Enquetes

Decisões simples sem assembleia (horário da academia, cor da fachada). O síndico pergunta, os moradores respondem pelo app.

**Morador**
- **Onde:** cartão "Enquete · faltam N dias" no Início (some depois que você vota) ou Mais → Enquetes, com as abas Para responder, Respondidas e Encerradas.
- **Votar:** abra a enquete → escolha a opção (ou até N opções, se for múltipla escolha) → comentário opcional, se a enquete permitir → **Enviar voto**.
- **Um voto por unidade:** se alguém do apartamento já votou, aparece "Sua unidade já votou". Dá para trocar o voto até o encerramento (**Trocar o voto**).
- **Voto secreto (padrão):** o síndico vê só os totais e quais unidades já responderam, nunca o voto de cada uma. **Voto aberto:** o síndico vê o voto de cada unidade; a tela avisa antes de você votar.
- **Resultado:** aparece quando a enquete encerra. Se o síndico liberar, a parcial aparece logo depois do seu voto.

**Síndico**
- **Criar:** Enquetes → **Nova enquete**: pergunta, contexto, de 2 a 8 respostas (reordenáveis), prazo de 1 a 60 dias (encerra às 23h59), público (todos, um andar ou unidades escolhidas). Ao lado aparece a prévia de como o morador vê. **Salvar rascunho** ou **Publicar enquete** (aviso por app, e-mail e WhatsApp).
- **Painel:** participação (ex.: 14 de 32 unidades), prazo, gráfico da evolução das respostas por dia, votos por opção, comentários e unidades que ainda não responderam (marcando as sem app, que recebem por e-mail e WhatsApp).
- **Lembretes:** **Enviar lembrete agora** vai só para quem não respondeu, com os dias restantes ("Faltam 4 dias…" ou "Hoje é o último dia…"). No Intermediário há lembretes automáticos 3 dias antes e no último dia.
- **Encerrar e prorrogar:** **Encerrar agora** (pede confirmação) ou **Prorrogar** uma única vez. A enquete também encerra sozinha na data limite.
- **Resultado (Intermediário):** **Publicar resultado** gera um comunicado no mural e um documento em Documentos → Enquetes, com percentuais e participação, sem votos individuais.

**Por plano**
- Básico: escolha única, voto secreto, painel de participação e lembrete manual.
- Intermediário: + múltipla escolha, comentário, voto aberto ou secreto, parcial visível, lembretes automáticos e resultado publicado.
- Avançado: + peso por fração ideal e quórum mínimo. Abaixo do quórum, o resultado sai como "Sem quórum".

**Mensagens:** "Escolha só uma opção" · "Escolha até N opções" · "A enquete está encerrada" · "Sua unidade não faz parte do público desta enquete" · "Só é possível prorrogar uma vez".

O Sr. Abel nunca conta como outra unidade votou, nem em enquete de voto aberto. Também não vota pelo morador sem ele confirmar a opção.

## 12. Vendas entre moradores (feira do condomínio)

- **Comprar:** aba Vendas → Vitrine → escolha o produto e a quantidade → sacola → escolha forma de pagamento (Pix, dinheiro ou cartão na entrega, conforme o vendedor) e entrega (retirar no apartamento ou na porta) → Fechar pedido. Acompanhe em Meus pedidos e converse com o vendedor dentro do pedido.
- O pagamento é combinado direto com o vendedor. O app só registra o pedido e a marcação "pago". O CondoFácil não intermedeia o dinheiro dessas vendas.
- Cancelar: o comprador pode cancelar enquanto o pedido estiver "novo".
- **Quero vender:** Vendas → Minha loja → Quero vender → conte o que pretende vender → o síndico aprova. Aprovado, publique anúncios com título, preço, quantidade, formas de pagamento e entrega. O estoque baixa a cada pedido e volta se o pedido for recusado ou cancelado.
- **Painel do vendedor (Minha loja → Painel):** faturamento, pedidos, ticket médio, itens vendidos, mais vendidos, por 7 dias, 30 dias ou mês.
- **Privacidade:** pedidos, conversas e números de cada vendedor são só dele. O síndico aprova ou suspende vendedores e pode ocultar anúncios com motivo, mas não lê conversas nem pedidos.
- **Avisos de novidades:** ligue "Aceito receber ofertas" para ser avisado de anúncios novos (desligado por padrão).

**Mensagens:** "Você não pode comprar o próprio anúncio" · "Só restam N unidades" · "Escolha a forma de pagamento" · "Escolha a forma de entrega".

## 13. Zelador: OS, compras e caixa pequeno (plano Intermediário)

- **OS (ordem de serviço):** o síndico gera a partir de uma ocorrência, ou o zelador abre numa ronda. O zelador inicia, executa e conclui com foto do depois e horas gastas. A ocorrência ligada vira resolvida e o morador é avisado.
- **Compras:** o zelador pede (item, quantidade, valor), o síndico aprova, o zelador recebe com nota fiscal (obrigatória acima de R$ 200). A despesa entra automaticamente no financeiro. No Avançado, compras acima de um valor exigem cotações mínimas.
- **Caixa pequeno (Avançado):** gastos pequenos até R$ 200 com foto do cupom.

**Mensagens:** "Anexe a foto do depois" · "Informe as horas gastas" · "Anexe a nota fiscal (obrigatória acima de R$ 200,00)" · "Gasto acima de R$ 200,00: faça uma compra" · "Saldo do caixa pequeno insuficiente".

## 14. Escala de porteiros (plano Intermediário)

- Síndico: menu Escala, com calendário, pendências, equipe e horas. Modelos 12x36, 6x1 (8 h) e noturno 12x36. Gera o mês, mostra buracos de cobertura e feriados, e publica com aviso.
- Portaria: aba Escala mostra "de plantão agora", próximo turno, pedido de troca com colega, falta ou atestado (com sugestão de cobertura) e férias. Alerta de descanso mínimo de 11 h entre turnos.
- Avançado: check-in e check-out com foto e relatório de horas.

## 15. Gestão financeira do síndico

- **Início:** dashboard com saldo, arrecadação do mês, inadimplência, despesas × orçado e a lista "Precisa da sua atenção".
- **Cobrança:** prévia e emissão do mês, cobranças emitidas, régua, devedores, acordos, taxa e reajustes, orçamento e parâmetros. Unidade sem responsável financeiro fica bloqueada na emissão.
- **Taxas e reajustes:** reajuste com vigência futura, ata obrigatória e simulação antes de confirmar; ordinária fixa por tipo ou rateio por fração ideal; fundo de reserva; taxas extras (rateio igual ou por fração). Os moradores recebem comunicado e aviso individual.
- **Orçamento:** previsão anual por categoria com margem de inadimplência; calcula a taxa necessária, compara previsões e gera o documento para a AGO.
- **Financeiro:** contas a pagar (pagar lança a despesa e baixa o saldo; recorrentes geram a do mês seguinte), prestação de contas mensal (fechar o mês, enviar ao conselho, responder comentários, aprovar; mês aprovado fica travado), fluxo de caixa projetado de 90 dias (Avançado) e auditoria de tudo.
- A multa por atraso é limitada a 2%. Desconto de pontualidade exige a ata ou cláusula que o aprova.

## 16. Planos do CondoFácil

| Plano | Para quem | Destaques |
|---|---|---|
| Básico | Começar a organizar | Reservas, avisos, ocorrências, documentos, encomendas, vendas entre moradores, cobrança com boleto/Pix/cartão, régua básica (antes e no vencimento), enquetes simples |
| Intermediário (mais escolhido) | Gestão completa do dia a dia | Tudo do Básico + prazos nas ocorrências, zelador (OS e compras), escala de porteiros, acordos, multas com defesa, taxas extras e fração ideal, simulador de orçamento, contas a pagar, prestação de contas, régua completa, enquetes completas |
| Avançado | Prédios exigentes | Tudo do Intermediário + cotações mínimas, caixa pequeno, fluxo de caixa de 90 dias, aprovação do conselho, check-in de porteiros com foto, relatório de horas, peso e quórum nas enquetes, notificação formal em PDF |

Preço de referência (faixa de 31 a 70 unidades, plano Básico): implantação R$ 399,00 e R$ 9,90 por unidade ao mês. Intermediário = 1,5× e Avançado = 2,2× o Básico. Valores para confirmar com o comercial (comercial@condofacil.cloud).

Quando um recurso não está no plano do condomínio, o app mostra "Disponível no plano Intermediário" (ou Avançado). O Sr. Abel explica o recurso e diz que a contratação é decisão do síndico.

## 17. Privacidade (LGPD)

- Cada pessoa só vê o que o perfil dela permite. O Sr. Abel segue as mesmas regras.
- Ocorrência anônima: ninguém, nem o síndico, vê quem abriu.
- Inadimplência é vista só pelo síndico (e pelo conselho, de forma agregada na prestação de contas). Nunca é exposta a outros moradores.
- Documentos de convidados são usados só para a portaria liberar a entrada.
- Para corrigir ou excluir dados pessoais, fale com o síndico (controlador dos dados do condomínio) ou com comercial@condofacil.cloud.

## 18. Perguntas frequentes

- **Esqueci minha senha / não consigo entrar:** o acesso é por código enviado ao celular ou e-mail cadastrado. Se mudou de número, peça ao síndico para atualizar o cadastro.
- **Mudei de apartamento ou sou inquilino novo:** o síndico atualiza a unidade e o responsável financeiro.
- **O boleto está no nome do proprietário:** o responsável financeiro da unidade é quem o condomínio cadastrou (titular, inquilino ou proprietário). Peça ajuste ao síndico.
- **Posso reservar para outra pessoa?** A reserva é da unidade; quem reserva é responsável pelo uso.
- **Como falar com o síndico?** Abra uma ocorrência (tipo Sugestão para assuntos gerais) ou use o canal indicado nos Avisos.
- **O app funciona sem internet?** Precisa de internet para enviar e receber dados.`;
