const MESES_ABREV = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const ETAPAS_POR_PLANO = {
  basico: ['antes5', 'vencimento'],
  intermediario: ['antes5', 'vencimento', 'atraso1', 'atraso15', 'atraso60'],
  avancado: ETAPAS_REGUA.map((e) => e.id),
};

function milhar(n) {
  return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
}

function fmtReais(centavos) {
  const abs = Math.abs(centavos);
  return `${centavos < 0 ? '−' : ''}R$ ${milhar(Math.floor(abs / 100))},${String(abs % 100).padStart(2, '0')}`;
}

function fmtReaisCurto(centavos) {
  return `${centavos < 0 ? '−' : ''}R$ ${milhar(Math.round(Math.abs(centavos) / 100))}`;
}

function mesCurto(anoMes) {
  return MESES_ABREV[Number(anoMes.slice(5, 7)) - 1];
}

function mesExtenso(anoMes) {
  return nomeMes(anoMes).split(' de ')[0];
}

function rotuloCobranca(cobranca) {
  const a = cobranca.acordo;
  if (!a) return nomeMes(cobranca.competencia);
  return `Acordo ${a.id} · ${a.numero ? `parcela ${a.numero}/${a.de}` : 'entrada'}`;
}

function situacaoCobranca(cobranca, hoje) {
  if (cobranca.status !== 'aberta') return cobranca.status;
  return cobranca.vencimento < hoje ? 'vencida' : 'aberta';
}

function valorAtualizado(cobranca, parametros, hoje) {
  const dias = situacaoCobranca(cobranca, hoje) === 'vencida' ? diferencaDias(hoje, cobranca.vencimento) : 0;
  if (!dias) return { total: cobranca.valor, multa: 0, juros: 0, dias: 0 };
  const multa = Math.round((cobranca.valor * parametros.multaPct) / 100);
  const juros = Math.round((cobranca.valor * parametros.jurosPct * dias) / 3000);
  return { total: cobranca.valor + multa + juros, multa, juros, dias };
}

function validarParametros(p) {
  const falha = (motivo) => ({ ok: false, motivo });
  for (const dia of [p.diaVencimento, p.diaFechamento]) {
    if (!Number.isInteger(dia) || dia < 1 || dia > 28) return falha('Use um dia entre 1 e 28');
  }
  if (!(p.multaPct >= 0) || p.multaPct > 2) return falha('A multa por atraso é limitada a 2% (Código Civil, art. 1.336)');
  if (!(p.jurosPct >= 0)) return falha('Informe os juros ao mês');
  if (p.descontoPct > 0 && !String(p.descontoAprovadoEm || '').trim()) return falha('Informe a ata ou cláusula que aprova o desconto');
  if (!p.formas || !p.formas.length) return falha('Escolha ao menos uma forma de pagamento');
  return { ok: true };
}

function proximaCompetencia(financeiro) {
  return somarMes(financeiro.vigente, 1);
}

function vencimentoDa(financeiro, competencia) {
  return mesmoDiaDoMes(financeiro.vencimentoVigente, diferencaMeses(competencia, financeiro.vigente));
}

function previaCompetencia(estado, competencia) {
  const fin = estado.financeiro;
  const ajustes = fin.ajustesPrevia[competencia] || {};
  const linhas = estado.condominio.unidades.map((unidade) => {
    const { tipo, responsavel } = fin.unidades[unidade];
    const avulsos = fin.avulsos.filter((a) => a.unidade === unidade && a.competencia === competencia).map(({ tipo: t, descricao, valor }) => ({ tipo: t, descricao, valor }));
    const itens = ajustes[unidade] || [...itensBase(fin, unidade, competencia), ...avulsos];
    const bloqueada = !responsavel || !responsavel.documento;
    return { unidade, tipo, responsavel, itens, total: itens.reduce((soma, i) => soma + i.valor, 0), bloqueada, motivo: bloqueada ? 'Sem responsável financeiro' : null };
  });
  return { competencia, vencimento: vencimentoDa(fin, competencia), linhas };
}

function etapasNoPlano(plano) {
  return ETAPAS_POR_PLANO[plano];
}

function etapaRegua(cobranca, hoje) {
  if (cobranca.status !== 'aberta') return null;
  const dias = diferencaDias(hoje, cobranca.vencimento);
  const alcancadas = ETAPAS_REGUA.filter((e) => e.dias <= dias);
  return alcancadas.length ? alcancadas[alcancadas.length - 1] : null;
}

function pendentesDaRegua(estado, hoje, plano) {
  const permitidas = etapasNoPlano(plano);
  return estado.financeiro.cobrancas.flatMap((c) => {
    if (c.status !== 'aberta') return [];
    const dias = diferencaDias(hoje, c.vencimento);
    const candidatas = ETAPAS_REGUA.filter((e) => e.dias <= dias && permitidas.includes(e.id));
    const etapa = candidatas[candidatas.length - 1];
    return etapa && !c.regua.some((r) => r.etapa === etapa.id) ? [{ cobranca: c, etapa }] : [];
  });
}

function devedores(estado, hoje) {
  const fin = estado.financeiro;
  const grupos = {};
  for (const c of fin.cobrancas) {
    if (situacaoCobranca(c, hoje) !== 'vencida') continue;
    const v = valorAtualizado(c, fin.parametros, hoje);
    if (!grupos[c.unidade]) grupos[c.unidade] = { unidade: c.unidade, responsavel: fin.unidades[c.unidade].responsavel, cobrancas: 0, valor: 0, dias: 0, etapa: null, acordo: null };
    const g = grupos[c.unidade];
    g.cobrancas += 1;
    g.valor += v.total;
    if (v.dias > g.dias) {
      g.dias = v.dias;
      g.etapa = etapaRegua(c, hoje);
    }
  }
  for (const g of Object.values(grupos)) g.acordo = acordoDaUnidade(estado, g.unidade);
  return Object.values(grupos).sort((a, b) => b.dias - a.dias);
}

function indicadoresFinanceiros(estado, hoje) {
  const fin = estado.financeiro;
  const daCompetencia = (competencia) => fin.cobrancas.filter((c) => c.competencia === competencia && c.status !== 'cancelada' && !c.acordo);
  const vigentes = daCompetencia(fin.vigente);
  const previsto = vigentes.reduce((soma, c) => soma + c.valor, 0);
  const recebido = vigentes.filter((c) => c.status === 'paga').reduce((soma, c) => soma + c.valor, 0);
  const proxima = proximaCompetencia(fin);
  const daProxima = daCompetencia(proxima);
  const lista = devedores(estado, hoje);
  const totalUnidades = estado.condominio.unidades.length;
  const despesaMedia = fin.historico.length ? Math.round(fin.historico.reduce((soma, m) => soma + m.despesas, 0) / fin.historico.length) : 0;
  const despesas = Object.values(fin.despesasMes).reduce((soma, v) => soma + v, 0);
  const orcado = Object.values(fin.orcamento).reduce((soma, v) => soma + v, 0);
  const desvio = orcado ? Math.round(((despesas - orcado) / orcado) * 1000) / 10 : 0;
  const pct = previsto ? Math.round((recebido / previsto) * 100) : 0;
  const inadimplenciaPct = Math.round((lista.length / totalUnidades) * 1000) / 10;
  return {
    saldo: { valor: fin.saldo, despesaMedia, alerta: fin.saldo < despesaMedia },
    arrecadado: { competencia: fin.vigente, recebido, previsto, pct, alerta: previsto > 0 && pct < 85, proxima: fin.emitidas.includes(proxima) ? { competencia: proxima, pagas: daProxima.filter((c) => c.status === 'paga').length, total: daProxima.length } : null },
    inadimplencia: { unidades: lista.length, total: totalUnidades, pct: inadimplenciaPct, valor: lista.reduce((soma, d) => soma + d.valor, 0), alerta: inadimplenciaPct > 10 },
    despesas: { valor: despesas, orcado, desvio, alerta: desvio > 10 },
  };
}

function serieReceitasDespesas(estado, hoje) {
  const ind = indicadoresFinanceiros(estado, hoje);
  return [...estado.financeiro.historico, { mes: estado.financeiro.vigente, receitas: ind.arrecadado.recebido, despesas: ind.despesas.valor }];
}

function tituloSerie(serie) {
  if (serie.every((m) => !m.receitas && !m.despesas)) return 'Ainda sem receitas e despesas registradas';
  const acima = serie.filter((m) => m.despesas > m.receitas);
  if (!acima.length) return 'Receita cobriu a despesa em todos os meses';
  if (acima.length === 1) return `Despesa superou a receita só em ${mesExtenso(acima[0].mes)}`;
  return `Despesa superou a receita em ${acima.length} meses`;
}

function podeOperar(perfil) {
  return perfil === 'sindico';
}

// ---- src/cobranca/composicao.js ----

// Reajustes e taxas extras: montagem de uma nova versão, simulação do impacto e o que muda para cada unidade.
const NOMES_TIPO_UNIDADE = { A: 'Apto tipo A', cobertura: 'Cobertura' };
const NOMES_MODO = { fixo: 'Valor fixo por tipo', fracao: 'Rateio por fração ideal' };
const NOMES_RATEIO = { igual: 'Dividido igual entre as unidades', fracao: 'Por fração ideal' };
const MSG_ATA = 'Informe a ata ou data da assembleia';
const MSG_VALORES = 'Informe um percentual ou valores válidos';
const DIAS_AVISO_ENCERRADA = 60;

function primeiraNaoEmitida(fin) {
  // Sem nenhuma emissão (condomínio recém-implantado), a primeira competência é a seguinte à vigente.
  return somarMes([...fin.emitidas].sort().at(-1) || fin.vigente, 1);
}

function versaoAnterior(fin, vigencia) {
  return fin.composicao.versoes.filter((v) => v.vigencia < vigencia).sort((a, b) => a.vigencia.localeCompare(b.vigencia)).at(-1) || null;
}

function fmtFracao(fracao) {
  return `${(fracao * 100).toFixed(4).replace('.', ',')}%`;
}

function fmtVariacao(pct) {
  return `${pct >= 0 ? '+' : '−'}${Math.abs(pct).toFixed(1).replace('.', ',')}%`;
}

function unidadeModelo(fin, tipo) {
  return Object.keys(fin.unidades).find((u) => fin.unidades[u].tipo === tipo);
}

// Só os tipos que existem no condomínio (um prédio sem coberturas não mostra a linha da cobertura).
function tiposPresentes(fin) {
  return Object.keys(NOMES_TIPO_UNIDADE).filter((tipo) => unidadeModelo(fin, tipo));
}

// Versão que a nova substitui: a anterior, ou a própria vigente quando ainda não houve emissão (mesma competência).
function versaoBase(fin, vigencia) {
  return versaoAnterior(fin, vigencia) || versaoVigente(fin);
}

function montarVersao(fin, dados) {
  const minimo = primeiraNaoEmitida(fin);
  if (!dados.vigencia || dados.vigencia < minimo) return { erro: `A vigência deve ser a partir de ${nomeMes(minimo)}` };
  const base = versaoBase(fin, dados.vigencia);
  const modo = dados.modo || base.modo;
  const fundoPct = dados.fundoPct === undefined || dados.fundoPct === '' ? base.fundoPct : Number(dados.fundoPct);
  if (!Number.isFinite(fundoPct) || fundoPct < 0 || fundoPct > 30) return { erro: 'O fundo de reserva deve ser de 0% a 30%' };
  let ordinaria = null;
  let orcamento = null;
  if (dados.forma === 'percentual') {
    if (modo !== base.modo) return { erro: 'Ao trocar o modo, informe os valores' };
    const pct = String(dados.pct ?? '').trim() === '' ? NaN : Number(dados.pct);
    if (!Number.isFinite(pct) || pct < -50) return { erro: MSG_VALORES };
    const aplicar = (v) => Math.round(v * (1 + pct / 100));
    if (modo === 'fixo') ordinaria = { A: aplicar(base.ordinaria.A), cobertura: aplicar(base.ordinaria.cobertura) };
    else orcamento = aplicar(base.orcamento);
  } else if (modo === 'fixo') {
    const o = dados.ordinaria || {};
    const temCobertura = tiposPresentes(fin).includes('cobertura');
    if (!(o.A > 0 && (o.cobertura > 0 || !temCobertura))) return { erro: MSG_VALORES };
    ordinaria = { A: Math.round(o.A), cobertura: Math.round(temCobertura ? o.cobertura : o.A) };
  } else {
    if (!(dados.orcamento > 0)) return { erro: MSG_VALORES };
    orcamento = Math.round(dados.orcamento);
  }
  return { versao: { vigencia: dados.vigencia, modo, ordinaria, orcamento, fundoPct } };
}

function simularComposicao(fin, nova) {
  const antes = versaoBase(fin, nova.vigencia);
  const tipos = tiposPresentes(fin).map((tipo) => {
    const u = unidadeModelo(fin, tipo);
    const a = mensalDe(fin, antes, u);
    const d = mensalDe(fin, nova, u);
    return { tipo, antes: a, depois: d, diferenca: d - a, pct: a ? ((d - a) / a) * 100 : 0 };
  });
  const soma = (v) => Object.keys(fin.unidades).reduce((s, u) => s + mensalDe(fin, v, u), 0);
  return { tipos, arrecadacaoAntes: soma(antes), arrecadacaoDepois: soma(nova) };
}

function resumoVersao(fin, v) {
  const valores = tiposPresentes(fin).map((tipo) => `${NOMES_TIPO_UNIDADE[tipo]} ${fmtReais(ordinariaDe(fin, v, unidadeModelo(fin, tipo)))}`).join(' · ');
  return `${v.modo === 'fracao' ? `Orçamento ${fmtReais(v.orcamento)}/mês · ` : ''}${valores} · fundo ${v.fundoPct}%`;
}

function textoValoresVersao(fin, v) {
  return tiposPresentes(fin).map((tipo) => {
    const u = unidadeModelo(fin, tipo);
    return `${NOMES_TIPO_UNIDADE[tipo]}: ${fmtReais(mensalDe(fin, v, u))} por mês (taxa ordinária ${fmtReais(ordinariaDe(fin, v, u))} + fundo de reserva ${fmtReais(fundoDe(fin, v, u))})`;
  }).join('\n');
}

function valorPorTipoExtra(fin, extra) {
  return tiposPresentes(fin).map((tipo) => ({ tipo, valor: valorExtraDe(fin, extra, unidadeModelo(fin, tipo)) }));
}

function versoesAgendadas(fin) {
  const p = primeiraNaoEmitida(fin);
  // A primeira versão (implantação) não é reajuste: só conta a que tem uma versão anterior.
  return fin.composicao.versoes.filter((v) => v.vigencia >= p && versaoAnterior(fin, v.vigencia)).sort((a, b) => a.vigencia.localeCompare(b.vigencia));
}

function versaoVigente(fin) {
  // Antes da primeira emissão vale a primeira versão cadastrada (condomínio recém-implantado).
  return versaoEm(fin, somarMes(primeiraNaoEmitida(fin), -1)) || [...fin.composicao.versoes].sort((x, y) => x.vigencia.localeCompare(y.vigencia))[0];
}

function mudancasDaUnidade(estado, unidade, hoje) {
  const fin = estado.financeiro;
  const p = primeiraNaoEmitida(fin);
  const linhas = versoesAgendadas(fin).map((v) => {
    const antes = mensalDe(fin, versaoAnterior(fin, v.vigencia), unidade);
    const depois = mensalDe(fin, v, unidade);
    return { chave: v.id, titulo: 'Reajuste da taxa', texto: `A partir de ${nomeMes(v.vigencia)}: de ${fmtReais(antes)} para ${fmtReais(depois)} (${fmtVariacao(((depois - antes) / antes) * 100)})`, detalhe: `Aprovado em: ${v.aprovadoEm}` };
  });
  for (const x of fin.composicao.extras) {
    if (x.situacao === 'ativa' && fimExtra(x) >= p) {
      const fracao = x.rateio === 'fracao' ? ` (fração ${fmtFracao(fin.unidades[unidade].fracao)})` : '';
      linhas.push({ chave: x.id, titulo: 'Taxa extra', texto: `${x.descricao}: ${fmtReais(valorExtraDe(fin, x, unidade))} por mês em ${x.parcelas} parcelas, de ${nomeMes(x.inicio)} a ${nomeMes(fimExtra(x))}${fracao}`, detalhe: `Aprovado em: ${x.aprovadoEm}` });
    } else if (x.situacao === 'encerrada' && diferencaDias(hoje, x.encerradaEm.slice(0, 10)) <= DIAS_AVISO_ENCERRADA) {
      const texto = x.ultimaCompetencia ? `A taxa ${x.descricao} foi encerrada; a última parcela foi a de ${nomeMes(x.ultimaCompetencia)}` : `A taxa ${x.descricao} foi cancelada antes da primeira parcela`;
      linhas.push({ chave: x.id, titulo: 'Taxa extra encerrada', texto, detalhe: x.motivoEncerramento });
    }
  }
  return linhas;
}

function alertasComposicao(estado) {
  return versoesAgendadas(estado.financeiro).map((v) => ({ chave: `reajuste-${v.id}`, href: '#sindico.cobranca.taxas', texto: `Reajuste agendado para ${nomeMes(v.vigencia)} · confira a prévia antes de emitir` }));
}

// ---- src/cobranca/acoes.js ----

// Cada ação devolve { estado, notificacao?, erro? } sem mutar nada; ações financeiras entram na auditoria.
const SO_SINDICO = 'Somente o síndico pode fazer isso';

function erroCobranca(estado, mensagem) {
  return { estado, erro: mensagem };
}

function comFinanceiro(estado, mudanca) {
  return { ...estado, financeiro: { ...estado.financeiro, ...mudanca } };
}

function comAuditoria(estado, agora, acao, detalhe) {
  return [...estado.financeiro.auditoria, { em: agora.toISOString(), quem: nomeSindico(estado), acao, detalhe }];
}

function trocarCobranca(cobrancas, id, mudanca) {
  return cobrancas.map((c) => (c.id === id ? { ...c, ...mudanca } : c));
}

function nomeResponsavel(estado, unidade) {
  const r = estado.financeiro.unidades[unidade].responsavel;
  return r ? r.nome : `Apto ${unidade}`;
}

function nomeCurtoCobranca(cobranca) {
  return cobranca.acordo ? rotuloCobranca(cobranca) : mesExtenso(cobranca.competencia);
}

function comQuitacao(estado, cobranca) {
  if (!cobranca.acordo) return { estado, quitado: null };
  const id = cobranca.acordo.id;
  const fin = estado.financeiro;
  if (fin.cobrancas.some((c) => c.acordo && c.acordo.id === id && c.status === 'aberta')) return { estado, quitado: null };
  return { estado: comFinanceiro(estado, { acordos: fin.acordos.map((x) => (x.id === id && x.situacao === 'ativo' ? { ...x, situacao: 'quitado' } : x)) }), quitado: id };
}

function salvarParametros(estado, parametros, perfil, agora) {
  if (!podeOperar(perfil)) return erroCobranca(estado, SO_SINDICO);
  const v = validarParametros(parametros);
  if (!v.ok) return erroCobranca(estado, v.motivo);
  return {
    estado: comFinanceiro(estado, {
      parametros: { ...parametros, formas: [...parametros.formas] },
      auditoria: comAuditoria(estado, agora, 'Parâmetros alterados', `Multa ${parametros.multaPct}% · juros ${parametros.jurosPct}% a.m. · vencimento dia ${parametros.diaVencimento}`),
    }),
  };
}

function editarItemPrevia(estado, competencia, unidade, itens) {
  if (estado.financeiro.emitidas.includes(competencia)) return erroCobranca(estado, 'Competência já emitida');
  if (itens.some((i) => !String(i.descricao || '').trim() || !Number.isFinite(i.valor))) return erroCobranca(estado, 'Preencha descrição e valor de cada item');
  const daCompetencia = { ...(estado.financeiro.ajustesPrevia[competencia] || {}), [unidade]: itens.map(({ tipo, descricao, valor }) => ({ tipo, descricao: descricao.trim(), valor })) };
  return { estado: comFinanceiro(estado, { ajustesPrevia: { ...estado.financeiro.ajustesPrevia, [competencia]: daCompetencia } }) };
}

function emitirCompetencia(estado, competencia, perfil, agora) {
  if (!podeOperar(perfil)) return erroCobranca(estado, SO_SINDICO);
  const fin = estado.financeiro;
  if (fin.emitidas.includes(competencia)) return erroCobranca(estado, 'Competência já emitida');
  const previa = previaCompetencia(estado, competencia);
  const novas = previa.linhas.filter((l) => !l.bloqueada).map((l) => ({
    id: `CB-${competencia}-${l.unidade}`, unidade: l.unidade, competencia, vencimento: previa.vencimento, itens: l.itens, valor: l.total,
    status: 'aberta', pagaEm: null, valorPago: null, forma: null, baixaManual: null, eventosAsaas: [], regua: [], substituiu: null, acordo: null,
  }));
  const bloqueadas = previa.linhas.filter((l) => l.bloqueada).map((l) => l.unidade);
  return {
    estado: comFinanceiro(estado, {
      cobrancas: [...fin.cobrancas, ...novas],
      emitidas: [...fin.emitidas, competencia],
      auditoria: comAuditoria(estado, agora, 'Emissão em lote', `${mesExtenso(competencia)}: ${novas.length} cobranças${bloqueadas.length ? ` · não emitidas: ${bloqueadas.join(', ')}` : ''}`),
    }),
    emitidas: novas.length,
    notificacao: { canal: 'App + e-mail + WhatsApp', para: `${novas.length} responsáveis`, texto: `Cobranças de ${mesExtenso(competencia)} emitidas pelo Asaas: boleto, Pix e link de pagamento` },
  };
}

function confirmarPagamentoAsaas(estado, idCobranca, idEvento, forma, agora) {
  const fin = estado.financeiro;
  const c = fin.cobrancas.find((x) => x.id === idCobranca);
  if (!c) return erroCobranca(estado, 'Cobrança não encontrada');
  if (c.eventosAsaas.includes(idEvento)) return { estado };
  if (c.status !== 'aberta') return erroCobranca(estado, 'Cobrança não está em aberto');
  const { total } = valorAtualizado(c, fin.parametros, isoDia(agora));
  const pago = comFinanceiro(estado, {
    cobrancas: trocarCobranca(fin.cobrancas, idCobranca, { status: 'paga', pagaEm: agora.toISOString(), valorPago: total, forma, eventosAsaas: [...c.eventosAsaas, idEvento] }),
    saldo: fin.saldo + total,
  });
  const q = comQuitacao(pago, c);
  return {
    estado: q.estado,
    notificacao: { canal: 'Asaas', para: nomeResponsavel(estado, c.unidade), texto: `Pagamento recebido: ${fmtReais(total)} · recibo enviado${q.quitado ? ` · acordo ${q.quitado} quitado` : ''}` },
  };
}

function baixaManual(estado, idCobranca, { data, comprovante }, perfil, agora) {
  if (!podeOperar(perfil)) return erroCobranca(estado, SO_SINDICO);
  if (!String(comprovante || '').trim()) return erroCobranca(estado, 'Anexe o comprovante');
  const fin = estado.financeiro;
  const c = fin.cobrancas.find((x) => x.id === idCobranca);
  if (!c || c.status !== 'aberta') return erroCobranca(estado, 'Cobrança não está em aberto');
  const dia = data || isoDia(agora);
  const { total } = valorAtualizado(c, fin.parametros, dia);
  const pago = comFinanceiro(estado, {
    cobrancas: trocarCobranca(fin.cobrancas, idCobranca, { status: 'paga', pagaEm: agora.toISOString(), valorPago: total, forma: 'manual', baixaManual: { por: nomeSindico(estado), comprovante, em: dia } }),
    saldo: fin.saldo + total,
    auditoria: comAuditoria(estado, agora, 'Baixa manual', `Apto ${c.unidade} · ${nomeCurtoCobranca(c)} · ${fmtReais(total)} · ${comprovante}`),
  });
  const q = comQuitacao(pago, c);
  return {
    estado: q.estado,
    notificacao: { canal: 'App', para: nomeResponsavel(estado, c.unidade), texto: `Pagamento de ${nomeCurtoCobranca(c)} registrado pelo síndico${q.quitado ? ` · acordo ${q.quitado} quitado` : ''}` },
  };
}

function cancelarEReemitir(estado, idCobranca, perfil, agora) {
  if (!podeOperar(perfil)) return erroCobranca(estado, SO_SINDICO);
  const fin = estado.financeiro;
  const c = fin.cobrancas.find((x) => x.id === idCobranca);
  if (!c || c.status !== 'aberta') return erroCobranca(estado, 'Cobrança não está em aberto');
  const nova = { ...c, id: `${c.id}-R${fin.cobrancas.filter((x) => x.id.startsWith(`${c.id}-R`)).length + 1}`, status: 'aberta', regua: [], eventosAsaas: [], substituiu: c.id };
  return {
    estado: comFinanceiro(estado, {
      cobrancas: [...trocarCobranca(fin.cobrancas, idCobranca, { status: 'cancelada' }), nova],
      auditoria: comAuditoria(estado, agora, 'Cancelamento e reemissão', `${c.id} substituída por ${nova.id}`),
    }),
    id: nova.id,
    notificacao: { canal: 'App + e-mail', para: nomeResponsavel(estado, c.unidade), texto: `Nova cobrança de ${nomeCurtoCobranca(c)} enviada (a anterior foi cancelada)` },
  };
}

function enviarSegundaVia(estado, idCobranca, agora) {
  const fin = estado.financeiro;
  const c = fin.cobrancas.find((x) => x.id === idCobranca);
  if (!c || c.status !== 'aberta') return erroCobranca(estado, 'Cobrança não está em aberto');
  const { total } = valorAtualizado(c, fin.parametros, isoDia(agora));
  return { estado, notificacao: { canal: 'App + WhatsApp', para: nomeResponsavel(estado, c.unidade), texto: `2ª via de ${nomeCurtoCobranca(c)} com valor atualizado: ${fmtReais(total)}` } };
}

function executarRegua(estado, agora) {
  const pendentes = pendentesDaRegua(estado, isoDia(agora), estado.plano);
  if (!pendentes.length) return { estado, resumo: [] };
  const em = agora.toISOString();
  const cobrancas = estado.financeiro.cobrancas.map((c) => {
    const p = pendentes.find((x) => x.cobranca.id === c.id);
    return p ? { ...c, regua: [...c.regua, { etapa: p.etapa.id, em }] } : c;
  });
  const unidades = new Set(pendentes.map((p) => p.cobranca.unidade)).size;
  const etapas = [...new Set(pendentes.map((p) => p.etapa.nome))].join(', ');
  return {
    estado: comFinanceiro(estado, { cobrancas, auditoria: comAuditoria(estado, agora, 'Régua executada', `${pendentes.length} avisos para ${unidades} unidades`) }),
    resumo: pendentes.map((p) => ({ unidade: p.cobranca.unidade, competencia: p.cobranca.competencia, rotulo: rotuloCobranca(p.cobranca), etapa: p.etapa })),
    notificacao: { canal: 'Régua de cobrança', para: `${unidades} responsáveis`, texto: `${pendentes.length} avisos enviados: ${etapas}` },
  };
}

function trocarPlano(estado, plano) {
  if (!PLANOS.some((p) => p.id === plano)) return erroCobranca(estado, 'Plano inexistente');
  return { estado: { ...estado, plano } };
}

// ---- src/cobranca/acordos.js ----

// Acordos de inadimplência: o acordo junta débitos vencidos; cada entrada ou parcela vira uma cobrança comum marcada com o acordo.
const PARCELA_MINIMA = 5000;
const MAX_PARCELAS = 12;
const DIAS_ENTRADA = 3;

function falhaAcordo(motivo) {
  return { ok: false, motivo };
}

function planoInsuficiente(recurso) {
  return `Disponível no plano ${planoMinimo(recurso).nome}`;
}

function acordoComDebito(estado, idCobranca) {
  return estado.financeiro.acordos.find((a) => ['aguardando', 'ativo'].includes(a.situacao) && a.originais.includes(idCobranca));
}

function vencidasSemAcordo(estado, unidade, hoje) {
  return estado.financeiro.cobrancas.filter((c) => c.unidade === unidade && !c.acordo && situacaoCobranca(c, hoje) === 'vencida');
}

function debitosParaAcordo(estado, unidade, hoje) {
  return vencidasSemAcordo(estado, unidade, hoje).filter((c) => !acordoComDebito(estado, c.id)).sort((a, b) => b.vencimento.localeCompare(a.vencimento));
}

function cronogramaAcordo(financeiro, hoje, entrada, parcelas, valorParcela, ultimaParcela) {
  const vencimentoEntrada = somarDias(hoje, DIAS_ENTRADA);
  const dia = String(financeiro.parametros.diaVencimento).padStart(2, '0');
  const linhas = entrada ? [{ numero: 0, vencimento: vencimentoEntrada, valor: entrada }] : [];
  for (let k = 1; k <= parcelas; k++) linhas.push({ numero: k, vencimento: `${somarMes(vencimentoEntrada.slice(0, 7), k)}-${dia}`, valor: k === parcelas ? ultimaParcela : valorParcela });
  return linhas;
}

function simularAcordo(estado, dados, hoje) {
  const fin = estado.financeiro;
  const { unidade, originais = [], perdoaMulta = false, jurosPerdoadosPct = 0, entrada = 0, parcelas } = dados;
  const vencidas = vencidasSemAcordo(estado, unidade, hoje);
  if (!vencidas.length) return falhaAcordo('Esta unidade não tem débitos vencidos');
  if (!originais.length) return falhaAcordo('Escolha ao menos um débito');
  for (const id of originais) {
    const outro = acordoComDebito(estado, id);
    if (outro) return falhaAcordo(`Este débito já está no acordo ${outro.id}`);
  }
  const escolhidas = vencidas.filter((c) => originais.includes(c.id));
  if (escolhidas.length !== originais.length) return falhaAcordo('Escolha só débitos vencidos desta unidade');
  if (!Number.isFinite(jurosPerdoadosPct) || jurosPerdoadosPct < 0 || jurosPerdoadosPct > 100) return falhaAcordo('Informe um perdão de juros entre 0% e 100%');
  if (!Number.isInteger(parcelas) || parcelas < 1 || parcelas > MAX_PARCELAS) return falhaAcordo('Escolha de 1 a 12 parcelas');
  const valores = escolhidas.map((c) => valorAtualizado(c, fin.parametros, hoje));
  const valorOriginal = escolhidas.reduce((soma, c) => soma + c.valor, 0);
  const multa = valores.reduce((soma, v) => soma + v.multa, 0);
  const juros = valores.reduce((soma, v) => soma + v.juros, 0);
  const desconto = (perdoaMulta ? multa : 0) + Math.round((juros * jurosPerdoadosPct) / 100);
  const total = valorOriginal + multa + juros - desconto;
  if (!Number.isInteger(entrada) || entrada < 0 || entrada >= total) return falhaAcordo('A entrada precisa ser menor que o total do acordo');
  const valorParcela = Math.floor((total - entrada) / parcelas);
  if (valorParcela < PARCELA_MINIMA) return falhaAcordo('Cada parcela precisa ter no mínimo R$ 50,00');
  const ultimaParcela = total - entrada - valorParcela * (parcelas - 1);
  return { ok: true, valorOriginal, multa, juros, desconto, total, valorParcela, ultimaParcela, cronograma: cronogramaAcordo(fin, hoje, entrada, parcelas, valorParcela, ultimaParcela) };
}

function cronogramaDoAcordo(estado, acordo, hoje) {
  const ultima = acordo.total - acordo.entrada - acordo.valorParcela * (acordo.parcelas - 1);
  return cronogramaAcordo(estado.financeiro, hoje, acordo.entrada, acordo.parcelas, acordo.valorParcela, ultima);
}

function cobrancasDoAcordo(estado, id) {
  return estado.financeiro.cobrancas.filter((c) => c.acordo && c.acordo.id === id && c.status !== 'cancelada').sort((a, b) => a.acordo.numero - b.acordo.numero);
}

function progressoAcordo(estado, acordo) {
  const lista = cobrancasDoAcordo(estado, acordo.id);
  const parcelas = lista.filter((c) => c.acordo.numero > 0);
  return { pagas: parcelas.filter((c) => c.status === 'paga').length, total: acordo.parcelas, proxima: lista.find((c) => c.status === 'aberta') || null };
}

function propostaPendente(estado, unidade) {
  return estado.financeiro.acordos.find((a) => a.unidade === unidade && a.situacao === 'aguardando');
}

function acordoAtivo(estado, unidade) {
  return estado.financeiro.acordos.find((a) => a.unidade === unidade && a.situacao === 'ativo');
}

function acordoDaUnidade(estado, unidade) {
  if (acordoAtivo(estado, unidade)) return 'ativo';
  if (propostaPendente(estado, unidade)) return 'aguardando';
  return null;
}

function alertasAcordos(estado, hoje) {
  const fin = estado.financeiro;
  const itens = [];
  for (const a of fin.acordos) {
    if (a.situacao === 'ativo') {
      for (const c of cobrancasDoAcordo(estado, a.id).filter((x) => situacaoCobranca(x, hoje) === 'vencida')) {
        itens.push({ chave: `acordo-${c.id}`, texto: `Acordo ${a.id} (${a.unidade}): ${c.acordo.numero ? `parcela ${c.acordo.numero}` : 'entrada'} vencida`, href: `#sindico.cobranca.${a.id}` });
      }
    }
    if (a.situacao === 'aguardando') {
      const r = fin.unidades[a.unidade].responsavel;
      itens.push({ chave: `proposta-${a.id}`, texto: `Proposta ${a.id} aguarda aceite de ${r ? r.nome : `apto ${a.unidade}`}`, href: `#sindico.cobranca.${a.id}` });
    }
  }
  return itens;
}

function erroAcordo(estado, mensagem) {
  return { estado, erro: mensagem };
}

function cobrancaDoAcordo(acordo, linha) {
  const marca = { id: acordo.id, numero: linha.numero, de: acordo.parcelas };
  return {
    id: `${acordo.id}-${linha.numero ? `P${linha.numero}` : 'E'}`, unidade: acordo.unidade, competencia: linha.vencimento.slice(0, 7), vencimento: linha.vencimento,
    itens: [{ tipo: 'acordo', descricao: rotuloCobranca({ acordo: marca }), valor: linha.valor }], valor: linha.valor,
    status: 'aberta', pagaEm: null, valorPago: null, forma: null, baixaManual: null, eventosAsaas: [], regua: [], substituiu: null, acordo: marca,
  };
}

function proporAcordo(estado, dados, perfil, agora) {
  if (!podeOperar(perfil)) return erroAcordo(estado, SO_SINDICO);
  if (!liberado(estado.plano, 'acordos')) return erroAcordo(estado, planoInsuficiente('acordos'));
  const s = simularAcordo(estado, dados, isoDia(agora));
  if (!s.ok) return erroAcordo(estado, s.motivo);
  const fin = estado.financeiro;
  const id = `AC-${String(fin.acordos.length + 1).padStart(3, '0')}`;
  const entrada = dados.entrada || 0;
  const acordo = {
    id, unidade: dados.unidade, originais: [...dados.originais], valorOriginal: s.valorOriginal, multa: s.multa, juros: s.juros,
    perdoaMulta: !!dados.perdoaMulta, jurosPerdoadosPct: dados.jurosPerdoadosPct || 0, desconto: s.desconto, total: s.total,
    entrada, parcelas: dados.parcelas, valorParcela: s.valorParcela, situacao: 'aguardando',
    criadoEm: agora.toISOString(), criadoPor: nomeSindico(estado), aceitoEm: null, aceitoPor: null, termoLidoEm: null,
  };
  let auditoria = comAuditoria(estado, agora, 'Proposta de acordo', `${id} · apto ${dados.unidade} · ${fmtReais(s.total)} em ${entrada ? 'entrada + ' : ''}${dados.parcelas}x`);
  if (s.desconto) auditoria = [...auditoria, { em: agora.toISOString(), quem: nomeSindico(estado), acao: 'Desconto em acordo', detalhe: `${id} · ${fmtReais(s.desconto)} perdoados de multa e juros` }];
  const nome = nomeResponsavel(estado, dados.unidade);
  return {
    estado: comFinanceiro(estado, { acordos: [...fin.acordos, acordo], auditoria }),
    id,
    notificacao: { canal: 'App + e-mail + WhatsApp', para: nome, texto: `Proposta ${id} enviada a ${nome}` },
  };
}

function cancelarProposta(estado, id, perfil, agora) {
  if (!podeOperar(perfil)) return erroAcordo(estado, SO_SINDICO);
  const fin = estado.financeiro;
  const acordo = fin.acordos.find((a) => a.id === id);
  if (!acordo || acordo.situacao !== 'aguardando') return erroAcordo(estado, 'Só propostas aguardando aceite podem ser canceladas');
  return {
    estado: comFinanceiro(estado, {
      acordos: fin.acordos.map((a) => (a.id === id ? { ...a, situacao: 'cancelado' } : a)),
      auditoria: comAuditoria(estado, agora, 'Proposta cancelada', `${id} · apto ${acordo.unidade}`),
    }),
  };
}

function marcarTermoLido(estado, id, agora) {
  const fin = estado.financeiro;
  if (!fin.acordos.some((a) => a.id === id)) return erroAcordo(estado, 'Acordo não encontrado');
  return { estado: comFinanceiro(estado, { acordos: fin.acordos.map((a) => (a.id === id ? { ...a, termoLidoEm: a.termoLidoEm || agora.toISOString() } : a)) }) };
}

function aceitarAcordo(estado, id, { quem, ciente }, agora) {
  const fin = estado.financeiro;
  const acordo = fin.acordos.find((a) => a.id === id);
  if (!acordo || acordo.situacao !== 'aguardando') return erroAcordo(estado, 'Esta proposta não está aguardando aceite');
  if (!liberado(estado.plano, 'acordos')) return erroAcordo(estado, planoInsuficiente('acordos'));
  const responsavel = fin.unidades[acordo.unidade].responsavel;
  if (!responsavel || responsavel.nome !== quem) return erroAcordo(estado, 'Só o responsável financeiro pode aceitar o acordo');
  if (!ciente) return erroAcordo(estado, 'Marque que leu e aceita as condições');
  if (liberado(estado.plano, 'termoConfissao') && !acordo.termoLidoEm) return erroAcordo(estado, 'Leia o termo de confissão antes de aceitar');
  const cronograma = cronogramaDoAcordo(estado, acordo, isoDia(agora));
  const novas = cronograma.map((linha) => cobrancaDoAcordo(acordo, linha));
  const primeira = cronograma[0];
  return {
    estado: comFinanceiro(estado, {
      cobrancas: [...fin.cobrancas.map((c) => (acordo.originais.includes(c.id) ? { ...c, status: 'cancelada', substituidaPor: id } : c)), ...novas],
      acordos: fin.acordos.map((a) => (a.id === id ? { ...a, situacao: 'ativo', aceitoEm: agora.toISOString(), aceitoPor: quem } : a)),
      auditoria: [...fin.auditoria, { em: agora.toISOString(), quem, acao: 'Acordo aceito', detalhe: `${id} · apto ${acordo.unidade} · ${acordo.originais.length} débitos substituídos` }],
    }),
    notificacao: { canal: 'App', para: nomeSindico(estado), texto: `Acordo ${id} aceito. ${primeira.numero ? 'A parcela 1' : 'A entrada'} vence em ${fmtDataCurta(primeira.vencimento)}.` },
  };
}

// Acordo antigo da 304, gerado pelas próprias ações: proposto e aceito no dia 5 de dois meses atrás, entrada e parcela 1 pagas.
function comAcordoInicial(estado) {
  const fin = estado.financeiro;
  const dia = momento(`${somarMes(fin.vigente, -2)}-05`, 10);
  const originais = fin.cobrancas.filter((c) => c.unidade === '304' && c.status === 'aberta').map((c) => c.id);
  let e = proporAcordo(estado, { unidade: '304', originais, perdoaMulta: true, jurosPerdoadosPct: 0, entrada: 30000, parcelas: 4 }, 'sindico', dia).estado;
  e = aceitarAcordo(e, 'AC-001', { quem: 'Otávio Reis', ciente: true }, dia).estado;
  for (const id of ['AC-001-E', 'AC-001-P1']) {
    const c = e.financeiro.cobrancas.find((x) => x.id === id);
    e = confirmarPagamentoAsaas(e, id, `evt-${id}-pix`, 'pix', momento(somarDias(c.vencimento, -1), 11)).estado;
  }
  const p2 = e.financeiro.cobrancas.find((x) => x.id === 'AC-001-P2');
  const regua = [{ etapa: 'antes5', em: momento(somarDias(p2.vencimento, -5), 9).toISOString() }, { etapa: 'vencimento', em: momento(p2.vencimento, 9).toISOString() }];
  return comFinanceiro(e, { saldo: fin.saldo, cobrancas: e.financeiro.cobrancas.map((c) => (c.id === p2.id ? { ...c, regua } : c)) });
}

function identificadorCondominio(nome) {
  return String(nome || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'condominio';
}

function linkConvite(identificador) {
  return `https://${CONTATO_COMERCIAL.site}/c/${identificador}`;
}

function apenasDigitos(texto) {
  return String(texto || '').replace(/\D/g, '');
}

function validarCondominio(dados) {
  if (!String(dados.nome || '').trim()) return 'Informe o nome do condomínio';
  const cnpj = apenasDigitos(dados.cnpj);
  if (cnpj && cnpj.length !== 14) return 'O CNPJ deve ter 14 dígitos';
  const cep = apenasDigitos(dados.cep);
  if (cep && cep.length !== 8) return 'O CEP deve ter 8 dígitos';
  if (dados.uf && !UFS.includes(dados.uf)) return 'Escolha a UF';
  const s = dados.sindico || {};
  if (!String(s.nome || '').trim()) return 'Informe o nome do síndico';
  if (s.email && !emailValido(s.email)) return 'E-mail do síndico inválido';
  if (s.celular && !celularValido(s.celular)) return 'Celular do síndico inválido';
  return null;
}

// CPF com os dois dígitos verificadores; 11 dígitos iguais não valem.
function cpfValido(cpf) {
  const d = apenasDigitos(cpf);
  if (d.length !== 11 || /^(\d)\1{10}$/.test(d)) return false;
  const digito = (n) => {
    const soma = [...d.slice(0, n)].reduce((s, c, i) => s + Number(c) * (n + 1 - i), 0);
    const resto = (soma * 10) % 11;
    return resto === 10 ? 0 : resto;
  };
  return digito(9) === Number(d[9]) && digito(10) === Number(d[10]);
}

function fmtCpf(cpf) {
  return apenasDigitos(cpf).replace(/^(\d{3})(\d{3})(\d{3})(\d{2})$/, '$1.$2.$3-$4');
}

function emailValido(email) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(email || '').trim());
}

function celularValido(celular) {
  const n = apenasDigitos(celular).length;
  return n >= 10 && n <= 13;
}

// Unidades como "101", "102"… e, com blocos, "A101". O último andar pode ser todo de coberturas.
function gerarUnidades({ blocos = [], andares, porAndar, coberturaUltimo = false }) {
  const a = Number(andares);
  const p = Number(porAndar);
  if (!Number.isInteger(a) || a < 1 || a > 40) return { erro: 'Informe de 1 a 40 andares' };
  if (!Number.isInteger(p) || p < 1 || p > 20) return { erro: 'Informe de 1 a 20 apartamentos por andar' };
  const nomes = blocos.map((b) => String(b).trim().toUpperCase()).filter(Boolean);
  if (new Set(nomes).size !== nomes.length) return { erro: 'Blocos repetidos' };
  const listaBlocos = nomes.length ? nomes : [''];
  if (listaBlocos.length * a * p > LIMITE_UNIDADES) return { erro: `No máximo ${LIMITE_UNIDADES} unidades` };
  const unidades = [];
  for (const bloco of listaBlocos) {
    for (let andar = 1; andar <= a; andar++) {
      for (let n = 1; n <= p; n++) unidades.push({ id: `${bloco}${andar}${String(n).padStart(2, '0')}`, bloco: bloco || null, andar, tipo: coberturaUltimo && andar === a && a > 1 ? 'cobertura' : 'A' });
    }
  }
  return { unidades };
}

function dividirLinha(linha, sep) {
  const campos = [];
  let atual = '';
  let aspas = false;
  for (let i = 0; i < linha.length; i++) {
    const c = linha[i];
    if (c === '"') {
      if (aspas && linha[i + 1] === '"') { atual += '"'; i++; } else aspas = !aspas;
    } else if (c === sep && !aspas) { campos.push(atual.trim()); atual = ''; } else atual += c;
  }
  campos.push(atual.trim());
  return campos;
}

function separadorDe(texto) {
  const primeira = texto.split(/\r?\n/).find((l) => l.trim()) || '';
  if (primeira.includes('\t')) return '\t';
  return (primeira.match(/;/g) || []).length >= (primeira.match(/,/g) || []).length ? ';' : ',';
}

function lerCsvUnidades(texto) {
  const linhas = String(texto || '').split(/\r?\n/).filter((l) => l.trim());
  if (!linhas.length) return { erro: 'Cole a planilha de unidades' };
  const sep = separadorDe(texto);
  const corpo = /unidade/i.test(linhas[0]) ? linhas.slice(1) : linhas;
  const unidades = [];
  for (const [n, linha] of corpo.entries()) {
    const [id, bloco, tipo] = dividirLinha(linha, sep);
    const limpo = String(id || '').toUpperCase().replace(/\s+/g, '');
    if (!limpo) return { erro: `Linha ${n + 1}: informe a unidade` };
    if (unidades.some((u) => u.id === limpo)) return { erro: `Linha ${n + 1}: unidade ${limpo} repetida` };
    const andar = Number((limpo.match(/(\d+)\d\d$/) || [])[1]) || 1;
    unidades.push({ id: limpo, bloco: bloco ? bloco.toUpperCase() : null, andar, tipo: /cobertura/i.test(tipo || '') ? 'cobertura' : 'A' });
  }
  if (unidades.length > LIMITE_UNIDADES) return { erro: `No máximo ${LIMITE_UNIDADES} unidades` };
  return { unidades };
}

const VINCULOS_ACEITOS = { titular: 'titular', proprietario: 'proprietario', 'proprietário': 'proprietario', inquilino: 'inquilino', locatario: 'inquilino', 'locatário': 'inquilino' };

// Devolve todas as linhas com seus erros, para o síndico corrigir antes de importar.
function lerCsvMoradores(texto, idsUnidades) {
  const linhasTexto = String(texto || '').split(/\r?\n/).filter((l) => l.trim());
  if (!linhasTexto.length) return { linhas: [], validas: [], totalErros: 0 };
  const sep = separadorDe(texto);
  const comCabecalho = /unidade/i.test(linhasTexto[0]) && /nome/i.test(linhasTexto[0]);
  const corpo = comCabecalho ? linhasTexto.slice(1) : linhasTexto;
  const unidades = new Set(idsUnidades);
  const responsaveis = new Set();
  const linhas = corpo.map((texto, i) => {
    const [unidade, nome, email, celular, vinculo, responsavel, cpf] = dividirLinha(texto, sep);
    const u = String(unidade || '').toUpperCase().replace(/\s+/g, '');
    const erros = [];
    if (!unidades.has(u)) erros.push(`Unidade ${u || '(vazia)'} não existe`);
    if (!String(nome || '').trim()) erros.push('Informe o nome');
    if (email && !emailValido(email)) erros.push('E-mail inválido');
    if (celular && !celularValido(celular)) erros.push('Celular inválido');
    if (String(cpf || '').trim() && !cpfValido(cpf)) erros.push('CPF inválido');
    const v = vinculo ? VINCULOS_ACEITOS[String(vinculo).toLowerCase()] : 'titular';
    if (!v) erros.push(`Vínculo "${vinculo}" desconhecido`);
    const ehResponsavel = /^(s|sim|x|1|true)$/i.test(String(responsavel || '').trim());
    if (ehResponsavel && unidades.has(u)) {
      if (responsaveis.has(u)) erros.push(`A unidade ${u} já tem responsável financeiro`);
      else responsaveis.add(u);
    }
    return { numero: i + 1 + (comCabecalho ? 1 : 0), dados: { unidade: u, nome: String(nome || '').trim(), email: String(email || '').trim(), celular: apenasDigitos(celular), vinculo: v || 'titular', responsavel: ehResponsavel, cpf: apenasDigitos(cpf) }, erros };
  });
  return { linhas, validas: linhas.filter((l) => !l.erros.length).map((l) => l.dados), totalErros: linhas.filter((l) => l.erros.length).length };
}

// Frações proporcionais ao valor de cada tipo, somando exatamente 1 (o resto do arredondamento vai para a primeira unidade).
function fracoesDasUnidades(unidades, valores) {
  const peso = (u) => (u.tipo === 'cobertura' ? valores.cobertura || valores.A : valores.A) || 1;
  const total = unidades.reduce((s, u) => s + peso(u), 0);
  const fracoes = Object.fromEntries(unidades.map((u) => [u.id, Math.round((peso(u) / total) * 1e6) / 1e6]));
  const soma = Object.values(fracoes).reduce((s, f) => s + f, 0);
  if (unidades.length) fracoes[unidades[0].id] = Math.round((fracoes[unidades[0].id] + (1 - soma)) * 1e6) / 1e6;
  return fracoes;
}

function condominioNovo(config, agora) {
  const hoje = isoDia(agora);
  const mes = hoje.slice(0, 7);
  const c = config.condominio;
  const unidades = config.unidades;
  const ids = unidades.map((u) => u.id);
  const sindico = { nome: c.sindico.nome.trim(), unidade: c.sindico.unidade || ids[0], email: c.sindico.email || '', celular: apenasDigitos(c.sindico.celular) };
  const moradores = [...(config.moradores || [])];
  if (sindico.unidade && !moradores.some((m) => m.nome === sindico.nome)) moradores.unshift({ unidade: sindico.unidade, nome: sindico.nome, email: sindico.email, celular: sindico.celular, vinculo: 'titular', responsavel: !moradores.some((m) => m.unidade === sindico.unidade && m.responsavel) });
  // Só o síndico já usa o app; quem veio da planilha está "convidado" até entrar pelo convite.
  const pessoas = moradores.map((m, n) => pessoaNova(m, n + 1, agora, m.nome === sindico.nome && m.unidade === sindico.unidade ? 'ativo' : 'convidado'));
  const cob = config.cobranca;
  const valores = { A: Math.round(cob.valores.A), cobertura: Math.round(cob.valores.cobertura || cob.valores.A) };
  const fracoes = fracoesDasUnidades(unidades, valores);
  const unidadesFinanceiro = Object.fromEntries(unidades.map((u) => {
    const r = moradores.find((m) => m.unidade === u.id && m.responsavel);
    return [u.id, { tipo: u.tipo, fracao: fracoes[u.id], responsavel: r ? { nome: r.nome, relacao: r.vinculo === 'proprietario' ? 'proprietario' : r.vinculo === 'inquilino' ? 'inquilino' : 'titular', documento: 'CPF informado na implantação', cpf: r.cpf || null, canais: ['App', 'E-mail', 'WhatsApp'] } : null }];
  }));
  const vigente = somarMes(mes, -1);
  const versao = cob.modo === 'fracao'
    ? { id: 'CV-001', vigencia: mes, modo: 'fracao', ordinaria: null, orcamento: Math.round(cob.orcamento), fundoPct: cob.fundoPct, aprovadoEm: 'Implantação do condomínio', criadaEm: agora.toISOString(), criadaPor: 'Síndico' }
    : { id: 'CV-001', vigencia: mes, modo: 'fixo', ordinaria: valores, orcamento: null, fundoPct: cob.fundoPct, aprovadoEm: 'Implantação do condomínio', criadaEm: agora.toISOString(), criadaPor: 'Síndico' };
  const identificador = identificadorCondominio(c.nome);
  const categorias = { pessoal: 0, concessionarias: 0, manutencao: 0, administracao: 0, seguro: 0 };
  return {
    versao: VERSAO_CONDOMINIO_NOVO,
    origem: 'novo',
    geradoEm: hoje,
    proximoProtocolo: 1,
    infracoes: [],
    proximaInfracao: 1,
    enquetes: [],
    proximaEnquete: 1,
    condominio: {
      id: config.id || `cond-${identificador}-${agora.getTime().toString(36)}`, nome: c.nome.trim(), identificador, cnpj: apenasDigitos(c.cnpj), cep: apenasDigitos(c.cep), endereco: c.endereco || '', cidade: c.cidade || '', uf: c.uf || '',
      sindico, unidades: ids, unidadesInfo: Object.fromEntries(unidades.map((u) => [u.id, { bloco: u.bloco, andar: u.andar, tipo: u.tipo }])),
      asaas: config.asaas || { situacao: 'pendente', ambiente: 'sandbox' }, criadoEm: agora.toISOString(),
    },
    pessoas,
    areas: (config.areas || []).map((id) => AREAS_MODELO[id]).filter(Boolean).map((a) => ({ ...a, vinculadas: [] })),
    reservas: [], bloqueios: [], comunicados: [], ocorrencias: [], documentos: [], encomendas: [],
    moradorAtual: pessoas.length ? pessoas[0].unidade : ids[0],
    sacola: [], anuncios: [], pedidos: [], proximoPedido: 1,
    manutencao: { os: [], compras: [], caixa: { fundo: 30000, saldo: 30000, gastos: [], reposicoes: [] }, proximaOS: 1, proximaCompra: 1 },
    plano: c.plano || 'intermediario',
    financeiro: {
      parametros: { diaVencimento: cob.diaVencimento, diaFechamento: 20, multaPct: cob.multaPct, jurosPct: cob.jurosPct, descontoPct: 0, descontoAprovadoEm: '', formas: ['boleto', 'pix', 'cartao'], tarifa: 'condominio' },

      unidades: unidadesFinanceiro,
      avulsos: [], ajustesPrevia: {},
      vigente, vencimentoVigente: `${vigente}-${String(cob.diaVencimento).padStart(2, '0')}`, emitidas: [],
      cobrancas: [], acordos: [], historico: [],

function dadosIniciais(agora = new Date()) {
  const hoje = isoDia(agora);

// ---- src/regras.js ----

const STATUS_ATIVOS = ['pendente', 'confirmada'];
const REGRA_OK = { ok: true };

function falhaRegra(motivo) {
  return { ok: false, motivo };
}

function sobrepoe(a, b) {
  return a.inicio < b.fim && b.inicio < a.fim;
}

function plural(n, um, varios) {
  return n === 1 ? `1 ${um}` : `${n} ${varios}`;
}

function areaPorId(estado, id) {
  return estado.areas.find((a) => a.id === id);
}

function conflito(estado, areaId, data, inicio, fim) {
  const area = areaPorId(estado, areaId);
  const ids = [areaId, ...(area.vinculadas || [])];
  const alvo = { inicio, fim };
  const bloqueio = estado.bloqueios.find((b) => b.areaId === areaId && b.data === data && sobrepoe(b, alvo));
  if (bloqueio) return { tipo: 'bloqueio', item: bloqueio };
  const reserva = estado.reservas.find((r) => ids.includes(r.areaId) && r.data === data && STATUS_ATIVOS.includes(r.status) && sobrepoe(r, alvo));
  if (reserva) return { tipo: 'reserva', item: reserva };
  return null;
}

function podeReservar(estado, pedido, agora) {
  const area = areaPorId(estado, pedido.areaId);
  if (!area) return falhaRegra('Área inexistente');
  const dias = diferencaDias(pedido.data, isoDia(agora));
  if (dias < 0 || momento(pedido.data, pedido.inicio) <= agora) return falhaRegra('Esse horário já passou');
  if (dias < area.antecedenciaMin) return falhaRegra(`Reserve com pelo menos ${plural(area.antecedenciaMin, 'dia', 'dias')} de antecedência`);
  if (dias > area.antecedenciaMax) return falhaRegra(`Reservas abrem com no máximo ${area.antecedenciaMax} dias de antecedência`);
  const c = conflito(estado, area.id, pedido.data, pedido.inicio, pedido.fim);
  if (c && c.tipo === 'bloqueio') return falhaRegra(`Área bloqueada: ${c.item.motivo}`);
  if (c) return falhaRegra('Horário já reservado');
  if (area.limiteMes) {
    const mes = pedido.data.slice(0, 7);
    const usadas = estado.reservas.filter((r) => r.areaId === area.id && r.unidade === pedido.unidade && STATUS_ATIVOS.includes(r.status) && r.data.slice(0, 7) === mes).length;
    if (usadas >= area.limiteMes) return falhaRegra(`Limite de ${area.limiteMes} reservas/mês atingido para esta área`);
  }
  return REGRA_OK;
}

function avisoCancelamento(reserva, agora) {
  const horas = Math.floor(horasEntre(agora, momento(reserva.data, reserva.inicio)));
  const multa = horas < 72;
  return {
    multa,
    horas,
    texto: multa
      ? `Faltam ${horas} h para a reserva. Pelo regulamento, cancelamentos com menos de 72 h perdem a taxa.`
      : `Faltam ${horas} h para a reserva. Cancelamento sem multa.`,
  };
}

function podeEntregar(encomenda, codigo, nomeRetirada) {
  if (encomenda.status !== 'aguardando') return falhaRegra('Encomenda já entregue');
  if (String(codigo || '').trim() !== encomenda.codigo) return falhaRegra('Código inválido');
  if (!String(nomeRetirada || '').trim()) return falhaRegra('Informe quem retirou');
  return REGRA_OK;
}

function proximoStatus(status) {
  const i = FLUXO_OCORRENCIA.indexOf(status);
  return FLUXO_OCORRENCIA[i + 1] || null;
}

function acoesOcorrencia(oc) {
  if (oc.arquivada) return [];
  const acoes = [];
  const proximo = proximoStatus(oc.status);
  if (proximo) acoes.push({ id: 'avancar', rotulo: `Mover para "${NOMES_STATUS[proximo]}"` });
  acoes.push({ id: 'comentar', rotulo: 'Comentar' });
  if (oc.status === 'fechada') acoes.push({ id: 'arquivar', rotulo: 'Arquivar' });
  return acoes;
}

function alertasDocumentos(documentos, hoje) {
  return documentos
    .filter((d) => d.vencimento)
    .map((d) => {
      const dias = diferencaDias(d.vencimento, hoje);
      const faixa = dias < 0 ? 'vencido' : dias <= 7 ? '7' : dias <= 30 ? '30' : dias <= 60 ? '60' : null;
      return { documento: d, dias, faixa };
    })
    .filter((a) => a.faixa)
    .sort((a, b) => a.dias - b.dias);
}

function slaVencido(oc, agora) {
  const v = prazosVencidos(oc, agora);
  return v.resposta !== null || v.solucao !== null;
}

function statusDia(estado, areaId, data) {
  if (estado.bloqueios.some((b) => b.areaId === areaId && b.data === data)) return 'bloqueado';
  const area = areaPorId(estado, areaId);
  const ids = [areaId, ...(area.vinculadas || [])];
  const doDia = estado.reservas.filter((r) => ids.includes(r.areaId) && r.data === data && STATUS_ATIVOS.includes(r.status));
  if (!doDia.length) return 'livre';
  return doDia.some((r) => r.status === 'pendente') ? 'pendente' : 'reservado';
}

function horariosDaArea(estado, areaId, data, agora) {
  const area = areaPorId(estado, areaId);
  const base = area.tipo === 'periodo'
    ? area.periodos.map((p) => ({ inicio: p.inicio, fim: p.fim, rotulo: `${p.nome} (${fmtHora(p.inicio)}–${fmtHora(p.fim)})` }))
    : Array.from({ length: area.horaFim - area.horaInicio }, (_, i) => {
        const h = area.horaInicio + i;
        return { inicio: h, fim: h + 1, rotulo: `${fmtHora(h)}–${fmtHora(h + 1)}` };
      });
  return base.map((h) => {
    const c = conflito(estado, areaId, data, h.inicio, h.fim);
    const passou = momento(data, h.inicio) <= agora;
    let motivo = null;
    if (c) motivo = c.tipo === 'bloqueio' ? 'Bloqueado' : c.item.status === 'pendente' ? 'Pendente' : 'Reservado';
    else if (passou) motivo = 'Encerrado';
    return { ...h, livre: !motivo, motivo };
  });
}

// Com blocos ("A401"), o andar vem do cadastro da implantação; na demonstração, é o primeiro dígito.
function andarDaUnidade(estado, unidade) {
  const info = estado.condominio.unidadesInfo && estado.condominio.unidadesInfo[unidade];
  return info ? info.andar : Number(unidade[0]);
}

function destinatarios(estado, publico) {
  const todas = estado.condominio.unidades;
  if (publico.tipo === 'andar') return todas.filter((u) => String(andarDaUnidade(estado, u)) === String(publico.valor));
  if (publico.tipo === 'unidades') return todas.filter((u) => publico.valor.includes(u));
  return [...todas];
}

function comunicadosDaUnidade(estado, unidade) {
  return estado.comunicados
    .filter((c) => destinatarios(estado, c.publico).includes(unidade))
    .sort((a, b) => Number(b.fixado) - Number(a.fixado) || b.publicadoEm.localeCompare(a.publicadoEm));
}

function encomendaParada(encomenda, agora) {
  return encomenda.status === 'aguardando' && horasEntre(new Date(encomenda.chegadaEm), agora) > 72;
}

function moradoresDaUnidade(estado, unidade) {
  return estado.pessoas.filter((p) => p.unidade === unidade && !p.naoResidente);
}

function indicadoresSindico(estado, agora) {
  return {
    pendentes: estado.reservas.filter((r) => r.status === 'pendente').length,
    abertas: estado.ocorrencias.filter((o) => !o.arquivada && !['resolvida', 'fechada'].includes(o.status)).length,
    slaVencidas: estado.ocorrencias.filter((o) => slaVencido(o, agora)).length,
    paradas: estado.encomendas.filter((e) => encomendaParada(e, agora)).length,
    vencendo: alertasDocumentos(estado.documentos, isoDia(agora)).length,
    adesao: { com: new Set(estado.pessoas.filter((p) => !p.naoResidente && (!p.situacao || p.situacao === 'ativo')).map((p) => p.unidade)).size, total: estado.condominio.unidades.length },
  };
}

// Prazos derivados da linha do tempo: 1ª resposta = primeira entrada do síndico; solução = entrada com status "resolvida".
const HORA_MS = 3600000;
const ENCERRADAS = ['resolvida', 'fechada'];

function instanteMais(iso, horas) {
  return new Date(new Date(iso).getTime() + horas * HORA_MS).toISOString();
}

function prazosDe(oc) {
  const p = PRIORIDADES[oc.prioridade];
  const respondida = oc.linha.find((l) => l.autor === 'Síndico');
  const resolvida = oc.linha.find((l) => l.status === 'resolvida');
  return {
    resposta: { limite: instanteMais(oc.criadaEm, p.resposta), em: respondida ? respondida.em : null },
    solucao: p.solucao === null ? null : { limite: instanteMais(oc.criadaEm, p.solucao), em: resolvida ? resolvida.em : null },
  };
}

function prazosVencidos(oc, agora) {
  if (oc.arquivada) return { resposta: null, solucao: null };
  const p = prazosDe(oc);
  const atraso = (prazo, encerrou) => (prazo && !encerrou && agora > new Date(prazo.limite) ? Math.floor(horasEntre(new Date(prazo.limite), agora)) : null);
  return { resposta: atraso(p.resposta, !!p.resposta.em), solucao: atraso(p.solucao, !p.solucao || !!p.solucao.em || ENCERRADAS.includes(oc.status)) };
}

function textoAtraso(horas) {
  return horas < 48 ? `${horas} h` : `${Math.floor(horas / 24)} dias`;
}

function proximoLimite(oc) {
  const p = prazosDe(oc);
  if (!p.resposta.em) return p.resposta.limite;
  return p.solucao && !p.solucao.em ? p.solucao.limite : '9999';
}

function caixaDeEntrada(estado, agora, filtros = {}) {
  const { status = 'ativas', tipo = 'todos', prioridade = 'todas' } = filtros;
  return estado.ocorrencias
    .filter((o) => {
      if (status === 'arquivadas') return o.arquivada;
      if (o.arquivada) return false;
      if (status === 'ativas' && ENCERRADAS.includes(o.status)) return false;
      if (!['ativas', 'todas'].includes(status) && o.status !== status) return false;
      if (tipo !== 'todos' && CATEGORIAS[o.categoria].tipo !== tipo) return false;
      return prioridade === 'todas' || o.prioridade === prioridade;
    })
    .sort((a, b) => Number(ENCERRADAS.includes(a.status)) - Number(ENCERRADAS.includes(b.status))
      || ORDEM_PRIORIDADE.indexOf(a.prioridade) - ORDEM_PRIORIDADE.indexOf(b.prioridade)
      || proximoLimite(a).localeCompare(proximoLimite(b))
      || b.criadaEm.localeCompare(a.criadaEm));
}

function parecidas(estado, categoria, unidade) {
  return estado.ocorrencias.filter((o) => o.categoria === categoria && o.unidade !== unidade && !o.arquivada && !ENCERRADAS.includes(o.status));
}

function alertasNotificacoes(estado, agora) {
  const itens = [];
  for (const o of caixaDeEntrada(estado, agora, { status: 'ativas' })) {
    const v = prazosVencidos(o, agora);
    if (v.resposta !== null) itens.push({ chave: `resp-${o.id}`, texto: `${o.id}: 1ª resposta vencida há ${textoAtraso(v.resposta)}`, href: `#sindico.ocorrencias.${o.id}` });
    if (v.solucao !== null) itens.push({ chave: `sol-${o.id}`, texto: `${o.id}: solução vencida há ${textoAtraso(v.solucao)}`, href: `#sindico.ocorrencias.${o.id}` });
  }
  return itens;
}

function indicadorAtendimento(estado) {
  const ativas = estado.ocorrencias.filter((o) => !o.arquivada && !ENCERRADAS.includes(o.status));
  const encerradas = estado.ocorrencias.filter((o) => ENCERRADAS.includes(o.status) && prazosDe(o).solucao);
  const noPrazo = encerradas.filter((o) => {
    const s = prazosDe(o).solucao;
    return s.em && s.em <= s.limite;
  }).length;
  const pct = encerradas.length ? Math.round((noPrazo / encerradas.length) * 100) : 100;
  return { abertas: ativas.length, noPrazo, comPrazo: encerradas.length, pct, alerta: pct < 80 };
}

function urgentesAbertas(estado) {
  return estado.ocorrencias.filter((o) => o.prioridade === 'urgente' && !o.arquivada && !ENCERRADAS.includes(o.status));
}

// ---- src/acoes.js ----

// Cada ação recebe o estado e devolve { estado, notificacao?, erro?, id?, aviso? } sem mutar nada.
function erroAcao(estado, mensagem) {
  return { estado, erro: mensagem };
}

function trocarItem(lista, id, mudanca) {
  return lista.map((x) => (x.id === id ? { ...x, ...mudanca } : x));
}

function nomesDaUnidade(estado, unidade) {
  const nomes = estado.pessoas.filter((p) => p.unidade === unidade).map((p) => p.nome);
  return nomes.length ? nomes.join(', ') : `Apto ${unidade}`;
}

function gerarCodigo(n) {
  return String((((n + 1) * 739391) % 900000) + 100000);
}

function quandoReserva(r) {
  return `${fmtDia(r.data)}, ${fmtHora(r.inicio)}–${fmtHora(r.fim)}`;
}

function solicitarReserva(estado, pedido, agora) {
  const v = podeReservar(estado, pedido, agora);
  if (!v.ok) return erroAcao(estado, v.motivo);
  if (!pedido.aceiteTermo) return erroAcao(estado, 'Aceite o termo de responsabilidade');
  const area = areaPorId(estado, pedido.areaId);
  const status = area.aprovacao === 'automatica' ? 'confirmada' : 'pendente';
  const reserva = { id: `r${estado.reservas.length + 1}`, areaId: area.id, unidade: pedido.unidade, data: pedido.data, inicio: pedido.inicio, fim: pedido.fim, status, convidados: pedido.convidados || [], criadaEm: agora.toISOString() };
  const notificacao = status === 'pendente'
    ? { canal: 'Push', para: nomeSindico(estado), texto: `Nova reserva para aprovar: ${area.nome}, apto ${reserva.unidade}, ${quandoReserva(reserva)}` }
    : { canal: 'Push', para: nomesDaUnidade(estado, reserva.unidade), texto: `Reserva confirmada: ${area.nome}, ${quandoReserva(reserva)}` };
  return { estado: { ...estado, reservas: [...estado.reservas, reserva] }, id: reserva.id, notificacao };
}

function aprovarReserva(estado, id) {
  const r = estado.reservas.find((x) => x.id === id);
  if (!r || r.status !== 'pendente') return erroAcao(estado, 'Reserva não está pendente');
  const area = areaPorId(estado, r.areaId);
  return {
    estado: { ...estado, reservas: trocarItem(estado.reservas, id, { status: 'confirmada' }) },
    notificacao: { canal: 'WhatsApp', para: nomesDaUnidade(estado, r.unidade), texto: `Reserva aprovada: ${area.nome}, ${quandoReserva(r)}. A portaria já recebeu a lista de convidados.` },
  };
}

function recusarReserva(estado, id, motivo) {
  const r = estado.reservas.find((x) => x.id === id);
  if (!r || r.status !== 'pendente') return erroAcao(estado, 'Reserva não está pendente');
  const texto = String(motivo || '').trim();
  if (!texto) return erroAcao(estado, 'Escolha o motivo da recusa');
  const area = areaPorId(estado, r.areaId);
  return {
    estado: { ...estado, reservas: trocarItem(estado.reservas, id, { status: 'recusada', motivo: texto }) },
    notificacao: { canal: 'WhatsApp', para: nomesDaUnidade(estado, r.unidade), texto: `Reserva recusada: ${area.nome}, ${quandoReserva(r)}. Motivo: ${texto}.` },
  };
}

function cancelarReserva(estado, id, agora) {
  const r = estado.reservas.find((x) => x.id === id);
  if (!r || !STATUS_ATIVOS.includes(r.status)) return erroAcao(estado, 'Reserva não pode ser cancelada');
  const aviso = avisoCancelamento(r, agora);
  const area = areaPorId(estado, r.areaId);
  return {
    estado: { ...estado, reservas: trocarItem(estado.reservas, id, { status: 'cancelada' }) },
    aviso,
    notificacao: { canal: 'Push', para: nomeSindico(estado), texto: `Reserva cancelada: ${area.nome}, apto ${r.unidade}, ${quandoReserva(r)}${aviso.multa ? ' (fora do prazo de 72 h)' : ''}` },
  };
}

function registrarEncomenda(estado, dados, agora) {
  const unidade = String(dados.unidade || '').trim();
  if (!estado.condominio.unidades.includes(unidade)) return erroAcao(estado, 'Unidade inexistente');
  if (!dados.transportadora) return erroAcao(estado, 'Escolha a transportadora');
  const encomenda = { id: `e${estado.encomendas.length + 1}`, unidade, transportadora: dados.transportadora, codigo: gerarCodigo(estado.encomendas.length), chegadaEm: agora.toISOString(), status: 'aguardando', foto: !!dados.foto, retiradaPor: null, retiradaEm: null, lembretes: 0, registradaPor: dados.porteiro || 'Seu José' };
  return {
    estado: { ...estado, encomendas: [...estado.encomendas, encomenda] },
    id: encomenda.id,
    notificacao: { canal: 'WhatsApp', para: nomesDaUnidade(estado, unidade), texto: `Chegou sua encomenda (${encomenda.transportadora}). Código de retirada: ${encomenda.codigo}` },
  };
}

function entregarEncomenda(estado, { id, codigo, nome }, agora) {
  const e = estado.encomendas.find((x) => x.id === id);
  if (!e) return erroAcao(estado, 'Encomenda não encontrada');
  const v = podeEntregar(e, codigo, nome);
  if (!v.ok) return erroAcao(estado, v.motivo);
  const quem = nome.trim();
  return {
    estado: { ...estado, encomendas: trocarItem(estado.encomendas, id, { status: 'retirada', retiradaPor: quem, retiradaEm: agora.toISOString() }) },
    notificacao: { canal: 'Push', para: nomesDaUnidade(estado, e.unidade), texto: `Encomenda (${e.transportadora}) retirada por ${quem}.` },
  };
}

function lembrarEncomenda(estado, id, agora) {
  const e = estado.encomendas.find((x) => x.id === id);
  if (!e || e.status !== 'aguardando') return erroAcao(estado, 'Encomenda já entregue');
  return {
    estado: { ...estado, encomendas: trocarItem(estado.encomendas, id, { lembretes: e.lembretes + 1 }) },
    notificacao: { canal: 'WhatsApp', para: nomesDaUnidade(estado, e.unidade), texto: `Lembrete: sua encomenda (${e.transportadora}) chegou ${haQuanto(e.chegadaEm, agora)} e está na portaria.` },
  };
}

function publicarComunicado(estado, dados, agora) {
  const titulo = String(dados.titulo || '').trim();
  const texto = String(dados.texto || '').trim();
  if (!titulo) return erroAcao(estado, 'Informe o título');
  if (!texto) return erroAcao(estado, 'Escreva o texto do comunicado');
  const dest = destinatarios(estado, dados.publico);
  if (!dest.length) return erroAcao(estado, 'Escolha ao menos uma unidade');
  const canais = [...(dados.canais || [])];
  if (dados.tipo === 'urgente' && !canais.includes('sms')) canais.push('sms');
  if (!canais.length) return erroAcao(estado, 'Escolha ao menos um canal');
  const comunicado = { id: `c${estado.comunicados.length + 1}`, tipo: dados.tipo, titulo, texto, publico: dados.publico, canais, fixado: !!dados.fixado, anexo: dados.anexo || null, publicadoEm: agora.toISOString(), leituras: [], reacoes: { util: [], duvida: [] } };
  return {
    estado: { ...estado, comunicados: [...estado.comunicados, comunicado] },
    id: comunicado.id,
    notificacao: { canal: canais.map((k) => NOMES_CANAL[k]).join(' + '), para: `${dest.length} unidades`, texto: titulo },
  };
}

function marcarLido(estado, id, unidade) {
  const c = estado.comunicados.find((x) => x.id === id);
  if (!c) return erroAcao(estado, 'Comunicado não encontrado');
  if (c.leituras.includes(unidade)) return { estado };
  return { estado: { ...estado, comunicados: trocarItem(estado.comunicados, id, { leituras: [...c.leituras, unidade] }) } };
}

function reagir(estado, id, unidade, tipo) {
  const c = estado.comunicados.find((x) => x.id === id);
  if (!c) return erroAcao(estado, 'Comunicado não encontrado');
  const tinha = c.reacoes[tipo].includes(unidade);
  const reacoes = { util: c.reacoes.util.filter((u) => u !== unidade), duvida: c.reacoes.duvida.filter((u) => u !== unidade) };
  if (!tinha) reacoes[tipo] = [...reacoes[tipo], unidade];
  return { estado: { ...estado, comunicados: trocarItem(estado.comunicados, id, { reacoes }) } };
}

function abrirOcorrencia(estado, dados, agora) {
  if (!CATEGORIAS[dados.categoria]) return erroAcao(estado, 'Escolha o tipo e a categoria');
  const descricao = String(dados.descricao || '').trim();
  if (!descricao) return erroAcao(estado, 'Descreva a ocorrência');
  const id = `OC-${String(estado.proximoProtocolo).padStart(4, '0')}`;
  const em = agora.toISOString();
  const ocorrencia = { id, categoria: dados.categoria, descricao, local: String(dados.local || '').trim(), unidade: dados.unidade, anonima: !!dados.anonima, publica: !!dados.publica, foto: !!dados.foto, status: 'aberta', eutambem: [], linha: [{ em, status: 'aberta', texto: 'Ocorrência aberta', autor: dados.anonima ? 'Anônimo' : nomesDaUnidade(estado, dados.unidade) }], avaliacao: null, arquivada: false, criadaEm: em, prioridade: CATEGORIAS[dados.categoria].prioridade, os: null, processos: [], motivoArquivamento: null };
  return {
    estado: { ...estado, ocorrencias: [ocorrencia, ...estado.ocorrencias], proximoProtocolo: estado.proximoProtocolo + 1 },
    id,
    notificacao: { canal: 'Push', para: nomeSindico(estado), texto: `Nova ocorrência ${id}: ${CATEGORIAS[dados.categoria].nome}` },
  };
}

function avancarOcorrencia(estado, id, agora, texto = '') {
  const oc = estado.ocorrencias.find((x) => x.id === id);
  if (!oc) return erroAcao(estado, 'Ocorrência não encontrada');
  if (oc.arquivada) return erroAcao(estado, 'Ocorrência arquivada');
  const proximo = proximoStatus(oc.status);
  if (!proximo) return erroAcao(estado, 'Ocorrência já está fechada');
  const mensagem = String(texto || '').trim();
  const entrada = { em: agora.toISOString(), status: proximo, texto: mensagem || `Status alterado para ${NOMES_STATUS[proximo]}`, autor: 'Síndico' };
  return {
    estado: { ...estado, ocorrencias: trocarItem(estado.ocorrencias, id, { status: proximo, linha: [...oc.linha, entrada] }) },
    notificacao: { canal: 'Push', para: nomesDaUnidade(estado, oc.unidade), texto: `${oc.id}: ${NOMES_STATUS[proximo]}${mensagem ? ` — ${mensagem}` : ''}` },
  };
}

function comentarOcorrencia(estado, id, texto, agora, autor = 'Síndico') {
  const oc = estado.ocorrencias.find((x) => x.id === id);
  if (!oc) return erroAcao(estado, 'Ocorrência não encontrada');
  const mensagem = String(texto || '').trim();
  if (!mensagem) return erroAcao(estado, 'Escreva o comentário');
  const entrada = { em: agora.toISOString(), status: null, texto: mensagem, autor };
  return {
    estado: { ...estado, ocorrencias: trocarItem(estado.ocorrencias, id, { linha: [...oc.linha, entrada] }) },
    notificacao: { canal: 'Push', para: nomesDaUnidade(estado, oc.unidade), texto: `${oc.id}: novo comentário do síndico` },
  };
}

function arquivarOcorrencia(estado, id) {
  const oc = estado.ocorrencias.find((x) => x.id === id);
  if (!oc) return erroAcao(estado, 'Ocorrência não encontrada');
  if (oc.status !== 'fechada') return erroAcao(estado, 'Só ocorrências fechadas podem ser arquivadas');
  return { estado: { ...estado, ocorrencias: trocarItem(estado.ocorrencias, id, { arquivada: true }) } };
}

function avaliarOcorrencia(estado, id, nota) {
  const oc = estado.ocorrencias.find((x) => x.id === id);
  if (!oc) return erroAcao(estado, 'Ocorrência não encontrada');
  if (!['resolvida', 'fechada'].includes(oc.status)) return erroAcao(estado, 'A avaliação abre quando a ocorrência for resolvida');
  if (!Number.isInteger(nota) || nota < 1 || nota > 5) return erroAcao(estado, 'Escolha de 1 a 5 estrelas');
  return {
    estado: { ...estado, ocorrencias: trocarItem(estado.ocorrencias, id, { avaliacao: nota }) },
    notificacao: { canal: 'Push', para: nomeSindico(estado), texto: `${oc.id} avaliada com ${nota} de 5 estrelas` },
  };
}

function euTambem(estado, id, unidade) {
  const oc = estado.ocorrencias.find((x) => x.id === id);
  if (!oc) return erroAcao(estado, 'Ocorrência não encontrada');
  if (!oc.publica && oc.unidade === unidade) return erroAcao(estado, 'Ocorrência não é pública');
  const eutambem = oc.eutambem.includes(unidade) ? oc.eutambem.filter((u) => u !== unidade) : [...oc.eutambem, unidade];
  return { estado: { ...estado, ocorrencias: trocarItem(estado.ocorrencias, id, { eutambem }) } };
}

// Ações do síndico na caixa de notificações (Intermediário em diante). Cada uma entra na linha do tempo como "Síndico".
const SO_SINDICO_NOTIF = 'Somente o síndico pode fazer isso';

function erroNotif(estado, mensagem) {
  return { estado, erro: mensagem };
}

function guardaNotif(estado, id, perfil) {
  if (perfil !== 'sindico') return SO_SINDICO_NOTIF;
  if (!liberado(estado.plano, 'notificacoesPrazo')) return 'Disponível no plano Intermediário';
  if (!estado.ocorrencias.some((o) => o.id === id)) return 'Ocorrência não encontrada';
  return null;
}

function comEntrada(estado, id, mudanca, entrada) {
  const oc = estado.ocorrencias.find((o) => o.id === id);
  return { ...estado, ocorrencias: trocarItem(estado.ocorrencias, id, { ...mudanca, linha: [...oc.linha, entrada] }) };
}

function definirPrioridade(estado, id, prioridade, perfil, agora) {
  const falha = guardaNotif(estado, id, perfil);
  if (falha) return erroNotif(estado, falha);
  if (!PRIORIDADES[prioridade]) return erroNotif(estado, 'Prioridade inválida');
  return { estado: comEntrada(estado, id, { prioridade }, { em: agora.toISOString(), status: null, texto: `Prioridade definida como ${PRIORIDADES[prioridade].nome}`, autor: 'Síndico' }) };
}

function pedirInformacao(estado, id, texto, perfil, agora) {
  const falha = guardaNotif(estado, id, perfil);
  if (falha) return erroNotif(estado, falha);
  const mensagem = String(texto || '').trim();
  if (!mensagem) return erroNotif(estado, 'Escreva o que precisa saber');
  const oc = estado.ocorrencias.find((o) => o.id === id);
  const status = oc.status === 'aberta' ? 'em_analise' : oc.status;
  return {
    estado: comEntrada(estado, id, { status }, { em: agora.toISOString(), status: status !== oc.status ? status : null, texto: `Pedido de informação: ${mensagem}`, autor: 'Síndico' }),
    notificacao: { canal: 'Push', para: `Apto ${oc.unidade}`, texto: `${id}: o síndico pediu mais informações` },
  };
}

function arquivarComJustificativa(estado, id, motivo, perfil, agora) {
  if (perfil !== 'sindico') return erroNotif(estado, SO_SINDICO_NOTIF);
  const texto = String(motivo || '').trim();
  if (!texto) return erroNotif(estado, 'Informe o motivo do arquivamento');
  if (!estado.ocorrencias.some((o) => o.id === id)) return erroNotif(estado, 'Ocorrência não encontrada');
  return { estado: comEntrada(estado, id, { arquivada: true, motivoArquivamento: texto }, { em: agora.toISOString(), status: null, texto: `Arquivada: ${texto}`, autor: 'Síndico' }) };
}

// Primeiro acesso pelo convite (QR Code): quem está na planilha passa a ativo; quem não está aguarda o síndico aprovar.
function erroConvite(estado, mensagem) {
  return { estado, erro: mensagem };
}

function normalizarNome(nome) {
  return String(nome || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim();
}

// Código simulado do "SMS": fixo por celular, para o teste ponta a ponta poder conferi-lo.
function codigoDoConvite(celular) {
  const d = apenasDigitos(celular);
  return String((Number(d.slice(-6) || '0') * 7919 + 104729) % 900000 + 100000);
}

function confirmarConvite(estado, { unidade, nome, celular, codigo }, agora) {
  const u = String(unidade || '').toUpperCase().replace(/\s+/g, '');
  if (!estado.condominio.unidades.includes(u)) return erroConvite(estado, 'Escolha a sua unidade');
  const n = String(nome || '').trim();
  if (!n) return erroConvite(estado, 'Informe o seu nome');
  if (!celularValido(celular)) return erroConvite(estado, 'Informe um celular com DDD');
  if (String(codigo || '').trim() !== codigoDoConvite(celular)) return erroConvite(estado, 'Código inválido. Confira o SMS');
  const cel = apenasDigitos(celular);
  const existente = estado.pessoas.find((p) => p.unidade === u && (normalizarNome(p.nome) === normalizarNome(n) || (p.celular && p.celular === cel)));
  if (existente) {
    if (existente.situacao === 'pendente') return { estado, id: existente.id, situacao: 'pendente' };
    const ativo = { situacao: 'ativo', celular: existente.celular || cel, acessoEm: agora.toISOString() };
    return {
      estado: { ...estado, pessoas: trocarItem(estado.pessoas, existente.id, ativo), moradorAtual: u },
      id: existente.id,
      situacao: 'ativo',
      notificacao: { canal: 'App', para: estado.condominio.sindico ? estado.condominio.sindico.nome : 'Síndico', texto: `${existente.nome} (apto ${u}) entrou no app pelo convite` },
    };
  }
  const id = `p${u}-c${estado.pessoas.length + 1}`;
  const pessoa = { id, nome: n, unidade: u, email: '', celular: cel, vinculo: 'titular', situacao: 'pendente', criadaEm: agora.toISOString(), recebeOfertas: false, vendedor: 'nao', pedidoVenda: null, motivoVendedor: null };
  return {
    estado: { ...estado, pessoas: [...estado.pessoas, pessoa] },
    id,
    situacao: 'pendente',
    notificacao: { canal: 'App + e-mail', para: estado.condominio.sindico ? estado.condominio.sindico.nome : 'Síndico', texto: `Novo morador no apto ${u}: ${n}. Aprove no Início` },
  };
}

function aprovarMorador(estado, id, perfil, agora) {
  if (perfil !== 'sindico') return erroConvite(estado, 'Somente o síndico pode fazer isso');
  const p = estado.pessoas.find((x) => x.id === id);
  if (!p || p.situacao !== 'pendente') return erroConvite(estado, 'Este cadastro não está aguardando aprovação');
  return {
    estado: { ...estado, pessoas: trocarItem(estado.pessoas, id, { situacao: 'ativo', acessoEm: agora.toISOString() }) },
    notificacao: { canal: 'App + WhatsApp', para: p.nome, texto: `Seu acesso ao apto ${p.unidade} foi aprovado. Bem-vindo ao CondoFácil!` },
  };
}

function recusarMorador(estado, id, perfil) {
  if (perfil !== 'sindico') return erroConvite(estado, 'Somente o síndico pode fazer isso');
  const p = estado.pessoas.find((x) => x.id === id);
  if (!p || p.situacao !== 'pendente') return erroConvite(estado, 'Este cadastro não está aguardando aprovação');
  return {
    estado: { ...estado, pessoas: estado.pessoas.filter((x) => x.id !== id) },
    notificacao: { canal: 'App + WhatsApp', para: p.nome, texto: `O cadastro no apto ${p.unidade} não foi confirmado. Fale com o síndico.` },
  };
}

function moradoresPendentes(estado) {
  return estado.pessoas.filter((p) => p.situacao === 'pendente');
}
