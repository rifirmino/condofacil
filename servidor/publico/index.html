// Processo de infração: cartão na notificação, lista e detalhe do síndico, e a defesa do morador.
const ETQ_SITUACAO_INFRACAO = { defesa: 'alerta', analise: 'info', decidido: 'neutro' };

function EtqInfracao({ p, hoje }) {
  const s = situacaoInfracao(p, hoje);
  return html`<${Etiqueta} tipo=${ETQ_SITUACAO_INFRACAO[s]}>${s === 'decidido' ? NOMES_RESULTADO_INFRACAO[p.decisao.resultado] : NOMES_SITUACAO_INFRACAO[s]}<//>`;
}

function LinhaProcesso({ linha }) {
  return html`<ol class="linha-tempo">${linha.map((l, i) => html`<li key=${i} class="marco">
    <span class="lt-quando">${fmtDataHora(l.em)}</span>
    <strong>${l.texto}</strong>
    <span>${l.autor}</span>
  </li>`)}</ol>`;
}

function ResumoProcesso({ p }) {
  return html`<dl class="resumo">
    <dt>Tipo</dt><dd>${NOMES_TIPO_INFRACAO[p.tipo]}${p.valor ? ` · ${fmtReais(p.valor)}` : ''}</dd>
    <dt>Fato</dt><dd>${p.fato}</dd>
    <dt>Base</dt><dd>${p.artigo}</dd>
    <dt>Prazo de defesa</dt><dd>até ${fmtDataCurta(p.prazoAte)} (${p.prazoDias} dias)</dd>
    ${p.decisao && html`<dt>Decisão</dt><dd>${NOMES_RESULTADO_INFRACAO[p.decisao.resultado]}: ${p.decisao.justificativa}</dd>`}
    ${p.lancamento && html`<dt>Lançamento</dt><dd>Multa no boleto de ${nomeMes(p.lancamento)}</dd>`}
  </dl>`;
}

function CartaoProcessoOcorrencia({ estado, executar, oc }) {
  const [form, setForm] = useState({ unidade: '', tipo: 'multa', artigo: '', fato: fatoPadrao(oc), valor: '', prazoDias: String(PRAZO_DEFESA_PADRAO) });
  const [erro, setErro] = useState(null);
  const [mensagem, setMensagem] = useState(null);
  if (!liberado(estado.plano, 'multasDefesa')) return html`<${Bloqueado} estado=${estado} recurso="multasDefesa" titulo="Advertência ou multa com direito de defesa" />`;
  const hoje = isoDia(new Date());
  const processos = (oc.processos || []).map((id) => infracaoPorId(estado, id)).filter(Boolean);
  const campo = (chave) => (ev) => setForm({ ...form, [chave]: ev.target.value });

  function abrir() {
    const r = executar((e) => abrirProcesso(e, oc.id, { ...form, valor: lerPreco(form.valor), prazoDias: Number(form.prazoDias) }, 'sindico', new Date()));
    setErro(r.erro || null);
    setMensagem(r.erro ? null : `Processo ${r.id} aberto. A unidade foi notificada.`);
  }

  return html`<div class="cartao pilha">
    <strong>Advertência ou multa</strong>
    ${processos.length > 0 && html`<ul class="itens-sacola">${processos.map((p) => html`<li key=${p.id}><a href=${`#sindico.ocorrencias.${p.id}`}>${p.id} · ${NOMES_TIPO_INFRACAO[p.tipo].toLowerCase()} ao apto ${p.unidade}</a><${EtqInfracao} p=${p} hoje=${hoje} /></li>`)}</ul>`}
    <div class="edicao-anuncio">
      <${Campo} rotulo="Unidade infratora"><input id="infracao-unidade" value=${form.unidade} onInput=${campo('unidade')} placeholder="Ex.: 503" /><//>
      <${Campo} rotulo="Tipo"><select id="infracao-tipo" value=${form.tipo} onChange=${campo('tipo')}><option value="multa">Multa</option><option value="advertencia">Advertência</option></select><//>
      <${Campo} rotulo="Artigo do regimento"><input id="infracao-artigo" value=${form.artigo} onInput=${campo('artigo')} placeholder="Ex.: Art. 18 (obras só em dias úteis)" /><//>
      ${form.tipo === 'multa' && html`<${Campo} rotulo="Valor da multa (R$)"><input id="infracao-valor" inputmode="decimal" value=${form.valor} onInput=${campo('valor')} placeholder="Ex.: 150,00" /><//>`}
      <${Campo} rotulo="Prazo de defesa (dias)" dica="De 5 a 30 dias"><input id="infracao-prazo" type="number" min="5" max="30" value=${form.prazoDias} onInput=${campo('prazoDias')} /><//>
    </div>
    <${Campo} rotulo="Descrição do fato" dica="É o que o morador vê. A notificação original e quem a enviou nunca são mostrados."><textarea id="infracao-fato" rows="2" value=${form.fato} onInput=${campo('fato')}></textarea><//>
    <${Erro} texto=${erro} />
    <${Sucesso} texto=${mensagem} />
    <button type="button" class="btn secundario" data-acao="abrir-processo" onClick=${abrir}>Abrir processo</button>
  </div>`;
}

function BlocoProcessos({ estado, agora }) {
  if (!liberado(estado.plano, 'multasDefesa')) return null;
  const hoje = isoDia(agora);
  const abertos = infracoesAbertas(estado);
  return html`<div class="pilha">
    <h2>Processos de infração</h2>
    ${abertos.length
      ? html`<div class="tabela-rolagem"><table class="tabela">
          <thead><tr><th>Processo</th><th>Unidade</th><th>Tipo</th><th>Situação</th><th>Prazo de defesa</th></tr></thead>
          <tbody>${abertos.map((p) => html`<tr key=${p.id}>
            <td><a href=${`#sindico.ocorrencias.${p.id}`}>${p.id}</a></td>
            <td>${p.unidade}</td>
            <td>${NOMES_TIPO_INFRACAO[p.tipo]}${p.valor ? ` · ${fmtReais(p.valor)}` : ''}</td>
            <td><${EtqInfracao} p=${p} hoje=${hoje} />${podeDecidir(p, hoje) ? html` <small class="sub">decida</small>` : ''}</td>
            <td>${fmtDataCurta(p.prazoAte)}</td>
          </tr>`)}</tbody>
        </table></div>`
      : html`<${Vazio} texto="Nenhum processo em andamento." />`}
  </div>`;
}

function SDetalheInfracao({ estado, executar, agora, p }) {
  const [resultado, setResultado] = useState('mantida');
  const [justificativa, setJustificativa] = useState('');
  const [erro, setErro] = useState(null);
  const [mensagem, setMensagem] = useState(null);
  const hoje = isoDia(agora);

  function rodar(acao, sucesso) {
    const r = executar(acao);
    setErro(r.erro || null);
    setMensagem(r.erro ? null : sucesso);
  }

  return html`<section class="pilha">
    <a class="voltar" href="#sindico.ocorrencias">‹ Notificações</a>
    <p class="protocolo">Processo ${p.id}</p>
    <div class="linha-entre"><h1>${NOMES_TIPO_INFRACAO[p.tipo]} · apto ${p.unidade}</h1><${EtqInfracao} p=${p} hoje=${hoje} /></div>
    <p class="sub">Aberto a partir da notificação <a href=${`#sindico.ocorrencias.${p.ocorrencia}`}>${p.ocorrencia}</a>. O morador vê só o fato descrito abaixo.</p>
    <${ResumoProcesso} p=${p} />
    <h2>Defesa</h2>
    ${p.defesa
      ? html`<div class="cartao"><strong>${p.defesa.autor} · ${fmtDataHora(p.defesa.em)}</strong><p class="texto-longo">${p.defesa.texto}</p>${p.defesa.anexo && html`<small class="sub">Anexo: ${p.defesa.anexo}</small>`}</div>`
      : html`<p class="sub">${prazoVencido(p, hoje) ? 'O prazo terminou sem defesa.' : `Aguardando a defesa até ${fmtDataCurta(p.prazoAte)}.`}</p>`}
    ${p.situacao === 'defesa' && !p.defesa && !prazoVencido(p, hoje) && html`<div class="acoes"><button type="button" class="btn secundario" data-acao="encerrar-prazo" onClick=${() => rodar((e) => encerrarPrazo(e, p.id, 'sindico', new Date()), 'Prazo encerrado. Agora você pode decidir.')}>Simular fim do prazo (demonstração)</button></div>`}
    ${podeDecidir(p, hoje) && html`<div class="cartao pilha">
      <strong>Decisão</strong>
      <div class="edicao-anuncio">
        <${Campo} rotulo="Decisão"><select id="infracao-decisao" value=${resultado} onChange=${(ev) => setResultado(ev.target.value)}>
          <option value="mantida">Manter ${p.tipo === 'multa' ? `a multa (lança ${fmtReais(p.valor)} no próximo boleto)` : 'a advertência'}</option>
          ${p.tipo === 'multa' && html`<option value="convertida">Converter em advertência</option>`}
          <option value="cancelada">Cancelar</option>
        </select><//>
      </div>
      <${Campo} rotulo="Justificativa" dica="O morador recebe a decisão com esta justificativa."><textarea id="infracao-justificativa" rows="2" value=${justificativa} onInput=${(ev) => setJustificativa(ev.target.value)}></textarea><//>
      <button type="button" class="btn primario" data-acao="decidir-processo" onClick=${() => rodar((e) => decidirProcesso(e, p.id, { resultado, justificativa }, 'sindico', new Date()), 'Decisão registrada e enviada à unidade.')}>Registrar decisão</button>
    </div>`}
    <${Erro} texto=${erro} />
    <${Sucesso} texto=${mensagem} />
    <h2>Linha do tempo</h2>
    <${LinhaProcesso} linha=${p.linha} />
  </section>`;
}

function MBlocoInfracoes({ estado, eu, agora }) {
  const lista = infracoesDaUnidade(estado, eu);
  if (!lista.length) return null;
  const hoje = isoDia(agora);
  return html`<h2>Notificações para o seu apartamento</h2>
    <ul class="m-lista">${lista.map((p) => html`<li key=${p.id}><a class="cartao link" href=${`#morador.ocorrencias.${p.id}`}>
      <div class="linha-entre"><strong>${NOMES_TIPO_INFRACAO[p.tipo]}${p.valor ? ` · ${fmtReais(p.valor)}` : ''}</strong><${EtqInfracao} p=${p} hoje=${hoje} /></div>
      <span>${p.fato}</span>
      <small class="sub">${p.id} · ${situacaoInfracao(p, hoje) === 'defesa' ? `defesa até ${fmtDataCurta(p.prazoAte)}` : p.artigo}</small>
    </a></li>`)}</ul>`;
}

function MDetalheInfracao({ estado, executar, agora, p, eu }) {
  const [texto, setTexto] = useState('');
  const [anexo, setAnexo] = useState(null);
  const [erro, setErro] = useState(null);
  const hoje = isoDia(agora);
  const aberta = situacaoInfracao(p, hoje) === 'defesa' && !p.defesa;
  const autor = pessoaDaUnidade(estado, eu) ? pessoaDaUnidade(estado, eu).nome : `Apto ${eu}`;

  function enviar() {
    const r = executar((e) => apresentarDefesa(e, p.id, { unidade: eu, autor, texto, anexo }, new Date()));
    setErro(r.erro || null);
  }

  return html`<section class="m-pagina">
    <a class="voltar" href="#morador.ocorrencias">‹ Notificações</a>
    <p class="protocolo">Processo ${p.id}</p>
    <h1 class="m-titulo">Notificação formal do condomínio</h1>
    <div class="etq-linha"><${EtqInfracao} p=${p} hoje=${hoje} /><span class="sub">${NOMES_TIPO_INFRACAO[p.tipo]} · apto ${p.unidade}</span></div>
    <${ResumoProcesso} p=${p} />
    ${aberta && html`<div class="cartao pilha">
      <strong>Você tem até ${fmtDataCurta(p.prazoAte)} para apresentar sua defesa</strong>
      <small class="sub">O síndico só decide depois da sua defesa ou do fim do prazo.</small>
      <${Campo} rotulo="Sua defesa"><textarea id="defesa-texto" rows="4" value=${texto} onInput=${(ev) => setTexto(ev.target.value)}></textarea><//>
      <button type="button" class="btn secundario" onClick=${() => setAnexo(`defesa-${p.id}.pdf`)}>${anexo ? `Anexado: ${anexo}` : 'Anexar documento'}</button>
      <${Erro} texto=${erro} />
      <button type="button" class="btn primario" data-acao="enviar-defesa" onClick=${enviar}>Enviar defesa</button>
    </div>`}
    ${p.defesa && html`<div class="cartao"><strong>Sua defesa · ${fmtDataHora(p.defesa.em)}</strong><p class="m-texto">${p.defesa.texto}</p>${p.defesa.anexo && html`<small class="sub">Anexo: ${p.defesa.anexo}</small>`}</div>`}
    ${!p.defesa && !aberta && p.situacao !== 'decidido' && html`<p class="m-sub">O prazo de defesa terminou. Aguarde a decisão do síndico.</p>`}
    <h2>Andamento</h2>
    <${LinhaProcesso} linha=${p.linha} />
  </section>`;
}

function CartaoInfracaoInicio({ estado, eu, agora }) {
  const hoje = isoDia(agora);
  const p = infracoesDaUnidade(estado, eu).find((x) => situacaoInfracao(x, hoje) === 'defesa' && !x.defesa);
  if (!p) return null;
  return html`<a class="cartao link cobranca-inicio vencida" href=${`#morador.ocorrencias.${p.id}`}>
    <strong>Notificação formal do condomínio</strong>
    <span>${NOMES_TIPO_INFRACAO[p.tipo]}${p.valor ? ` de ${fmtReais(p.valor)}` : ''}: ${p.fato}</span>
    <small class="sub">Você pode apresentar defesa até ${fmtDataCurta(p.prazoAte)}</small>
    <span class="btn primario">Ver e responder</span>
  </a>`;
}

// ---- src/ui/acordos.js ----

const ETQ_ACORDO = { aguardando: 'alerta', ativo: 'info', quitado: 'ok', cancelado: 'neutro' };
const NOMES_SITUACAO_ACORDO = { aguardando: 'Aguardando aceite', ativo: 'Ativo', quitado: 'Quitado', cancelado: 'Cancelado' };

function EtqAcordo({ situacao }) {
  return html`<${Etiqueta} tipo=${ETQ_ACORDO[situacao]}>${NOMES_SITUACAO_ACORDO[situacao]}<//>`;
}

function termoDoAcordo(acordo) {
  return { titulo: `Termo de confissão de dívida · ${acordo.id} · apto ${acordo.unidade}`, pasta: 'Financeiro', versoes: [{ versao: 1, data: isoDia(new Date(acordo.criadoEm)) }] };
}

function nomeLinha(numero, de) {
  return numero ? `Parcela ${numero}/${de}` : 'Entrada';
}

function ResumoAcordo({ estado, acordo }) {
  const originais = estado.financeiro.cobrancas.filter((c) => acordo.originais.includes(c.id));
  return html`<dl class="resumo">
    <dt>Débitos incluídos</dt><dd>${originais.map((c) => rotuloCobranca(c)).join(', ')}</dd>
    <dt>Valor original</dt><dd>${fmtReais(acordo.valorOriginal)}</dd>
    <dt>Multa e juros</dt><dd>${fmtReais(acordo.multa + acordo.juros)}</dd>
    <dt>Desconto</dt><dd>${fmtReais(-acordo.desconto)}</dd>
    <dt>Total do acordo</dt><dd><strong>${fmtReais(acordo.total)}</strong></dd>
  </dl>`;
}

function Cronograma({ estado, acordo, hoje, aoAbrir }) {
  if (['aguardando', 'cancelado'].includes(acordo.situacao)) {
    return html`<ul class="itens-sacola">${cronogramaDoAcordo(estado, acordo, hoje).map((l) => html`<li key=${l.numero}><span>${nomeLinha(l.numero, acordo.parcelas)} · ${fmtDataCurta(l.vencimento)}</span><span>${fmtReais(l.valor)}</span></li>`)}</ul>`;
  }
  return html`<ul class="itens-sacola cronograma">${cobrancasDoAcordo(estado, acordo.id).map((c) => html`<li key=${c.id}>
    <span>${nomeLinha(c.acordo.numero, c.acordo.de)} · ${fmtDataCurta(c.vencimento)}</span>
    <span class="cronograma-fim">${fmtReais(c.valor)} <${EtqCobranca} situacao=${situacaoCobranca(c, hoje)} />${aoAbrir && html` <button type="button" class="btn-link" data-cobranca=${c.id} onClick=${() => aoAbrir(c.id)}>Detalhes</button>`}</span>
  </li>`)}</ul>`;
}

function CAcordos(props) {
  const { estado, rota } = props;
  if (!liberado(estado.plano, 'acordos')) return html`<${Bloqueado} estado=${estado} recurso="acordos" titulo="Acordos de inadimplência com parcelamento e desconto" />`;
  const id = rota.id || '';
  if (id.startsWith('novoacordo')) return html`<${NovoAcordo} key=${id} ...${props} unidadeInicial=${id.split('-')[1] || null} />`;
  const acordo = estado.financeiro.acordos.find((a) => a.id === id);
  if (acordo) return html`<${DetalheAcordo} key=${acordo.id} ...${props} acordo=${acordo} />`;
  return html`<${ListaAcordos} ...${props} />`;
}

function ListaAcordos({ estado, agora }) {
  const fin = estado.financeiro;
  const hoje = isoDia(agora);
  const lista = [...fin.acordos].reverse();
  return html`<div class="pilha">
    <div class="linha-entre"><h2>Acordos</h2><a class="btn primario" href="#sindico.cobranca.novoacordo">Novo acordo</a></div>
    ${lista.length
      ? html`<div class="tabela-rolagem"><table class="tabela">
          <thead><tr><th>Acordo</th><th>Unidade</th><th>Situação</th><th>Progresso</th><th>Próxima</th><th>Ação</th></tr></thead>
          <tbody>${lista.map((a) => {
            const p = progressoAcordo(estado, a);
            const r = fin.unidades[a.unidade].responsavel;
            return html`<tr key=${a.id}>
              <td>${a.id}</td>
              <td>${a.unidade} · ${r ? r.nome : '—'}</td>
              <td><${EtqAcordo} situacao=${a.situacao} /></td>
              <td>${p.pagas} de ${p.total} parcelas pagas</td>
              <td>${p.proxima ? html`${fmtDataCurta(p.proxima.vencimento)}${situacaoCobranca(p.proxima, hoje) === 'vencida' ? html` <${EtqCobranca} situacao="vencida" />` : ''}` : '—'}</td>
              <td><a class="btn-link" data-acordo=${a.id} href=${`#sindico.cobranca.${a.id}`}>Abrir</a></td>
            </tr>`;
          })}</tbody>
        </table></div>`
      : html`<${Vazio} texto="Nenhum acordo ainda." />`}
    <small class="sub">As parcelas viram cobranças comuns: pagamento pelo Asaas, baixa manual e régua funcionam igual.</small>
  </div>`;
}

function NovoAcordo({ estado, executar, agora, unidadeInicial }) {
  const hoje = isoDia(agora);
  const fin = estado.financeiro;
  const unidades = estado.condominio.unidades.filter((u) => debitosParaAcordo(estado, u, hoje).length);
  const inicial = unidades.includes(unidadeInicial) ? unidadeInicial : unidades[0] || '';
  const [unidade, setUnidade] = useState(inicial);
  const [marcados, setMarcados] = useState(inicial ? debitosParaAcordo(estado, inicial, hoje).map((c) => c.id) : []);
  const [perdoaMulta, setPerdoaMulta] = useState(false);
  const [jurosPct, setJurosPct] = useState('0');
  const [entrada, setEntrada] = useState('');
  const [parcelas, setParcelas] = useState('3');
  const [erro, setErro] = useState(null);
  const voltar = html`<a class="voltar" href="#sindico.cobranca.acordos">‹ Acordos</a>`;
  if (!unidades.length) return html`<div class="pilha">${voltar}<${Vazio} texto="Nenhuma unidade com débito vencido." /></div>`;
  const debitos = debitosParaAcordo(estado, unidade, hoje);
  const dados = { unidade, originais: marcados, perdoaMulta, jurosPerdoadosPct: Number(jurosPct), entrada: entrada.trim() ? lerPreco(entrada) : 0, parcelas: Number(parcelas) };
  const s = simularAcordo(estado, dados, hoje);

  function trocarUnidade(u) {
    setUnidade(u);
    setMarcados(debitosParaAcordo(estado, u, hoje).map((c) => c.id));
  }

  function enviar() {
    const r = executar((e) => proporAcordo(e, dados, 'sindico', new Date()));
    if (r.erro) setErro(r.erro);
    else ir('sindico', 'cobranca', r.id);
  }

  return html`<div class="pilha formulario">
    ${voltar}
    <h2>Novo acordo</h2>
    <${Campo} rotulo="Unidade"><select id="acordo-unidade" value=${unidade} onChange=${(ev) => trocarUnidade(ev.target.value)}>${unidades.map((u) => html`<option key=${u} value=${u}>${u} · ${fin.unidades[u].responsavel.nome}</option>`)}</select><//>
    <fieldset><legend>Débitos vencidos</legend>
      ${debitos.map((c) => html`<label key=${c.id} class="check"><input id=${`acordo-debito-${c.id}`} type="checkbox" checked=${marcados.includes(c.id)} onChange=${() => setMarcados(marcados.includes(c.id) ? marcados.filter((x) => x !== c.id) : [...marcados, c.id])} /><span>${rotuloCobranca(c)} · ${fmtReais(valorAtualizado(c, fin.parametros, hoje).total)}</span></label>`)}
    </fieldset>
    <label class="check"><input id="acordo-perdoa-multa" type="checkbox" checked=${perdoaMulta} onChange=${() => setPerdoaMulta(!perdoaMulta)} /><span>Perdoar a multa</span></label>
    <div class="edicao-anuncio">
      <${Campo} rotulo="Juros perdoados (%)"><input id="acordo-juros" type="number" min="0" max="100" value=${jurosPct} onInput=${(ev) => setJurosPct(ev.target.value)} /><//>
      <${Campo} rotulo="Entrada (R$)"><input id="acordo-entrada" inputmode="decimal" value=${entrada} onInput=${(ev) => setEntrada(ev.target.value)} placeholder="Ex.: 300,00" /><//>
      <${Campo} rotulo="Parcelas"><select id="acordo-parcelas" value=${parcelas} onChange=${(ev) => setParcelas(ev.target.value)}>${Array.from({ length: 12 }, (_, i) => html`<option key=${i + 1} value=${String(i + 1)}>${i + 1}</option>`)}</select><//>
    </div>
    ${s.ok
      ? html`<div class="cartao simulacao">
          <dl class="resumo">
            <dt>Valor original</dt><dd>${fmtReais(s.valorOriginal)}</dd>
            <dt>Multa e juros</dt><dd>${fmtReais(s.multa + s.juros)}</dd>
            <dt>Desconto</dt><dd>${fmtReais(-s.desconto)}</dd>
            <dt>Total do acordo</dt><dd><strong>${fmtReais(s.total)}</strong></dd>
          </dl>
          <strong>${dados.entrada ? `Entrada de ${fmtReais(dados.entrada)} + ` : ''}${dados.parcelas} × ${fmtReais(s.valorParcela)}${s.ultimaParcela !== s.valorParcela ? ` (a última de ${fmtReais(s.ultimaParcela)})` : ''}</strong>
          <ul class="itens-sacola">${s.cronograma.map((l) => html`<li key=${l.numero}><span>${nomeLinha(l.numero, dados.parcelas)} · ${fmtDataCurta(l.vencimento)}</span><span>${fmtReais(l.valor)}</span></li>`)}</ul>
        </div>`
      : html`<${Erro} texto=${s.motivo} />`}
    <${Erro} texto=${erro} />
    <button type="button" class="btn primario" data-acao="enviar-proposta" disabled=${!s.ok} onClick=${enviar}>Enviar proposta</button>
  </div>`;
}

function DetalheAcordo({ estado, executar, agora, acordo }) {
  const hoje = isoDia(agora);
  const fin = estado.financeiro;
  const [aberta, setAberta] = useState(null);
  const [documento, setDocumento] = useState(null);
  const [erro, setErro] = useState(null);
  const [mensagem, setMensagem] = useState(null);
  const r = fin.unidades[acordo.unidade].responsavel;
  const selecionada = aberta ? fin.cobrancas.find((c) => c.id === aberta) : null;
  const auditoria = fin.auditoria.filter((a) => a.detalhe.startsWith(acordo.id));
  if (documento) return html`<${PrevDoc} documento=${documento} aoFechar=${() => setDocumento(null)} />`;

  function cancelar() {
    const res = executar((e) => cancelarProposta(e, acordo.id, 'sindico', new Date()));
    setErro(res.erro || null);
    setMensagem(res.erro ? null : 'Proposta cancelada. Os débitos originais continuam valendo.');
  }

  return html`<div class="pilha">
    <a class="voltar" href="#sindico.cobranca.acordos">‹ Acordos</a>
    <div class="linha-entre"><h2>Acordo ${acordo.id} · apto ${acordo.unidade}</h2><${EtqAcordo} situacao=${acordo.situacao} /></div>
    <small class="sub">${r ? r.nome : '—'} · proposto em ${fmtDataCurta(acordo.criadoEm)}${acordo.aceitoEm ? ` · aceito em ${fmtDataCurta(acordo.aceitoEm)} por ${acordo.aceitoPor}` : ''}</small>
    <div class="cartao"><${ResumoAcordo} estado=${estado} acordo=${acordo} /></div>
    <h2>${acordo.situacao === 'aguardando' ? 'Cronograma proposto' : 'Cronograma'}</h2>
    ${selecionada && html`<${DetalheCobranca} key=${selecionada.id} estado=${estado} cobranca=${selecionada} executar=${executar} hoje=${hoje} aoFechar=${() => setAberta(null)} />`}
    <div class="cartao"><${Cronograma} estado=${estado} acordo=${acordo} hoje=${hoje} aoAbrir=${setAberta} /></div>
    <div class="acoes">
      ${liberado(estado.plano, 'termoConfissao') && html`<button type="button" class="btn secundario" onClick=${() => setDocumento(termoDoAcordo(acordo))}>Ver termo de confissão</button>`}
      ${acordo.situacao === 'aguardando' && html`<button type="button" class="btn secundario" onClick=${cancelar}>Cancelar proposta</button>`}
    </div>
    <${Erro} texto=${erro} />
    <${Sucesso} texto=${mensagem} />
    <h2>Auditoria</h2>
    <ul class="auditoria">${[...auditoria].reverse().map((a, n) => html`<li key=${n}><span class="lt-quando">${fmtDataHora(a.em)}</span> <strong>${a.acao}</strong> · ${a.detalhe} · ${a.quem}</li>`)}</ul>
  </div>`;
}

function PropostaAcordo({ estado, executar, acordo, hoje, eu }) {
  const [ciente, setCiente] = useState(false);
  const [documento, setDocumento] = useState(null);
  const [erro, setErro] = useState(null);
  const comTermo = liberado(estado.plano, 'termoConfissao');
  if (documento) return html`<${PrevDoc} documento=${documento} aoFechar=${() => setDocumento(null)} />`;

  function lerTermo() {
    executar((e) => marcarTermoLido(e, acordo.id, new Date()));
    setDocumento(termoDoAcordo(acordo));
  }

  function aceitar() {
    const r = executar((e) => aceitarAcordo(e, acordo.id, { quem: pessoaDaUnidade(estado, eu).nome, ciente }, new Date()));
    setErro(r.erro || null);
  }

  return html`<article class="cartao proposta-acordo">
    <div class="linha-entre"><strong>Proposta de acordo ${acordo.id}</strong><${EtqAcordo} situacao=${acordo.situacao} /></div>
    <small class="sub">Enviada pelo síndico em ${fmtDataCurta(acordo.criadoEm)}. Ao aceitar, os débitos incluídos são substituídos pelas parcelas abaixo.</small>
    <${ResumoAcordo} estado=${estado} acordo=${acordo} />
    <${Cronograma} estado=${estado} acordo=${acordo} hoje=${hoje} />
    ${comTermo && html`<button type="button" class="btn secundario" onClick=${lerTermo}>${acordo.termoLidoEm ? 'Abrir de novo o termo' : 'Ler o termo de confissão de dívida'}</button>`}
    <label class="check"><input id="acordo-ciente" type="checkbox" checked=${ciente} onChange=${() => setCiente(!ciente)} /><span>Li e aceito as condições do acordo</span></label>
    <${Erro} texto=${erro} />
    <button type="button" class="btn primario bloco" onClick=${aceitar}>Aceitar acordo</button>
  </article>`;
}

function MeuAcordo({ estado, acordo, hoje }) {
  const p = progressoAcordo(estado, acordo);
  const pct = Math.round((p.pagas / p.total) * 100);
  return html`<article class="cartao">
    <div class="linha-entre"><strong>Meu acordo ${acordo.id}</strong><${EtqAcordo} situacao=${acordo.situacao} /></div>
    <small class="sub">${p.pagas} de ${p.total} parcelas pagas · total ${fmtReais(acordo.total)}</small>
    <div class="barra" role="progressbar" aria-label="Parcelas pagas" aria-valuenow=${p.pagas} aria-valuemin="0" aria-valuemax=${p.total}><span style=${`width:${pct}%`}></span></div>
    <details class="composicao"><summary>Cronograma</summary><${Cronograma} estado=${estado} acordo=${acordo} hoje=${hoje} /></details>
  </article>`;
}

// ---- src/ui/manutencao-sindico.js ----

const CORES_PRIORIDADE = { urgente: 'perigo', alta: 'alerta', normal: 'info', baixa: 'neutro' };
const CORES_STATUS_OS = { aberta: 'info', em_execucao: 'alerta', aguardando_material: 'neutro', aguardando_prestador: 'neutro', concluida: 'ok', validada: 'ok' };
const NOMES_STATUS_COMPRA = { solicitada: 'Aguardando aprovação', aprovada: 'Aprovada', recusada: 'Recusada', recebida: 'Recebida' };
const CORES_STATUS_COMPRA = { solicitada: 'alerta', aprovada: 'info', recusada: 'neutro', recebida: 'ok' };
const ABAS_MANUTENCAO = [['os', 'Ordens de serviço'], ['compras', 'Compras'], ['caixa', 'Caixa pequeno']];

function EtqPrioridade({ prioridade }) {
  return html`<${Etiqueta} tipo=${CORES_PRIORIDADE[prioridade]}>${PRIORIDADES[prioridade].nome}<//>`;
}

function EtqOS({ status }) {
  return html`<${Etiqueta} tipo=${CORES_STATUS_OS[status]}>${NOMES_STATUS_OS[status]}<//>`;
}

function EtqCompra({ status }) {
  return html`<${Etiqueta} tipo=${CORES_STATUS_COMPRA[status]}>${NOMES_STATUS_COMPRA[status]}<//>`;
}

function fmtPrazo(iso) {
  const d = new Date(iso);
  return `${fmtDataCurta(isoDia(d))} ${String(d.getHours()).padStart(2, '0')}h`;
}

function FotosOS({ os }) {
  return html`<div class="fotos-reparo"><${FotoFalsa} rotulo="Foto do antes" />${os.fotoDepois && html`<${FotoFalsa} rotulo="Foto do depois" />`}</div>`;
}

function SManutencao(props) {
  const { estado, rota } = props;
  if (!liberado(estado.plano, 'zelador')) {
    return html`<section><h1>Manutenção</h1><${Bloqueado} estado=${estado} recurso="zelador" titulo="Ordens de serviço, compras com aprovação e caixa pequeno do zelador" /></section>`;
  }
  const id = rota.id || '';
  const os = id.startsWith('OS-') ? estado.manutencao.os.find((o) => o.id === id) : null;
  const compra = id.startsWith('CP-') ? estado.manutencao.compras.find((c) => c.id === id) : null;
  const aba = compra ? 'compras' : os || id === 'novaos' ? 'os' : ABAS_MANUTENCAO.some(([a]) => a === id) ? id : 'os';
  let conteudo;
  if (os) conteudo = html`<${MDetalheOSSindico} key=${os.id} ...${props} os=${os} />`;
  else if (compra) conteudo = html`<${MDetalheCompraSindico} key=${compra.id} ...${props} compra=${compra} />`;
  else if (id === 'novaos') conteudo = html`<${MNovaOSSindico} ...${props} />`;
  else conteudo = { os: html`<${MListaOS} ...${props} />`, compras: html`<${MListaCompras} ...${props} />`, caixa: html`<${MCaixaSindico} ...${props} />` }[aba];
  return html`<section>
    <h1>Manutenção</h1>
    <p class="sub">Ordens de serviço e compras do zelador (${ZELADOR}). Cada compra recebida entra sozinha nas despesas do mês.</p>
    <nav class="chips" aria-label="Manutenção">${ABAS_MANUTENCAO.map(([a, nome]) => html`<a key=${a} class="chip" href=${`#sindico.manutencao.${a}`} aria-current=${aba === a ? 'page' : undefined}>${nome}</a>`)}</nav>
    ${conteudo}
  </section>`;
}

function MListaOS({ estado }) {
  const lista = listaOS(estado);
  return html`<div class="pilha">
    <div class="linha-entre"><h2>Ordens de serviço</h2><a class="btn primario" href="#sindico.manutencao.novaos">Nova OS</a></div>
    <div class="tabela-rolagem"><table class="tabela">
      <thead><tr><th>OS</th><th>Local</th><th>Prioridade</th><th>Responsável</th><th>Prazo</th><th>Status</th><th>Ação</th></tr></thead>
      <tbody>${lista.map((o) => html`<tr key=${o.id}>
        <td>${o.id}${o.notificacao ? html`<br /><small class="sub">${o.notificacao}</small>` : ''}</td>
        <td>${o.local}</td>
        <td><${EtqPrioridade} prioridade=${o.prioridade} /></td>
        <td>${o.responsavel === 'prestador' ? o.prestador : ZELADOR}</td>
        <td>${fmtPrazo(o.prazo)}</td>
        <td><${EtqOS} status=${o.status} /></td>
        <td><a class="btn-link" data-os=${o.id} href=${`#sindico.manutencao.${o.id}`}>Abrir</a></td>
      </tr>`)}</tbody>
    </table></div>
  </div>`;
}

function MNovaOSSindico({ executar }) {

    ${(os.materiais || os.horas > 0 || os.observacoes) && html`<dl class="resumo">
      <dt>Materiais</dt><dd>${os.materiais || '—'}</dd>

    <h2>Linha do tempo</h2>

      <${Campo} rotulo="Motivo da recusa"><input id="compra-motivo-recusa" value=${motivo} onInput=${(ev) => setMotivo(ev.target.value)} /><//>

function MCaixaSindico({ estado, executar }) {
  const [erro, setErro] = useState(null);
  const [mensagem, setMensagem] = useState(null);
  if (!liberado(estado.plano, 'caixaPequeno')) return html`<${Bloqueado} estado=${estado} recurso="caixaPequeno" titulo="Caixa pequeno do zelador com cupom, saldo e reposição" />`;

const ABAS_ESCALA = [['semana', 'Semana'], ['calendario', 'Calendário'], ['pendencias', 'Pendências'], ['equipe', 'Equipe'], ['horas', 'Horas']];

function horaCurta(local) {
  return `${Number(local.slice(11, 13))}h`;
}

function nomeOuDescoberto(t) {
  return t.porteiro ? porteiroPorId(t.porteiro).nome : `Descoberto · ${NOMES_MOTIVO[t.motivoDescoberto] || 'sem porteiro'}`;
}

function SEscala(props) {
  const { estado, rota } = props;
  if (!liberado(estado.plano, 'escala')) {
    return html`<section><h1>Escala</h1><${Bloqueado} estado=${estado} recurso="escala" titulo="Escala de porteiros com trocas, faltas e cobertura" /></section>`;
  }
  if (estado.escala.semEquipe) return html`<section><h1>Escala</h1><${Vazio} texto="Cadastre a equipe da portaria para montar a escala (em breve na implantação)." /></section>`;
  const aba = ABAS_ESCALA.some(([id]) => id === rota.id) ? rota.id : 'semana';
  const Conteudo = { semana: ESemana, calendario: ECalendario, pendencias: EPendencias, equipe: EEquipe, horas: EHoras }[aba];
  return html`<section>
    <h1>Escala</h1>
    <p class="sub">Escala dos porteiros por posto. Trocas e faltas chegam aqui para aprovação; o sistema avisa (não bloqueia) quando o descanso entre turnos fica abaixo de 11 h.</p>
    <nav class="chips" aria-label="Escala">${ABAS_ESCALA.map(([id, nome]) => html`<a key=${id} class="chip" href=${`#sindico.escala.${id}`} aria-current=${aba === id ? 'page' : undefined}>${nome}</a>`)}</nav>
    <${Conteudo} ...${props} />
  </section>`;
}

function ESemana({ estado, executar, agora }) {
  return html`<${SemanaEscala} estado=${estado} executar=${executar} agora=${agora} editavel=${true} />`;
}

function ECalendario({ estado, executar, agora }) {
  const atual = mesAtual(agora);
  const meses = [atual, somarMes(atual, 1)];
  const [mes, setMes] = useState(atual);
  const [posto, setPosto] = useState('portaria');
  const [editando, setEditando] = useState(null);
  const [erro, setErro] = useState(null);
  const [mensagem, setMensagem] = useState(null);
  const m = estado.escala.meses[mes];
  const hoje = isoDia(agora);

  function rodar(acao, sucesso) {
    const r = executar(acao);
    setErro(r.erro || r.alerta || null);
    setMensagem(r.erro ? null : sucesso);
    return r;
  }

  const seletores = html`<div class="edicao-anuncio">
    <${Campo} rotulo="Mês"><select id="escala-mes" value=${mes} onChange=${(ev) => { setMes(ev.target.value); setEditando(null); }}>${meses.map((x) => html`<option key=${x} value=${x}>${nomeDoMesEscala(x)}</option>`)}</select><//>
    <${Campo} rotulo="Posto"><select id="escala-posto" value=${posto} onChange=${(ev) => { setPosto(ev.target.value); setEditando(null); }}>${Object.entries(POSTOS).map(([id, p]) => html`<option key=${id} value=${id}>${p.nome}</option>`)}</select><//>
  </div>`;

  if (!m) {
    return html`<div class="pilha">
      ${seletores}
      <p class="sub">A escala de ${nomeDoMesEscala(mes)} ainda não foi gerada. Ela é montada a partir dos modelos de turno de cada porteiro e já considera as férias.</p>
      <button type="button" class="btn primario" data-acao="gerar-escala" onClick=${() => rodar((e) => gerarEscala(e, mes, 'sindico'), `Escala de ${nomeDoMesEscala(mes)} gerada em rascunho.`)}>Gerar escala de ${nomeDoMesEscala(mes)}</button>
      <${Erro} texto=${erro} />
    </div>`;
  }

  const lista = buracos(estado, mes, posto);
  const descanso = descansoInsuficiente(estado, mes);
  const feriados = Object.fromEntries(feriadosDoMes(mes).map((f) => [f.dia, f.nome]));
  const turnos = m.turnos.filter((t) => t.posto === posto);
  const podeCobrir = PORTEIROS.filter((p) => p.postos.includes(posto));

  return html`<div class="pilha">
    ${seletores}
    <div class="linha-entre">
      <p class="sub">${lista.length} buracos de cobertura · ${descanso.length} alertas de descanso · ${m.situacao === 'publicada' ? `publicada em ${fmtDataCurta(m.publicadaEm.slice(0, 10))}` : 'rascunho'}</p>
      ${m.situacao === 'rascunho' && html`<button type="button" class="btn primario" data-acao="publicar-escala" onClick=${() => rodar((e) => publicarEscala(e, mes, 'sindico', new Date()), 'Escala publicada.')}>Publicar escala</button>`}
    </div>
    <${Erro} texto=${erro} />
    <${Sucesso} texto=${mensagem} />
    <div class="grade-escala">${diasDoMes(mes).map((dia) => html`<div key=${dia} class=${`dia-escala${dia === hoje ? ' hoje' : ''}`}>

function EPendencias({ estado, executar, agora }) {

  function rodar(acao, sucesso) {

              <button type="button" class="btn secundario" onClick=${() => rodar((e) => recusarTroca(e, x.id, null, 'sindico'), 'Troca recusada.')}>Recusar</button>

          </li>`;
        })}</ul>`
      : html`<${Vazio} texto="Nenhuma troca aguardando." />`}
    <h2>Turnos descobertos</h2>
    ${descobertos.length
      ? html`<ul class="m-lista">${descobertos.map((t) => html`<li key=${t.id} class="cartao">
          <strong>${POSTOS[t.posto].nome} · ${fmtTurno(t)}</strong>
          <small class="sub">${NOMES_MOTIVO[t.motivoDescoberto] || 'sem porteiro'}${t.porteiroOriginal ? ` de ${porteiroPorId(t.porteiroOriginal).nome}` : ''}${t.anexo ? ` · ${t.anexo}` : ''}</small>
          <ul class="itens-sacola">${sugestoesCobertura(estado, t.id).map((s) => {
            const p = porteiroPorId(s.porteiro);

              <span>${p.nome} · ${NOMES_VINCULO[p.vinculo]} · ${s.descanso === Infinity ? 'livre' : `${s.descanso} h de descanso`}${s.alerta11 ? ' · ⚠ menos de 11 h' : ''}</span>
              <button type="button" class="btn secundario" data-atribuir=${`${t.id}-${s.porteiro}`} onClick=${() => rodar((e) => atribuirCobertura(e, t.id, s.porteiro, 'sindico'), `${p.nome} cobre o turno.`)}>Atribuir</button>
            </li>`;
          })}</ul>
        </li>`)}</ul>`
      : html`<${Vazio} texto="Nenhum turno descoberto." />`}
    <${Erro} texto=${erro} />

function responsavelDaPessoa(estado, eu) {
  const responsavel = estado.financeiro.unidades[eu].responsavel;
  const pessoa = pessoaDaUnidade(estado, eu);
  return { responsavel, souResponsavel: !!responsavel && !!pessoa && responsavel.nome === pessoa.nome };
}

function cobrancasDaUnidade(estado, eu, hoje) {
  const minhas = estado.financeiro.cobrancas.filter((c) => c.unidade === eu);
  const todas = minhas.filter((c) => c.status === 'aberta').sort((a, b) => a.vencimento.localeCompare(b.vencimento));
  // Do acordo, só as vencidas ou, se nenhuma venceu, a próxima: o cronograma completo fica em "Meu acordo".
  const comVencida = new Set(todas.filter((c) => c.acordo && c.vencimento < hoje).map((c) => c.acordo.id));
  const vistos = new Set();
  const abertas = todas.filter((c) => {
    if (!c.acordo || c.vencimento < hoje) return true;
    if (comVencida.has(c.acordo.id) || vistos.has(c.acordo.id)) return false;
    vistos.add(c.acordo.id);
    return true;
  });
  return {
    abertas,
    pagas: minhas.filter((c) => c.status === 'paga').sort((a, b) => b.pagaEm.localeCompare(a.pagaEm)),
    substituidas: minhas.filter((c) => c.status === 'cancelada' && c.substituidaPor),
  };
}

function nomeAbreviado(nome) {
  const partes = nome.split(' ');
  return `${partes[0]} ${partes[partes.length - 1][0]}.`;
}

function linhaDigitavel(cobranca, total) {
  const n = cobranca.id.replace(/\D/g, '').padEnd(12, '0').slice(0, 12);
  return `34191.${n.slice(0, 5)} ${n.slice(5, 10)}.${n.slice(10)}0001 23456.789012 1 ${String(total).padStart(10, '0')}`;
}

function CartaoCobrancaInicio({ estado, eu, agora }) {
  const hoje = isoDia(agora);
  if (!responsavelDaPessoa(estado, eu).souResponsavel) return null;
  const proposta = propostaPendente(estado, eu);
  if (proposta) return html`<a class="cartao link cobranca-inicio" href="#morador.financeiro"><strong>Proposta de acordo do síndico</strong><span class="preco grande">${fmtReais(proposta.total)}</span><small class="sub">${proposta.entrada ? `Entrada de ${fmtReais(proposta.entrada)} + ` : ''}${proposta.parcelas} parcelas · toque para ver e aceitar</small><span class="btn primario">Ver proposta</span></a>`;
  const { abertas } = cobrancasDaUnidade(estado, eu, hoje);
  if (!abertas.length) return html`<a class="cartao link" href="#morador.financeiro"><strong>Financeiro em dia</strong><span class="sub">Nenhuma cobrança em aberto.</span></a>`;
  const c = abertas[0];
  const situacao = situacaoCobranca(c, hoje);
  const v = valorAtualizado(c, estado.financeiro.parametros, hoje);
  return html`<a class=${`cartao link cobranca-inicio${situacao === 'vencida' ? ' vencida' : ''}`} href="#morador.financeiro">
    <div class="linha-entre"><strong>${c.acordo ? `Sua cobrança: ${rotuloCobranca(c)}` : `Sua cobrança de ${mesExtenso(c.competencia)}`}</strong><${EtqCobranca} situacao=${situacao} /></div>
    <span class="preco grande">${fmtReais(v.total)}</span>
    <small class="sub">${situacao === 'vencida' ? `Venceu em ${fmtDataCurta(c.vencimento)} · valor com multa e juros` : `Vence em ${fmtDataCurta(c.vencimento)}`}</small>
    <span class="btn primario">Pagar</span>
  </a>`;
}

function CartaoCobranca({ estado, cobranca, executar, hoje }) {
  const fin = estado.financeiro;
  const [forma, setForma] = useState(null);
  const [mensagem, setMensagem] = useState(null);
  const situacao = situacaoCobranca(cobranca, hoje);
  const v = valorAtualizado(cobranca, fin.parametros, hoje);
  // Emitida no Asaas sandbox: Pix, boleto e fatura são os reais; senão, simulados como no resto do protótipo.
  const asaas = cobranca.asaas || null;
  const [enviando, setEnviando] = useState(false);
  const copiaECola = asaas && asaas.pixCopiaCola ? asaas.pixCopiaCola : `00020126580014BR.GOV.BCB.PIX0136${cobranca.id}5204000053039865406${(v.total / 100).toFixed(2)}5802BR`;
  const formas = [['pix', 'Pagar com Pix'], ['boleto', 'Boleto'], ['cartao', 'Cartão']].filter(([k]) => fin.parametros.formas.includes(k));

  function copiar() {
    const campo = document.getElementById(`pix-${cobranca.id}`);
    const selecionar = () => {
      campo.select();
      setMensagem('Selecione e copie o código acima.');
    };
    if (!navigator.clipboard) {
      selecionar();
      return;
    }
    navigator.clipboard.writeText(copiaECola).then(() => setMensagem('Código Pix copiado.')).catch(selecionar);
  }

  async function simularNoSandbox() {
    setEnviando(true);
    try {
      await chamarApi('POST', '/api/simular-pagamento', { referencia: asaas.referencia });
      setMensagem('Pagamento enviado ao sandbox. A baixa chega pelo webhook em alguns segundos.');
    } catch (e) {
      setMensagem(e.message);
    }
    setEnviando(false);
  }

  function confirmar() {
    const r = executar((e) => confirmarPagamentoAsaas(e, cobranca.id, `evt-${cobranca.id}-${forma}`, forma, new Date()));
    if (r.erro) setMensagem(r.erro);
  }

  return html`<article class=${`cartao cobranca${situacao === 'vencida' ? ' vencida' : ''}`}>
    <div class="linha-entre"><strong>${rotuloCobranca(cobranca)}</strong><${EtqCobranca} situacao=${situacao} /></div>
    <span class="preco grande">${fmtReais(v.total)}</span>
    <small class="sub">${situacao === 'vencida'
      ? `Venceu em ${fmtDataCurta(cobranca.vencimento)} · ${fmtReais(cobranca.valor)} + multa ${fmtReais(v.multa)} + juros ${fmtReais(v.juros)} (${v.dias} dias)`
      : `Vence em ${fmtDataCurta(cobranca.vencimento)}`}</small>
    <details class="composicao"><summary>Composição</summary>
      <ul class="itens-sacola">${cobranca.itens.map((i, n) => html`<li key=${n}><span>${i.descricao}</span><span>${fmtReais(i.valor)}</span></li>`)}</ul>
    </details>
    <div class="acoes" role="group" aria-label="Forma de pagamento">
      ${formas.map(([k, nome]) => html`<button type="button" key=${k} class=${forma === k ? 'btn primario' : 'btn secundario'} aria-pressed=${forma === k} onClick=${() => { setForma(k); setMensagem(null); }}>${nome}</button>`)}
    </div>
    ${forma === 'pix' && html`<div class="pagamento">
      ${asaas && asaas.pixImagem ? html`<img class="pix-real" alt="QR Code Pix" width="160" height="160" src=${`data:image/png;base64,${asaas.pixImagem}`} />` : html`<${QrFalso} texto=${cobranca.id} tamanho=${120} />`}
      <label class="campo"><span>Pix copia e cola</span><input id=${`pix-${cobranca.id}`} readonly value=${copiaECola} /></label>
      <button type="button" class="btn secundario" onClick=${copiar}>Copiar código</button>
    </div>`}
    ${forma === 'boleto' && asaas && html`<div class="pagamento">
      <a class="btn secundario" href=${asaas.boletoUrl} target="_blank" rel="noopener">Abrir boleto</a>
    </div>`}
    ${forma === 'boleto' && !asaas && html`<div class="pagamento">
      <label class="campo"><span>Linha digitável</span><input id=${`boleto-${cobranca.id}`} readonly value=${linhaDigitavel(cobranca, v.total)} /></label>
      <small class="sub">O PDF do boleto chega por e-mail e WhatsApp.</small>
    </div>`}
    ${forma === 'cartao' && html`<div class="pagamento"><small class="sub">O cartão é pago na página segura do Asaas (simulada no protótipo).</small></div>`}
    ${asaas && html`<a class="btn-link" href=${asaas.faturaUrl} target="_blank" rel="noopener">Abrir fatura do Asaas</a>`}
    ${forma && asaas && html`<button type="button" class="btn primario bloco" data-acao="simular-sandbox" disabled=${enviando} onClick=${simularNoSandbox}>Simular pagamento no sandbox</button>`}
    ${forma && !asaas && html`<button type="button" class="btn primario bloco" onClick=${confirmar}>Simular confirmação do Asaas</button>`}
    <${Sucesso} texto=${mensagem} />
    <button type="button" class="btn-link" onClick=${() => setMensagem(`2ª via gerada com valor atualizado: ${fmtReais(v.total)}.`)}>Gerar 2ª via</button>
  </article>`;
}

function MFinanceiro({ estado, eu, executar, agora }) {
  const hoje = isoDia(agora);
  const [documento, setDocumento] = useState(null);
  const { responsavel, souResponsavel } = responsavelDaPessoa(estado, eu);
  const pessoa = pessoaDaUnidade(estado, eu);
  if (documento) return html`<section class="m-pagina"><${PrevDoc} documento=${documento} aoFechar=${() => setDocumento(null)} /></section>`;
  if (!souResponsavel) {
    return html`<section class="m-pagina">
      <h1 class="m-titulo">Financeiro</h1>
      <div class="cartao">
        <strong>As cobranças do apto ${eu} vão para o responsável financeiro</strong>
        <span>${responsavel ? `${nomeAbreviado(responsavel.nome)} (${NOMES_RELACAO[responsavel.relacao]})` : 'Responsável ainda não cadastrado'}</span>
        <small class="sub">Se isso mudou, avise o síndico.</small>
      </div>
    </section>`;
  }
  const { abertas, pagas, substituidas } = cobrancasDaUnidade(estado, eu, hoje);
  const proposta = propostaPendente(estado, eu);
  const ativo = acordoAtivo(estado, eu);
  const vencidaSemAcordo = abertas.some((c) => !c.acordo && situacaoCobranca(c, hoje) === 'vencida');
  const ano = hoje.slice(0, 4);
  const recibo = (c) => ({ titulo: `Recibo · ${rotuloCobranca(c)} · apto ${eu}`, pasta: 'Financeiro', versoes: [{ versao: 1, data: isoDia(new Date(c.pagaEm)) }] });
  const temVencida = abertas.some((c) => situacaoCobranca(c, hoje) === 'vencida');
  return html`<section class="m-pagina">
    <h1 class="m-titulo">Financeiro</h1>
    <p class="m-sub">Responsável financeiro: ${responsavel.nome} · ${pessoa && pessoa.naoResidente ? 'proprietário não residente' : `apto ${eu}`}</p>
    ${proposta && html`<${PropostaAcordo} key=${proposta.id} estado=${estado} executar=${executar} acordo=${proposta} hoje=${hoje} eu=${eu} />`}
    ${ativo && html`<${MeuAcordo} estado=${estado} acordo=${ativo} hoje=${hoje} />`}
    <${MudancasTaxa} estado=${estado} eu=${eu} hoje=${hoje} />
    <h2>Em aberto</h2>
    ${abertas.length
      ? abertas.map((c) => html`<${CartaoCobranca} key=${c.id} estado=${estado} cobranca=${c} executar=${executar} hoje=${hoje} />`)
      : html`<${Vazio} texto="Nenhuma cobrança em aberto. Tudo em dia!" />`}
    ${!proposta && !ativo && vencidaSemAcordo && html`<small class="sub">Quer parcelar? Fale com o síndico para propor um acordo.</small>`}
    <h2>Histórico</h2>
    ${pagas.length || substituidas.length
      ? html`<ul class="m-lista">${pagas.map((c) => html`<li key=${c.id} class="cartao">
          <div class="linha-entre"><strong>${rotuloCobranca(c)}</strong><span>${fmtReais(c.valorPago)}</span></div>
          <small class="sub">Pago em ${fmtDataCurta(isoDia(new Date(c.pagaEm)))} · ${NOMES_FORMA[c.forma]}</small>
          <button type="button" class="btn-link" onClick=${() => setDocumento(recibo(c))}>Ver recibo</button>
        </li>`)}
          ${substituidas.map((c) => html`<li key=${c.id} class="cartao"><div class="linha-entre"><strong>${nomeMes(c.competencia)}</strong><${EtqCobranca} situacao="cancelada" /></div><small class="sub">Substituída pelo acordo ${c.substituidaPor}</small></li>`)}</ul>`
      : html`<${Vazio} texto="Nenhum pagamento registrado." />`}
    ${temVencida
      ? html`<small class="sub">A declaração de quitação fica disponível quando não houver débitos vencidos.</small>`
      : html`<button type="button" class="btn secundario" onClick=${() => setDocumento({ titulo: `Declaração anual de quitação de débitos ${ano} · apto ${eu}`, pasta: 'Financeiro', versoes: [{ versao: 1, data: hoje }] })}>Declaração de quitação ${ano}</button>`}
  </section>`;
}

function TelaVendas(props) {
  const { estado, rota, eu } = props;
  const id = rota.id;
  const pessoa = pessoaDaUnidade(estado, eu);
  const naSacola = estado.sacola.reduce((soma, i) => soma + i.quantidade, 0);
  let conteudo;
  let aba = 'vitrine';
  if (id === 'sacola') {
    conteudo = html`<${VSacola} ...${props} />`;
    aba = 'sacola';
  } else if (id === 'pedidos') {
    conteudo = html`<${VMeusPedidos} ...${props} />`;
    aba = 'pedidos';
  } else if (id === 'loja' || id === 'novo-anuncio') {
    conteudo = id === 'loja' ? html`<${VLoja} ...${props} />` : html`<${VNovoAnuncio} ...${props} />`;
    aba = 'loja';
  } else if (id && id.startsWith('PD-')) {
    const pedido = estado.pedidos.find((p) => p.id === id && (p.comprador === eu || p.vendedor === eu));
    conteudo = pedido ? html`<${VPedido} key=${pedido.id} ...${props} pedido=${pedido} />` : html`<${Vazio} texto="Pedido não encontrado." />`;
    aba = pedido && pedido.vendedor === eu ? 'loja' : 'pedidos';
  } else if (id && anuncioPorId(estado, id)) {
    conteudo = html`<${VAnuncio} key=${id} ...${props} anuncio=${anuncioPorId(estado, id)} />`;
  } else {
    conteudo = html`<${VVitrine} ...${props} />`;
  }
  const links = [['vitrine', 'Vitrine', '#morador.vendas'], ['pedidos', 'Meus pedidos', '#morador.vendas.pedidos'], ['loja', pessoa.vendedor === 'aprovado' ? 'Minha loja' : 'Vender', '#morador.vendas.loja']];
  return html`<section class="m-pagina">
    <h1 class="m-titulo">Vendas</h1>
    <nav class="vendas-nav" aria-label="Vendas">
      ${links.map(([chave, nome, href]) => html`<a key=${chave} href=${href} class=${aba === chave ? 'ativa' : ''} aria-current=${aba === chave ? 'page' : undefined}>${nome}</a>`)}
      <a class=${`sacola${aba === 'sacola' ? ' ativa' : ''}`} href="#morador.vendas.sacola" aria-label=${`Sacola com ${naSacola} ${naSacola === 1 ? 'item' : 'itens'}`}><${Icone} nome="sacola" tamanho=${20} />${naSacola}</a>
    </nav>
    ${conteudo}
  </section>`;
}

function VVitrine({ estado, eu }) {
  const [categoria, setCategoria] = useState('todas');
  const [busca, setBusca] = useState('');
  const termo = busca.trim().toLowerCase();
  const lista = anunciosVisiveis(estado).filter((a) => (categoria === 'todas' || a.categoria === categoria) && (!termo || `${a.titulo} ${a.descricao}`.toLowerCase().includes(termo)));
  return html`<div class="pilha">
    <${Campo} rotulo="Buscar na vitrine"><input id="vitrine-busca" type="search" value=${busca} onInput=${(ev) => setBusca(ev.target.value)} placeholder="Ex.: brigadeiro, bicicleta" /><//>
    <div class="chips" role="group" aria-label="Categoria">
      ${[['todas', 'Todas'], ...Object.entries(CATEGORIAS_VENDA)].map(([chave, nome]) => html`<button type="button" key=${chave} class="chip" aria-pressed=${categoria === chave} onClick=${() => setCategoria(chave)}>${nome}</button>`)}
    </div>
    ${lista.length
      ? html`<ul class="anuncios">${lista.map((a) => html`<li key=${a.id}><${CartaoAnuncio} estado=${estado} anuncio=${a} eu=${eu} /></li>`)}</ul>`
      : html`<${Vazio} texto="Nenhum anúncio encontrado." />`}
  </div>`;
}

function VAnuncio({ estado, eu, executar, anuncio }) {
  const [quantidade, setQuantidade] = useState('1');
  const [erro, setErro] = useState(null);
  const [adicionado, setAdicionado] = useState(false);
  const proprio = anuncio.vendedor === eu;

  function adicionar() {
    const r = executar((e) => adicionarASacola(e, anuncio.id, Number(quantidade)));
    setErro(r.erro || null);
    setAdicionado(!r.erro);
  }

  return html`<div class="pilha">
    <a class="voltar" href="#morador.vendas">‹ Vitrine</a>
    <${FotoProduto} categoria=${anuncio.categoria} />
    <p class="anuncio-titulo">${anuncio.titulo}</p>
    <p class="preco grande">${fmtCentavos(anuncio.preco)}</p>
    <p class="m-texto">${anuncio.descricao}</p>
    <dl class="resumo">
      <dt>Vendedor</dt><dd>${nomeVizinho(estado, anuncio.vendedor)} · apto ${anuncio.vendedor}</dd>
      <dt>Pagamento</dt><dd>${anuncio.pagamentos.map((k) => PAGAMENTOS[k]).join(', ')}</dd>
      <dt>Entrega</dt><dd>${anuncio.entregas.map((k) => ENTREGAS[k]).join(', ')}</dd>
      <dt>Disponível</dt><dd>${anuncio.quantidade ? `Restam ${anuncio.quantidade}` : 'Esgotado'}</dd>
    </dl>
    ${proprio
      ? html`<p class="sub">Este anúncio é seu. Altere preço e quantidade em Minha loja.</p>`
      : html`<${Campo} rotulo="Quantidade"><input id="anuncio-quantidade" type="number" min="1" max=${anuncio.quantidade} inputmode="numeric" value=${quantidade} onInput=${(ev) => setQuantidade(ev.target.value)} /><//>
        <${Erro} texto=${erro} />
        ${adicionado && html`<p class="sucesso" role="status">Adicionado à sacola. <a href="#morador.vendas.sacola">Ver sacola</a></p>`}
        <button type="button" class="btn primario bloco" disabled=${!anuncio.quantidade} onClick=${adicionar}>Adicionar à sacola</button>`}
  </div>`;
}

function VSacola({ estado, executar }) {
  const grupos = sacolaPorVendedor(estado);
  const [escolhas, setEscolhas] = useState({});
  const [erro, setErro] = useState(null);
  const escolhaDe = (g) => {
    const feita = escolhas[g.vendedor] || {};
    return {
      pagamento: feita.pagamento || (g.pagamentos.length === 1 ? g.pagamentos[0] : ''),
      entrega: feita.entrega || (g.entregas.length === 1 ? g.entregas[0] : ''),
    };
  };

  function escolher(vendedor, campo, valor) {
    setEscolhas({ ...escolhas, [vendedor]: { ...(escolhas[vendedor] || {}), [campo]: valor } });
  }

  function fechar() {
    const finais = Object.fromEntries(grupos.map((g) => [g.vendedor, escolhaDe(g)]));
    const r = executar((e) => fecharPedido(e, finais, new Date()));
    if (r.erro) {
      setErro(r.erro);
      return;
    }
    ir('morador', 'vendas', r.id);
  }

  if (!grupos.length) {
    return html`<div class="pilha"><${Vazio} texto="Sua sacola está vazia." /><a class="btn secundario" href="#morador.vendas">Ver a vitrine</a></div>`;
  }
  const total = grupos.reduce((soma, g) => soma + g.subtotal, 0);
  const opcoes = (g, campo, nomes, lista, vazio) => (lista.length
    ? lista.map((k) => html`<label key=${k} class="check"><input id=${`${campo}-${g.vendedor}-${k}`} type="radio" name=${`${campo}-${g.vendedor}`} checked=${escolhaDe(g)[campo] === k} onChange=${() => escolher(g.vendedor, campo, k)} /><span>${nomes[k]}</span></label>`)
    : html`<small class="sub">${vazio}</small>`);
  return html`<div class="pilha">
    <h2>Sacola</h2>
    ${grupos.map((g) => html`<article key=${g.vendedor} class="cartao">
      <strong>${g.nome} · apto ${g.vendedor}</strong>
      <ul class="itens-sacola">${g.itens.map((i) => html`<li key=${i.anuncio.id}>
        <span>${i.quantidade} × ${i.anuncio.titulo}</span>
        <span>${fmtCentavos(i.subtotal)}</span>
        <button type="button" class="btn-link" onClick=${() => executar((e) => removerDaSacola(e, i.anuncio.id))}>Remover</button>
      </li>`)}</ul>
      <fieldset><legend>Pagamento</legend>${opcoes(g, 'pagamento', PAGAMENTOS, g.pagamentos, 'Estes itens não têm forma de pagamento em comum. Faça pedidos separados.')}</fieldset>
      <fieldset><legend>Entrega</legend>${opcoes(g, 'entrega', ENTREGAS, g.entregas, 'Estes itens não têm forma de entrega em comum. Faça pedidos separados.')}</fieldset>
      <div class="linha-entre"><span class="sub">Subtotal</span><strong>${fmtCentavos(g.subtotal)}</strong></div>
    </article>`)}
    <div class="linha-entre total"><span>Total</span><strong>${fmtCentavos(total)}</strong></div>
    <p class="sub">O pagamento é combinado direto com o vendedor. O app registra o pedido e a conversa.</p>
    <${Erro} texto=${erro} />
    <button type="button" class="btn primario bloco" onClick=${fechar}>Fechar pedido</button>
  </div>`;
}

function LinhaPedido({ estado, pedido, outro }) {
  return html`<a class=${`cartao link${pedido.status === 'novo' ? ' destaque' : ''}`} href=${`#morador.vendas.${pedido.id}`}>
    <div class="linha-entre"><strong>${pedido.id}</strong><${EtqPedido} status=${pedido.status} /></div>
    <span>${nomeVizinho(estado, outro)} · apto ${outro}</span>
    <small class="sub">${pedido.itens.map((i) => `${i.quantidade} × ${i.titulo}`).join(', ')} · ${fmtCentavos(totalPedido(pedido))} · ${fmtDataHora(pedido.criadoEm)}</small>
  </a>`;
}

function VMeusPedidos({ estado, eu }) {
  const lista = estado.pedidos.filter((p) => p.comprador === eu).sort((a, b) => b.criadoEm.localeCompare(a.criadoEm));
  return html`<div class="pilha">
    <h2>Meus pedidos</h2>
    ${lista.length
      ? html`<ul class="m-lista">${lista.map((p) => html`<li key=${p.id}><${LinhaPedido} estado=${estado} pedido=${p} outro=${p.vendedor} /></li>`)}</ul>`
      : html`<${Vazio} texto="Você ainda não fez pedidos." />`}
  </div>`;
}

function VPedido({ estado, eu, executar, pedido }) {
  const [mensagem, setMensagem] = useState('');
  const [recusando, setRecusando] = useState(false);
  const [motivo, setMotivo] = useState('');
  const [erro, setErro] = useState(null);
  const souVendedor = pedido.vendedor === eu;
  const outro = souVendedor ? pedido.comprador : pedido.vendedor;
  const acoes = acoesPedido(pedido, eu);
  const botoes = acoes.filter((a) => a !== 'conversar');

  function rodar(acao) {
    const r = executar(acao);
    setErro(r.erro || null);
    return r;
  }

  function agir(acao) {
    if (acao === 'recusar') {
      setRecusando(true);
      return;
    }
    const funcoes = { aceitar: aceitarPedido, entregar: marcarEntregue, pago: marcarPago, cancelar: cancelarPedido };
    rodar((e) => funcoes[acao](e, pedido.id, eu, new Date()));
  }

  function recusar() {
    if (!rodar((e) => recusarPedido(e, pedido.id, eu, motivo, new Date())).erro) setRecusando(false);
  }

  function enviar() {
    if (!rodar((e) => enviarMensagem(e, pedido.id, eu, mensagem, new Date())).erro) setMensagem('');
  }

  return html`<div class="pilha">
    <a class="voltar" href=${souVendedor ? '#morador.vendas.loja' : '#morador.vendas.pedidos'}>‹ ${souVendedor ? 'Minha loja' : 'Meus pedidos'}</a>
    <p class="protocolo">Pedido ${pedido.id}</p>
    <div class="linha-entre">
      <strong>${souVendedor ? 'Comprador' : 'Vendedor'}: ${nomeVizinho(estado, outro)} · apto ${outro}</strong>
      <span class="etq-linha"><${EtqPedido} status=${pedido.status} />${pedido.pago && html`<${Etiqueta} tipo="ok">Pago<//>`}</span>
    </div>
    <ul class="itens-sacola">${pedido.itens.map((i, n) => html`<li key=${n}><span>${i.quantidade} × ${i.titulo}</span><span>${fmtCentavos(i.preco * i.quantidade)}</span></li>`)}</ul>
    <div class="linha-entre total"><span>Total</span><strong>${fmtCentavos(totalPedido(pedido))}</strong></div>
    <p class="sub">${PAGAMENTOS[pedido.pagamento]} · ${ENTREGAS[pedido.entrega]}${pedido.motivo ? ` · Motivo: ${pedido.motivo}` : ''}</p>
    ${botoes.length > 0 && html`<div class="acoes">${botoes.map((a) => html`<button type="button" key=${a} class=${['aceitar', 'entregar'].includes(a) ? 'btn primario' : 'btn secundario'} onClick=${() => agir(a)}>${ROTULOS_ACAO_PEDIDO[a]}</button>`)}</div>`}
    ${recusando && html`<div class="cartao">
      <${Campo} rotulo="Motivo da recusa"><input id="pedido-motivo" value=${motivo} onInput=${(ev) => setMotivo(ev.target.value)} placeholder="Ex.: sem ingredientes hoje" /><//>
      <div class="acoes">
        <button type="button" class="btn perigo" onClick=${recusar}>Confirmar recusa</button>
        <button type="button" class="btn secundario" onClick=${() => setRecusando(false)}>Voltar</button>
      </div>
    </div>`}
    <${Erro} texto=${erro} />
    <h2>Andamento</h2>
    <ol class="linha-tempo">${pedido.linha.map((l, n) => html`<li key=${n} class=${l.status ? 'marco' : 'comentario'}>
      <span class="lt-quando">${fmtDataHora(l.em)}</span>
      <strong>${l.status ? NOMES_STATUS_PEDIDO[l.status] : 'Pagamento'}</strong>
      <span>${l.texto}</span>
    </li>`)}</ol>
    <h2>Conversa</h2>
    <ul class="conversa">
      ${pedido.mensagens.length
        ? pedido.mensagens.map((m, n) => html`<li key=${n} class=${m.autor === eu ? 'minha' : 'outra'}><span>${m.texto}</span><small>${m.autor === eu ? 'Você' : nomeVizinho(estado, m.autor)} · ${fmtDataHora(m.em)}</small></li>`)
        : html`<li class="sem-mensagem">Nenhuma mensagem ainda.</li>`}
    </ul>
    ${acoes.includes('conversar') && html`<div class="enviar-mensagem">
      <${Campo} rotulo="Mensagem"><input id="pedido-mensagem" value=${mensagem} onInput=${(ev) => setMensagem(ev.target.value)} placeholder=${`Escreva para ${nomeVizinho(estado, outro).split(' ')[0]}`} /><//>
      <button type="button" class="btn primario" onClick=${enviar}>Enviar</button>
    </div>`}
  </div>`;
}

function VLoja(props) {
  const { estado, eu } = props;
  const [aba, setAba] = useState('pedidos');
  const pessoa = pessoaDaUnidade(estado, eu);
  if (pessoa.vendedor !== 'aprovado') return html`<${VConvite} ...${props} />`;
  const recebidos = estado.pedidos
    .filter((p) => p.vendedor === eu)
    .sort((a, b) => Number(b.status === 'novo') - Number(a.status === 'novo') || b.criadoEm.localeCompare(a.criadoEm));
  const novos = recebidos.filter((p) => p.status === 'novo').length;
  const abas = [['pedidos', novos ? `Pedidos (${novos} ${novos === 1 ? 'novo' : 'novos'})` : 'Pedidos'], ['anuncios', 'Meus anúncios'], ['painel', 'Painel']];
  return html`<div class="pilha">
    <div class="chips" role="group" aria-label="Minha loja">
      ${abas.map(([chave, nome]) => html`<button type="button" key=${chave} class="chip" aria-pressed=${aba === chave} onClick=${() => setAba(chave)}>${nome}</button>`)}
    </div>
    ${aba === 'pedidos' && (recebidos.length
      ? html`<ul class="m-lista">${recebidos.map((p) => html`<li key=${p.id}><${LinhaPedido} estado=${estado} pedido=${p} outro=${p.comprador} /></li>`)}</ul>`
      : html`<${Vazio} texto="Nenhum pedido recebido ainda." />`)}
    ${aba === 'anuncios' && html`<${VMeusAnuncios} ...${props} />`}
    ${aba === 'painel' && html`<${VPainel} ...${props} />`}
  </div>`;
}

function VMeusAnuncios({ estado, eu, executar }) {
  const meus = estado.anuncios.filter((a) => a.vendedor === eu).sort((a, b) => b.criadoEm.localeCompare(a.criadoEm));
  return html`<a class="btn primario bloco" href="#morador.vendas.novo-anuncio">Novo anúncio</a>
    ${meus.length
      ? html`<ul class="m-lista">${meus.map((a) => html`<li key=${a.id}><${EditorAnuncio} anuncio=${a} eu=${eu} executar=${executar} /></li>`)}</ul>`
      : html`<${Vazio} texto="Você ainda não tem anúncios." />`}`;
}

function EditorAnuncio({ anuncio, eu, executar }) {
  const [preco, setPreco] = useState((anuncio.preco / 100).toFixed(2).replace('.', ','));
  const [quantidade, setQuantidade] = useState(String(anuncio.quantidade));
  const [mensagem, setMensagem] = useState(null);
  const [erro, setErro] = useState(null);

  function salvar(mudanca) {
    const r = executar((e) => editarAnuncio(e, eu, anuncio.id, mudanca));
    setErro(r.erro || null);
    setMensagem(r.erro ? null : 'Anúncio atualizado.');
  }

  let situacao = html`<${Etiqueta} tipo="ok">Na vitrine<//>`;
  if (anuncio.oculto) situacao = html`<${Etiqueta} tipo="perigo">Oculto pelo síndico<//>`;
  else if (!anuncio.ativo) situacao = html`<${Etiqueta}>Pausado<//>`;
  return html`<article class="cartao">
    <div class="linha-entre"><strong>${anuncio.titulo}</strong>${situacao}</div>
    ${anuncio.oculto && html`<small class="sub">Motivo: ${anuncio.motivoOculto}</small>`}
    <div class="edicao-anuncio">
      <${Campo} rotulo="Preço (R$)"><input id=${`preco-${anuncio.id}`} inputmode="decimal" value=${preco} onInput=${(ev) => setPreco(ev.target.value)} /><//>
      <${Campo} rotulo="Disponível"><input id=${`quantidade-${anuncio.id}`} type="number" min="0" value=${quantidade} onInput=${(ev) => setQuantidade(ev.target.value)} /><//>
    </div>
    <${Erro} texto=${erro} />
    <${Sucesso} texto=${mensagem} />
    <div class="acoes">
      <button type="button" class="btn secundario" onClick=${() => salvar({ preco: lerPreco(preco), quantidade: quantidade === '' ? NaN : Number(quantidade) })}>Salvar</button>
      <button type="button" class="btn secundario" onClick=${() => salvar({ ativo: !anuncio.ativo })}>${anuncio.ativo ? 'Pausar' : 'Retomar'}</button>
    </div>
  </article>`;
}

function VNovoAnuncio({ estado, eu, executar }) {
  const [titulo, setTitulo] = useState('');
  const [descricao, setDescricao] = useState('');
  const [categoria, setCategoria] = useState('doces');
  const [preco, setPreco] = useState('');
  const [quantidade, setQuantidade] = useState('');
  const [pagamentos, setPagamentos] = useState([]);
  const [entregas, setEntregas] = useState([]);
  const [erro, setErro] = useState(null);
  if (pessoaDaUnidade(estado, eu).vendedor !== 'aprovado') return html`<${VConvite} estado=${estado} eu=${eu} executar=${executar} />`;
  const alternar = (lista, definir, chave) => definir(lista.includes(chave) ? lista.filter((x) => x !== chave) : [...lista, chave]);

  function publicar() {
    const dados = { titulo, descricao, categoria, preco: lerPreco(preco), quantidade: quantidade === '' ? NaN : Number(quantidade), pagamentos, entregas };
    const r = executar((e) => publicarAnuncio(e, eu, dados, new Date()));
    if (r.erro) {
      setErro(r.erro);
      return;
    }
    ir('morador', 'vendas', 'loja');
  }

  return html`<div class="pilha">
    <a class="voltar" href="#morador.vendas.loja">‹ Minha loja</a>
    <h2>Novo anúncio</h2>
    <${Campo} rotulo="Título"><input id="novo-titulo" value=${titulo} onInput=${(ev) => setTitulo(ev.target.value)} placeholder="Ex.: Bolo de cenoura com chocolate" /><//>
    <${Campo} rotulo="Descrição"><textarea id="novo-descricao" rows="3" value=${descricao} onInput=${(ev) => setDescricao(ev.target.value)}></textarea><//>
    <${Campo} rotulo="Categoria"><select id="novo-categoria" value=${categoria} onChange=${(ev) => setCategoria(ev.target.value)}>${Object.entries(CATEGORIAS_VENDA).map(([chave, nome]) => html`<option key=${chave} value=${chave}>${nome}</option>`)}</select><//>
    <div class="edicao-anuncio">
      <${Campo} rotulo="Preço (R$)"><input id="novo-preco" inputmode="decimal" value=${preco} onInput=${(ev) => setPreco(ev.target.value)} placeholder="Ex.: 18,00" /><//>
      <${Campo} rotulo="Quantidade"><input id="novo-quantidade" type="number" min="0" value=${quantidade} onInput=${(ev) => setQuantidade(ev.target.value)} /><//>
    </div>
    <fieldset><legend>Pagamento aceito</legend>
      ${Object.entries(PAGAMENTOS).map(([chave, nome]) => html`<label key=${chave} class="check"><input id=${`novo-pagamento-${chave}`} type="checkbox" checked=${pagamentos.includes(chave)} onChange=${() => alternar(pagamentos, setPagamentos, chave)} /><span>${nome}</span></label>`)}
    </fieldset>
    <fieldset><legend>Entrega</legend>
      ${Object.entries(ENTREGAS).map(([chave, nome]) => html`<label key=${chave} class="check"><input id=${`novo-entrega-${chave}`} type="checkbox" checked=${entregas.includes(chave)} onChange=${() => alternar(entregas, setEntregas, chave)} /><span>${nome}</span></label>`)}
    </fieldset>
    <p class="sub">No protótipo, a foto do produto é simulada.</p>
    <${Erro} texto=${erro} />
    <button type="button" class="btn primario bloco" onClick=${publicar}>Publicar anúncio</button>
  </div>`;
}

// Gráfico de uma série: sem legenda (o título nomeia), barras em laranja escuro (contraste ≥ 3:1),
// valor visível só na maior barra e nas demais ao passar o mouse ou focar; tabela para leitores de tela.
function VPainel({ estado, eu, agora }) {
  const [periodo, setPeriodo] = useState('7d');
  const d = painelVendas(estado, eu, periodo, agora);
  const maximo = Math.max(...d.barras.map((b) => b.valor));
  const unidadeTempo = periodo === '7d' ? 'dia' : 'semana';
  const rotuloBarra = (b) => (periodo === '7d' ? fmtDataCurta(b.rotulo).slice(0, 5) : `sem. ${fmtDataCurta(b.rotulo).slice(0, 5)}`);
  const numeros = [['Faturamento', fmtCentavos(d.faturamento)], ['Pedidos', d.pedidos], ['Ticket médio', fmtCentavos(d.ticket)], ['Itens vendidos', d.itens]];
  return html`<div class="pilha">
    <div class="chips" role="group" aria-label="Período">
      ${PERIODOS_PAINEL.map(([chave, nome]) => html`<button type="button" key=${chave} class="chip" aria-pressed=${periodo === chave} onClick=${() => setPeriodo(chave)}>${nome}</button>`)}
    </div>
    <div class="numeros">${numeros.map(([rotulo, valor]) => html`<div key=${rotulo} class="numero"><span>${rotulo}</span><strong>${valor}</strong></div>`)}</div>
    <h2>Faturamento por ${unidadeTempo}</h2>
    <div class="grafico-barras" aria-hidden="true">
      ${d.barras.map((b) => html`<div key=${b.rotulo} class=${`coluna${maximo && b.valor === maximo ? ' maior' : ''}`} title=${`${rotuloBarra(b)}: ${fmtCentavos(b.valor)}`}>
        <span class="valor">${fmtCentavos(b.valor).replace(',00', '')}</span>
        <span class="barra-v" style=${`height:${maximo ? Math.round((b.valor / maximo) * 110) : 0}px`}></span>
        <span class="rotulo-x">${rotuloBarra(b)}</span>
      </div>`)}
    </div>
    <table class="so-leitor">
      <caption>Faturamento por ${unidadeTempo}</caption>
      <thead><tr><th>${periodo === '7d' ? 'Dia' : 'Semana a partir de'}</th><th>Faturamento</th></tr></thead>
      <tbody>${d.barras.map((b) => html`<tr key=${b.rotulo}><td>${fmtDataCurta(b.rotulo)}</td><td>${fmtCentavos(b.valor)}</td></tr>`)}</tbody>
    </table>
    <h2>Mais vendidos</h2>
    ${d.maisVendidos.length
      ? html`<ol class="mais-vendidos">${d.maisVendidos.map((m) => html`<li key=${m.titulo}><span>${m.titulo}</span><strong>${m.quantidade}</strong></li>`)}</ol>`
      : html`<${Vazio} texto="Nenhuma venda entregue no período." />`}
    <h2>Pedidos por situação</h2>
    <dl class="situacao-pedidos">
      <dt>Entregues</dt><dd>${d.situacao.entregues}</dd>
      <dt>Em andamento</dt><dd>${d.situacao.andamento}</dd>
      <dt>Recusados</dt><dd>${d.situacao.recusados}</dd>
      <dt>Cancelados</dt><dd>${d.situacao.cancelados}</dd>
