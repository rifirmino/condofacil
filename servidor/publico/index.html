// Modo conectado: converte o que o servidor devolve do Asaas sandbox nas mesmas estruturas do modo simulado.
const MSG_SEM_CPF = 'Sem CPF: não será emitida';

function previaConectada(estado, competencia) {
  const previa = previaCompetencia(estado, competencia);
  return {
    ...previa,
    linhas: previa.linhas.map((l) => (!l.bloqueada && !l.responsavel.cpf ? { ...l, bloqueada: true, motivo: MSG_SEM_CPF } : l)),
  };
}

function linhasParaAsaas(estado, competencia, apenas = null) {
  const previa = previaConectada(estado, competencia);
  const { multaPct, jurosPct } = estado.financeiro.parametros;
  return previa.linhas.filter((l) => !l.bloqueada && (!apenas || apenas.includes(l.unidade))).map((l) => {
    const pessoa = estado.pessoas.find((p) => p.unidade === l.unidade && p.nome === l.responsavel.nome);
    return {
      unidade: l.unidade,
      responsavel: { nome: l.responsavel.nome, cpf: l.responsavel.cpf, email: pessoa ? pessoa.email : '', celular: pessoa ? pessoa.celular : '' },
      valor: l.total,
      vencimento: previa.vencimento,
      descricao: `Taxa condominial de ${mesExtenso(competencia)} · apto ${l.unidade}`,
      multaPct,
      jurosPct,
    };
  });
}

function cobrancaDoAsaas(competencia, linha, c) {
  return {
    id: `CB-${competencia}-${linha.unidade}`, unidade: linha.unidade, competencia, vencimento: c.vencimento, itens: linha.itens, valor: c.valor,
    status: 'aberta', pagaEm: null, valorPago: null, forma: null, baixaManual: null, eventosAsaas: [], regua: [], substituiu: null, acordo: null,
    asaas: { id: c.asaasId, referencia: c.referencia, faturaUrl: c.faturaUrl, boletoUrl: c.boletoUrl, pixCopiaCola: c.pixCopiaCola, pixImagem: c.pixImagem },
  };
}

function aplicarEmissao(estado, competencia, resultados, perfil, agora) {
  if (!podeOperar(perfil)) return { estado, erro: SO_SINDICO };
  const fin = estado.financeiro;
  const previa = previaCompetencia(estado, competencia);
  const existentes = new Set(fin.cobrancas.filter((c) => c.competencia === competencia && !c.acordo).map((c) => c.unidade));
  const novas = resultados.filter((r) => r.ok && !existentes.has(r.unidade)).map((r) => cobrancaDoAsaas(competencia, previa.linhas.find((l) => l.unidade === r.unidade), r.cobranca));
  // Falhas antigas das unidades reenviadas agora são substituídas pelo resultado novo.
  const anteriores = ((fin.falhasAsaas || {})[competencia] || []).filter((f) => !resultados.some((r) => r.unidade === f.unidade));
  const falhas = [...anteriores, ...resultados.filter((r) => !r.ok).map((r) => ({ unidade: r.unidade, erro: r.erro }))];
  const emitidas = fin.emitidas.includes(competencia) ? fin.emitidas : [...fin.emitidas, competencia];
  return {
    estado: comFinanceiro(estado, {
      cobrancas: [...fin.cobrancas, ...novas],
      emitidas,
      falhasAsaas: { ...(fin.falhasAsaas || {}), [competencia]: falhas },
      auditoria: comAuditoria(estado, agora, 'Emissão no Asaas sandbox', `${mesExtenso(competencia)}: ${novas.length} cobranças${falhas.length ? ` · falharam: ${falhas.map((f) => f.unidade).join(', ')}` : ''}`),
    }),
    emitidas: novas.length,
    falhas,
    notificacao: novas.length ? { canal: 'Asaas sandbox', para: `${novas.length} responsáveis`, texto: `Cobranças de ${mesExtenso(competencia)} emitidas no Asaas sandbox: boleto, Pix e fatura` } : undefined,
  };
}

function aplicarSituacoes(estado, cobrancasServidor, agora) {
  let atual = estado;
  let baixas = 0;
  let notificacao;
  for (const s of cobrancasServidor) {
    if (s.situacao !== 'paga') continue;
    const id = `CB-${s.competencia}-${s.unidade}`;
    const c = atual.financeiro.cobrancas.find((x) => x.id === id);
    if (!c || c.status !== 'aberta') continue;
    const r = confirmarPagamentoAsaas(atual, id, `evt-${s.asaasId}`, s.forma || 'boleto', s.pagoEm ? new Date(`${s.pagoEm.slice(0, 10)}T12:00:00`) : agora);
    if (r.erro) continue;
    atual = r.estado;
    baixas += 1;
    notificacao = r.notificacao;
  }
  return { estado: atual, baixas, notificacao };
}

// ---- src/enquetes/regras.js ----

// Enquetes: situação no instante, público, apuração (simples ou por fração ideal), quórum, evolução e lembretes.
const NOMES_SITUACAO_ENQUETE = { rascunho: 'Rascunho', aberta: 'Aberta', encerrada: 'Encerrada' };

function enquetePorId(estado, id) {
  return estado.enquetes.find((e) => e.id === id) || null;
}

function situacaoEnquete(e, agora) {
  return e.situacao === 'aberta' && new Date(e.encerraEm) <= agora ? 'encerrada' : e.situacao;
}

function diasRestantes(e, agora) {
  return Math.max(0, diferencaDias(isoDia(new Date(e.encerraEm)), isoDia(agora)));
}

function textoDiasRestantes(e, agora) {
  const n = diasRestantes(e, agora);
  if (n === 0) return 'termina hoje';
  return n === 1 ? 'falta 1 dia' : `faltam ${n} dias`;
}

function unidadesDoPublico(estado, e) {
  return destinatarios(estado, e.publico);
}

function faltantes(estado, e) {
  const comApp = new Set(estado.pessoas.map((p) => p.unidade));
  return unidadesDoPublico(estado, e).filter((u) => !e.votos[u]).map((unidade) => ({ unidade, semApp: !comApp.has(unidade) }));
}

function apuracao(estado, e) {
  const publico = unidadesDoPublico(estado, e);
  const votantes = publico.filter((u) => e.votos[u]);
  const fracao = (u) => estado.financeiro.unidades[u].fracao;
  const pesoTotal = votantes.reduce((s, u) => s + fracao(u), 0);
  const opcoes = e.opcoes.map((o) => {
    const quem = votantes.filter((u) => e.votos[u].opcoes.includes(o.id));
    const peso = quem.reduce((s, u) => s + fracao(u), 0);
    return { id: o.id, texto: o.texto, votos: quem.length, pct: votantes.length ? (quem.length / votantes.length) * 100 : 0, pesoPct: pesoTotal ? (peso / pesoTotal) * 100 : 0 };
  });
  const participacaoPct = publico.length ? (votantes.length / publico.length) * 100 : 0;
  const quorumAtingido = !e.quorumPct || participacaoPct >= e.quorumPct;
  const medida = (o) => (e.peso === 'fracao' ? Math.round(o.pesoPct * 1000) : o.votos);
  const maior = Math.max(...opcoes.map(medida));
  const vencedoras = votantes.length ? opcoes.filter((o) => medida(o) === maior) : [];
  return { opcoes, participantes: votantes.length, total: publico.length, participacaoPct, quorumAtingido, semQuorum: !quorumAtingido, vencedoras };
}

function textoResultado(estado, e) {
  const a = apuracao(estado, e);
  if (!a.participantes) return 'Ninguém votou';
  if (a.semQuorum) return `Sem quórum: ${Math.round(a.participacaoPct)}% de participação, mínimo de ${e.quorumPct}%`;
  if (a.vencedoras.length > 1) return `Empate entre ${a.vencedoras.map((o) => o.texto).join(' e ')}`;
  const v = a.vencedoras[0];
  return `Vencedora: ${v.texto} (${Math.round(e.peso === 'fracao' ? v.pesoPct : v.pct)}%${e.peso === 'fracao' ? ' por fração ideal' : ''})`;
}

function evolucao(e, agora) {
  if (!e.abertaEm) return [];
  const inicio = isoDia(new Date(e.abertaEm));
  const fim = isoDia(situacaoEnquete(e, agora) === 'encerrada' ? new Date(e.encerradaEm || e.encerraEm) : agora);
  const dias = [];
  for (let d = inicio; d <= fim; d = somarDias(d, 1)) dias.push(d);
  const datas = Object.values(e.votos).map((v) => isoDia(new Date(v.em)));
  return dias.map((dia) => ({ dia, total: datas.filter((d) => d <= dia).length }));
}

function marcosLembrete(e) {
  const ultimo = isoDia(new Date(e.encerraEm));
  return [somarDias(ultimo, -3), ultimo].map((d) => momento(d, 9).toISOString());
}

function proximoLembreteAuto(e, agora) {
  if (!e.lembretesAuto || situacaoEnquete(e, agora) !== 'aberta') return null;
  const enviados = e.lembretes.filter((l) => l.automatico).length;
  return marcosLembrete(e).slice(enviados).find((m) => new Date(m) >= new Date(e.abertaEm)) || null;
}

function enquetesPendentes(estado, unidade, agora) {
  return estado.enquetes.filter((e) => situacaoEnquete(e, agora) === 'aberta' && !e.votos[unidade] && unidadesDoPublico(estado, e).includes(unidade));
}

function enquetesDaUnidade(estado, unidade, agora) {
  const visiveis = estado.enquetes.filter((e) => e.situacao !== 'rascunho' && unidadesDoPublico(estado, e).includes(unidade));
  return {
    pendentes: visiveis.filter((e) => situacaoEnquete(e, agora) === 'aberta' && !e.votos[unidade]),
    respondidas: visiveis.filter((e) => situacaoEnquete(e, agora) === 'aberta' && e.votos[unidade]),
    encerradas: visiveis.filter((e) => situacaoEnquete(e, agora) === 'encerrada'),
  };
}

function alertasEnquetes(estado, agora) {
  const alertas = [];
  for (const e of estado.enquetes) {
    const s = situacaoEnquete(e, agora);
    if (s === 'aberta' && diasRestantes(e, agora) <= 1) {
      const n = faltantes(estado, e).length;
      if (n) alertas.push({ chave: `enquete-${e.id}`, href: `#sindico.enquetes.${e.id}`, texto: `Enquete "${e.pergunta}": ${textoDiasRestantes(e, agora) === 'termina hoje' ? 'termina hoje' : 'termina amanhã'}, ${n} unidades sem resposta` });
    }
    if (s === 'encerrada' && !e.resultado && liberado(estado.plano, 'enqueteCompleta')) alertas.push({ chave: `enquete-res-${e.id}`, href: `#sindico.enquetes.${e.id}`, texto: `Enquete encerrada: publique o resultado de "${e.pergunta}"` });
  }
  return alertas;
}

// ---- src/enquetes/acoes.js ----

// Ações das enquetes: o síndico cria, publica, lembra, encerra, prorroga e publica o resultado; o morador vota.
const SO_SINDICO_ENQUETE = 'Somente o síndico pode fazer isso';
const CANAIS_ENQUETE = 'App + e-mail + WhatsApp';

function erroEnquete(estado, mensagem) {
  return { estado, erro: mensagem };
}

function comEnquete(estado, id, mudanca) {
  return { ...estado, enquetes: trocarItem(estado.enquetes, id, mudanca) };
}

// O que o plano não libera volta ao padrão do Básico: escolha única, sem comentário, voto secreto, sem peso nem quórum.
function noPlano(estado, dados) {
  const completa = liberado(estado.plano, 'enqueteCompleta');
  const peso = liberado(estado.plano, 'enquetePeso');
  return {
    tipo: completa && dados.tipo === 'multipla' ? 'multipla' : 'unica',
    maxEscolhas: completa && dados.tipo === 'multipla' ? Math.max(2, Math.min(Number(dados.maxEscolhas) || 2, dados.opcoes.length)) : 1,
    comentarios: completa && !!dados.comentarios,
    secreto: completa ? dados.secreto !== false : true,
    parcialVisivel: completa && !!dados.parcialVisivel,
    lembretesAuto: completa && dados.lembretesAuto !== false,
    peso: peso && dados.peso === 'fracao' ? 'fracao' : 'unidade',
    quorumPct: peso && Number(dados.quorumPct) > 0 ? Math.min(100, Math.round(Number(dados.quorumPct))) : null,
  };
}

function salvarEnquete(estado, dados, perfil, agora) {
  if (perfil !== 'sindico') return erroEnquete(estado, SO_SINDICO_ENQUETE);
  if (!liberado(estado.plano, 'enquetes')) return erroEnquete(estado, 'Disponível no plano Básico');
  const pergunta = String(dados.pergunta || '').trim();
  if (!pergunta) return erroEnquete(estado, 'Escreva a pergunta');
  const textos = (dados.opcoes || []).map((o) => String(o || '').trim()).filter(Boolean);
  if (textos.length < 2) return erroEnquete(estado, 'Informe pelo menos 2 opções');
  if (textos.length > 8) return erroEnquete(estado, 'No máximo 8 opções');
  if (new Set(textos.map((t) => t.toLowerCase())).size !== textos.length) return erroEnquete(estado, 'Opções repetidas');
  const dias = Number(dados.dias);
  if (!Number.isInteger(dias) || dias < 1 || dias > 60) return erroEnquete(estado, 'Escolha uma data limite de 1 a 60 dias');
  const publico = dados.publico || { tipo: 'todos' };
  if (!destinatariosValidos(estado, publico)) return erroEnquete(estado, 'Escolha o público');
  const existente = dados.id && enquetePorId(estado, dados.id);
  if (existente && existente.situacao !== 'rascunho') return erroEnquete(estado, 'Só rascunhos podem ser editados');
  const id = existente ? existente.id : `EN-${String(estado.proximaEnquete).padStart(3, '0')}`;
  const enquete = {
    id, pergunta, contexto: String(dados.contexto || '').trim(), anexo: dados.anexo || null,
    opcoes: textos.map((texto, n) => ({ id: `${id}-o${n + 1}`, texto })),
    publico, criadaEm: existente ? existente.criadaEm : agora.toISOString(), abertaEm: null,
    encerraEm: momento(somarDias(isoDia(agora), dias), 23, 59).toISOString(), dias, situacao: 'rascunho', encerradaEm: null,
    lembretes: [], prorrogada: false, votos: {}, resultado: null,
    ...noPlano(estado, { ...dados, opcoes: textos }),
  };
  if (existente) return { estado: comEnquete(estado, id, enquete), id };
  return { estado: { ...estado, enquetes: [...estado.enquetes, enquete], proximaEnquete: estado.proximaEnquete + 1 }, id };
}

function destinatariosValidos(estado, publico) {
  if (publico.tipo === 'unidades') return (publico.valor || []).some((u) => estado.condominio.unidades.includes(u));
  return ['todos', 'andar'].includes(publico.tipo);
}

function publicarEnquete(estado, id, perfil, agora) {
  if (perfil !== 'sindico') return erroEnquete(estado, SO_SINDICO_ENQUETE);
  const e = enquetePorId(estado, id);
  if (!e || e.situacao !== 'rascunho') return erroEnquete(estado, 'Só rascunhos podem ser publicados');
  const encerraEm = e.dias ? momento(somarDias(isoDia(agora), e.dias), 23, 59).toISOString() : e.encerraEm;
  if (new Date(encerraEm) <= agora) return erroEnquete(estado, 'Escolha uma data limite de 1 a 60 dias');
  const n = unidadesDoPublico(estado, e).length;
  return {
    estado: comEnquete(estado, id, { situacao: 'aberta', abertaEm: agora.toISOString(), encerraEm }),
    notificacao: { canal: CANAIS_ENQUETE, para: `${n} unidades`, texto: `Nova enquete: ${e.pergunta} · responda até ${fmtDataCurta(isoDia(new Date(encerraEm)))}` },
  };
}

function votar(estado, id, { unidade, autor, opcoes, comentario }, agora) {
  const e = enquetePorId(estado, id);
  if (!e || e.situacao === 'rascunho') return erroEnquete(estado, 'Enquete não encontrada');
  if (situacaoEnquete(e, agora) !== 'aberta') return erroEnquete(estado, 'A enquete está encerrada');
  if (!unidadesDoPublico(estado, e).includes(unidade)) return erroEnquete(estado, 'Sua unidade não faz parte do público desta enquete');
  const escolhidas = [...new Set(opcoes || [])].filter((o) => e.opcoes.some((x) => x.id === o));
  if (!escolhidas.length) return erroEnquete(estado, 'Escolha uma opção');
  if (escolhidas.length > e.maxEscolhas) return erroEnquete(estado, e.maxEscolhas === 1 ? 'Escolha só uma opção' : `Escolha até ${e.maxEscolhas} opções`);
  const trocou = !!e.votos[unidade];
  const voto = { opcoes: escolhidas, comentario: e.comentarios ? String(comentario || '').trim() : '', autor, em: agora.toISOString() };
  return { estado: comEnquete(estado, id, { votos: { ...e.votos, [unidade]: voto } }), trocou };
}

function enviarLembrete(estado, id, perfil, agora, automatico = false) {
  if (perfil !== 'sindico') return erroEnquete(estado, SO_SINDICO_ENQUETE);
  const e = enquetePorId(estado, id);
  if (!e || situacaoEnquete(e, agora) !== 'aberta') return erroEnquete(estado, 'Só enquetes abertas recebem lembrete');
  if (automatico && !liberado(estado.plano, 'enqueteCompleta')) return erroEnquete(estado, 'Disponível no plano Intermediário');
  const lista = faltantes(estado, e);
  if (!lista.length) return erroEnquete(estado, 'Todas as unidades já responderam');
  const prazo = textoDiasRestantes(e, agora);
  const texto = `${prazo === 'termina hoje' ? 'Hoje é o último dia' : `${prazo[0].toUpperCase()}${prazo.slice(1)}`} para a enquete "${e.pergunta}". Sua unidade ainda não votou`;
  return {
    estado: comEnquete(estado, id, { lembretes: [...e.lembretes, { em: agora.toISOString(), unidades: lista.length, automatico }] }),
    notificacao: { canal: CANAIS_ENQUETE, para: `${lista.length} unidades`, texto },
  };
}

function encerrarEnquete(estado, id, perfil, agora) {
  if (perfil !== 'sindico') return erroEnquete(estado, SO_SINDICO_ENQUETE);
  const e = enquetePorId(estado, id);
  if (!e || situacaoEnquete(e, agora) !== 'aberta') return erroEnquete(estado, 'Só enquetes abertas podem ser encerradas');
  const fim = agora.toISOString();
  const novo = comEnquete(estado, id, { situacao: 'encerrada', encerradaEm: fim, encerraEm: fim });
  return { estado: novo, notificacao: { canal: 'App', para: 'Síndico', texto: `Enquete encerrada · ${textoResultado(novo, enquetePorId(novo, id))}` } };
}

function prorrogarEnquete(estado, id, dias, perfil, agora) {
  if (perfil !== 'sindico') return erroEnquete(estado, SO_SINDICO_ENQUETE);
  const e = enquetePorId(estado, id);
  if (!e || situacaoEnquete(e, agora) !== 'aberta') return erroEnquete(estado, 'Só enquetes abertas podem ser prorrogadas');
  if (e.prorrogada) return erroEnquete(estado, 'Só é possível prorrogar uma vez');
  const n = Number(dias);
  if (!Number.isInteger(n) || n < 1 || n > 30) return erroEnquete(estado, 'Prorrogue de 1 a 30 dias');
  const encerraEm = momento(somarDias(isoDia(new Date(e.encerraEm)), n), 23, 59).toISOString();
  return {
    estado: comEnquete(estado, id, { encerraEm, prorrogada: true }),
    notificacao: { canal: CANAIS_ENQUETE, para: `${unidadesDoPublico(estado, e).length} unidades`, texto: `Enquete "${e.pergunta}" prorrogada até ${fmtDataCurta(isoDia(new Date(encerraEm)))}` },
  };
}

function publicarResultado(estado, id, perfil, agora) {
  if (perfil !== 'sindico') return erroEnquete(estado, SO_SINDICO_ENQUETE);
  if (!liberado(estado.plano, 'enqueteCompleta')) return erroEnquete(estado, 'Disponível no plano Intermediário');
  const e = enquetePorId(estado, id);
  if (!e || situacaoEnquete(e, agora) !== 'encerrada') return erroEnquete(estado, 'Encerre a enquete antes de publicar');
  if (e.resultado) return erroEnquete(estado, 'O resultado já foi publicado');
  const a = apuracao(estado, e);
  const linhas = a.opcoes.map((o) => `${o.texto}: ${Math.round(e.peso === 'fracao' ? o.pesoPct : o.pct)}%`).join('\n');
  const texto = `${textoResultado(estado, e)}.\n\n${linhas}\n\nParticipação: ${a.participantes} de ${a.total} unidades (${Math.round(a.participacaoPct)}%).${e.peso === 'fracao' ? ' Votos ponderados pela fração ideal.' : ''}`;
  const pub = publicarComunicado(estado, { tipo: 'geral', titulo: `Resultado da enquete: ${e.pergunta}`, texto, publico: e.publico, canais: ['push', 'email'] }, agora);
  if (pub.erro) return erroEnquete(estado, pub.erro);
  const docId = `d${pub.estado.documentos.reduce((m, d) => Math.max(m, Number(d.id.slice(1)) || 0), 0) + 1}`;
  const documento = { id: docId, pasta: 'Enquetes', titulo: `Resultado da enquete: ${e.pergunta}`, versoes: [{ versao: 1, data: isoDia(agora) }], visibilidade: 'todos' };
  const novo = comEnquete({ ...pub.estado, documentos: [...pub.estado.documentos, documento] }, id, { resultado: { publicadoEm: agora.toISOString(), comunicado: pub.id, documento: docId } });
  return { estado: novo, notificacao: { canal: pub.notificacao.canal, para: pub.notificacao.para, texto: `Resultado publicado: ${textoResultado(estado, e)}` } };
}

// ---- src/cobranca/acoes-composicao.js ----

// Reajuste da taxa e taxas extras: só o síndico, sempre com a ata, avisando os responsáveis financeiros.
function erroTaxa(estado, mensagem) {
  return { estado, erro: mensagem };
}

function responsaveisAvisados(fin) {
  return Object.values(fin.unidades).filter((u) => u.responsavel).length;
}

// Ajustes manuais da prévia guardam a lista inteira de itens: a partir da mudança, eles ficariam com valores velhos.
function semAjustesDesde(fin, desde) {
  let desfeitos = 0;
  const ajustesPrevia = {};
  for (const [competencia, porUnidade] of Object.entries(fin.ajustesPrevia)) {
    if (competencia >= desde) desfeitos += Object.keys(porUnidade).length;
    else ajustesPrevia[competencia] = porUnidade;
  }
  return { ajustesPrevia, desfeitos };
}

function comComunicado(estado, publicar, titulo, texto, agora) {
  if (!publicar) return estado;
  return publicarComunicado(estado, { tipo: 'assembleia', titulo, texto, publico: { tipo: 'todos' }, canais: ['push', 'email'] }, agora).estado;
}

function notificacaoTaxa(fin, texto, publicar) {
  return { canal: 'App + e-mail + WhatsApp', para: `${responsaveisAvisados(fin)} responsáveis`, texto: `${texto} avisado${publicar ? ' e publicado no mural' : ''}` };
}

function novaComposicao(estado, dados, perfil, agora) {
  if (!podeOperar(perfil)) return erroTaxa(estado, SO_SINDICO);
  const aprovadoEm = String(dados.aprovadoEm || '').trim();
  if (!aprovadoEm) return erroTaxa(estado, MSG_ATA);
  const fin = estado.financeiro;
  const montada = montarVersao(fin, dados);
  if (montada.erro) return erroTaxa(estado, montada.erro);
  const versao = { id: `CV-${String(fin.composicao.proximaVersao).padStart(3, '0')}`, ...montada.versao, aprovadoEm, criadaEm: agora.toISOString(), criadaPor: 'Síndico' };
  const { ajustesPrevia, desfeitos } = semAjustesDesde(fin, versao.vigencia);
  const publicar = dados.publicar !== false;
  const composicao = { ...fin.composicao, versoes: [...fin.composicao.versoes.filter((v) => v.vigencia !== versao.vigencia), versao], proximaVersao: fin.composicao.proximaVersao + 1 };
  let novo = comFinanceiro(estado, { composicao, ajustesPrevia, auditoria: comAuditoria(estado, agora, 'Reajuste da taxa', `${nomeMes(versao.vigencia)} · ${resumoVersao(fin, versao)} · ${aprovadoEm}`) });
  const texto = `A partir de ${nomeMes(versao.vigencia)}, a taxa condominial passa a ser:\n${textoValoresVersao(novo.financeiro, versao)}\n\nAprovado em: ${aprovadoEm}.`;
  novo = comComunicado(novo, publicar, `Reajuste da taxa condominial a partir de ${nomeMes(versao.vigencia)}`, texto, agora);
  return { estado: novo, id: versao.id, desfeitos, notificacao: notificacaoTaxa(fin, `Reajuste a partir de ${nomeMes(versao.vigencia)}`, publicar) };
}

function cancelarComposicao(estado, id, perfil, agora) {
  if (!podeOperar(perfil)) return erroTaxa(estado, SO_SINDICO);
  const fin = estado.financeiro;
  const versao = versoesAgendadas(fin).find((v) => v.id === id);
  if (!versao) return erroTaxa(estado, 'Esta competência já foi emitida');
  return { estado: comFinanceiro(estado, { composicao: { ...fin.composicao, versoes: fin.composicao.versoes.filter((v) => v.id !== id) }, auditoria: comAuditoria(estado, agora, 'Reajuste cancelado', `${versao.id} · ${nomeMes(versao.vigencia)}`) }) };
}

function montarTaxaExtra(fin, dados) {
  const minimo = primeiraNaoEmitida(fin);
  const descricao = String(dados.descricao || '').trim();
  const parcelas = Number(dados.parcelas);
  if (!descricao) return { erro: 'Informe a descrição' };
  if (!(dados.total > 0)) return { erro: 'Informe o valor total' };
  if (!Number.isInteger(parcelas) || parcelas < 1 || parcelas > 60) return { erro: 'As parcelas devem ser de 1 a 60' };
  if (!dados.inicio || dados.inicio < minimo) return { erro: `O início deve ser a partir de ${nomeMes(minimo)}` };
  return { extra: { descricao, total: Math.round(dados.total), parcelas, inicio: dados.inicio, rateio: dados.rateio === 'fracao' ? 'fracao' : 'igual' } };
}

function criarTaxaExtra(estado, dados, perfil, agora) {
  if (!podeOperar(perfil)) return erroTaxa(estado, SO_SINDICO);
  const fin = estado.financeiro;
  const montada = montarTaxaExtra(fin, dados);
  if (montada.erro) return erroTaxa(estado, montada.erro);
  const aprovadoEm = String(dados.aprovadoEm || '').trim();
  if (!aprovadoEm) return erroTaxa(estado, MSG_ATA);
  const extra = { id: `TX-${String(fin.composicao.proximaExtra).padStart(3, '0')}`, ...montada.extra, aprovadoEm, situacao: 'ativa', ultimaCompetencia: null, motivoEncerramento: null, criadaEm: agora.toISOString(), encerradaEm: null };
  const { ajustesPrevia, desfeitos } = semAjustesDesde(fin, extra.inicio);
  const publicar = dados.publicar !== false;
  const periodo = `${nomeMes(extra.inicio)} a ${nomeMes(fimExtra(extra))}`;
  let novo = comFinanceiro(estado, {
    composicao: { ...fin.composicao, extras: [...fin.composicao.extras, extra], proximaExtra: fin.composicao.proximaExtra + 1 },
    ajustesPrevia,
    auditoria: comAuditoria(estado, agora, 'Taxa extra criada', `${extra.id} · ${extra.descricao} · ${fmtReais(extra.total)} em ${extra.parcelas}x · ${aprovadoEm}`),
  });
  const valores = valorPorTipoExtra(novo.financeiro, extra).map((v) => `${NOMES_TIPO_UNIDADE[v.tipo]}: ${fmtReais(v.valor)} por parcela`).join('\n');
  const texto = `Taxa extra aprovada: ${extra.descricao}, ${fmtReais(extra.total)} em ${extra.parcelas} parcelas, de ${periodo}${extra.rateio === 'fracao' ? ', rateada por fração ideal' : ''}.\n${valores}\n\nAprovado em: ${aprovadoEm}.`;
  novo = comComunicado(novo, publicar, `Taxa extra: ${extra.descricao}`, texto, agora);
  return { estado: novo, id: extra.id, desfeitos, notificacao: notificacaoTaxa(fin, `Taxa extra ${extra.descricao}`, publicar) };
}

function encerrarTaxaExtra(estado, id, motivo, perfil, agora) {
  if (!podeOperar(perfil)) return erroTaxa(estado, SO_SINDICO);
  const fin = estado.financeiro;
  const extra = fin.composicao.extras.find((x) => x.id === id);
  if (!extra || extra.situacao !== 'ativa') return erroTaxa(estado, 'Só taxas ativas podem ser encerradas');
  const texto = String(motivo || '').trim();
  if (!texto) return erroTaxa(estado, 'Informe a ata ou o motivo');
  const ultimaEmitida = somarMes(primeiraNaoEmitida(fin), -1);
  const cobradas = [...fin.emitidas].sort().filter((c) => c <= ultimaEmitida && parcelaDe(extra, c));
  const ultimaCompetencia = cobradas.at(-1) || null;
  const encerrada = { ...extra, situacao: 'encerrada', ultimaCompetencia, motivoEncerramento: texto, encerradaEm: agora.toISOString() };
  const { ajustesPrevia, desfeitos } = semAjustesDesde(fin, primeiraNaoEmitida(fin));
  return {
    estado: comFinanceiro(estado, {
      composicao: { ...fin.composicao, extras: fin.composicao.extras.map((x) => (x.id === id ? encerrada : x)) },
      ajustesPrevia,
      auditoria: comAuditoria(estado, agora, 'Taxa extra encerrada', `${extra.id} · ${extra.descricao} · ${ultimaCompetencia ? `última parcela em ${nomeMes(ultimaCompetencia)}` : 'nenhuma parcela cobrada'} · ${texto}`),
    }),
    desfeitos,
    notificacao: { canal: 'App + e-mail + WhatsApp', para: `${responsaveisAvisados(fin)} responsáveis`, texto: `Taxa extra ${extra.descricao} encerrada${ultimaCompetencia ? `: última parcela em ${nomeMes(ultimaCompetencia)}` : ' antes da primeira parcela'}` },
  };
}

// ---- src/cobranca/orcamento.js ----

// Previsão orçamentária do ano: despesa por categoria, margem de inadimplência e a taxa que fecha a conta.
function despesaAnual(linhas) {
  return linhas.reduce((soma, l) => soma + l.valor, 0);
}

function ordinariaNecessaria(linhas, margemPct) {
  return Math.round(despesaAnual(linhas) / 12 / (1 - margemPct / 100));
}

function ordinariaTotal(fin, versao) {
  return Object.keys(fin.unidades).reduce((soma, u) => soma + ordinariaDe(fin, versao, u), 0);
}

function candidataDaPrevisao(fin, previsao) {
  const base = versaoVigente(fin);
  const necessaria = ordinariaNecessaria(previsao.linhas, previsao.margemPct);
  const comum = { vigencia: primeiraNaoEmitida(fin), modo: base.modo, fundoPct: base.fundoPct };
  if (base.modo === 'fracao') return { ...comum, ordinaria: null, orcamento: necessaria };
  const fator = necessaria / ordinariaTotal(fin, base);
  return { ...comum, ordinaria: { A: Math.round(base.ordinaria.A * fator), cobertura: Math.round(base.ordinaria.cobertura * fator) }, orcamento: null };
}

function simularPrevisao(fin, previsao) {
  return simularComposicao(fin, candidataDaPrevisao(fin, previsao));
}

function resultadoComTaxaAtual(fin, previsao) {
  return Math.round(ordinariaTotal(fin, versaoVigente(fin)) * 12 * (1 - previsao.margemPct / 100)) - despesaAnual(previsao.linhas);
}

function margemAtual(estado, hoje) {
  return indicadoresFinanceiros(estado, hoje).inadimplencia.pct;
}

function nomeDaLinha(linha) {
  return linha.categoria ? CATEGORIAS_DESPESA[linha.categoria] : linha.nome;
}

function compararPrevisoes(fin, a, b) {
  const nomes = [...new Set([...a.linhas, ...b.linhas].map(nomeDaLinha))];
  const valorDe = (p, nome) => (p.linhas.find((l) => nomeDaLinha(l) === nome) || { valor: 0 }).valor;
  const sa = simularPrevisao(fin, a);
  const sb = simularPrevisao(fin, b);
  return {
    linhas: nomes.map((nome) => ({ nome, a: valorDe(a, nome), b: valorDe(b, nome) })),
    total: { a: despesaAnual(a.linhas), b: despesaAnual(b.linhas) },
    ordinaria: { a: ordinariaNecessaria(a.linhas, a.margemPct), b: ordinariaNecessaria(b.linhas, b.margemPct) },
    tipos: sa.tipos.map((t, i) => ({ tipo: t.tipo, a: t.depois, b: sb.tipos[i].depois })),
  };
}

// ---- src/cobranca/acoes-orcamento.js ----

// Previsões orçamentárias salvas e o documento levado à AGO.
function erroOrcamento(estado, mensagem) {
  return { estado, erro: mensagem };
}

function guardaOrcamento(estado, perfil) {
  if (!podeOperar(perfil)) return SO_SINDICO;
  if (!liberado(estado.plano, 'simuladorTaxa')) return 'Disponível no plano Intermediário';
  return null;
}

function salvarPrevisao(estado, dados, perfil, agora) {
  const falha = guardaOrcamento(estado, perfil);
  if (falha) return erroOrcamento(estado, falha);
  const nome = String(dados.nome || '').trim();
  if (!nome) return erroOrcamento(estado, 'Informe o nome da previsão');
  const linhas = (dados.linhas || []).map((l) => ({ categoria: l.categoria || null, nome: String(l.nome || '').trim(), valor: l.valor }));
  if (!linhas.length || linhas.some((l) => (!l.categoria && !l.nome) || !Number.isFinite(l.valor) || l.valor < 0)) return erroOrcamento(estado, 'Cada linha precisa de nome e valor');
  const margemPct = Number(dados.margemPct);
  if (!Number.isFinite(margemPct) || margemPct < 0 || margemPct > 50) return erroOrcamento(estado, 'A margem de inadimplência deve ser de 0% a 50%');
  const fin = estado.financeiro;
  const em = agora.toISOString();
  const existente = dados.id && fin.previsoes.find((p) => p.id === dados.id);
  if (existente) {
    const atualizada = { ...existente, ano: dados.ano, nome, linhas, margemPct, atualizadaEm: em };
    return { estado: comFinanceiro(estado, { previsoes: fin.previsoes.map((p) => (p.id === existente.id ? atualizada : p)) }), id: existente.id };
  }
  const id = `PO-${String(fin.proximaPrevisao).padStart(3, '0')}`;
  const previsao = { id, ano: dados.ano, nome, linhas, margemPct, criadaEm: em, atualizadaEm: em, documento: null };
  return { estado: comFinanceiro(estado, { previsoes: [...fin.previsoes, previsao], proximaPrevisao: fin.proximaPrevisao + 1 }), id };
}

function excluirPrevisao(estado, id, perfil) {
  const falha = guardaOrcamento(estado, perfil);
  if (falha) return erroOrcamento(estado, falha);
  if (!estado.financeiro.previsoes.some((p) => p.id === id)) return erroOrcamento(estado, 'Previsão não encontrada');
  return { estado: comFinanceiro(estado, { previsoes: estado.financeiro.previsoes.filter((p) => p.id !== id) }) };
}

function gerarDocumentoPrevisao(estado, id, perfil, agora) {
  const falha = guardaOrcamento(estado, perfil);
  if (falha) return erroOrcamento(estado, falha);
  const previsao = estado.financeiro.previsoes.find((p) => p.id === id);
  if (!previsao) return erroOrcamento(estado, 'Salve a previsão antes de gerar o documento');
  const titulo = `Previsão orçamentária ${previsao.ano} · ${previsao.nome}`;
  const data = isoDia(agora);
  const atual = previsao.documento && estado.documentos.find((d) => d.id === previsao.documento);
  if (atual) {
    const versao = atual.versoes.length + 1;
    const documentos = estado.documentos.map((d) => (d.id === atual.id ? { ...d, titulo, versoes: [...d.versoes, { versao, data }] } : d));
    return { estado: { ...estado, documentos }, id: atual.id, versao, notificacao: { canal: 'Documentos', para: 'Todos os moradores', texto: `${titulo}: versão ${versao} publicada` } };
  }
  const docId = `d${estado.documentos.reduce((m, d) => Math.max(m, Number(d.id.slice(1)) || 0), 0) + 1}`;
  const documento = { id: docId, pasta: 'Previsão orçamentária', titulo, versoes: [{ versao: 1, data }], visibilidade: 'todos' };
  const novo = comFinanceiro({ ...estado, documentos: [...estado.documentos, documento] }, { previsoes: estado.financeiro.previsoes.map((p) => (p.id === id ? { ...p, documento: docId } : p)) });
  return { estado: novo, id: docId, versao: 1, notificacao: { canal: 'Documentos', para: 'Todos os moradores', texto: `${titulo} publicada para a AGO` } };
}

// ---- src/financeiro/contas.js ----

// Contas a pagar: situação no dia, filtros da lista e alertas do síndico.
const NOMES_SITUACAO_CONTA = { paga: 'Paga', vencida: 'Vencida', hoje: 'Vence hoje', aberta: 'A pagar' };
const FILTROS_CONTAS = [['proximas', 'Próximos 30 dias'], ['vencidas', 'Vencidas'], ['pagas', 'Pagas no mês'], ['todas', 'Todas']];

function situacaoConta(conta, hoje) {
  if (conta.situacao === 'paga') return 'paga';
  if (conta.vencimento < hoje) return 'vencida';
  if (conta.vencimento === hoje) return 'hoje';
  return 'aberta';
}

function contasFiltradas(estado, filtro, hoje) {
  const contas = estado.financeiro.contas;
  const limite = somarDias(hoje, 30);
  const lista = {
    proximas: contas.filter((c) => c.situacao === 'aberta' && c.vencimento <= limite),
    vencidas: contas.filter((c) => situacaoConta(c, hoje) === 'vencida'),
    pagas: contas.filter((c) => c.situacao === 'paga' && mesDoInstante(c.pagaEm) === hoje.slice(0, 7)),
    todas: contas,
  }[filtro] || contas;
  return [...lista].sort((a, b) => a.vencimento.localeCompare(b.vencimento));
}

function totalAPagar(estado, hoje) {
  return contasFiltradas(estado, 'proximas', hoje).reduce((s, c) => s + c.valor, 0);
}

function alertasContas(estado, hoje) {
  return estado.financeiro.contas
    .filter((c) => ['vencida', 'hoje'].includes(situacaoConta(c, hoje)))
    .sort((a, b) => a.vencimento.localeCompare(b.vencimento))
    .map((c) => ({ chave: `conta-${c.id}`, href: '#sindico.financeiro.contas', texto: `${situacaoConta(c, hoje) === 'vencida' ? 'Conta vencida' : 'Vence hoje'}: ${c.descricao} (${fmtReais(c.valor)})` }));
}

function serieDaConta(conta) {
  return `${conta.fornecedor}|${conta.descricao}`;
}

// ---- src/financeiro/balancete.js ----

// Balancete mensal: meses passados ficam guardados (e travam ao fechar); o mês corrente é calculado na hora.
const NOMES_SITUACAO_BALANCETE = { aberto: 'Aberto', fechado: 'Fechado', aguardando: 'Aguardando conselho', correcao: 'Correção pedida', aprovado: 'Aprovado' };
const SITUACOES_TRAVADAS = ['fechado', 'aprovado'];

function totalReceitas(b) {
  return b.receitas.reduce((s, r) => s + r.valor, 0);
}

function totalDespesas(b) {
  return b.despesas.reduce((s, d) => s + d.itens.reduce((t, i) => t + i.valor, 0), 0);
}

function totalCategoria(d) {
  return d.itens.reduce((s, i) => s + i.valor, 0);
}

function saldoFinal(b) {
  return b.saldoInicial + totalReceitas(b) - totalDespesas(b);
}

function mesCorrente(hoje) {
  return hoje.slice(0, 7);
}

function balanceteVivo(estado, hoje) {
  const fin = estado.financeiro;
  const mes = mesCorrente(hoje);
  const anterior = fin.balancetes[somarMes(mes, -1)];
  const noMes = (iso) => iso && mesDoInstante(iso) === mes;
  const pagas = fin.cobrancas.filter((c) => c.status === 'paga' && noMes(c.pagaEm));
  const acordos = pagas.filter((c) => c.acordo).reduce((s, c) => s + c.valorPago, 0);
  const taxas = pagas.filter((c) => !c.acordo).reduce((s, c) => s + c.valorPago, 0);
  const receitas = [{ nome: 'Taxas condominiais', valor: taxas }, ...(acordos ? [{ nome: 'Parcelas de acordos', valor: acordos }] : [])];
  const despesas = Object.keys(CATEGORIAS_DESPESA).map((categoria) => {
    const itens = [
      ...fin.contas.filter((c) => c.categoria === categoria && c.situacao === 'paga' && noMes(c.pagaEm)).map((c) => ({ id: c.id, descricao: `${c.descricao} · ${c.fornecedor}`, valor: c.valor, nota: true })),
      ...estado.manutencao.compras.filter((c) => c.categoria === categoria && c.status === 'recebida' && !c.viaCaixa && noMes(c.recebidaEm)).map((c) => ({ id: c.id, descricao: `Compra ${c.id}: ${c.item}`, valor: c.valorFinal, nota: !!c.nota })),
      ...(categoria === 'manutencao' ? estado.manutencao.caixa.reposicoes.filter((r) => noMes(r.em)).map((r, n) => ({ id: `caixa-${n + 1}`, descricao: 'Reposição do caixa pequeno (cupons anexos)', valor: r.valor, nota: true })) : []),
      ...fin.ajustesMes.filter((a) => a.categoria === categoria).map((a) => ({ id: a.id, descricao: `Ajuste referente a ${nomeMes(a.referente)}: ${a.descricao}`, valor: a.valor, nota: true })),
    ];
    const resto = fin.despesasMes[categoria] - itens.reduce((s, i) => s + i.valor, 0);
    if (resto > 0) itens.push({ id: `outros-${categoria}`, descricao: 'Outros lançamentos do mês', valor: resto, nota: null });
    return { categoria, itens };
  });
  const inad = indicadoresFinanceiros(estado, hoje).inadimplencia;
  return {
    situacao: 'aberto', parcial: true, saldoInicial: anterior ? saldoFinal(anterior) : fin.saldo - taxas - acordos + Object.values(fin.despesasMes).reduce((s, v) => s + v, 0),
    receitas, despesas, inadimplencia: { unidades: inad.unidades, valor: inad.valor }, comentarios: [], correcao: null, fechadoEm: null, aprovadoEm: null, aprovadoPor: null, documento: null, resumo: null,
  };
}

function balanceteDe(estado, mes, hoje) {
  return mes === mesCorrente(hoje) ? balanceteVivo(estado, hoje) : estado.financeiro.balancetes[mes] || null;
}

function mesesDaPrestacao(estado, hoje) {
  return [mesCorrente(hoje), ...Object.keys(estado.financeiro.balancetes).sort().reverse()];
}

function itemDoBalancete(b, itemId) {
  for (const d of b.despesas) {
    const item = d.itens.find((i) => i.id === itemId);
    if (item) return { ...item, categoria: d.categoria };
  }
  return null;
}

function itensSemNota(b) {
  return b.despesas.flatMap((d) => d.itens.filter((i) => i.nota === false));
}

function resumoDoBalancete(estado, b) {
  const unidades = estado.condominio.unidades.length;
  return {
    saldoInicial: b.saldoInicial,
    receitas: totalReceitas(b),
    despesas: b.despesas.map((d) => ({ nome: CATEGORIAS_DESPESA[d.categoria], valor: totalCategoria(d) })),
    totalDespesas: totalDespesas(b),
    saldoFinal: saldoFinal(b),
    inadimplenciaPct: Math.round((b.inadimplencia.unidades / unidades) * 1000) / 10,
  };
}

function resumosPublicados(estado) {
  return Object.entries(estado.financeiro.balancetes).filter(([, b]) => b.resumo).sort(([a], [b]) => b.localeCompare(a)).map(([mes, b]) => ({ mes, b }));
}

function alertasPrestacao(estado, hoje) {
  const atual = mesCorrente(hoje);
  return Object.entries(estado.financeiro.balancetes)
    .filter(([mes, b]) => mes < atual && ['aberto', 'correcao'].includes(b.situacao))
    .map(([mes, b]) => ({ chave: `balancete-${mes}`, href: `#sindico.financeiro.prestacao-${mes}`, texto: b.situacao === 'aberto' ? `Feche o balancete de ${nomeMes(mes)}` : `Balancete de ${nomeMes(mes)}: o conselho pediu correção` }));
}

function mesesParaOConselho(estado) {
  return Object.entries(estado.financeiro.balancetes).filter(([, b]) => b.situacao === 'aguardando').map(([mes]) => mes);
}

function dataDoInstante(iso) {
  return isoDia(new Date(iso));
}

// Fluxo de caixa projetado (Avançado): entradas previstas descontadas da inadimplência e saídas das contas, dia a dia.
const DIAS_FLUXO = 90;

function entradasDeCobrancas(fin, hoje, fim, fator) {
  const grupos = {};
  for (const c of fin.cobrancas) {
    if (c.status !== 'aberta' || c.vencimento < hoje || c.vencimento > fim) continue;
    const descricao = c.acordo ? 'Parcelas de acordo' : `Taxas de ${nomeMes(c.competencia)}`;
    const chave = `${c.vencimento}|${descricao}`;
    grupos[chave] = { dia: c.vencimento, descricao, valor: (grupos[chave] ? grupos[chave].valor : 0) + c.valor };
  }
  return Object.values(grupos).map((g) => ({ ...g, valor: Math.round(g.valor * fator) }));
}

function entradasPrevistas(estado, hoje, fim, fator) {
  const fin = estado.financeiro;
  const lista = [];
  for (let c = primeiraNaoEmitida(fin); vencimentoDa(fin, c) <= fim; c = somarMes(c, 1)) {
    const dia = vencimentoDa(fin, c);
    if (dia < hoje) continue;
    const total = previaCompetencia(estado, c).linhas.filter((l) => !l.bloqueada).reduce((s, l) => s + l.total, 0);
    lista.push({ dia, descricao: `Taxas de ${nomeMes(c)} (previsão)`, valor: Math.round(total * fator) });
  }
  return lista;
}

function saidasDeContas(fin, hoje, fim) {
  const abertas = fin.contas.filter((c) => c.situacao === 'aberta').map((c) => ({ dia: c.vencimento < hoje ? hoje : c.vencimento, descricao: c.descricao, valor: -c.valor })).filter((s) => s.dia <= fim);
  const series = {};
  for (const c of fin.contas.filter((x) => x.recorrente)) (series[serieDaConta(c)] = series[serieDaConta(c)] || []).push(c);
  const projetadas = [];
  for (const contas of Object.values(series)) {
    const meses = new Set(contas.map((c) => c.vencimento.slice(0, 7)));
    const ultima = contas.reduce((a, b) => (a.vencimento > b.vencimento ? a : b));
    for (let n = 1; ; n++) {
      const dia = mesmoDiaDoMes(ultima.vencimento, n);
      if (dia > fim) break;
      if (dia >= hoje && !meses.has(dia.slice(0, 7))) projetadas.push({ dia, descricao: `${ultima.descricao} (previsão)`, valor: -ultima.valor });
    }
  }
  return [...abertas, ...projetadas];
}

function eventosDoFluxo(estado, hoje, margemPct, dias = DIAS_FLUXO) {
  const fin = estado.financeiro;
  const fim = somarDias(hoje, dias);
  const fator = 1 - margemPct / 100;
  return [...entradasDeCobrancas(fin, hoje, fim, fator), ...entradasPrevistas(estado, hoje, fim, fator), ...saidasDeContas(fin, hoje, fim)]
    .sort((a, b) => a.dia.localeCompare(b.dia) || b.valor - a.valor);
}

function fluxoProjetado(estado, hoje, margemPct, dias = DIAS_FLUXO) {
  const eventos = eventosDoFluxo(estado, hoje, margemPct, dias);
  const reserva = indicadoresFinanceiros(estado, hoje).saldo.despesaMedia;
  let saldo = estado.financeiro.saldo;
  const serie = Array.from({ length: dias + 1 }, (_, i) => {
    const dia = somarDias(hoje, i);
    const doDia = eventos.filter((e) => e.dia === dia);
    saldo += doDia.reduce((s, e) => s + e.valor, 0);
    return { dia, saldo, eventos: doDia };
  });
  const minimo = serie.reduce((m, p) => (p.saldo < m.saldo ? p : m), serie[0]);
  const abaixo = serie.find((p) => p.saldo < reserva) || null;
  return { serie, eventos, reserva, minimo, abaixo, final: serie.at(-1).saldo };
}

function fraseDoFluxo(f) {
  if (f.abaixo) return `Em ${fmtDataCurta(f.abaixo.dia)} o saldo fica abaixo da reserva de ${fmtReais(f.reserva)}`;
  return `O saldo fica acima da reserva nos próximos ${f.serie.length - 1} dias; o ponto mais baixo é ${fmtReais(f.minimo.saldo)} em ${fmtDataCurta(f.minimo.dia)}`;
}

// Ações do financeiro operacional: contas a pagar (Intermediário). Toda saída de caixa entra na auditoria.
function erroFinanceiro(estado, mensagem) {
  return { estado, erro: mensagem };
}

function guardaFinanceiro(estado, perfil, recurso) {
  if (!podeOperar(perfil)) return SO_SINDICO;
  if (!liberado(estado.plano, recurso)) return `Disponível no plano ${recurso === 'aprovacaoConselho' || recurso === 'fluxoCaixa' ? 'Avançado' : 'Intermediário'}`;
  return null;
}

function idConta(n) {
  return `CT-${String(n).padStart(3, '0')}`;
}

function novaConta(estado, dados, perfil) {
  const falha = guardaFinanceiro(estado, perfil, 'contasPagar');
  if (falha) return erroFinanceiro(estado, falha);
  const fornecedor = String(dados.fornecedor || '').trim();
  if (!fornecedor) return erroFinanceiro(estado, 'Informe o fornecedor');
  if (!CATEGORIAS_DESPESA[dados.categoria]) return erroFinanceiro(estado, 'Escolha a categoria');
  if (!(dados.valor > 0)) return erroFinanceiro(estado, 'Informe o valor');
  if (!/^\d{4}-\d{2}-\d{2}$/.test(String(dados.vencimento || ''))) return erroFinanceiro(estado, 'Informe o vencimento');
  const fin = estado.financeiro;
  const id = idConta(fin.proximaConta);
  const conta = { id, fornecedor, categoria: dados.categoria, descricao: String(dados.descricao || '').trim() || fornecedor, valor: Math.round(dados.valor), vencimento: dados.vencimento, recorrente: !!dados.recorrente, situacao: 'aberta', pagaEm: null, comprovante: null, boleto: `boleto-${id}.pdf` };
  return { estado: comFinanceiro(estado, { contas: [...fin.contas, conta], proximaConta: fin.proximaConta + 1 }), id };
}

function pagarConta(estado, id, perfil, agora) {
  const falha = guardaFinanceiro(estado, perfil, 'contasPagar');
  if (falha) return erroFinanceiro(estado, falha);
  const fin = estado.financeiro;
  const conta = fin.contas.find((c) => c.id === id);
  if (!conta) return erroFinanceiro(estado, 'Conta não encontrada');
  if (conta.situacao === 'paga') return erroFinanceiro(estado, 'Esta conta já foi paga');
  const paga = { ...conta, situacao: 'paga', pagaEm: agora.toISOString(), comprovante: `comprovante-${id}.pdf` };
  let contas = fin.contas.map((c) => (c.id === id ? paga : c));
  let proximaConta = fin.proximaConta;
  let seguinte = null;
  if (conta.recorrente) {
    seguinte = { ...conta, id: idConta(proximaConta), vencimento: mesmoDiaDoMes(conta.vencimento, 1), situacao: 'aberta', pagaEm: null, comprovante: null, boleto: `boleto-${idConta(proximaConta)}.pdf` };
    contas = [...contas, seguinte];
    proximaConta += 1;
  }
  const novo = comFinanceiro(estado, {
    contas, proximaConta,
    despesasMes: { ...fin.despesasMes, [conta.categoria]: fin.despesasMes[conta.categoria] + conta.valor },
    saldo: fin.saldo - conta.valor,
    auditoria: comAuditoria(estado, agora, 'Conta paga', `${id} · ${conta.descricao} · ${fmtReais(conta.valor)} · ${CATEGORIAS_DESPESA[conta.categoria]}`),
  });
  return {
    estado: novo,
    seguinte: seguinte && seguinte.id,
    notificacao: { canal: 'Asaas · pagamento de contas', para: conta.fornecedor, texto: `Pagamento de ${fmtReais(conta.valor)} enviado em ${isoDia(agora).split('-').reverse().join('/')} · comprovante anexado${seguinte ? ` · próxima conta em ${seguinte.vencimento.split('-').reverse().join('/')}` : ''}` },
  };
}

// Prestação de contas: fechar o mês (Intermediário trava; Avançado manda ao conselho), análise do conselho, ajuste e resumo.
const SO_CONSELHO = 'Somente o conselho fiscal pode fazer isso';

function idNovoDocumento(estado) {
  return `d${estado.documentos.reduce((m, d) => Math.max(m, Number(d.id.slice(1)) || 0), 0) + 1}`;
}

function comBalancete(estado, mes, mudanca) {
  const fin = estado.financeiro;
  return comFinanceiro(estado, { balancetes: { ...fin.balancetes, [mes]: { ...fin.balancetes[mes], ...mudanca } } });
}

function comDocumentoVersionado(estado, docId, dados, agora) {
  const data = isoDia(agora);
  const atual = docId && estado.documentos.find((d) => d.id === docId);
  if (atual) return { estado: { ...estado, documentos: estado.documentos.map((d) => (d.id === docId ? { ...d, versoes: [...d.versoes, { versao: d.versoes.length + 1, data }] } : d)) }, id: docId };
  const id = idNovoDocumento(estado);
  return { estado: { ...estado, documentos: [...estado.documentos, { id, ...dados, versoes: [{ versao: 1, data }] }] }, id };
}

function guardaConselho(estado, perfil) {
  if (perfil !== 'conselho') return SO_CONSELHO;
  if (!liberado(estado.plano, 'aprovacaoConselho')) return 'Disponível no plano Avançado';
  return null;
}

function balanceteGuardadoDe(estado, mes) {
  return estado.financeiro.balancetes[mes] || null;
}

function fecharMes(estado, mes, perfil, agora) {
  const falha = guardaFinanceiro(estado, perfil, 'prestacaoContas');
  if (falha) return erroFinanceiro(estado, falha);
  if (mes >= isoDia(agora).slice(0, 7)) return erroFinanceiro(estado, 'O mês ainda não terminou');
  const b = balanceteGuardadoDe(estado, mes);
  if (!b) return erroFinanceiro(estado, 'Balancete não encontrado');
  if (b.situacao !== 'aberto') return erroFinanceiro(estado, 'Este mês já foi fechado');
  const comConselho = liberado(estado.plano, 'aprovacaoConselho');
  const doc = comDocumentoVersionado(estado, b.documento, { pasta: 'Balancetes', titulo: `Balancete de ${nomeMes(mes)}`, visibilidade: 'conselho' }, agora);
  const novo = comBalancete(doc.estado, mes, { situacao: comConselho ? 'aguardando' : 'fechado', fechadoEm: agora.toISOString(), documento: doc.id });
  return {
    estado: comFinanceiro(novo, { auditoria: comAuditoria(novo, agora, 'Balancete fechado', `${nomeMes(mes)}${comConselho ? ' · enviado ao conselho fiscal' : ' · travado'}`) }),
    notificacao: comConselho
      ? { canal: 'App + e-mail', para: `${CONSELHEIRO.nome} (conselho fiscal)`, texto: `Balancete de ${nomeMes(mes)} pronto para análise` }
      : { canal: 'Documentos', para: 'Conselho fiscal', texto: `Balancete de ${nomeMes(mes)} fechado e travado` },
  };
}

function comentarLancamento(estado, mes, itemId, texto, perfil, agora) {
  const falha = guardaConselho(estado, perfil);
  if (falha) return erroFinanceiro(estado, falha);
  const b = balanceteGuardadoDe(estado, mes);
  if (!b || b.situacao !== 'aguardando') return erroFinanceiro(estado, 'Só balancetes aguardando o conselho recebem comentários');
  if (!itemDoBalancete(b, itemId)) return erroFinanceiro(estado, 'Lançamento não encontrado');
  const escrito = String(texto || '').trim();
  if (!escrito) return erroFinanceiro(estado, 'Escreva o comentário');
  const fin = estado.financeiro;
  const comentario = { id: `CM-${fin.proximoComentario}`, item: itemId, texto: escrito, autor: CONSELHEIRO.nome, em: agora.toISOString(), resposta: null };
  const novo = comBalancete(estado, mes, { comentarios: [...b.comentarios, comentario] });
  return { estado: comFinanceiro(novo, { proximoComentario: fin.proximoComentario + 1 }), id: comentario.id };
}

function pedirCorrecao(estado, mes, motivo, perfil, agora) {
  const falha = guardaConselho(estado, perfil);
  if (falha) return erroFinanceiro(estado, falha);
  const b = balanceteGuardadoDe(estado, mes);
  if (!b || b.situacao !== 'aguardando') return erroFinanceiro(estado, 'Só balancetes aguardando o conselho');
  const texto = String(motivo || '').trim();
  if (!texto) return erroFinanceiro(estado, 'Informe o motivo');
  return {
    estado: comBalancete(estado, mes, { situacao: 'correcao', correcao: { motivo: texto, autor: CONSELHEIRO.nome, em: agora.toISOString() } }),
    notificacao: { canal: 'App + e-mail', para: 'Síndico', texto: `Conselho pediu correção no balancete de ${nomeMes(mes)}: ${texto}` },
  };
}

function aprovarMes(estado, mes, perfil, agora) {
  const falha = guardaConselho(estado, perfil);
  if (falha) return erroFinanceiro(estado, falha);
  const b = balanceteGuardadoDe(estado, mes);
  if (!b || b.situacao !== 'aguardando') return erroFinanceiro(estado, 'Só balancetes aguardando o conselho');
  const novo = comBalancete(estado, mes, { situacao: 'aprovado', aprovadoEm: agora.toISOString(), aprovadoPor: CONSELHEIRO.nome });
  return {
    estado: comFinanceiro(novo, { auditoria: comAuditoria(novo, agora, 'Balancete aprovado', `${nomeMes(mes)} · ${CONSELHEIRO.nome} · mês travado`) }),
    notificacao: { canal: 'App + e-mail', para: 'Síndico', texto: `Balancete de ${nomeMes(mes)} aprovado pelo conselho fiscal` },
  };
}

function anexarNota(estado, mes, itemId, perfil) {
  const falha = guardaFinanceiro(estado, perfil, 'prestacaoContas');
  if (falha) return erroFinanceiro(estado, falha);
  const b = balanceteGuardadoDe(estado, mes);
  if (!b) return erroFinanceiro(estado, 'Balancete não encontrado');
  if (SITUACOES_TRAVADAS.includes(b.situacao)) return erroFinanceiro(estado, 'Mês travado: registre um ajuste no mês corrente');
  if (b.situacao === 'aguardando') return erroFinanceiro(estado, 'Aguarde a análise do conselho');
  if (!itemDoBalancete(b, itemId)) return erroFinanceiro(estado, 'Lançamento não encontrado');
  const despesas = b.despesas.map((d) => ({ ...d, itens: d.itens.map((i) => (i.id === itemId ? { ...i, nota: true, anexo: `nota-${itemId}.pdf` } : i)) }));
  return { estado: comBalancete(estado, mes, { despesas }) };
}

function responderComentario(estado, mes, comentarioId, texto, perfil, agora) {
  const falha = guardaFinanceiro(estado, perfil, 'prestacaoContas');
  if (falha) return erroFinanceiro(estado, falha);
  const b = balanceteGuardadoDe(estado, mes);
  if (!b || !b.comentarios.some((c) => c.id === comentarioId)) return erroFinanceiro(estado, 'Comentário não encontrado');
  const escrito = String(texto || '').trim();
  if (!escrito) return erroFinanceiro(estado, 'Escreva a resposta');
  return { estado: comBalancete(estado, mes, { comentarios: b.comentarios.map((c) => (c.id === comentarioId ? { ...c, resposta: { texto: escrito, em: agora.toISOString() } } : c)) }) };
}

function reenviarAoConselho(estado, mes, perfil, agora) {
  const falha = guardaFinanceiro(estado, perfil, 'prestacaoContas');
  if (falha) return erroFinanceiro(estado, falha);
  const b = balanceteGuardadoDe(estado, mes);
  if (!b || b.situacao !== 'correcao') return erroFinanceiro(estado, 'Só balancetes com correção pedida');
  const doc = comDocumentoVersionado(estado, b.documento, {}, agora);
  return {
    estado: comBalancete(doc.estado, mes, { situacao: 'aguardando', correcao: { ...b.correcao, respondidaEm: agora.toISOString() } }),
    notificacao: { canal: 'App + e-mail', para: `${CONSELHEIRO.nome} (conselho fiscal)`, texto: `Balancete de ${nomeMes(mes)} corrigido e reenviado` },
  };
}

function registrarAjuste(estado, mesOrigem, { descricao, categoria, valor }, perfil, agora) {
  const falha = guardaFinanceiro(estado, perfil, 'prestacaoContas');
  if (falha) return erroFinanceiro(estado, falha);
  const b = balanceteGuardadoDe(estado, mesOrigem);
  if (!b || !SITUACOES_TRAVADAS.includes(b.situacao)) return erroFinanceiro(estado, 'Ajustes só valem para meses travados');
  const texto = String(descricao || '').trim();
  if (!texto) return erroFinanceiro(estado, 'Descreva o ajuste');
  if (!CATEGORIAS_DESPESA[categoria]) return erroFinanceiro(estado, 'Escolha a categoria');
  if (!(valor > 0)) return erroFinanceiro(estado, 'Informe o valor');
  const fin = estado.financeiro;
  const ajuste = { id: `AJ-${fin.ajustesMes.length + 1}`, referente: mesOrigem, descricao: texto, categoria, valor: Math.round(valor), em: agora.toISOString() };
  return {
    estado: comFinanceiro(estado, {
      ajustesMes: [...fin.ajustesMes, ajuste],
      despesasMes: { ...fin.despesasMes, [categoria]: fin.despesasMes[categoria] + ajuste.valor },
      saldo: fin.saldo - ajuste.valor,
      auditoria: comAuditoria(estado, agora, 'Ajuste de mês travado', `Referente a ${nomeMes(mesOrigem)} · ${texto} · ${fmtReais(ajuste.valor)}`),
    }),
    id: ajuste.id,
  };
}

function publicarResumo(estado, mes, perfil, agora) {
  const falha = guardaFinanceiro(estado, perfil, 'prestacaoContas');
  if (falha) return erroFinanceiro(estado, falha);
  const b = balanceteGuardadoDe(estado, mes);
  if (!b) return erroFinanceiro(estado, 'Balancete não encontrado');
  if (b.resumo) return erroFinanceiro(estado, 'O resumo já foi publicado');
  const comConselho = liberado(estado.plano, 'aprovacaoConselho');
  if (comConselho ? b.situacao !== 'aprovado' : !SITUACOES_TRAVADAS.includes(b.situacao)) return erroFinanceiro(estado, comConselho ? 'Aguarde a aprovação do conselho' : 'Feche o mês antes de publicar');
  const doc = comDocumentoVersionado(estado, null, { pasta: 'Prestação de contas', titulo: `Prestação de contas de ${nomeMes(mes)} (resumo)`, visibilidade: 'todos' }, agora);
  return {
    estado: comBalancete(doc.estado, mes, { resumo: { publicadoEm: agora.toISOString(), documento: doc.id } }),
    notificacao: { canal: 'App', para: 'Todos os moradores', texto: `Prestação de contas de ${nomeMes(mes)} publicada` },
  };
}

// Semente: o balancete aprovado usa o documento d5 e já tem o resumo publicado.
function comPrestacaoInicial(estado) {
  const fin = estado.financeiro;
  const [mes] = Object.entries(fin.balancetes).find(([, b]) => b.situacao === 'aprovado') || [];
  if (!mes) return estado;
  const b = fin.balancetes[mes];
  const documentos = estado.documentos.map((d) => (d.id === 'd5' ? { ...d, titulo: `Balancete de ${nomeMes(mes)}`, versoes: [{ versao: 1, data: isoDia(new Date(b.fechadoEm)) }] } : d));
  const id = idNovoDocumento(estado);
  const comResumo = { ...estado, documentos: [...documentos, { id, pasta: 'Prestação de contas', titulo: `Prestação de contas de ${nomeMes(mes)} (resumo)`, versoes: [{ versao: 1, data: isoDia(new Date(b.resumo.publicadoEm)) }], visibilidade: 'todos' }] };
  return comBalancete(comResumo, mes, { resumo: { ...b.resumo, documento: id } });
}

// Processo de infração: advertência ou multa com prazo de defesa, decidida pelo síndico com justificativa.
const NOMES_TIPO_INFRACAO = { advertencia: 'Advertência', multa: 'Multa' };
const NOMES_SITUACAO_INFRACAO = { defesa: 'Aguardando defesa', analise: 'Em análise', decidido: 'Decidido' };
const NOMES_RESULTADO_INFRACAO = { mantida: 'Mantida', convertida: 'Convertida em advertência', cancelada: 'Cancelada' };
const PRAZO_DEFESA_PADRAO = 10;

function infracaoPorId(estado, id) {
  return estado.infracoes.find((p) => p.id === id) || null;
}

function prazoVencido(p, hoje) {
  return p.prazoEncerrado || hoje > p.prazoAte;
}

function situacaoInfracao(p, hoje) {
  return p.situacao === 'defesa' && prazoVencido(p, hoje) ? 'analise' : p.situacao;
}

function podeDecidir(p, hoje) {
  return p.situacao !== 'decidido' && (!!p.defesa || prazoVencido(p, hoje));
}

function infracoesDaUnidade(estado, unidade) {
  return estado.infracoes.filter((p) => p.unidade === unidade).sort((a, b) => b.abertoEm.localeCompare(a.abertoEm));
}

function infracoesAbertas(estado) {
  return estado.infracoes.filter((p) => p.situacao !== 'decidido').sort((a, b) => a.prazoAte.localeCompare(b.prazoAte));
}

function alertasInfracoes(estado, hoje) {
  return infracoesAbertas(estado).filter((p) => podeDecidir(p, hoje)).map((p) => ({
    chave: `infracao-${p.id}`,
    href: `#sindico.ocorrencias.${p.id}`,
    texto: `${p.id}: ${p.defesa ? 'defesa recebida' : 'prazo de defesa encerrado'}, decida`,
  }));
}

function fatoPadrao(oc) {
  return `${CATEGORIAS[oc.categoria].nome} (registro de ${fmtDataCurta(isoDia(new Date(oc.criadaEm)))})`;
}

// Ações do processo de infração. O infrator vê só o fato descrito pelo síndico, nunca a notificação original.
const SO_SINDICO_INFRACAO = 'Somente o síndico pode fazer isso';

function erroInfracao(estado, mensagem) {
  return { estado, erro: mensagem };
}

function guardaInfracao(estado, perfil) {
  if (perfil !== 'sindico') return SO_SINDICO_INFRACAO;
  if (!liberado(estado.plano, 'multasDefesa')) return 'Disponível no plano Intermediário';
  return null;
}

function comEntradaInfracao(estado, id, mudanca, texto, autor, agora) {
  const p = infracaoPorId(estado, id);
  return { ...estado, infracoes: trocarItem(estado.infracoes, id, { ...mudanca, linha: [...p.linha, { em: agora.toISOString(), texto, autor }] }) };
}

function comEntradaNaOcorrencia(estado, ocId, texto, agora, mudanca = {}) {
  const oc = estado.ocorrencias.find((o) => o.id === ocId);
  return { ...estado, ocorrencias: trocarItem(estado.ocorrencias, ocId, { ...mudanca, linha: [...oc.linha, { em: agora.toISOString(), status: null, texto, autor: 'Síndico' }] }) };
}

function abrirProcesso(estado, ocId, dados, perfil, agora) {
  const falha = guardaInfracao(estado, perfil);
  if (falha) return erroInfracao(estado, falha);
  const oc = estado.ocorrencias.find((o) => o.id === ocId);
  if (!oc) return erroInfracao(estado, 'Ocorrência não encontrada');
  if (CATEGORIAS[oc.categoria].tipo !== 'irregularidade') return erroInfracao(estado, 'Processo só vale para irregularidades');
  const unidade = String(dados.unidade || '').trim();
  if (!estado.condominio.unidades.includes(unidade)) return erroInfracao(estado, 'Informe a unidade infratora');
  const tipo = dados.tipo === 'advertencia' ? 'advertencia' : 'multa';
  const artigo = String(dados.artigo || '').trim();
  if (!artigo) return erroInfracao(estado, 'Informe o artigo do regimento');
  const fato = String(dados.fato || '').trim();
  if (!fato) return erroInfracao(estado, 'Descreva o fato');
  if (tipo === 'multa' && !(dados.valor > 0)) return erroInfracao(estado, 'Informe o valor da multa');
  const prazoDias = Number(dados.prazoDias);
  if (!Number.isInteger(prazoDias) || prazoDias < 5 || prazoDias > 30) return erroInfracao(estado, 'O prazo de defesa deve ser de 5 a 30 dias');
  if (estado.infracoes.some((p) => p.ocorrencia === ocId && p.unidade === unidade && p.situacao !== 'decidido')) return erroInfracao(estado, 'Já existe um processo aberto para esta unidade nesta notificação');
  const id = `PI-${String(estado.proximaInfracao).padStart(3, '0')}`;
  const prazoAte = somarDias(isoDia(agora), prazoDias);
  const nome = NOMES_TIPO_INFRACAO[tipo];
  const processo = {
    id, ocorrencia: ocId, unidade, tipo, artigo, fato, valor: tipo === 'multa' ? Math.round(dados.valor) : null, prazoDias,
    abertoEm: agora.toISOString(), prazoAte, situacao: 'defesa', defesa: null, prazoEncerrado: false, decisao: null, lancamento: null,
    linha: [{ em: agora.toISOString(), texto: `${nome} aberta com base no ${artigo}. Prazo de defesa até ${fmtDataCurta(prazoAte)}`, autor: 'Síndico' }],
  };
  const novo = comEntradaNaOcorrencia({ ...estado, infracoes: [...estado.infracoes, processo], proximaInfracao: estado.proximaInfracao + 1 }, ocId, `Processo ${id} aberto: ${nome.toLowerCase()} ao apto ${unidade}`, agora, { processos: [...(oc.processos || []), id] });
  return {
    estado: novo,
    id,
    notificacao: { canal: 'App + e-mail', para: nomesDaUnidade(estado, unidade), texto: `Notificação formal do condomínio (${id}): ${fato}. ${artigo}.${processo.valor ? ` Multa de ${fmtReais(processo.valor)}.` : ''} Defesa até ${fmtDataCurta(prazoAte)}.` },
  };
}

function apresentarDefesa(estado, id, { unidade, autor, texto, anexo }, agora) {
  const p = infracaoPorId(estado, id);
  if (!p) return erroInfracao(estado, 'Processo não encontrado');
  if (unidade !== p.unidade) return erroInfracao(estado, `Só moradores do apto ${p.unidade} podem apresentar defesa`);
  if (p.situacao === 'decidido') return erroInfracao(estado, 'O processo já foi decidido');
  if (p.defesa) return erroInfracao(estado, 'A defesa já foi apresentada');
  if (prazoVencido(p, isoDia(agora))) return erroInfracao(estado, 'O prazo de defesa terminou');
  const escrita = String(texto || '').trim();
  if (!escrita) return erroInfracao(estado, 'Escreva a sua defesa');
  const defesa = { texto: escrita, anexo: anexo || null, autor, em: agora.toISOString() };
  return {
    estado: comEntradaInfracao(estado, id, { defesa, situacao: 'analise' }, `Defesa apresentada${anexo ? ' com anexo' : ''}`, autor, agora),
    notificacao: { canal: 'Painel do síndico', para: 'Síndico', texto: `${id}: defesa apresentada pelo apto ${p.unidade}` },
  };
}

function encerrarPrazo(estado, id, perfil, agora) {
  const falha = guardaInfracao(estado, perfil);
  if (falha) return erroInfracao(estado, falha);
  const p = infracaoPorId(estado, id);
  if (!p || p.situacao !== 'defesa' || p.defesa) return erroInfracao(estado, 'Só processos aguardando defesa');
  return { estado: comEntradaInfracao(estado, id, { prazoEncerrado: true, situacao: 'analise' }, 'Prazo de defesa encerrado sem defesa', 'Síndico', agora) };
}

function decidirProcesso(estado, id, { resultado, justificativa }, perfil, agora) {
  const falha = guardaInfracao(estado, perfil);
  if (falha) return erroInfracao(estado, falha);
  const p = infracaoPorId(estado, id);
  if (!p) return erroInfracao(estado, 'Processo não encontrado');
  if (p.situacao === 'decidido') return erroInfracao(estado, 'O processo já foi decidido');
  if (!podeDecidir(p, isoDia(agora))) return erroInfracao(estado, 'Aguarde a defesa ou o fim do prazo');
  if (!NOMES_RESULTADO_INFRACAO[resultado]) return erroInfracao(estado, 'Escolha a decisão');
  if (resultado === 'convertida' && p.tipo !== 'multa') return erroInfracao(estado, 'Só multas podem ser convertidas em advertência');
  const motivo = String(justificativa || '').trim();
  if (!motivo) return erroInfracao(estado, 'Informe a justificativa da decisão');
  const lanca = resultado === 'mantida' && p.tipo === 'multa';
  let novo = estado;
  let lancamento = null;
  if (lanca) {
    const fin = estado.financeiro;
    lancamento = primeiraNaoEmitida(fin);
    const item = { tipo: 'multa', descricao: `Multa por infração ${id} (${p.artigo})`, valor: p.valor };
    const ajuste = fin.ajustesPrevia[lancamento] && fin.ajustesPrevia[lancamento][p.unidade];
    const ajustesPrevia = ajuste ? { ...fin.ajustesPrevia, [lancamento]: { ...fin.ajustesPrevia[lancamento], [p.unidade]: [...ajuste, item] } } : fin.ajustesPrevia;
    novo = { ...estado, financeiro: { ...fin, avulsos: [...fin.avulsos, { unidade: p.unidade, competencia: lancamento, ...item }], ajustesPrevia } };
  }
  const texto = `Decisão: ${NOMES_RESULTADO_INFRACAO[resultado].toLowerCase()}. ${motivo}${lanca ? `. Multa de ${fmtReais(p.valor)} no boleto de ${nomeMes(lancamento)}` : ''}`;
  novo = comEntradaInfracao(novo, id, { situacao: 'decidido', decisao: { resultado, justificativa: motivo, em: agora.toISOString() }, lancamento }, texto, 'Síndico', agora);
  novo = comEntradaNaOcorrencia(novo, p.ocorrencia, `Decisão do processo ${id}: ${NOMES_RESULTADO_INFRACAO[resultado].toLowerCase()}`, agora);
  return {
    estado: novo,
    notificacao: { canal: 'App + e-mail', para: nomesDaUnidade(estado, p.unidade), texto: `Decisão do processo ${id}: ${NOMES_RESULTADO_INFRACAO[resultado].toLowerCase()}.${lanca ? ` Multa de ${fmtReais(p.valor)} no boleto de ${nomeMes(lancamento)}.` : ''}` },
  };
}

// Semente: multa aguardando defesa para o apto 104 (Juliana), aberta pela própria ação como faria o síndico.
function comInfracaoInicial(estado, agora) {
  const abertura = new Date(agora.getFullYear(), agora.getMonth(), agora.getDate(), 0, 10);
  const r = abrirProcesso(estado, 'OC-0041', { unidade: '104', tipo: 'multa', artigo: 'Art. 12 do regimento interno (silêncio depois das 22h)', fato: 'Música alta depois das 22h na unidade, registrada na noite anterior', valor: 20000, prazoDias: 10 }, 'sindico', abertura);
  return r.erro ? estado : r.estado;
}

// Regras do zelador: ordem das OS, cotações mínimas por faixa de valor e alertas ao síndico.
const LIMITE_COTACAO_1 = 50000;
const LIMITE_COTACAO_2 = 200000;
const ATIVAS_OS = ['aberta', 'em_execucao', 'aguardando_material', 'aguardando_prestador'];

function listaOS(estado) {
  const fase = (o) => (ATIVAS_OS.includes(o.status) ? 0 : o.status === 'concluida' ? 1 : 2);
  return [...estado.manutencao.os].sort((a, b) => fase(a) - fase(b) || ORDEM_PRIORIDADE.indexOf(a.prioridade) - ORDEM_PRIORIDADE.indexOf(b.prioridade) || a.prazo.localeCompare(b.prazo));
}

function osAtiva(os) {
  return ATIVAS_OS.includes(os.status);
}

function cotacoesMinimas(valor) {
  if (valor > LIMITE_COTACAO_2) return { minimo: 3, acimaDe: LIMITE_COTACAO_2 };
  if (valor > LIMITE_COTACAO_1) return { minimo: 2, acimaDe: LIMITE_COTACAO_1 };
  return { minimo: 1, acimaDe: 0 };
}

function textoCotacoes(valor) {
  const r = cotacoesMinimas(valor);
  return r.acimaDe ? `Anexe ${r.minimo} cotações para compras acima de ${fmtReais(r.acimaDe)}` : 'Anexe 1 cotação';
}

function alertasManutencao(estado, agora) {
  const m = estado.manutencao;
  const itens = [];
  for (const o of m.os.filter((x) => x.prioridade === 'urgente' && x.status === 'aberta')) {
    const h = Math.floor(horasEntre(new Date(o.criadaEm), agora));
    if (h >= 2) itens.push({ chave: `osu-${o.id}`, texto: `${o.id} urgente sem início há ${h} h`, href: `#sindico.manutencao.${o.id}` });
  }
  for (const o of m.os.filter((x) => x.status === 'concluida')) itens.push({ chave: `osv-${o.id}`, texto: `${o.id} concluída: validar`, href: `#sindico.manutencao.${o.id}` });
  for (const c of m.compras.filter((x) => x.status === 'solicitada')) itens.push({ chave: `cp-${c.id}`, texto: `${c.id} aguardando aprovação: ${c.item}, ${fmtReais(c.valorEstimado)}`, href: `#sindico.manutencao.${c.id}` });
  return itens;
}
