// Sr. Abel: Intermediário responde pelo manual e pelos dados do perfil; Avançado conversa com o Claude, vendo o estado real.
const COPIA_ERRO_ABEL = {
  rate_limited: 'Muitas perguntas seguidas. Espere um pouquinho e tente de novo.',
  session_expired: 'Sua sessão expirou. Entre de novo no Claude e tente outra vez.',
  refused: 'Não posso responder isso. Tente perguntar de outro jeito.',
  empty_completion: 'Fiquei sem palavras 🐝. Tente perguntar de outro jeito.',
  prompt_too_large: 'A conversa ficou longa demais. Toque em Nova conversa.',
};
const SEM_IA_ABEL = ['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'];

// Texto do Sr. Abel com **negrito** e listas "- " ou "1. ". Escapa tudo antes de formatar.
function TextoAbel({ texto }) {
  const blocos = [];
  let lista = null;
  texto.split('\n').forEach((linha, i) => {
    const item = linha.match(/^\s*(?:[-•*]|\d+[.)])\s+(.*)/);
    const partes = (item ? item[1] : linha).split(/\*\*(.+?)\*\*/g).map((p, j) => (j % 2 ? html`<strong key=${j}>${p}</strong>` : p));
    if (item) {
      if (!lista) { lista = []; blocos.push(html`<ul key=${`l${i}`}>${lista}</ul>`); }
      lista.push(html`<li key=${i}>${partes}</li>`);
    } else {
      lista = null;
      if (linha.trim()) blocos.push(html`<p key=${i}>${partes.map((p) => (typeof p === 'string' ? p.replace(/^#+\s*/, '') : p))}</p>`);
    }
  });
  return blocos;
}

function AvisoPlanoAbel({ estado }) {
  const minimo = planoMinimo('assistente');
  const unidades = estado.condominio.unidades.length;
  return html`<div class="abel-msgs"><div class="bloqueado">
    <strong>Sr. Abel, o assistente do CondoFácil</strong>
    <span>Disponível no plano ${minimo.nome} (+${fmtReais(mensalidade(minimo.id, unidades) - mensalidade(estado.plano, unidades))}/mês)</span>
    <small class="sub">Tira dúvidas do app e consulta os seus dados. No Avançado, conversa com IA e faz ações como reservar e votar.</small>
  </div></div>`;
}

function SrAbel({ estado, rota, agora, executar, obterEstado }) {
  const perfil = rota.perfil;
  const chaveConversa = perfil === 'morador' ? `${perfil}-${estado.moradorAtual}` : perfil;
  const comAbel = liberado(estado.plano, 'assistente');
  const comIA = liberado(estado.plano, 'assistenteIA');
  const [aberto, setAberto] = useState(false);
  const [conversa, setConversa] = useState({ chave: null, mensagens: [] });
  const [texto, setTexto] = useState('');
  const [sample, setSample] = useState(null);
  const [comFerramentas, setComFerramentas] = useState(false);
  const [pensando, setPensando] = useState(false);
  const controle = useRef(null);

  useEffect(() => {
    let ativo = true;
    if (!comIA || !window.claude || !window.claude.use) { setSample(null); return undefined; }
    window.claude.use('sample').then(async (s) => {
      if (!ativo) return;
      setSample(() => s);
      const lim = s ? await s.limits().catch(() => null) : null;
      if (ativo) setComFerramentas(!!(lim && lim.tools));
    }).catch(() => ativo && setSample(null));
    return () => { ativo = false; };
  }, [comIA]);

  const mensagens = conversa.chave === chaveConversa ? conversa.mensagens : [{ de: 'abel', texto: saudacaoAbel(estado, perfil), links: [] }];
  const comIAAgora = comIA && !!sample;

  useEffect(() => {
    const el = document.getElementById('abel-msgs');
    if (el) el.scrollTop = el.scrollHeight;
  }, [mensagens.length, aberto, mensagens.at(-1) && mensagens.at(-1).texto]);

  function guardar(lista) {
    setConversa({ chave: chaveConversa, mensagens: lista });
  }

  async function perguntarIA(base, p) {
    const pendente = { de: 'abel', texto: 'O Sr. Abel está pensando…', links: [], pensando: true };
    let atual = [...base, pendente];
    guardar(atual);
    setPensando(true);
    const ctl = new AbortController();
    controle.current = ctl;
    const trocar = (msg) => { atual = [...atual.slice(0, -1), msg]; guardar(atual); };
    const acoes = [];
    const turnos = base.filter((m) => !m.pensando && !m.acao).slice(-14).map((m) => ({ role: m.de === 'eu' ? 'user' : 'assistant', content: m.texto }));
    while (turnos.length && turnos[0].role === 'assistant') turnos.shift();
    try {
      const opcoes = {
        modelTier: 'quick', cache: false, signal: ctl.signal,
        onText: ({ text }) => trocar({ de: 'abel', texto: text, links: [], acoes }),
      };
      if (comFerramentas && perfil === 'morador') {
        delete opcoes.cache;
        opcoes.tools = ferramentasAbel({ obterEstado, executar, agora: () => new Date(), aoAgir: (titulo, detalhe) => acoes.push({ titulo, detalhe }) });
      }
      const { text, truncated } = await sample([{ role: 'user', content: instrucoesAbel(obterEstado(), perfil, new Date()) }, ...turnos], opcoes);
      trocar({ de: 'abel', texto: text + (truncated ? '\n\n(Resposta cortada: peça em partes.)' : ''), links: [], acoes });
    } catch (e) {
      const code = e && e.code;
      if (code === 'cancelled') trocar({ de: 'abel', texto: (e.text || '') || 'Parado.', links: [], acoes });
      else if (SEM_IA_ABEL.includes(code) || code === 'tools_unavailable') {
        if (code === 'tools_unavailable') setComFerramentas(false); else setSample(null);
        const r = responderAbel(obterEstado(), perfil, p, new Date());
        trocar({ de: 'abel', ...r, texto: `${r.texto}\n\n(IA não liberada neste acesso: respondi pelo manual.)` });
      } else trocar({ de: 'abel', texto: `${e && e.text ? `${e.text}\n\n` : ''}${COPIA_ERRO_ABEL[code] || 'Deu um probleminha na conexão. Tente de novo.'}`, links: [], acoes });
    } finally {
      controle.current = null;
      setPensando(false);
    }
  }

  function perguntar(pergunta) {
    const p = pergunta.trim();
    if (!p || pensando) return;
    setTexto('');
    const base = [...mensagens, { de: 'eu', texto: p, links: [] }];
    if (comIAAgora) { perguntarIA(base, p); return; }
    guardar([...base, { de: 'abel', ...responderAbel(estado, perfil, p, agora) }]);
  }

  const sugestoes = (PERFIS_ABEL[perfil] || PERFIS_ABEL.morador).sugestoes;
  const modo = !comAbel ? null : comIAAgora ? 'IA ativa' : 'respostas pelo manual';

  return html`
    ${aberto && html`<section class="abel-painel" role="dialog" aria-label="Sr. Abel, assistente do CondoFácil">
      <header class="abel-topo">
        <img class="abel-avatar" src=${AVATAR_ABEL} alt="" />
        <div><strong>Sr. Abel</strong><small>${modo ? `Assistente do CondoFácil · ${modo}` : 'Assistente do CondoFácil'}</small></div>
        ${comAbel && html`<button type="button" class="abel-nova" disabled=${pensando} onClick=${() => guardar([])}>Nova conversa</button>`}
        <button type="button" class="abel-fechar" aria-label="Fechar o Sr. Abel" onClick=${() => setAberto(false)}>×</button>
      </header>
      ${comAbel
        ? html`<div class="abel-msgs" id="abel-msgs" aria-live="polite">
            ${mensagens.map((m, i) => html`<div key=${i} class=${`abel-msg abel-${m.de}${m.pensando ? ' abel-pensando' : ''}`}>
              <div class="abel-bolha"><${TextoAbel} texto=${m.texto} /></div>
              ${m.acoes && m.acoes.map((a, n) => html`<div key=${n} class="abel-acao"><strong>${a.titulo}</strong><span>${a.detalhe}</span></div>`)}
              ${m.links && m.links.length ? html`<div class="abel-links">${m.links.map((l) => html`<button type="button" key=${l.rotulo} class="btn-link" onClick=${() => ir(l.perfil, l.tela)}>${l.rotulo} →</button>`)}</div>` : null}
            </div>`)}
          </div>
          <div class="abel-sugestoes">${sugestoes.map((s) => html`<button type="button" key=${s} disabled=${pensando} onClick=${() => perguntar(s)}>${s}</button>`)}</div>
          <form class="abel-entrada" onSubmit=${(ev) => { ev.preventDefault(); perguntar(texto); }}>
            <label class="so-leitor" for="abel-caixa">Pergunte ao Sr. Abel</label>
            <input id="abel-caixa" type="text" autocomplete="off" placeholder="Pergunte ao Sr. Abel…" value=${texto} disabled=${pensando} onInput=${(ev) => setTexto(ev.target.value)} />
            ${pensando
              ? html`<button type="button" class="btn secundario" onClick=${() => controle.current && controle.current.abort()}>Parar</button>`
              : html`<button type="submit" class="btn primario" disabled=${!texto.trim()}>Enviar</button>`}
          </form>
          <small class="abel-aviso">${comIAAgora ? 'O Sr. Abel usa a IA do Claude e pode errar. Ações sempre pedem sua confirmação; decisões do condomínio são do síndico.' : comIA ? 'IA do plano Avançado: disponível quando o protótipo é aberto no Claude. Agora respondo pelo manual.' : 'Respostas pelo manual e pelos seus dados. A conversa com IA é do plano Avançado.'}</small>`
        : html`<${AvisoPlanoAbel} estado=${estado} />`}
    </section>`}
    <button type="button" class="abel-botao" aria-expanded=${aberto} aria-label=${aberto ? 'Fechar o Sr. Abel' : 'Falar com o Sr. Abel'} onClick=${() => setAberto(!aberto)}>
      <img src=${AVATAR_ABEL} alt="" /><span>${aberto ? 'Fechar' : 'Sr. Abel'}</span>
    </button>
  `;
}

// Assistente de implantação: do cadastro do condomínio ao QR Code de divulgação e à ativação.
const URL_QRCODE = 'https://unpkg.com/qrcode-generator@1.4.4/qrcode.js';
let promessaQr = null;

function carregarQrcode() {
  if (window.qrcode) return Promise.resolve(window.qrcode);
  if (!promessaQr) {
    promessaQr = new Promise((ok, falha) => {
      const s = document.createElement('script');
      s.src = URL_QRCODE;
      s.onload = () => (window.qrcode ? ok(window.qrcode) : falha(new Error('QR indisponível')));
      s.onerror = () => { promessaQr = null; falha(new Error('QR indisponível')); };
      document.head.appendChild(s);
    });
  }
  return promessaQr;
}

function QrCodeReal({ texto, tamanho = 220 }) {
  const [svg, setSvg] = useState(null);
  const [falhou, setFalhou] = useState(false);
  useEffect(() => {
    let ativo = true;
    carregarQrcode().then((qrcode) => {
      const qr = qrcode(0, 'M');
      qr.addData(texto);
      qr.make();
      if (ativo) setSvg(qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true, alt: `QR Code para ${texto}` }));
    }).catch(() => ativo && setFalhou(true));
    return () => { ativo = false; };
  }, [texto]);
  if (falhou) return html`<div class="qr-real qr-falhou" style=${`width:${tamanho}px;height:${tamanho}px`}><small>QR Code indisponível sem internet. Use o link:</small><strong>${texto}</strong></div>`;
  if (!svg) return html`<div class="qr-real" style=${`width:${tamanho}px;height:${tamanho}px`}><small class="sub">Gerando QR Code…</small></div>`;
  return html`<div class="qr-real" style=${`width:${tamanho}px;height:${tamanho}px`} dangerouslySetInnerHTML=${{ __html: svg }}></div>`;
}

function numeroImplantacao(texto) {
  const n = Number(String(texto ?? '').replace(',', '.'));
  return Number.isFinite(n) ? n : NaN;
}

// Converte o rascunho (textos do formulário) na configuração que o condominioNovo espera.
function configDoRascunho(r) {
  return {
    id: r.idCondominio,
    condominio: { ...r.condominio, sindico: { ...r.condominio.sindico, unidade: String(r.condominio.sindico.unidade || '').toUpperCase().replace(/\s+/g, '') } },
    unidades: r.unidades,
    moradores: r.moradores,
    cobranca: { diaVencimento: Number(r.cobranca.diaVencimento), multaPct: numeroImplantacao(r.cobranca.multaPct), jurosPct: numeroImplantacao(r.cobranca.jurosPct), fundoPct: numeroImplantacao(r.cobranca.fundoPct), modo: r.cobranca.modo, valores: { A: lerPreco(r.cobranca.A), cobertura: lerPreco(r.cobranca.cobertura) || lerPreco(r.cobranca.A) }, orcamento: lerPreco(r.cobranca.orcamento) },
    asaas: r.asaas,
    areas: r.areas,
  };
}

function validarPasso(passo, r) {
  if (passo === 'condominio') return validarCondominio(r.condominio);
  if (passo === 'unidades') return r.unidades.length ? null : 'Gere ou importe as unidades';
  if (passo === 'moradores') return lerCsvMoradores(r.csvMoradores, r.unidades.map((u) => u.id)).totalErros ? 'Corrija as linhas com erro (ou apague-as) antes de continuar' : null;
  if (passo === 'cobranca') {
    const c = configDoRascunho(r).cobranca;
    if (!Number.isInteger(c.diaVencimento) || c.diaVencimento < 1 || c.diaVencimento > 28) return 'O vencimento deve ser entre o dia 1 e o dia 28';
    if (!(c.multaPct >= 0 && c.multaPct <= 2)) return 'A multa por atraso é limitada a 2%';
    if (!(c.jurosPct >= 0 && c.jurosPct <= 10)) return 'Informe os juros ao mês (0% a 10%)';
    if (!(c.fundoPct >= 0 && c.fundoPct <= 30)) return 'O fundo de reserva deve ser de 0% a 30%';
    if (c.modo === 'fixo' && !(c.valores.A > 0)) return 'Informe o valor da taxa do apartamento padrão';
    if (c.modo === 'fracao' && !(c.orcamento > 0)) return 'Informe o orçamento mensal';
    return null;
  }
  if (passo === 'divulgacao') {
    const u = configDoRascunho(r).condominio.sindico.unidade;
    if (u && !r.unidades.some((x) => x.id === u)) return `A unidade do síndico (${u}) não existe. Corrija no passo Condomínio`;
    return null;
  }
  return null;
}

// Soma das taxas do mês com o fundo de reserva; vai como faturamento estimado na subconta do Asaas.
function arrecadacaoPrevista(r) {
  const cfg = configDoRascunho(r).cobranca;
  if (!(cfg.valores.A > 0)) return 0;
  const fracoes = fracoesDasUnidades(r.unidades, cfg.valores);
  const mensal = cfg.modo === 'fracao' && cfg.orcamento > 0 ? (u) => Math.round(cfg.orcamento * fracoes[u.id]) : (u) => (u.tipo === 'cobertura' ? cfg.valores.cobertura : cfg.valores.A);
  return r.unidades.reduce((s, u) => s + Math.round(mensal(u) * (1 + (cfg.fundoPct || 0) / 100)), 0);
}

function SubcontaReal({ r, mudar }) {
  const a = r.asaas;
  const c = r.condominio;
  const [enviando, setEnviando] = useState(false);
  const [erro, setErro] = useState(null);
  const campo = (chave) => (ev) => mudar({ asaas: { ...a, [chave]: ev.target.value } });

  async function criar() {
    const cnpj = apenasDigitos(a.cnpj || c.cnpj);
    if (cnpj.length !== 14) { setErro('Informe o CNPJ do condomínio (14 dígitos)'); return; }
    if (!c.cep || !c.endereco || !a.numero || !a.bairro) { setErro('Preencha CEP e endereço (passo Condomínio), número e bairro'); return; }
    if (!c.sindico.email || !c.sindico.celular) { setErro('Informe o e-mail e o celular do síndico no passo Condomínio'); return; }
    const id = r.idCondominio || `cond-${identificadorCondominio(c.nome)}-${Date.now().toString(36)}`;
    setEnviando(true);
    setErro(null);
    try {
      const resp = await chamarApi('POST', '/api/condominios', { id, nome: c.nome, cnpj, email: c.sindico.email, celular: apenasDigitos(c.sindico.celular), cep: apenasDigitos(c.cep), endereco: c.endereco, numero: a.numero, bairro: a.bairro, rendaMensal: arrecadacaoPrevista(r) || 100000 });
      mudar({ idCondominio: id, asaas: { ...a, cnpj, situacao: 'aprovada', ambiente: 'sandbox', real: true, walletId: resp.walletId } });
    } catch (e) {
      setErro(e.message);
    }
    setEnviando(false);
  }

  return html`<div class="pilha formulario">
    <p class="sub">Asaas sandbox conectado: a subconta é criada de verdade no ambiente de testes (dinheiro de mentira).</p>
    <div class="edicao-anuncio">
      <${Campo} rotulo="CNPJ do condomínio"><input id="impl-asaas-cnpj" inputmode="numeric" value=${a.cnpj || c.cnpj} onInput=${campo('cnpj')} /><//>
      <${Campo} rotulo="Número"><input id="impl-numero" value=${a.numero || ''} onInput=${campo('numero')} /><//>
      <${Campo} rotulo="Bairro"><input id="impl-bairro" value=${a.bairro || ''} onInput=${campo('bairro')} /><//>
    </div>
    ${a.real
      ? html`<p class="sucesso">Subconta aprovada no Asaas sandbox (carteira ${a.walletId}). As cobranças vão sair por ela.</p>`
      : html`<button type="button" class="btn primario" data-acao="criar-subconta" disabled=${enviando} onClick=${criar}>${enviando ? 'Criando no Asaas…' : 'Criar subconta no Asaas sandbox'}</button>`}
    <${Erro} texto=${erro} />
  </div>`;
}

function TelaImplantacao({ rota, rascunho, aoSalvarRascunho, aoAtivar }) {
  const [r, setR] = useState(() => rascunho || rascunhoPadrao());
  const [erro, setErro] = useState(null);
  const passo = PASSOS_UI[rota.tela] ? rota.tela : 'condominio';
  const indice = PASSOS_IMPLANTACAO.findIndex(([id]) => id === passo);
  const Passo = PASSOS_UI[passo];
  const mudar = (mudanca) => setR((atual) => ({ ...atual, ...mudanca }));

  function avancar() {
    const falha = validarPasso(passo, r);
    setErro(falha);
    if (falha) return;
    const salvo = { ...r, concluidos: [...new Set([...r.concluidos, passo])] };
    setR(salvo);
    aoSalvarRascunho(salvo);
    if (passo === 'divulgacao') { aoAtivar(condominioNovo(configDoRascunho(salvo), new Date())); return; }
    ir('implantacao', PASSOS_IMPLANTACAO[indice + 1][0]);
  }

  function voltar() {
    setErro(null);
    aoSalvarRascunho(r);
    if (indice > 0) ir('implantacao', PASSOS_IMPLANTACAO[indice - 1][0]);
    else ir('sindico', 'inicio');
  }

  const total = configDoRascunho(r).cobranca.valores.A > 0 ? mensalidade(r.condominio.plano, Math.max(1, r.unidades.length)) : null;
  return html`<section class="implantacao">
    <header class="linha-entre">
      <div><p class="protocolo">Implantação · passo ${indice + 1} de ${PASSOS_IMPLANTACAO.length}</p><h1>${PASSOS_IMPLANTACAO[indice][1]}</h1></div>
      ${r.unidades.length > 0 && total !== null && html`<small class="sub">${r.unidades.length} unidades · plano ${PLANOS.find((p) => p.id === r.condominio.plano).nome}: ${fmtReais(total)}/mês</small>`}
    </header>
    <ol class="passos-implantacao">${PASSOS_IMPLANTACAO.map(([id, nome], i) => html`<li key=${id} class=${`${i === indice ? 'atual' : ''} ${r.concluidos.includes(id) ? 'feito' : ''}`}><a href=${`#implantacao.${id}`} aria-current=${i === indice ? 'step' : undefined}>${i + 1}. ${nome}</a></li>`)}</ol>
    <div class="cartao implantacao-corpo"><${Passo} r=${r} mudar=${mudar} /></div>
    <${Erro} texto=${erro} />
    <div class="acoes implantacao-rodape">
      <button type="button" class="btn secundario" onClick=${voltar}>${indice > 0 ? 'Voltar' : 'Cancelar'}</button>
      <button type="button" class="btn primario" data-acao="avancar-implantacao" onClick=${avancar}>${passo === 'divulgacao' ? 'Ativar condomínio' : 'Salvar e continuar'}</button>
    </div>
  </section>`;
}

// O que o morador vê ao ler o QR Code do convite, e a aprovação dos cadastros novos pelo síndico.
function MConvite({ estado, executar }) {
  const [form, setForm] = useState({ unidade: '', nome: '', celular: '', codigo: '' });
  const [enviado, setEnviado] = useState(null);
  const [erro, setErro] = useState(null);
  const [resultado, setResultado] = useState(null);
  const campo = (chave) => (ev) => setForm({ ...form, [chave]: ev.target.value });

  function pedirCodigo() {
    if (!form.unidade) { setErro('Escolha a sua unidade'); return; }
    if (!form.nome.trim()) { setErro('Informe o seu nome'); return; }
    if (!celularValido(form.celular)) { setErro('Informe um celular com DDD'); return; }
    setErro(null);
    setEnviado(codigoDoConvite(form.celular));
  }

  function confirmar() {
    const r = executar((e) => confirmarConvite(e, form, new Date()));
    setErro(r.erro || null);
    if (!r.erro) setResultado(r.situacao);
  }

  if (resultado === 'ativo') return html`<section class="m-pagina"><h1 class="m-titulo">Tudo certo!</h1><p class="m-texto">Seu acesso ao apto ${form.unidade.toUpperCase()} está liberado. Bem-vindo ao ${estado.condominio.nome}.</p><a class="btn primario bloco" href="#morador.inicio">Ir para o início</a></section>`;
  if (resultado === 'pendente') return html`<section class="m-pagina"><h1 class="m-titulo">Cadastro enviado</h1><p class="m-texto">Você não estava na lista enviada pelo síndico, então ele vai confirmar o seu cadastro no apto ${form.unidade.toUpperCase()}. Você recebe um aviso assim que for aprovado.</p><a class="btn secundario bloco" href="#morador.inicio">Voltar</a></section>`;
  return html`<section class="m-pagina">
    <h1 class="m-titulo">Entrar pelo convite</h1>
    <p class="m-sub">${estado.condominio.nome} · confirme a sua unidade para começar a usar o app.</p>
    <div class="pilha formulario">
      <${Campo} rotulo="Sua unidade"><select id="convite-unidade" value=${form.unidade} onChange=${campo('unidade')}><option value="">Escolha</option>${estado.condominio.unidades.map((u) => html`<option key=${u} value=${u}>${u}</option>`)}</select><//>
      <${Campo} rotulo="Seu nome"><input id="convite-nome" value=${form.nome} onInput=${campo('nome')} autocomplete="name" /><//>
      <${Campo} rotulo="Seu celular" dica="Com DDD"><input id="convite-celular" inputmode="tel" value=${form.celular} onInput=${campo('celular')} autocomplete="tel" placeholder="(11) 90000-0000" /><//>
      ${!enviado && html`<button type="button" class="btn primario bloco" data-acao="pedir-codigo" onClick=${pedirCodigo}>Receber código por SMS</button>`}
      ${enviado && html`<div class="cartao pilha">
        <small class="sub">SMS simulado para ${form.celular}: <strong data-codigo=${enviado}>Seu código CondoFácil é ${enviado}</strong></small>
        <${Campo} rotulo="Código recebido"><input id="convite-codigo" inputmode="numeric" maxlength="6" value=${form.codigo} onInput=${campo('codigo')} /><//>
        <button type="button" class="btn primario bloco" data-acao="confirmar-convite" onClick=${confirmar}>Confirmar e entrar</button>
      </div>`}
      <${Erro} texto=${erro} />
    </div>
  </section>`;
}

function AprovacaoMoradores({ estado, executar }) {
  const [mensagem, setMensagem] = useState(null);
  const pendentes = moradoresPendentes(estado);
  if (!pendentes.length && !mensagem) return null;
  const rodar = (acao, texto) => { const r = executar(acao); setMensagem(r.erro || texto); };
  return html`<div class="cartao pilha">
    <strong>Moradores aguardando aprovação</strong>
    <small class="sub">Entraram pelo convite, mas não estavam na planilha da implantação.</small>
    ${pendentes.map((p) => html`<div key=${p.id} class="linha-entre">
      <span>${p.nome} · apto ${p.unidade}${p.celular ? ` · ${p.celular}` : ''}</span>
      <span class="acoes">
        <button type="button" class="btn primario" data-aprovar-morador=${p.id} onClick=${() => rodar((e) => aprovarMorador(e, p.id, 'sindico', new Date()), `${p.nome} aprovado.`)}>Aprovar</button>
        <button type="button" class="btn secundario" onClick=${() => rodar((e) => recusarMorador(e, p.id, 'sindico'), `Cadastro de ${p.nome} recusado.`)}>Recusar</button>
      </span>
    </div>`)}
    <${Sucesso} texto=${mensagem} />
  </div>`;
}

// ---- src/ui/app.js ----

const TELAS_PERFIL = { sindico: TelaSindico, morador: TelaMorador, portaria: TelaPortaria, zelador: TelaZelador, conselho: TelaConselho };
const ultimaRota = {};

function estadoDeHoje() {
  const salvo = carregarEstado();
  return salvo && salvo.geradoEm === isoDia(new Date()) ? salvo : dadosIniciais(new Date());
}

// O condomínio ativo pode ser a demonstração (refeita a cada dia) ou um condomínio criado pela implantação (guardado).
function estadoDoAtivo(condominios) {
  const salvo = condominios.ativo !== 'demo' && condominios.lista[condominios.ativo];
  return salvo || estadoDeHoje();
}

function App() {
  const [condominios, setCondominios] = useState(carregarCondominios);
  const [estado, setEstado] = useState(() => estadoDoAtivo(condominios));
  const estadoAtual = useRef(estado);
  estadoAtual.current = estado;
  const [rota, setRota] = useState(lerRota);
  const [selo, setSelo] = useState(null);
  const [geracao, setGeracao] = useState(0);
  const [mostrarPrecos, setMostrarPrecos] = useState(false);

  useEffect(() => {
    const mudou = () => setRota(lerRota());
    window.addEventListener('hashchange', mudou);
    return () => window.removeEventListener('hashchange', mudou);
  }, []);

  useEffect(() => {
    if (estado.origem !== 'novo') { salvarEstado(estado); return; }
    setCondominios((c) => {
      const novo = { ...c, ativo: estado.condominio.id, lista: { ...c.lista, [estado.condominio.id]: estado } };
      salvarCondominios(novo);
      return novo;
    });
  }, [estado]);

  CONDOMINIO_ATUAL.nome = estado.condominio.nome;

  function guardarCondominios(mudanca) {
    setCondominios((c) => {
      const novo = { ...c, ...mudanca };
      salvarCondominios(novo);
      return novo;
    });
  }

  function trocarCondominio(id) {
    if (id === 'novo') { ir('implantacao', 'condominio'); return; }
    guardarCondominios({ ativo: id });
    setEstado(id === 'demo' ? estadoDeHoje() : condominios.lista[id]);
    setSelo(null);
    setGeracao(geracao + 1);
    ir('sindico', 'inicio');
  }

  function ativarCondominio(novoEstado) {
    guardarCondominios({ ativo: novoEstado.condominio.id, lista: { ...condominios.lista, [novoEstado.condominio.id]: novoEstado }, rascunho: null });
    setEstado(novoEstado);
    setGeracao(geracao + 1);
    ir('sindico', 'inicio');
  }

  useEffect(() => {
    if (!selo) return undefined;
    const t = setTimeout(() => setSelo(null), 4500);
    return () => clearTimeout(t);
  }, [selo]);

  ultimaRota[rota.perfil] = rota;

  // Lê sempre o estado mais recente: o Sr. Abel pode encadear várias ações numa mesma resposta.
  function executar(acao) {
    const resultado = acao(estadoAtual.current);
    if (!resultado.erro) {
      estadoAtual.current = resultado.estado;
      setEstado(resultado.estado);
      if (resultado.notificacao) setSelo({ ...resultado.notificacao, chave: Date.now() });
    }
    return resultado;
  }

  function trocarPerfil(id) {
    const anterior = ultimaRota[id];
    const perfil = PERFIS.find((p) => p.id === id);
    ir(id, anterior ? anterior.tela : perfil.inicial, anterior ? anterior.id : null);
  }

  function reiniciar() {
    limparEstado();
    setEstado(dadosIniciais(new Date()));
    setSelo(null);
    setGeracao(geracao + 1);
  }

  // Modo conectado: só em app.condofacil.cloud (ou na máquina local) com o servidor respondendo.
  const [conexao, setConexao] = useState({ servidor: false, codigo: null, erro: null });
  useEffect(() => {
    detectarServidor().then((achou) => {
      if (!achou) return;
      CONEXAO.ativa = true;
      CONEXAO.codigo = lerCodigoPiloto();
      setConexao({ servidor: true, codigo: CONEXAO.codigo, erro: null });
    });
  }, []);

  async function conectar(codigo) {
    try {
      await chamarApi('GET', '/api/cobrancas?condominio=teste', undefined, codigo);
      CONEXAO.codigo = codigo;
      guardarCodigoPiloto(codigo);
      setConexao({ servidor: true, codigo, erro: null });
    } catch (e) {
      setConexao({ servidor: true, codigo: null, erro: e.message });
    }
  }

  const real = conexao.codigo && usaAsaasReal(estado);
  const telaFinanceira = (rota.perfil === 'sindico' && rota.tela === 'cobranca') || (rota.perfil === 'morador' && rota.tela === 'financeiro');
  useEffect(() => {
    if (!real) return undefined;
    const id = estado.condominio.id;
    const sincronizar = () => chamarApi('GET', `/api/cobrancas?condominio=${encodeURIComponent(id)}`)
      .then((r) => { if (estadoAtual.current.condominio.id === id) executar((e) => aplicarSituacoes(e, r.cobrancas, new Date())); })
      .catch(() => {});
    sincronizar();
    const t = setInterval(sincronizar, 15000);
    return () => clearInterval(t);
  }, [real, estado.condominio.id, telaFinanceira]);

  const Tela = TELAS_PERFIL[rota.perfil];
  return html`
    <header class="barra-demo">
      <div class="marca"><span class="logo"><${Icone} nome="predio" tamanho=${20} /></span><strong class="marca-nome">CondoFácil</strong><span class="sub">${estado.condominio.nome} · ${estado.condominio.unidades.length} unidades</span></div>
      <label class="seletor-condominio"><span class="so-leitor">Condomínio</span><select id="seletor-condominio" value=${rota.perfil === 'implantacao' ? 'novo' : estado.origem === 'novo' ? estado.condominio.id : 'demo'} onChange=${(ev) => trocarCondominio(ev.target.value)}>
        <option value="demo">Residencial Ipê Amarelo (demonstração)</option>
        ${Object.values(condominios.lista).map((c) => html`<option key=${c.condominio.id} value=${c.condominio.id}>${c.condominio.nome}</option>`)}
        <option value="novo">+ Novo condomínio</option>
      </select></label>
      <div class="ver-como" role="group" aria-label="Ver como">
        <span>Ver como</span>
        ${PERFIS.map((p) => html`<button type="button" key=${p.id} aria-pressed=${rota.perfil === p.id} onClick=${() => trocarPerfil(p.id)}>${p.nome}</button>`)}
      </div>
      <div class="ver-como plano" role="group" aria-label="Plano">
        <span>Plano</span>
        ${PLANOS.map((p) => html`<button type="button" key=${p.id} aria-pressed=${estado.plano === p.id} onClick=${() => executar((e) => trocarPlano(e, p.id))}>${p.nome}</button>`)}
        <button type="button" class="precos" aria-expanded=${mostrarPrecos} onClick=${() => setMostrarPrecos(!mostrarPrecos)}>Preços</button>
      </div>
      ${estado.origem !== 'novo' && html`<button type="button" class="reiniciar" onClick=${reiniciar}>Reiniciar demonstração</button>`}
      ${conexao.servidor && (conexao.codigo
        ? html`<span class="selo-conexao">Asaas sandbox conectado</span>`
        : html`<${ConectarPiloto} erro=${conexao.erro} aoConectar=${conectar} />`)}
    </header>
    ${mostrarPrecos && html`<${PainelPrecos} plano=${estado.plano} unidades=${estado.condominio.unidades.length} aoFechar=${() => setMostrarPrecos(false)} />`}
    <main class=${`palco palco-${rota.perfil}`}>
      ${rota.perfil === 'implantacao'
        ? html`<${TelaImplantacao} rota=${rota} rascunho=${condominios.rascunho} aoSalvarRascunho=${(r) => guardarCondominios({ rascunho: r })} aoAtivar=${ativarCondominio} />`
        : html`<${Tela} key=${`${rota.perfil}-${geracao}`} estado=${estado} rota=${rota} executar=${executar} agora=${new Date()} />`}
    </main>
    ${rota.perfil !== 'implantacao' && rota.tela !== 'convite' && html`<${SrAbel} estado=${estado} rota=${rota} agora=${new Date()} executar=${executar} obterEstado=${() => estadoAtual.current} />`}
    ${selo && html`<${Selo} key=${selo.chave} canal=${selo.canal} para=${selo.para} texto=${selo.texto} />`}
  `;
}

function ConectarPiloto({ erro, aoConectar }) {
  const [codigo, setCodigo] = useState('');
  return html`<form class="conectar-piloto" onSubmit=${(ev) => { ev.preventDefault(); if (codigo.trim()) aoConectar(codigo.trim()); }}>
    <label><span class="so-leitor">Código do piloto</span><input id="codigo-piloto" type="password" autocomplete="off" placeholder="Código do piloto" value=${codigo} onInput=${(ev) => setCodigo(ev.target.value)} /></label>
    <button type="submit" data-acao="conectar-piloto">Conectar ao Asaas</button>
    ${erro && html`<span class="erro-conexao" role="alert">${erro}</span>`}
  </form>`;
}

function PainelPrecos({ plano, unidades, aoFechar }) {
  return html`<div class="painel-precos" role="dialog" aria-label="Preços por plano">
    <div class="linha-entre"><strong>Preços para ${unidades} unidades · faixa de ${PRECO_BASE.faixa}</strong><button type="button" class="btn-link" onClick=${aoFechar}>Fechar</button></div>
    <ul class="itens-sacola">${PLANOS.map((p) => html`<li key=${p.id} class=${p.id === plano ? 'plano-atual' : ''}><span>${p.nome} · ${p.multiplicador.toFixed(1).replace('.', ',')}x</span><strong>${fmtReais(mensalidade(p.id, unidades))}/mês</strong></li>`)}</ul>
    <small class="sub">Implantação ${fmtReais(PRECO_BASE.implantacao)} · base de ${fmtReais(PRECO_BASE.porUnidade)} por unidade. As tarifas do Asaas por boleto ou Pix são do condomínio e aparecem à parte.</small>
  </div>`;
}

function PainelTestes() {
  const resultados = [...CASOS_DADOS, ...CASOS_REGRAS, ...CASOS_ACOES, ...CASOS_VENDAS, ...CASOS_COBRANCA_DADOS, ...CASOS_COBRANCA_REGRAS, ...CASOS_COBRANCA_ACOES, ...CASOS_ACORDOS, ...CASOS_NOTIFICACOES, ...CASOS_MANUTENCAO, ...CASOS_ESCALA, ...CASOS_COMPOSICAO, ...CASOS_INFRACOES, ...CASOS_ORCAMENTO, ...CASOS_FINANCEIRO, ...CASOS_ENQUETES, ...CASOS_ASSISTENTE, ...CASOS_IMPLANTACAO, ...CASOS_CONECTADO].map((caso) => {
    try {
      caso.rodar();
      return { nome: caso.nome, ok: true };
    } catch (e) {
      return { nome: caso.nome, ok: false, erro: e.message };
    }
  });
  const falhas = resultados.filter((r) => !r.ok);
  console.log(`Autoteste CondoFácil: ${resultados.length - falhas.length} de ${resultados.length} passaram`, falhas);
  return html`<main class="painel-testes">
    <h1>Autoteste das regras</h1>
    <p><strong>${resultados.length - falhas.length} de ${resultados.length} passaram · falhas: ${falhas.length}</strong></p>
    <ul>${resultados.map((r) => html`<li key=${r.nome} class=${r.ok ? 'ok' : 'falha'}>${r.ok ? '✓' : '✗'} ${r.nome}${r.erro ? html`<br /><small>${r.erro}</small>` : ''}</li>`)}</ul>
  </main>`;
}

const modoTeste = new URLSearchParams(location.search).get('teste') === '1';
render(modoTeste ? html`<${PainelTestes} />` : html`<${App} />`, document.getElementById('app'));

</script>
