}

function FormReajuste({ estado, executar, aoConcluir, inicial = {} }) {
  const fin = estado.financeiro;
  const base = versaoVigente(fin);
  const comFracao = liberado(estado.plano, 'fracaoIdeal');
  const comFundo = liberado(estado.plano, 'composicaoCompleta');
  const [form, setForm] = useState({ vigencia: primeiraNaoEmitida(fin), modo: base.modo, forma: 'percentual', pct: '', A: '', cobertura: '', orcamento: '', fundoPct: String(base.fundoPct), aprovadoEm: '', publicar: true, ...inicial });
  const [erro, setErro] = useState(null);
  const campo = (chave) => (ev) => setForm({ ...form, [chave]: ev.target.type === 'checkbox' ? ev.target.checked : ev.target.value });
  const dados = {
    vigencia: form.vigencia, modo: form.modo, forma: form.forma, pct: lerNumero(form.pct),
    ordinaria: { A: lerPreco(form.A), cobertura: lerPreco(form.cobertura) }, orcamento: lerPreco(form.orcamento),
    fundoPct: comFundo ? lerNumero(form.fundoPct) : undefined, aprovadoEm: form.aprovadoEm, publicar: form.publicar,
  };
  const montada = montarVersao(fin, dados);
  const simulacao = montada.versao ? simularComposicao(fin, montada.versao) : null;
  const agendada = versoesAgendadas(fin).find((v) => v.vigencia === form.vigencia);

  function confirmar() {
    const r = executar((e) => novaComposicao(e, dados, 'sindico', new Date()));
    setErro(r.erro || null);
    if (!r.erro) aoConcluir(`Reajuste agendado para ${nomeMes(form.vigencia)}.${textoDesfeitos(r.desfeitos)}`);
  }

  return html`<div class="cartao pilha formulario">
    <strong>Nova composição</strong>
    <div class="edicao-anuncio">
      <${Campo} rotulo="Vigência" dica="Meses já emitidos não mudam"><select id="taxa-vigencia" value=${form.vigencia} onChange=${campo('vigencia')}>${mesesAFrente(fin).map((m) => html`<option key=${m} value=${m}>A partir de ${nomeMes(m)}</option>`)}</select><//>
      ${comFracao && html`<${Campo} rotulo="Modo da ordinária"><select id="taxa-modo" value=${form.modo} onChange=${campo('modo')}>${Object.entries(NOMES_MODO).map(([k, nome]) => html`<option key=${k} value=${k}>${nome}</option>`)}</select><//>`}
      <${Campo} rotulo="Como reajustar"><select id="taxa-forma" value=${form.forma} onChange=${campo('forma')}><option value="percentual">Percentual sobre o valor atual</option><option value="valores">${form.modo === 'fracao' ? 'Novo orçamento mensal' : 'Novos valores por tipo'}</option></select><//>
      ${form.forma === 'percentual' && html`<${Campo} rotulo="Percentual (%)" dica="Use negativo para redução"><input id="taxa-pct" inputmode="decimal" value=${form.pct} onInput=${campo('pct')} placeholder="Ex.: 6" /><//>`}
      ${form.forma === 'valores' && form.modo === 'fixo' && html`
        <${Campo} rotulo="Apto tipo A (R$)"><input id="taxa-a" inputmode="decimal" value=${form.A} onInput=${campo('A')} placeholder=${fmtReais(base.ordinaria ? base.ordinaria.A : 0)} /><//>
        ${tiposPresentes(fin).includes('cobertura') && html`<${Campo} rotulo="Cobertura (R$)"><input id="taxa-cobertura" inputmode="decimal" value=${form.cobertura} onInput=${campo('cobertura')} placeholder=${fmtReais(base.ordinaria ? base.ordinaria.cobertura : 0)} /><//>`}`}
      ${form.forma === 'valores' && form.modo === 'fracao' && html`<${Campo} rotulo="Orçamento mensal (R$)" dica="Rateado pela fração ideal de cada unidade"><input id="taxa-orcamento" inputmode="decimal" value=${form.orcamento} onInput=${campo('orcamento')} placeholder="Ex.: 22.120,00" /><//>`}
      ${comFundo && html`<${Campo} rotulo="Fundo de reserva (%)"><input id="taxa-fundo" inputmode="decimal" value=${form.fundoPct} onInput=${campo('fundoPct')} /><//>`}
      <${Campo} rotulo="Aprovado em" dica="Ata ou data da assembleia"><input id="taxa-ata" value=${form.aprovadoEm} onInput=${campo('aprovadoEm')} placeholder="Ex.: AGE de 15/10/2026, item 2" /><//>
    </div>
    <label class="check"><input id="taxa-publicar" type="checkbox" checked=${form.publicar} onChange=${campo('publicar')} /><span>Publicar comunicado</span></label>
    ${!comFracao && html`<${Bloqueado} estado=${estado} recurso="fracaoIdeal" titulo="Rateio por fração ideal e fundo de reserva" />`}
    ${agendada && html`<small class="sub">Substitui o reajuste já agendado para ${nomeMes(form.vigencia)} (${agendada.id}).</small>`}
    ${simulacao ? html`<${TabelaSimulacao} simulacao=${simulacao} />` : html`<small class="sub">${montada.erro}</small>`}
    <${Erro} texto=${erro} />
    <button type="button" class="btn primario" data-acao="confirmar-reajuste" onClick=${confirmar}>Confirmar reajuste</button>
  </div>`;
}

function FormTaxaExtra({ estado, executar, aoConcluir }) {
  const fin = estado.financeiro;
  const comFracao = liberado(estado.plano, 'fracaoIdeal');
  const [form, setForm] = useState({ descricao: '', total: '', parcelas: '10', inicio: primeiraNaoEmitida(fin), rateio: 'igual', aprovadoEm: '', publicar: true });
  const [erro, setErro] = useState(null);
  const campo = (chave) => (ev) => setForm({ ...form, [chave]: ev.target.type === 'checkbox' ? ev.target.checked : ev.target.value });
  const dados = { ...form, total: lerPreco(form.total), parcelas: Number(form.parcelas) };
  const montada = montarTaxaExtra(fin, { ...dados, descricao: form.descricao || 'prévia' });

  function criar() {
    const r = executar((e) => criarTaxaExtra(e, dados, 'sindico', new Date()));
    setErro(r.erro || null);
    if (!r.erro) aoConcluir(`Taxa extra ${r.id} criada.${textoDesfeitos(r.desfeitos)}`);
  }

  return html`<div class="cartao pilha formulario">
    <strong>Nova taxa extra</strong>
    <div class="edicao-anuncio">
      <${Campo} rotulo="Descrição"><input id="extra-descricao" value=${form.descricao} onInput=${campo('descricao')} placeholder="Ex.: Troca dos elevadores" /><//>
      <${Campo} rotulo="Valor total (R$)"><input id="extra-total" inputmode="decimal" value=${form.total} onInput=${campo('total')} placeholder="Ex.: 30.000,00" /><//>
      <${Campo} rotulo="Parcelas" dica="De 1 a 60"><input id="extra-parcelas" type="number" min="1" max="60" value=${form.parcelas} onInput=${campo('parcelas')} /><//>
      <${Campo} rotulo="Início"><select id="extra-inicio" value=${form.inicio} onChange=${campo('inicio')}>${mesesAFrente(fin).map((m) => html`<option key=${m} value=${m}>${nomeMes(m)}</option>`)}</select><//>
      <${Campo} rotulo="Rateio"><select id="extra-rateio" value=${form.rateio} onChange=${campo('rateio')}>${Object.entries(NOMES_RATEIO).filter(([k]) => k === 'igual' || comFracao).map(([k, nome]) => html`<option key=${k} value=${k}>${nome}</option>`)}</select><//>
      <${Campo} rotulo="Aprovado em" dica="Ata ou data da assembleia"><input id="extra-ata" value=${form.aprovadoEm} onInput=${campo('aprovadoEm')} placeholder="Ex.: AGE de 15/10/2026, item 3" /><//>
    </div>
    <label class="check"><input id="extra-publicar" type="checkbox" checked=${form.publicar} onChange=${campo('publicar')} /><span>Publicar comunicado</span></label>
    ${montada.extra
      ? html`<div class="cartao simulacao"><strong>Valor por parcela</strong><dl class="resumo">${valorPorTipoExtra(fin, montada.extra).map((v) => html`<dt key=${`t-${v.tipo}`}>${NOMES_TIPO_UNIDADE[v.tipo]}</dt><dd key=${`v-${v.tipo}`}>${fmtReais(v.valor)} por mês</dd>`)}</dl><small class="sub">De ${nomeMes(montada.extra.inicio)} a ${nomeMes(fimExtra(montada.extra))}.</small></div>`
      : html`<small class="sub">${montada.erro}</small>`}
    <${Erro} texto=${erro} />
    <button type="button" class="btn primario" data-acao="criar-taxa-extra" onClick=${criar}>Criar taxa extra</button>
  </div>`;
}

function ItemTaxaExtra({ estado, extra, executar, aoConcluir }) {
  const fin = estado.financeiro;
  const [encerrando, setEncerrando] = useState(false);
  const [motivo, setMotivo] = useState('');
  const [erro, setErro] = useState(null);
  const competencia = somarMes(primeiraNaoEmitida(fin), -1);
  const parcela = parcelaDe(extra, competencia);
  const situacao = extra.inicio > competencia ? `começa em ${nomeMes(extra.inicio)}` : parcela ? `parcela ${parcela}/${extra.parcelas} em ${nomeMes(competencia)}` : 'parcelas concluídas';

  function encerrar() {
    const r = executar((e) => encerrarTaxaExtra(e, extra.id, motivo, 'sindico', new Date()));
    setErro(r.erro || null);
    if (!r.erro) aoConcluir(`Taxa extra ${extra.id} encerrada.${textoDesfeitos(r.desfeitos)}`);
  }

  return html`<li class="cartao">
    <div class="linha-entre"><strong>${extra.id} · ${extra.descricao}</strong><${Etiqueta} tipo="ok">Ativa<//></div>
    <span>${fmtReais(extra.total)} em ${extra.parcelas}x · ${NOMES_RATEIO[extra.rateio].toLowerCase()} · ${situacao}</span>
    <small class="sub">${valorPorTipoExtra(fin, extra).map((v) => `${NOMES_TIPO_UNIDADE[v.tipo]} ${fmtReais(v.valor)}`).join(' · ')} por mês · aprovado em: ${extra.aprovadoEm}</small>
    ${!encerrando
      ? html`<div class="acoes"><button type="button" class="btn secundario" data-encerrar=${extra.id} onClick=${() => setEncerrando(true)}>Encerrar</button></div>`
      : html`<div class="pilha">
          <${Campo} rotulo="Motivo ou ata" dica="As parcelas ainda não emitidas deixam de existir"><input id=${`encerrar-${extra.id}`} value=${motivo} onInput=${(ev) => setMotivo(ev.target.value)} /><//>
          <${Erro} texto=${erro} />
          <div class="acoes"><button type="button" class="btn primario" onClick=${encerrar}>Confirmar encerramento</button><button type="button" class="btn secundario" onClick=${() => setEncerrando(false)}>Voltar</button></div>
        </div>`}
  </li>`;
}

function CTaxas({ estado, executar }) {
  const fin = estado.financeiro;
  const [abrindo, setAbrindo] = useState(null);
  const [mensagem, setMensagem] = useState(null);
  const [erro, setErro] = useState(null);
  const comExtra = liberado(estado.plano, 'taxaExtra');
  const agendadas = versoesAgendadas(fin);
  const vigente = versaoVigente(fin);
  const passadas = fin.composicao.versoes.filter((v) => v.vigencia <= vigente.vigencia).sort((a, b) => b.vigencia.localeCompare(a.vigencia));
  const ativas = fin.composicao.extras.filter((x) => x.situacao === 'ativa' && fimExtra(x) >= primeiraNaoEmitida(fin));
  const encerradas = fin.composicao.extras.filter((x) => x.situacao === 'encerrada' || fimExtra(x) < primeiraNaoEmitida(fin));
  const concluir = (texto) => { setAbrindo(null); setErro(null); setMensagem(texto); };
  const abrir = (qual) => { setAbrindo(abrindo === qual ? null : qual); setMensagem(null); setErro(null); };

  function cancelar(id) {
    const r = executar((e) => cancelarComposicao(e, id, 'sindico', new Date()));
    setErro(r.erro || null);
    setMensagem(r.erro ? null : `Reajuste ${id} cancelado.`);
  }

  return html`<div class="pilha">
    <h2>Em vigor</h2>
    <${ResumoEmVigor} estado=${estado} />
    <${Sucesso} texto=${mensagem} />
    <${Erro} texto=${erro} />
    ${agendadas.length > 0 && html`<h2>Agendado</h2>
      <ul class="m-lista">${agendadas.map((v) => html`<li key=${v.id} class="cartao">
        <div class="linha-entre"><strong>${v.id} · a partir de ${nomeMes(v.vigencia)}</strong><${Etiqueta} tipo="info">Agendado<//></div>
        <span>${resumoVersao(fin, v)}</span>
        <small class="sub">Aprovado em: ${v.aprovadoEm}</small>
        <div class="acoes"><button type="button" class="btn secundario" data-cancelar=${v.id} onClick=${() => cancelar(v.id)}>Cancelar reajuste</button></div>
      </li>`)}</ul>`}
    <div class="acoes">
      <button type="button" class="btn primario" aria-expanded=${abrindo === 'reajuste'} onClick=${() => abrir('reajuste')}>Nova composição</button>
      ${comExtra && html`<button type="button" class="btn secundario" aria-expanded=${abrindo === 'extra'} onClick=${() => abrir('extra')}>Nova taxa extra</button>`}
    </div>
    ${abrindo === 'reajuste' && html`<${FormReajuste} estado=${estado} executar=${executar} aoConcluir=${concluir} />`}
    ${abrindo === 'extra' && html`<${FormTaxaExtra} estado=${estado} executar=${executar} aoConcluir=${concluir} />`}
    <h2>Taxas extras</h2>
    ${comExtra
      ? ativas.length
        ? html`<ul class="m-lista">${ativas.map((x) => html`<${ItemTaxaExtra} key=${x.id} estado=${estado} extra=${x} executar=${executar} aoConcluir=${concluir} />`)}</ul>`
        : html`<${Vazio} texto="Nenhuma taxa extra ativa." />`
      : html`<${Bloqueado} estado=${estado} recurso="taxaExtra" titulo="Taxas extras parceladas, com rateio e encerramento" />`}
    <h2>Histórico</h2>
    <ul class="auditoria">
      ${passadas.map((v) => html`<li key=${v.id}><span class="lt-quando">${nomeMes(v.vigencia)}</span> <strong>${v.id}${v.id === vigente.id ? ' · em vigor' : ''}</strong> · ${resumoVersao(fin, v)} · aprovado em: ${v.aprovadoEm}</li>`)}
      ${encerradas.map((x) => html`<li key=${x.id}><span class="lt-quando">${x.encerradaEm ? fmtDataCurta(x.encerradaEm.slice(0, 10)) : nomeMes(fimExtra(x))}</span> <strong>${x.id} · ${x.descricao}</strong> · ${x.situacao === 'encerrada' ? `encerrada${x.ultimaCompetencia ? `, última parcela em ${nomeMes(x.ultimaCompetencia)}` : ' antes da primeira parcela'} · ${x.motivoEncerramento}` : 'parcelas concluídas'}</li>`)}
    </ul>
    <details class="composicao"><summary>Frações ideais</summary>
      <div class="tabela-rolagem"><table class="tabela">
        <thead><tr><th>Unidade</th><th>Tipo</th><th>Fração ideal</th></tr></thead>
        <tbody>${Object.entries(fin.unidades).map(([u, d]) => html`<tr key=${u}><td>${u}</td><td>${NOMES_TIPO_UNIDADE[d.tipo]}</td><td>${fmtFracao(d.fracao)}</td></tr>`)}</tbody>
        <tfoot><tr><td colspan="2">Total</td><td>${(Object.values(fin.unidades).reduce((s, d) => s + d.fracao, 0) * 100).toFixed(2).replace('.', ',')}%</td></tr></tfoot>
      </table></div>
      <small class="sub">Conforme a convenção. Usada no rateio por fração ideal.</small>
    </details>
  </div>`;
}

function MudancasTaxa({ estado, eu, hoje }) {
  const linhas = mudancasDaUnidade(estado, eu, hoje);
  if (!linhas.length) return null;
  return html`<div class="cartao mudancas-taxa">
    <strong>Mudanças na sua taxa</strong>
    <ul class="m-lista">${linhas.map((l) => html`<li key=${l.chave}><span class="sub">${l.titulo}</span><div>${l.texto}</div>${l.detalhe && html`<small class="sub">${l.detalhe}</small>`}</li>`)}</ul>
  </div>`;
}

// Aba Orçamento: previsão do ano por categoria, a taxa que fecha a conta e o documento levado à AGO.
const REAJUSTE_PADRAO_ORCAMENTO = 8;

function linhasParaForm(linhas) {
  return linhas.map((l) => ({ categoria: l.categoria, nome: l.categoria ? '' : l.nome, texto: fmtReais(l.valor) }));
}

function formDaPrevisao(p) {
  return { id: p.id, ano: p.ano, nome: p.nome, linhas: linhasParaForm(p.linhas), margem: String(p.margemPct).replace('.', ',') };
}

function lerPercentual(texto) {
  const limpo = String(texto ?? '').trim().replace(',', '.');
  return limpo === '' ? NaN : Number(limpo);
}

function valoresIniciaisReajuste(versao) {
  if (versao.modo === 'fracao') return { modo: 'fracao', forma: 'valores', orcamento: fmtReais(versao.orcamento) };
  return { modo: 'fixo', forma: 'valores', A: fmtReais(versao.ordinaria.A), cobertura: fmtReais(versao.ordinaria.cobertura) };
}

function ComparacaoPrevisoes({ fin }) {
  const previsoes = fin.previsoes;
  const [a, setA] = useState(previsoes[0] ? previsoes[0].id : '');
  const [b, setB] = useState(previsoes[1] ? previsoes[1].id : '');
  const pa = previsoes.find((p) => p.id === a);
  const pb = previsoes.find((p) => p.id === b);
  if (previsoes.length < 2) return html`<${Vazio} texto="Salve duas previsões para comparar." />`;
  const c = pa && pb ? compararPrevisoes(fin, pa, pb) : null;
  const opcoes = previsoes.map((p) => html`<option key=${p.id} value=${p.id}>${p.id} · ${p.nome}</option>`);
  const linha = (rotulo, va, vb, forte) => html`<tr key=${rotulo}><td>${forte ? html`<strong>${rotulo}</strong>` : rotulo}</td><td>${fmtReais(va)}</td><td>${fmtReais(vb)}</td><td>${vb - va === 0 ? '—' : `${vb > va ? '+' : '−'}${fmtReais(Math.abs(vb - va))}`}</td></tr>`;
  return html`<div class="pilha">
    <div class="edicao-anuncio">
      <${Campo} rotulo="Previsão A"><select id="comparar-a" value=${a} onChange=${(ev) => setA(ev.target.value)}>${opcoes}</select><//>
      <${Campo} rotulo="Previsão B"><select id="comparar-b" value=${b} onChange=${(ev) => setB(ev.target.value)}>${opcoes}</select><//>
    </div>
    ${c && html`<div class="tabela-rolagem"><table class="tabela">
      <thead><tr><th>Item (por ano)</th><th>${pa.id}</th><th>${pb.id}</th><th>B − A</th></tr></thead>
      <tbody>
        ${c.linhas.map((l) => linha(l.nome, l.a, l.b, false))}
        ${linha('Despesa anual', c.total.a, c.total.b, true)}
        ${linha('Ordinária necessária por mês', c.ordinaria.a, c.ordinaria.b, true)}
        ${c.tipos.map((t) => linha(`${NOMES_TIPO_UNIDADE[t.tipo]} por mês (com fundo)`, t.a, t.b, true))}
      </tbody>
    </table></div>`}
  </div>`;
}

function COrcamento({ estado, executar, agora }) {
  const fin = estado.financeiro;
  const hoje = isoDia(agora);
  const anoBase = Number(fin.vigente.slice(0, 4)) + 1;
  const novoForm = () => ({ id: null, ano: anoBase, nome: '', linhas: linhasParaForm(linhasDoOrcado(fin.orcamento, REAJUSTE_PADRAO_ORCAMENTO)), margem: String(margemAtual(estado, hoje)).replace('.', ',') });
  const [form, setForm] = useState(novoForm);
  const [pct, setPct] = useState(String(REAJUSTE_PADRAO_ORCAMENTO));
  const [reajustando, setReajustando] = useState(false);
  const [erro, setErro] = useState(null);
  const [mensagem, setMensagem] = useState(null);
  if (!liberado(estado.plano, 'simuladorTaxa')) return html`<${Bloqueado} estado=${estado} recurso="simuladorTaxa" titulo="Previsão orçamentária e simulador de taxa" />`;

  const linhas = form.linhas.map((l) => ({ categoria: l.categoria, nome: l.categoria ? '' : l.nome, valor: lerPreco(l.texto) }));
  const margemPct = lerPercentual(form.margem);
  const previsao = { ano: Number(form.ano), linhas, margemPct };
  const valida = linhas.every((l) => Number.isFinite(l.valor) && l.valor >= 0) && Number.isFinite(margemPct) && margemPct >= 0 && margemPct < 100;
  const simulacao = valida ? simularPrevisao(fin, previsao) : null;
  const resultado = valida ? resultadoComTaxaAtual(fin, previsao) : 0;
  const salva = form.id && fin.previsoes.find((p) => p.id === form.id);

  function mudarLinha(n, chave, valor) {
    setForm({ ...form, linhas: form.linhas.map((l, i) => (i === n ? { ...l, [chave]: valor } : l)) });
  }

  function aplicarReajuste() {
    const p = lerPercentual(pct);
    if (!Number.isFinite(p)) { setErro('Informe o percentual de reajuste'); return; }
    const porCategoria = Object.fromEntries(linhasDoOrcado(fin.orcamento, p).map((l) => [l.categoria, fmtReais(l.valor)]));
    setForm({ ...form, linhas: form.linhas.map((l) => (l.categoria ? { ...l, texto: porCategoria[l.categoria] } : l)) });
    setErro(null);
  }

  function salvar(comoNova) {
    const r = executar((e) => salvarPrevisao(e, { id: comoNova ? null : form.id, ano: Number(form.ano), nome: form.nome, linhas, margemPct }, 'sindico', new Date()));
    setErro(r.erro || null);
    if (!r.erro) {
      setForm({ ...form, id: r.id });
      setMensagem(`Previsão ${r.id} salva.`);
    }
  }

  function abrir(p) {
    setForm(formDaPrevisao(p));
    setReajustando(false);
    setErro(null);
    setMensagem(`Previsão ${p.id} aberta.`);
  }

  function rodar(acao, sucesso) {
    const r = executar(acao);
    setErro(r.erro || null);
    setMensagem(r.erro ? null : sucesso(r));
    return r;
  }

  return html`<div class="pilha">
    <p class="sub">Monte a despesa do ano por categoria e veja a taxa que fecha a conta, já com a margem de inadimplência.</p>
    <div class="cartao pilha formulario">
      <strong>${salva ? `${salva.id} · ${salva.nome}` : 'Nova previsão'}</strong>
      <div class="edicao-anuncio">
        <${Campo} rotulo="Ano"><select id="orcamento-ano" value=${form.ano} onChange=${(ev) => setForm({ ...form, ano: Number(ev.target.value) })}>${[anoBase - 1, anoBase, anoBase + 1].map((a) => html`<option key=${a} value=${a}>${a}</option>`)}</select><//>
        <${Campo} rotulo="Nome da previsão"><input id="orcamento-nome" value=${form.nome} onInput=${(ev) => setForm({ ...form, nome: ev.target.value })} placeholder="Ex.: Proposta do conselho" /><//>
        <${Campo} rotulo="Percentual de reajuste (%)" dica="Aplicado sobre o orçado atual de cada categoria"><input id="orcamento-reajuste" inputmode="decimal" value=${pct} onInput=${(ev) => setPct(ev.target.value)} /><//>
        <${Campo} rotulo="Margem de inadimplência (%)" dica="Começa com a inadimplência de hoje"><input id="orcamento-margem" inputmode="decimal" value=${form.margem} onInput=${(ev) => setForm({ ...form, margem: ev.target.value })} /><//>
      </div>
      <div class="acoes"><button type="button" class="btn secundario" data-acao="aplicar-reajuste" onClick=${aplicarReajuste}>Aplicar reajuste</button></div>
      <div class="tabela-rolagem"><table class="tabela">
        <thead><tr><th>Item</th><th>Orçado atual (12 meses)</th><th>Previsão (R$ por ano)</th><th></th></tr></thead>
        <tbody>${form.linhas.map((l, n) => html`<tr key=${n}>
          <td>${l.categoria ? nomeDaLinha(l) : html`<input aria-label="Nome da linha" value=${l.nome} onInput=${(ev) => mudarLinha(n, 'nome', ev.target.value)} placeholder="Ex.: Obra do telhado" />`}</td>
          <td>${l.categoria ? fmtReais(fin.orcamento[l.categoria] * 12) : '—'}</td>
          <td><input aria-label=${`Valor de ${l.categoria ? nomeDaLinha(l) : l.nome || 'linha livre'}`} inputmode="decimal" value=${l.texto} onInput=${(ev) => mudarLinha(n, 'texto', ev.target.value)} /></td>
          <td>${!l.categoria && html`<button type="button" class="btn-link" onClick=${() => setForm({ ...form, linhas: form.linhas.filter((_, i) => i !== n) })}>Remover</button>`}</td>
        </tr>`)}</tbody>
      </table></div>
      <div class="acoes"><button type="button" class="btn secundario" data-acao="adicionar-linha" onClick=${() => setForm({ ...form, linhas: [...form.linhas, { categoria: null, nome: '', texto: '' }] })}>Adicionar linha</button></div>
      ${valida
        ? html`<div class="cartao simulacao pilha">
            <dl class="resumo">
              <dt>Despesa anual</dt><dd>${fmtReais(despesaAnual(linhas))}</dd>
              <dt>Despesa mensal</dt><dd>${fmtReais(Math.round(despesaAnual(linhas) / 12))}</dd>
              <dt>Ordinária necessária</dt><dd>${fmtReais(ordinariaNecessaria(linhas, margemPct))} por mês, com ${String(margemPct).replace('.', ',')}% de margem</dd>
            </dl>
            <p class=${resultado >= 0 ? 'sucesso' : 'erro'}>Com a taxa atual, o ano fecha com ${resultado >= 0 ? 'sobra' : 'falta'} de ${fmtReais(Math.abs(resultado))}.</p>
          </div>
          <${TabelaSimulacao} simulacao=${simulacao} />`
        : html`<small class="sub">Preencha valores e margem válidos para ver o cálculo.</small>`}
      <${Erro} texto=${erro} />
      <${Sucesso} texto=${mensagem} />
      <div class="acoes">
        <button type="button" class="btn primario" data-acao="salvar-previsao" onClick=${() => salvar(false)}>${salva ? 'Salvar alterações' : 'Salvar previsão'}</button>
        ${salva && html`<button type="button" class="btn secundario" data-acao="salvar-como-nova" onClick=${() => salvar(true)}>Salvar como nova</button>`}
        ${valida && html`<button type="button" class="btn secundario" data-acao="usar-no-reajuste" aria-expanded=${reajustando} onClick=${() => setReajustando(!reajustando)}>Usar no reajuste</button>`}
        ${salva && html`<button type="button" class="btn secundario" data-acao="gerar-documento" onClick=${() => rodar((e) => gerarDocumentoPrevisao(e, salva.id, 'sindico', new Date()), (r) => `Documento publicado em Documentos › Previsão orçamentária (versão ${r.versao}).`)}>Gerar documento para a AGO</button>`}
        <button type="button" class="btn-link" onClick=${() => { setForm(novoForm()); setReajustando(false); setMensagem(null); setErro(null); }}>Nova previsão</button>
      </div>
    </div>
    ${reajustando && valida && html`<${FormReajuste} key=${JSON.stringify(candidataDaPrevisao(fin, previsao))} estado=${estado} executar=${executar} inicial=${valoresIniciaisReajuste(candidataDaPrevisao(fin, previsao))} aoConcluir=${(texto) => { setReajustando(false); setMensagem(`${texto} Confira em Taxa e reajustes.`); }} />`}
    <h2>Previsões salvas</h2>
    ${fin.previsoes.length
      ? html`<ul class="m-lista">${fin.previsoes.map((p) => {
          const s = simularPrevisao(fin, p);
          return html`<li key=${p.id} class="cartao">
            <div class="linha-entre"><strong>${p.id} · ${p.nome} · ${p.ano}</strong><small class="sub">atualizada em ${fmtDataCurta(isoDia(new Date(p.atualizadaEm)))}${p.documento ? ' · documento publicado' : ''}</small></div>
            <span>${fmtReais(despesaAnual(p.linhas))} por ano · apto tipo A ${fmtReais(s.tipos[0].depois)} por mês · margem ${String(p.margemPct).replace('.', ',')}%</span>
            <div class="acoes">
              <button type="button" class="btn secundario" data-abrir-previsao=${p.id} onClick=${() => abrir(p)}>Abrir</button>
              <button type="button" class="btn-link" onClick=${() => { rodar((e) => excluirPrevisao(e, p.id, 'sindico'), () => `Previsão ${p.id} excluída.`); if (form.id === p.id) setForm(novoForm()); }}>Excluir</button>
            </div>
          </li>`;
        })}</ul>`
      : html`<${Vazio} texto="Nenhuma previsão salva." />`}
    <h2>Comparar</h2>
    <${ComparacaoPrevisoes} key=${fin.previsoes.map((p) => p.id).join()} fin=${fin} />
  </div>`;
}

// Menu Financeiro do síndico: contas a pagar, prestação de contas, fluxo de caixa e auditoria.
const ABAS_FINANCEIRO = [['contas', 'Contas a pagar'], ['prestacao', 'Prestação de contas'], ['fluxo', 'Fluxo de caixa'], ['auditoria', 'Auditoria']];
const ETQ_SITUACAO_CONTA = { paga: 'ok', vencida: 'perigo', hoje: 'alerta', aberta: 'info' };

function SFinanceiro(props) {
  const idRota = props.rota.id || '';
  const aba = idRota.startsWith('prestacao') ? 'prestacao' : ABAS_FINANCEIRO.some(([id]) => id === idRota) ? idRota : 'contas';
  const Conteudo = { contas: FContas, prestacao: FPrestacao, fluxo: FFluxo, auditoria: FAuditoria }[aba];
  return html`<section>
    <h1>Financeiro</h1>
    <nav class="chips" aria-label="Financeiro">${ABAS_FINANCEIRO.map(([id, nome]) => html`<a key=${id} class="chip" href=${`#sindico.financeiro.${id}`} aria-current=${aba === id ? 'page' : undefined}>${nome}</a>`)}</nav>
    <${Conteudo} ...${props} />
  </section>`;
}

function FormConta({ executar, hoje, aoConcluir }) {
  const [form, setForm] = useState({ fornecedor: '', categoria: 'manutencao', descricao: '', valor: '', vencimento: hoje, recorrente: false });
  const [erro, setErro] = useState(null);
  const campo = (chave) => (ev) => setForm({ ...form, [chave]: ev.target.type === 'checkbox' ? ev.target.checked : ev.target.value });

  function salvar() {
    const r = executar((e) => novaConta(e, { ...form, valor: lerPreco(form.valor) }, 'sindico'));
    setErro(r.erro || null);
    if (!r.erro) aoConcluir(`Conta ${r.id} cadastrada.`);
  }

  return html`<div class="cartao pilha formulario">
    <strong>Nova conta</strong>
    <div class="edicao-anuncio">
      <${Campo} rotulo="Fornecedor"><input id="conta-fornecedor" value=${form.fornecedor} onInput=${campo('fornecedor')} placeholder="Ex.: Pinturas Sol" /><//>
      <${Campo} rotulo="Categoria"><select id="conta-categoria" value=${form.categoria} onChange=${campo('categoria')}>${Object.entries(CATEGORIAS_DESPESA).map(([id, nome]) => html`<option key=${id} value=${id}>${nome}</option>`)}</select><//>
      <${Campo} rotulo="Descrição"><input id="conta-descricao" value=${form.descricao} onInput=${campo('descricao')} placeholder="Ex.: Pintura do hall" /><//>
      <${Campo} rotulo="Valor (R$)"><input id="conta-valor" inputmode="decimal" value=${form.valor} onInput=${campo('valor')} placeholder="Ex.: 2.500,00" /><//>
      <${Campo} rotulo="Vencimento"><input id="conta-vencimento" type="date" value=${form.vencimento} onInput=${campo('vencimento')} /><//>
    </div>
    <label class="check"><input id="conta-recorrente" type="checkbox" checked=${form.recorrente} onChange=${campo('recorrente')} /><span>Repete todo mês</span></label>
    <${Erro} texto=${erro} />
    <button type="button" class="btn primario" data-acao="salvar-conta" onClick=${salvar}>Cadastrar conta</button>
  </div>`;
}

function FContas({ estado, executar, agora }) {
  const [filtro, setFiltro] = useState('proximas');
  const [nova, setNova] = useState(false);
  const [erro, setErro] = useState(null);
  const [mensagem, setMensagem] = useState(null);
  if (!liberado(estado.plano, 'contasPagar')) return html`<${Bloqueado} estado=${estado} recurso="contasPagar" titulo="Contas a pagar com vencimento, boleto e pagamento pelo Asaas" />`;
  const hoje = isoDia(agora);
  const lista = contasFiltradas(estado, filtro, hoje);

  function pagar(id) {
    const r = executar((e) => pagarConta(e, id, 'sindico', new Date()));
    setErro(r.erro || null);
    setMensagem(r.erro ? null : `Conta ${id} paga.${r.seguinte ? ` A do próximo mês (${r.seguinte}) já foi criada.` : ''}`);
  }

  return html`<div class="pilha">
    <div class="linha-entre">
      <p class="sub">${fmtReais(totalAPagar(estado, hoje))} a pagar nos próximos 30 dias · saldo ${fmtReais(estado.financeiro.saldo)}</p>
      <button type="button" class="btn primario" aria-expanded=${nova} onClick=${() => { setNova(!nova); setMensagem(null); }}>Nova conta</button>
    </div>
    ${nova && html`<${FormConta} executar=${executar} hoje=${hoje} aoConcluir=${(t) => { setNova(false); setMensagem(t); }} />`}
    <${Campo} rotulo="Mostrar"><select id="contas-filtro" value=${filtro} onChange=${(ev) => setFiltro(ev.target.value)}>${FILTROS_CONTAS.map(([id, nome]) => html`<option key=${id} value=${id}>${nome}</option>`)}</select><//>
    <${Erro} texto=${erro} />
    <${Sucesso} texto=${mensagem} />
    ${lista.length
      ? html`<div class="tabela-rolagem"><table class="tabela">
          <thead><tr><th>Vencimento</th><th>Fornecedor</th><th>Descrição</th><th>Categoria</th><th>Valor</th><th>Situação</th><th>Ação</th></tr></thead>
          <tbody>${lista.map((c) => {
            const s = situacaoConta(c, hoje);
            return html`<tr key=${c.id}>
              <td>${fmtDataCurta(c.vencimento)}</td>
              <td>${c.fornecedor}</td>
              <td>${c.descricao}${c.recorrente ? html` <${Etiqueta}>mensal<//>` : ''}<br /><small class="sub">${c.id} · ${c.boleto}</small></td>
              <td>${CATEGORIAS_DESPESA[c.categoria]}</td>
              <td>${fmtReais(c.valor)}</td>
              <td><${Etiqueta} tipo=${ETQ_SITUACAO_CONTA[s]}>${NOMES_SITUACAO_CONTA[s]}<//>${c.pagaEm ? html`<br /><small class="sub">em ${fmtDataCurta(isoDia(new Date(c.pagaEm)))}</small>` : ''}</td>
              <td>${c.situacao === 'aberta' ? html`<button type="button" class="btn secundario" data-pagar=${c.id} onClick=${() => pagar(c.id)}>Pagar</button>` : html`<small class="sub">${c.comprovante}</small>`}</td>
            </tr>`;
          })}</tbody>
        </table></div>`
      : html`<${Vazio} texto="Nenhuma conta neste filtro." />`}
    <small class="sub">O pagamento sai pela conta Asaas do condomínio, entra na despesa da categoria e na auditoria. Conta paga não se edita.</small>
  </div>`;
}

function FAuditoria({ estado }) {
  const fin = estado.financeiro;
  return html`<div class="pilha">
    <p class="sub">Toda ação financeira do síndico fica registrada aqui e não pode ser apagada.</p>
    ${fin.auditoria.length
      ? html`<ul class="auditoria">${[...fin.auditoria].reverse().map((a, n) => html`<li key=${n}><span class="lt-quando">${fmtDataHora(a.em)}</span> <strong>${a.acao}</strong> · ${a.detalhe} · ${a.quem}</li>`)}</ul>`
      : html`<${Vazio} texto="Nenhuma ação registrada nesta demonstração." />`}
  </div>`;
}

const ETQ_SITUACAO_BALANCETE = { aberto: 'info', fechado: 'neutro', aguardando: 'alerta', correcao: 'perigo', aprovado: 'ok' };

function EtqBalancete({ b }) {
  return html`<${Etiqueta} tipo=${ETQ_SITUACAO_BALANCETE[b.situacao]}>${NOMES_SITUACAO_BALANCETE[b.situacao]}${b.parcial ? ' · parcial' : ''}<//>`;
}

function ListaMesesPrestacao({ estado, hoje, base }) {
  return html`<div class="tabela-rolagem"><table class="tabela">
    <thead><tr><th>Mês</th><th>Situação</th><th>Saldo inicial</th><th>Receitas</th><th>Despesas</th><th>Saldo final</th></tr></thead>
    <tbody>${mesesDaPrestacao(estado, hoje).map((mes) => {
      const b = balanceteDe(estado, mes, hoje);
      return html`<tr key=${mes}>
        <td><a href=${`${base}${mes}`} data-mes=${mes}>${nomeMes(mes)}</a></td>
        <td><${EtqBalancete} b=${b} /></td>
        <td>${fmtReais(b.saldoInicial)}</td><td>${fmtReais(totalReceitas(b))}</td><td>${fmtReais(totalDespesas(b))}</td><td><strong>${fmtReais(saldoFinal(b))}</strong></td>
      </tr>`;
    })}</tbody>
  </table></div>`;
}

function VisaoBalancete({ estado, mes, b, perfil, executar, aoResultado }) {
  const [comentando, setComentando] = useState(null);
  const [texto, setTexto] = useState('');
  const [respostas, setRespostas] = useState({});
  const comConselho = liberado(estado.plano, 'aprovacaoConselho');
  const sindicoEdita = perfil === 'sindico' && ['aberto', 'correcao'].includes(b.situacao) && !b.parcial;
  const conselhoAnalisa = perfil === 'conselho' && comConselho && b.situacao === 'aguardando';

  function rodar(acao, sucesso) {
    const r = executar(acao);
    aoResultado(r.erro || null, r.erro ? null : sucesso);
    return r;
  }

  const comentariosDe = (itemId) => b.comentarios.filter((c) => c.item === itemId);
  return html`<div class="pilha">
    <dl class="resumo">
      <dt>Saldo inicial</dt><dd>${fmtReais(b.saldoInicial)}</dd>
      <dt>Receitas</dt><dd>${fmtReais(totalReceitas(b))}</dd>
      <dt>Despesas</dt><dd>${fmtReais(totalDespesas(b))}</dd>
      <dt>Saldo final</dt><dd>${fmtReais(saldoFinal(b))}</dd>
      <dt>Inadimplência</dt><dd>${b.inadimplencia.unidades} unidades · ${fmtReais(b.inadimplencia.valor)}</dd>
      ${b.aprovadoPor && html`<dt>Aprovado</dt><dd>por ${b.aprovadoPor} em ${fmtDataCurta(isoDia(new Date(b.aprovadoEm)))}</dd>`}
    </dl>
    ${b.correcao && b.situacao === 'correcao' && html`<p class="erro">Correção pedida por ${b.correcao.autor}: ${b.correcao.motivo}</p>`}
    <h2>Receitas</h2>
    <ul class="itens-sacola">${b.receitas.map((r) => html`<li key=${r.nome}><span>${r.nome}</span><span>${fmtReais(r.valor)}</span></li>`)}</ul>
    <h2>Despesas por categoria</h2>
    ${b.despesas.map((d) => html`<div key=${d.categoria} class="cartao pilha">
      <div class="linha-entre"><strong>${CATEGORIAS_DESPESA[d.categoria]}</strong><strong>${fmtReais(totalCategoria(d))}</strong></div>
      <ul class="lancamentos-balancete">${d.itens.map((i) => html`<li key=${i.id}>
        <div class="linha-entre">
          <span>${i.descricao}</span>
          <span class="acoes">
            <span>${fmtReais(i.valor)}</span>
            ${i.nota === true && html`<${Etiqueta} tipo="ok">📎 nota<//>`}
            ${i.nota === false && html`<${Etiqueta} tipo="perigo">sem nota<//>`}
            ${sindicoEdita && i.nota === false && html`<button type="button" class="btn secundario" data-anexar=${i.id} onClick=${() => rodar((e) => anexarNota(e, mes, i.id, 'sindico'), 'Nota anexada.')}>Anexar nota</button>`}
            ${conselhoAnalisa && html`<button type="button" class="btn-link" data-comentar=${i.id} onClick=${() => { setComentando(comentando === i.id ? null : i.id); setTexto(''); }}>Comentar</button>`}
          </span>
        </div>
        ${comentariosDe(i.id).map((c) => html`<div key=${c.id} class="comentario-balancete">
          <small><strong>${c.autor}:</strong> ${c.texto}</small>
          ${c.resposta && html`<small><strong>Síndico:</strong> ${c.resposta.texto}</small>`}
          ${!c.resposta && perfil === 'sindico' && b.situacao === 'correcao' && html`<span class="acoes"><input aria-label="Resposta ao conselho" value=${respostas[c.id] || ''} onInput=${(ev) => setRespostas({ ...respostas, [c.id]: ev.target.value })} /><button type="button" class="btn secundario" onClick=${() => rodar((e) => responderComentario(e, mes, c.id, respostas[c.id], 'sindico', new Date()), 'Resposta enviada.')}>Responder</button></span>`}
        </div>`)}
        ${comentando === i.id && html`<span class="acoes"><input aria-label="Comentário do conselho" value=${texto} onInput=${(ev) => setTexto(ev.target.value)} placeholder="Ex.: falta a nota" /><button type="button" class="btn secundario" data-acao="enviar-comentario" onClick=${() => { const r = rodar((e) => comentarLancamento(e, mes, i.id, texto, 'conselho', new Date()), 'Comentário registrado.'); if (!r.erro) setComentando(null); }}>Enviar</button></span>`}
      </li>`)}</ul>
    </div>`)}
  </div>`;
}

function FormAjuste({ executar, mes, aoResultado }) {
  const [form, setForm] = useState({ descricao: '', categoria: 'administracao', valor: '' });
  const campo = (chave) => (ev) => setForm({ ...form, [chave]: ev.target.value });
  return html`<div class="cartao pilha">
    <strong>Registrar ajuste no mês corrente</strong>
    <small class="sub">O mês está travado. A correção entra como despesa do mês corrente, com referência a ${nomeMes(mes)}.</small>
    <div class="edicao-anuncio">
      <${Campo} rotulo="Descrição do ajuste"><input id="ajuste-descricao" value=${form.descricao} onInput=${campo('descricao')} placeholder="Ex.: tarifa bancária não lançada" /><//>
      <${Campo} rotulo="Categoria do ajuste"><select id="ajuste-categoria" value=${form.categoria} onChange=${campo('categoria')}>${Object.entries(CATEGORIAS_DESPESA).map(([id, nome]) => html`<option key=${id} value=${id}>${nome}</option>`)}</select><//>
      <${Campo} rotulo="Valor do ajuste (R$)"><input id="ajuste-valor" inputmode="decimal" value=${form.valor} onInput=${campo('valor')} /><//>
    </div>
    <button type="button" class="btn secundario" data-acao="registrar-ajuste" onClick=${() => { const r = executar((e) => registrarAjuste(e, mes, { ...form, valor: lerPreco(form.valor) }, 'sindico', new Date())); aoResultado(r.erro || null, r.erro ? null : `Ajuste ${r.id} lançado no mês corrente.`); }}>Registrar ajuste</button>
  </div>`;
}

function FPrestacao({ estado, executar, agora, rota }) {
  const [erro, setErro] = useState(null);
  const [mensagem, setMensagem] = useState(null);
  if (!liberado(estado.plano, 'prestacaoContas')) return html`<${Bloqueado} estado=${estado} recurso="prestacaoContas" titulo="Balancete mensal em PDF e resumo para os moradores" />`;
  const hoje = isoDia(agora);
  const mes = (rota.id || '').startsWith('prestacao-') ? rota.id.slice('prestacao-'.length) : null;
  const b = mes ? balanceteDe(estado, mes, hoje) : null;
  const aoResultado = (e, m) => { setErro(e); setMensagem(m); };
  if (!b) {
    return html`<div class="pilha">
      <p class="sub">${liberado(estado.plano, 'aprovacaoConselho') ? 'Ao fechar, o mês vai para o conselho fiscal aprovar. Depois de aprovado, fica travado.' : 'Ao fechar, o mês fica travado. A aprovação digital do conselho é do plano Avançado.'}</p>
      <${ListaMesesPrestacao} estado=${estado} hoje=${hoje} base="#sindico.financeiro.prestacao-" />
    </div>`;
  }
  const comConselho = liberado(estado.plano, 'aprovacaoConselho');
  const travado = SITUACOES_TRAVADAS.includes(b.situacao);
  const podePublicar = !b.resumo && (comConselho ? b.situacao === 'aprovado' : travado);
  const rodar = (acao, sucesso) => { const r = executar(acao); aoResultado(r.erro || null, r.erro ? null : sucesso); };
  return html`<div class="pilha">
    <a class="voltar" href="#sindico.financeiro.prestacao">‹ Prestação de contas</a>
    <div class="linha-entre"><h2>Balancete de ${nomeMes(mes)}</h2><${EtqBalancete} b=${b} /></div>
    ${b.parcial && html`<p class="sub">Mês em andamento: os números mudam a cada pagamento. O fechamento fica disponível depois que o mês terminar.</p>`}
    <div class="acoes">
      ${b.situacao === 'aberto' && !b.parcial && html`<button type="button" class="btn primario" data-acao="fechar-mes" onClick=${() => rodar((e) => fecharMes(e, mes, 'sindico', new Date()), comConselho ? 'Mês fechado e enviado ao conselho.' : 'Mês fechado e travado.')}>Fechar o mês</button>`}
      ${b.situacao === 'correcao' && html`<button type="button" class="btn primario" data-acao="reenviar-conselho" onClick=${() => rodar((e) => reenviarAoConselho(e, mes, 'sindico', new Date()), 'Balancete reenviado ao conselho.')}>Reenviar ao conselho</button>`}
      ${podePublicar && html`<button type="button" class="btn secundario" data-acao="publicar-resumo" onClick=${() => rodar((e) => publicarResumo(e, mes, 'sindico', new Date()), 'Resumo publicado para os moradores.')}>Publicar resumo para os moradores</button>`}
      ${b.resumo && html`<${Etiqueta} tipo="ok">Resumo publicado<//>`}
      ${b.situacao === 'aguardando' && html`<span class="sub">Aguardando a análise de ${CONSELHEIRO.nome}.</span>`}
    </div>
    <${Erro} texto=${erro} />
    <${Sucesso} texto=${mensagem} />

// Uma série (saldo dia a dia): sem legenda, título com a conclusão, reserva tracejada, mínimo rotulado, hover e tabela.
const GRAFICO_FLUXO = { largura: 760, altura: 260, esquerda: 64, direita: 16, topo: 16, base: 30 };

function passoBonito(bruto) {
  const potencia = 10 ** Math.floor(Math.log10(bruto));
  const n = bruto / potencia;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * potencia;
}

function GraficoFluxo({ fluxo, hoje }) {
  const [foco, setFoco] = useState(null);
  const g = GRAFICO_FLUXO;
  const valores = [...fluxo.serie.map((p) => p.saldo), fluxo.reserva];
  const min = Math.min(...valores);
  const max = Math.max(...valores);
  const folga = (max - min) * 0.08 || 100000;
  const y0 = min - folga;
  const y1 = max + folga;
  const larguraUtil = g.largura - g.esquerda - g.direita;
  const alturaUtil = g.altura - g.topo - g.base;
  const x = (i) => g.esquerda + (i / (fluxo.serie.length - 1)) * larguraUtil;
  const y = (v) => g.topo + (1 - (v - y0) / (y1 - y0)) * alturaUtil;
  const caminho = fluxo.serie.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.saldo).toFixed(1)}`).join(' ');
  const passo = passoBonito((y1 - y0) / 4);
  const marcas = [];
  for (let v = Math.ceil(y0 / passo) * passo; v <= y1; v += passo) marcas.push(v);
  const inicioMes = fluxo.serie.map((p, i) => ({ p, i })).filter(({ p, i }) => i === 0 || p.dia.endsWith('-01'));
  const iMin = fluxo.serie.indexOf(fluxo.minimo);
  const ponto = foco !== null ? fluxo.serie[foco] : null;

  function mover(ev) {
    const caixa = ev.currentTarget.getBoundingClientRect();
    const px = ((ev.clientX - caixa.left) / caixa.width) * g.largura;
    const i = Math.round(((px - g.esquerda) / larguraUtil) * (fluxo.serie.length - 1));
    setFoco(Math.max(0, Math.min(fluxo.serie.length - 1, i)));
  }

  return html`<div class="grafico-fluxo">
    <svg viewBox=${`0 0 ${g.largura} ${g.altura}`} role="img" aria-label=${`Saldo projetado de ${fmtDataCurta(hoje)} a ${fmtDataCurta(fluxo.serie.at(-1).dia)}`} onMouseMove=${mover} onMouseLeave=${() => setFoco(null)}>
      ${marcas.map((v) => html`<g key=${v}><line class="grade" x1=${g.esquerda} x2=${g.largura - g.direita} y1=${y(v)} y2=${y(v)} /><text class="eixo" x=${g.esquerda - 8} y=${y(v) + 4} text-anchor="end">${fmtReaisCurto(v)}</text></g>`)}
      ${inicioMes.map(({ p, i }) => html`<text key=${p.dia} class="eixo" x=${x(i)} y=${g.altura - 8} text-anchor=${i === 0 ? 'start' : 'middle'}>${i === 0 ? 'Hoje' : nomeMes(p.dia.slice(0, 7)).split(' de ')[0]}</text>`)}
      <line class="reserva" x1=${g.esquerda} x2=${g.largura - g.direita} y1=${y(fluxo.reserva)} y2=${y(fluxo.reserva)} />
      <text class="rotulo-reserva" x=${g.largura - g.direita} y=${y(fluxo.reserva) - 6} text-anchor="end">Reserva mínima ${fmtReaisCurto(fluxo.reserva)}</text>
      <path class="linha-saldo" d=${caminho} />
      <circle class="ponto-minimo" cx=${x(iMin)} cy=${y(fluxo.minimo.saldo)} r="5" />
      <text class="rotulo-minimo" x=${x(iMin)} y=${y(fluxo.minimo.saldo) + 20} text-anchor=${iMin > fluxo.serie.length * 0.8 ? 'end' : 'middle'}>Mínimo ${fmtReaisCurto(fluxo.minimo.saldo)} em ${fmtDataCurta(fluxo.minimo.dia).slice(0, 5)}</text>
      ${ponto && html`<g><line class="mira" x1=${x(foco)} x2=${x(foco)} y1=${g.topo} y2=${g.altura - g.base} /><circle class="ponto-foco" cx=${x(foco)} cy=${y(ponto.saldo)} r="4.5" /></g>`}
      <rect class="captura" x=${g.esquerda} y=${g.topo} width=${larguraUtil} height=${alturaUtil} />
    </svg>
    ${ponto && html`<div class="dica-fluxo" style=${`left:${Math.min(70, Math.max(2, (x(foco) / g.largura) * 100 - 10))}%`}>
      <strong>${fmtDataCurta(ponto.dia)} · ${fmtReais(ponto.saldo)}</strong>
      ${ponto.eventos.length ? ponto.eventos.map((e, n) => html`<small key=${n}>${e.valor >= 0 ? '+' : '−'}${fmtReais(Math.abs(e.valor))} · ${e.descricao}</small>`) : html`<small>Sem lançamentos no dia</small>`}
    </div>`}
  </div>`;
}

function FFluxo({ estado, agora }) {
  const hoje = isoDia(agora);
  const [margem, setMargem] = useState(String(indicadoresFinanceiros(estado, hoje).inadimplencia.pct).replace('.', ','));
  if (!liberado(estado.plano, 'fluxoCaixa')) return html`<${Bloqueado} estado=${estado} recurso="fluxoCaixa" titulo="Fluxo de caixa projetado para 90 dias" />`;
  const pct = Number(String(margem).replace(',', '.'));
  const valida = Number.isFinite(pct) && pct >= 0 && pct < 100;
  const fluxo = valida ? fluxoProjetado(estado, hoje, pct) : null;
  const saldoApos = (evento) => fluxo.serie.find((p) => p.dia === evento.dia).saldo;
  return html`<div class="pilha">
    <div class="edicao-anuncio">
      <${Campo} rotulo="Inadimplência esperada (%)" dica="Desconta as entradas previstas. Começa com a de hoje."><input id="fluxo-margem" inputmode="decimal" value=${margem} onInput=${(ev) => setMargem(ev.target.value)} /><//>
    </div>
    ${fluxo
      ? html`<section class="cartao pilha">
          <p class=${`titulo-grafico${fluxo.abaixo ? ' erro' : ''}`}>${fraseDoFluxo(fluxo)}.</p>
          <small class="sub">Saldo de hoje ${fmtReais(estado.financeiro.saldo)} · em 90 dias ${fmtReais(fluxo.final)} · reserva mínima = despesa média de um mês</small>
          <${GraficoFluxo} fluxo=${fluxo} hoje=${hoje} />
        </section>
        <h2>Próximos lançamentos</h2>
        <div class="tabela-rolagem"><table class="tabela">
          <thead><tr><th>Data</th><th>Lançamento</th><th>Entrada</th><th>Saída</th><th>Saldo no dia</th></tr></thead>
          <tbody>${fluxo.eventos.map((e, n) => html`<tr key=${n}>
            <td>${fmtDataCurta(e.dia)}</td><td>${e.descricao}</td>
            <td>${e.valor > 0 ? fmtReais(e.valor) : ''}</td><td>${e.valor < 0 ? fmtReais(-e.valor) : ''}</td>
            <td>${fmtReais(saldoApos(e))}</td>
          </tr>`)}</tbody>
        </table></div>`
      : html`<small class="sub">Informe uma inadimplência entre 0% e 99%.</small>`}
  </div>`;
}

function CPrestacao({ estado, executar, agora, rota }) {
  const [motivo, setMotivo] = useState('');
  const [erro, setErro] = useState(null);
  const [mensagem, setMensagem] = useState(null);
  const hoje = isoDia(agora);
  const comConselho = liberado(estado.plano, 'aprovacaoConselho');
  const mes = rota.id || null;
  const b = mes ? balanceteDe(estado, mes, hoje) : null;
  const aoResultado = (e, m) => { setErro(e); setMensagem(m); };
  const rodar = (acao, sucesso) => { const r = executar(acao); aoResultado(r.erro || null, r.erro ? null : sucesso); return r; };
  if (!b) {
    const pendentes = mesesParaOConselho(estado);
    return html`<section class="pilha">
      <h1>Prestação de contas</h1>
      ${!comConselho && html`<${Bloqueado} estado=${estado} recurso="aprovacaoConselho" titulo="Aprovação digital do conselho fiscal, com comentários por lançamento" />`}
      ${comConselho && (pendentes.length
        ? html`<div class="alertas">${pendentes.map((m) => html`<p key=${m} class="alerta-doc faixa-alerta"><a href=${`#conselho.prestacao.${m}`}><strong>Balancete de ${nomeMes(m)}</strong> aguarda a sua análise</a></p>`)}</div>`
        : html`<${Vazio} texto="Nenhum balancete aguardando a sua análise." />`)}
      <${ListaMesesPrestacao} estado=${estado} hoje=${hoje} base="#conselho.prestacao." />
    </section>`;
  }
  const analisa = comConselho && b.situacao === 'aguardando';
  return html`<section class="pilha">
    <a class="voltar" href="#conselho.prestacao">‹ Prestação de contas</a>
    <div class="linha-entre"><h1>Balancete de ${nomeMes(mes)}</h1><${EtqBalancete} b=${b} /></div>
    ${b.fechadoEm && html`<p class="sub">Fechado pelo síndico em ${fmtDataCurta(isoDia(new Date(b.fechadoEm)))}${b.correcao && b.correcao.respondidaEm ? ' · corrigido e reenviado' : ''}.</p>`}
    <${Erro} texto=${erro} />
    <${Sucesso} texto=${mensagem} />
    <${VisaoBalancete} key=${mes} estado=${estado} mes=${mes} b=${b} perfil="conselho" executar=${executar} aoResultado=${aoResultado} />
    ${analisa && html`<div class="cartao pilha">
      <strong>Parecer do conselho</strong>
      <button type="button" class="btn primario" data-acao="aprovar-mes" onClick=${() => rodar((e) => aprovarMes(e, mes, 'conselho', new Date()), 'Balancete aprovado. O mês está travado.')}>Aprovar o balancete</button>
      <${Campo} rotulo="Motivo da correção"><input id="correcao-motivo" value=${motivo} onInput=${(ev) => setMotivo(ev.target.value)} placeholder="Ex.: anexar a nota da dedetização" /><//>
      <button type="button" class="btn secundario" data-acao="pedir-correcao" onClick=${() => rodar((e) => pedirCorrecao(e, mes, motivo, 'conselho', new Date()), 'Correção pedida ao síndico.')}>Pedir correção</button>
    </div>`}
  </section>`;
}

function CDocumentos({ estado }) {
  const [aberto, setAberto] = useState(null);
  const documento = estado.documentos.find((d) => d.id === aberto);

  return html`<section class="pilha">

}

function FormEnquete({ estado, executar, agora, rascunho }) {
  const completa = liberado(estado.plano, 'enqueteCompleta');
  const comPeso = liberado(estado.plano, 'enquetePeso');
  const inicial = rascunho
    ? { pergunta: rascunho.pergunta, contexto: rascunho.contexto, opcoes: rascunho.opcoes.map((o) => o.texto), dias: String(rascunho.dias || 7), publicoTipo: rascunho.publico.tipo, andar: rascunho.publico.tipo === 'andar' ? rascunho.publico.valor : '1', unidades: rascunho.publico.tipo === 'unidades' ? rascunho.publico.valor.join(', ') : '', tipo: rascunho.tipo, maxEscolhas: String(rascunho.maxEscolhas), comentarios: rascunho.comentarios, secreto: rascunho.secreto, parcialVisivel: rascunho.parcialVisivel, lembretesAuto: rascunho.lembretesAuto, peso: rascunho.peso, quorumPct: rascunho.quorumPct ? String(rascunho.quorumPct) : '' }
    : { pergunta: '', contexto: '', opcoes: ['', ''], dias: '7', publicoTipo: 'todos', andar: '1', unidades: '', tipo: 'unica', maxEscolhas: '2', comentarios: false, secreto: true, parcialVisivel: false, lembretesAuto: true, peso: 'unidade', quorumPct: '' };

    setForm({ ...form, opcoes: lista });

  return html`<section class="pilha">

            <input aria-label=${`Opção ${n + 1}`} value=${o} onInput=${(ev) => mudarOpcao(n, ev.target.value)} placeholder=${`Opção ${n + 1}`} />
            <button type="button" class="btn-link" aria-label="Subir" disabled=${n === 0} onClick=${() => mover(n, -1)}>↑</button>
            <button type="button" class="btn-link" aria-label="Descer" disabled=${n === form.opcoes.length - 1} onClick=${() => mover(n, 1)}>↓</button>
            ${form.opcoes.length > 2 && html`<button type="button" class="btn-link" onClick=${() => setForm({ ...form, opcoes: form.opcoes.filter((_, i) => i !== n) })}>Remover</button>`}

          ${form.publicoTipo === 'andar' && html`<${Campo} rotulo="Andar"><select id="enquete-andar" value=${form.andar} onChange=${campo('andar')}>${['1', '2', '3', '4', '5', '6', '7', '8'].map((a) => html`<option key=${a} value=${a}>${a}º andar</option>`)}</select><//>`}
          ${form.publicoTipo === 'unidades' && html`<${Campo} rotulo="Unidades" dica="Separe por vírgula"><input id="enquete-unidades" value=${form.unidades} onInput=${campo('unidades')} placeholder="Ex.: 301, 302" /><//>`}
        </div>
        ${completa
          ? html`<div class="edicao-anuncio">
              <${Campo} rotulo="Tipo de resposta"><select id="enquete-tipo" value=${form.tipo} onChange=${campo('tipo')}><option value="unica">Escolha única</option><option value="multipla">Múltipla escolha</option></select><//>
              ${form.tipo === 'multipla' && html`<${Campo} rotulo="Até quantas opções"><input id="enquete-max" type="number" min="2" max=${Math.max(2, preenchidas.length)} value=${form.maxEscolhas} onInput=${campo('maxEscolhas')} /><//>`}
            </div>
            <label class="check"><input id="enquete-comentarios" type="checkbox" checked=${form.comentarios} onChange=${campo('comentarios')} /><span>Permitir comentário junto com o voto</span></label>
            <label class="check"><input id="enquete-secreto" type="checkbox" checked=${form.secreto} onChange=${campo('secreto')} /><span>Voto secreto (você vê só os totais e quem já respondeu)</span></label>
            <label class="check"><input id="enquete-parcial" type="checkbox" checked=${form.parcialVisivel} onChange=${campo('parcialVisivel')} /><span>Mostrar a parcial aos moradores durante a votação</span></label>
            <label class="check"><input id="enquete-lembretes" type="checkbox" checked=${form.lembretesAuto} onChange=${campo('lembretesAuto')} /><span>Lembretes automáticos 3 dias antes e no último dia</span></label>`
          : html`<${Bloqueado} estado=${estado} recurso="enqueteCompleta" titulo="Múltipla escolha, comentário, voto aberto, lembretes automáticos e resultado publicado" />`}
        ${comPeso
          ? html`<div class="edicao-anuncio">
              <${Campo} rotulo="Peso do voto"><select id="enquete-peso" value=${form.peso} onChange=${campo('peso')}><option value="unidade">1 voto por unidade</option><option value="fracao">Peso por fração ideal</option></select><//>
              <${Campo} rotulo="Quórum mínimo (%)" dica="Opcional. Abaixo dele, o resultado sai como Sem quórum."><input id="enquete-quorum" inputmode="numeric" value=${form.quorumPct} onInput=${campo('quorumPct')} placeholder="Ex.: 50" /><//>
            </div>`
          : html`<${Bloqueado} estado=${estado} recurso="enquetePeso" titulo="Peso por fração ideal e quórum mínimo" />`}
        <${Erro} texto=${erro} />
        <div class="acoes">
          <button type="button" class="btn primario" data-acao="publicar-enquete" onClick=${() => salvar(true)}>Publicar enquete</button>
          <button type="button" class="btn secundario" data-acao="salvar-rascunho" onClick=${() => salvar(false)}>Salvar rascunho</button>
        </div>
      </div>
      <aside class="cartao pilha previa-enquete" aria-label="Prévia para o morador">
        <small class="sub">Prévia: como o morador vê</small>
        <strong>${form.pergunta || 'Sua pergunta aparece aqui'}</strong>
        ${form.contexto && html`<span class="sub">${form.contexto}</span>`}
        ${(preenchidas.length ? preenchidas : ['Opção 1', 'Opção 2']).map((o, n) => html`<label key=${n} class="check"><input type=${completa && form.tipo === 'multipla' ? 'checkbox' : 'radio'} disabled /><span>${o}</span></label>`)}
        ${completa && form.tipo === 'multipla' && html`<small class="sub">Escolha até ${form.maxEscolhas} opções</small>`}
        <small class="sub">Responda até ${dataLimite}, 23h59${completa && !form.secreto ? ' · voto aberto ao síndico' : ' · voto secreto'}</small>
      </aside>
    </div>
  </section>`;
}

// Uma série (respostas acumuladas): título com a conclusão, quórum tracejado, rótulo no último ponto e tabela equivalente.
function GraficoEvolucao({ estado, e, agora }) {
  const pontos = evolucao(e, agora);
  const total = unidadesDoPublico(estado, e).length;
  if (pontos.length < 1) return null;
  const L = 900;
  const A = 200;
  const m = { esq: 36, dir: 16, topo: 12, base: 24 };
  const x = (i) => m.esq + (pontos.length === 1 ? 0 : (i / (pontos.length - 1)) * (L - m.esq - m.dir));
  const y = (v) => m.topo + (1 - v / total) * (A - m.topo - m.base);
  const quorum = e.quorumPct ? Math.ceil((e.quorumPct / 100) * total) : null;
  const ultimo = pontos.at(-1);
  return html`<div class="grafico-evolucao">
    <svg viewBox=${`0 0 ${L} ${A}`} role="img" aria-label=${`Respostas acumuladas: ${ultimo.total} de ${total}`}>
      ${[0, 0.5, 1].map((f) => html`<g key=${f}><line class="grade" x1=${m.esq} x2=${L - m.dir} y1=${y(total * f)} y2=${y(total * f)} /><text class="eixo" x=${m.esq - 6} y=${y(total * f) + 4} text-anchor="end">${Math.round(total * f)}</text></g>`)}
      ${quorum && html`<g><line class="reserva" x1=${m.esq} x2=${L - m.dir} y1=${y(quorum)} y2=${y(quorum)} /><text class="rotulo-reserva" x=${m.esq + 4} y=${y(quorum) - 5}>Quórum ${quorum} unidades</text></g>`}
      <path class="linha-saldo" d=${pontos.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.total).toFixed(1)}`).join(' ')} />
      ${pontos.map((p, i) => html`<circle key=${p.dia} class="ponto-foco" cx=${x(i)} cy=${y(p.total)} r="4"><title>${fmtDataCurta(p.dia)}: ${p.total} respostas</title></circle>`)}
      <text class="rotulo-minimo" x=${x(pontos.length - 1)} y=${y(ultimo.total) - 10} text-anchor="end">${ultimo.total} respostas</text>
      ${[pontos[0], ultimo].filter((p, i, l) => l.indexOf(p) === i).map((p) => html`<text key=${`x-${p.dia}`} class="eixo" x=${x(pontos.indexOf(p))} y=${A - 6} text-anchor=${p === pontos[0] ? 'start' : 'end'}>${fmtDataCurta(p.dia).slice(0, 5)}</text>`)}
    </svg>
    <table class="so-leitor"><caption>Respostas acumuladas por dia</caption><tbody>${pontos.map((p) => html`<tr key=${p.dia}><td>${fmtDataCurta(p.dia)}</td><td>${p.total}</td></tr>`)}</tbody></table>
  </div>`;
}

function PainelEnquete({ estado, executar, agora, e }) {
  const [erro, setErro] = useState(null);
  const [mensagem, setMensagem] = useState(null);
  const [confirmando, setConfirmando] = useState(false);
  const [dias, setDias] = useState('3');
  const completa = liberado(estado.plano, 'enqueteCompleta');
  const s = situacaoEnquete(e, agora);
  const a = apuracao(estado, e);
  const lista = faltantes(estado, e);
  const proximo = proximoLembreteAuto(e, agora);
  const comentarios = Object.entries(e.votos).filter(([, v]) => v.comentario);
  const rodar = (acao, sucesso) => { const r = executar(acao); setErro(r.erro || null); setMensagem(r.erro ? null : sucesso); return r; };
  const nomeOpcao = (id) => (e.opcoes.find((o) => o.id === id) || { texto: id }).texto;
  return html`<section class="pilha">
    <a class="voltar" href="#sindico.enquetes">‹ Enquetes</a>
    <div class="linha-entre"><h1>${e.pergunta}</h1><${EtqEnquete} e=${e} agora=${agora} /></div>
    <p class="sub">${e.id} · ${e.tipo === 'multipla' ? `múltipla escolha (até ${e.maxEscolhas})` : 'escolha única'} · ${e.secreto ? 'voto secreto' : 'voto aberto'}${e.peso === 'fracao' ? ' · peso por fração ideal' : ''}${e.quorumPct ? ` · quórum de ${e.quorumPct}%` : ''}</p>
    ${e.contexto && html`<p class="texto-longo">${e.contexto}</p>`}
    <div class="indicadores">
      <div class="indicador ind-info"><span class="ind-rotulo">Participação</span><strong>${a.participantes} de ${a.total}</strong><small>${pctTexto(a.participacaoPct)} das unidades</small></div>
      <div class=${`indicador ${s === 'aberta' && textoDiasRestantes(e, agora) === 'termina hoje' ? 'ind-alerta' : 'ind-info'}`}><span class="ind-rotulo">Prazo</span><strong>${s === 'aberta' ? textoDiasRestantes(e, agora) : 'encerrada'}</strong><small>${fmtDataHora(e.encerraEm)}${e.prorrogada ? ' · prorrogada' : ''}</small></div>
      ${e.quorumPct && html`<div class=${`indicador ${a.quorumAtingido ? 'ind-ok' : 'ind-alerta'}`}><span class="ind-rotulo">Quórum de ${e.quorumPct}%</span><strong>${a.quorumAtingido ? 'Atingido' : `Faltam ${Math.ceil((e.quorumPct / 100) * a.total) - a.participantes}`}</strong><small>${a.quorumAtingido ? 'O resultado vale' : 'unidades para valer'}</small></div>`}
    </div>
    <div class="barra" role="progressbar" aria-label="Participação" aria-valuenow=${Math.round(a.participacaoPct)} aria-valuemin="0" aria-valuemax="100"><span style=${`width:${a.participacaoPct}%`}></span></div>
    <${Erro} texto=${erro} />
    <${Sucesso} texto=${mensagem} />
    ${s === 'aberta' && html`<div class="cartao pilha">
      <strong>Lembretes</strong>
      <div class="acoes">
        <button type="button" class="btn primario" data-acao="enviar-lembrete" onClick=${() => rodar((x) => enviarLembrete(x, e.id, 'sindico', new Date()), `Lembrete enviado a ${lista.length} unidades.`)}>Enviar lembrete agora</button>
        ${completa && proximo && html`<button type="button" class="btn secundario" data-acao="lembrete-automatico" onClick=${() => rodar((x) => enviarLembrete(x, e.id, 'sindico', new Date(), true), 'Lembrete automático enviado.')}>Simular lembrete automático</button>`}
      </div>
      <small class="sub">${completa ? (proximo ? `Próximo lembrete automático em ${fmtDataHora(proximo)}` : e.lembretesAuto ? 'Lembretes automáticos já enviados' : 'Lembretes automáticos desligados') : 'Lembretes automáticos: plano Intermediário'}</small>
      ${e.lembretes.length > 0 && html`<ul class="auditoria">${e.lembretes.map((l, n) => html`<li key=${n}><span class="lt-quando">${fmtDataHora(l.em)}</span> ${l.automatico ? 'Automático' : 'Manual'} · ${l.unidades} unidades</li>`)}</ul>`}
    </div>`}
    <h2>Evolução das respostas</h2>
    <${GraficoEvolucao} estado=${estado} e=${e} agora=${agora} />
    <h2>${s === 'encerrada' ? `Resultado · ${textoResultado(estado, e)}` : 'Votos por opção'}</h2>
    <${BarrasOpcoes} estado=${estado} e=${e} />
    ${!e.secreto && Object.keys(e.votos).length > 0 && html`<details class="composicao"><summary>Voto de cada unidade (voto aberto)</summary>
      <div class="tabela-rolagem"><table class="tabela"><thead><tr><th>Unidade</th><th>Resposta</th><th>Quando</th></tr></thead>
        <tbody>${Object.entries(e.votos).sort(([x], [y]) => x.localeCompare(y)).map(([u, v]) => html`<tr key=${u}><td>${u}</td><td>${v.opcoes.map(nomeOpcao).join(', ')}</td><td>${fmtDataHora(v.em)}</td></tr>`)}</tbody></table></div>
    </details>`}
    ${comentarios.length > 0 && html`<h2>Comentários</h2><ul class="m-lista">${comentarios.map(([u, v]) => html`<li key=${u} class="cartao"><span>${v.comentario}</span><small class="sub">${e.secreto ? 'Comentário anônimo' : `Apto ${u}`}</small></li>`)}</ul>`}
    ${s === 'aberta' && html`<h2>Quem ainda não respondeu (${lista.length})</h2>
      <div class="faltantes-enquete">${lista.map((f) => html`<span key=${f.unidade} class="etq-turno t-folga">${f.unidade}${f.semApp ? ' · sem app' : ''}</span>`)}</div>
      <small class="sub">Unidades sem app recebem o lembrete por e-mail e WhatsApp.</small>`}
    <div class="acoes">
      ${s === 'aberta' && !e.prorrogada && html`<span class="acoes"><input aria-label="Dias de prorrogação" type="number" min="1" max="30" value=${dias} onInput=${(ev) => setDias(ev.target.value)} class="campo-curto" /><button type="button" class="btn secundario" data-acao="prorrogar" onClick=${() => rodar((x) => prorrogarEnquete(x, e.id, Number(dias), 'sindico', new Date()), 'Prazo prorrogado. Os moradores foram avisados.')}>Prorrogar</button></span>`}
      ${s === 'aberta' && (confirmando
        ? html`<button type="button" class="btn primario" data-acao="confirmar-encerrar" onClick=${() => { setConfirmando(false); rodar((x) => encerrarEnquete(x, e.id, 'sindico', new Date()), 'Enquete encerrada.'); }}>Confirmar encerramento</button><button type="button" class="btn-link" onClick=${() => setConfirmando(false)}>Voltar</button>`
        : html`<button type="button" class="btn secundario" data-acao="encerrar-enquete" onClick=${() => setConfirmando(true)}>Encerrar agora</button>`)}
      ${s === 'encerrada' && !e.resultado && (completa
        ? html`<button type="button" class="btn primario" data-acao="publicar-resultado" onClick=${() => rodar((x) => publicarResultado(x, e.id, 'sindico', new Date()), 'Resultado publicado no mural e em Documentos › Enquetes.')}>Publicar resultado</button>`
        : html`<${Bloqueado} estado=${estado} recurso="enqueteCompleta" titulo="Publicar o resultado no mural e em Documentos" />`)}
      ${e.resultado && html`<${Etiqueta} tipo="ok">Resultado publicado em ${fmtDataCurta(isoDia(new Date(e.resultado.publicadoEm)))}<//>`}
    </div>
  </section>`;
}

// Enquetes do morador: cartão no Início (some depois do voto), lista em Mais e a tela de voto.
function CartaoEnqueteInicio({ estado, eu, agora }) {
  const pendentes = enquetesPendentes(estado, eu, agora);
  return pendentes.map((e) => html`<a key=${e.id} class="cartao link enquete-inicio" href=${`#morador.enquetes.${e.id}`}>
    <span class="sub">Enquete · ${textoDiasRestantes(e, agora)}</span>
    <strong>${e.pergunta}</strong>
    <span class="btn primario">Responder</span>
  </a>`);
}

function TelaVoto({ estado, executar, agora, e, eu }) {
  const voto = e.votos[eu];
  const [escolhidas, setEscolhidas] = useState(voto ? voto.opcoes : []);
  const [comentario, setComentario] = useState(voto ? voto.comentario : '');
  const [trocando, setTrocando] = useState(false);
  const [erro, setErro] = useState(null);
  const [mensagem, setMensagem] = useState(null);
  const s = situacaoEnquete(e, agora);
  const pessoa = pessoaDaUnidade(estado, eu);
  const nome = pessoa ? pessoa.nome : `Apto ${eu}`;
  const multipla = e.tipo === 'multipla';
  const mostraResultado = s === 'encerrada' || (voto && e.parcialVisivel);
  const votando = s === 'aberta' && (!voto || trocando);

  function alternar(id) {
    if (!multipla) setEscolhidas([id]);
    else setEscolhidas(escolhidas.includes(id) ? escolhidas.filter((x) => x !== id) : [...escolhidas, id]);
  }

  function enviar() {
    const r = executar((x) => votar(x, e.id, { unidade: eu, autor: nome, opcoes: escolhidas, comentario }, new Date()));
    setErro(r.erro || null);
    if (!r.erro) {
      setTrocando(false);
      setMensagem(r.trocou ? 'Voto alterado.' : 'Seu voto foi registrado.');
    }
  }

  return html`<section class="m-pagina">
    <a class="voltar" href="#morador.enquetes">‹ Enquetes</a>
    <div class="etq-linha"><${EtqEnquete} e=${e} agora=${agora} /><span class="sub">${s === 'aberta' ? `Responda até ${fmtDataCurta(isoDia(new Date(e.encerraEm)))} · ${textoDiasRestantes(e, agora)}` : `Encerrada em ${fmtDataCurta(isoDia(new Date(e.encerradaEm || e.encerraEm)))}`}</span></div>
    <h1 class="m-titulo">${e.pergunta}</h1>
    ${e.contexto && html`<p class="m-texto">${e.contexto}</p>`}
    <${Sucesso} texto=${mensagem} />
    ${voto && !trocando && html`<div class="cartao">
      <strong>${voto.autor === nome ? 'Seu voto' : `Sua unidade já votou (${voto.autor})`}</strong>
      <span>${voto.opcoes.map((id) => e.opcoes.find((o) => o.id === id).texto).join(', ')}</span>
      ${voto.comentario && html`<small class="sub">“${voto.comentario}”</small>`}
      ${s === 'aberta' && html`<button type="button" class="btn-link" data-acao="trocar-voto" onClick=${() => setTrocando(true)}>Trocar o voto</button>`}
    </div>`}
    ${votando && html`<div class="pilha">
      <fieldset><legend>${multipla ? `Escolha até ${e.maxEscolhas} opções` : 'Escolha uma opção'}</legend>
        ${e.opcoes.map((o) => html`<label key=${o.id} class="check"><input type=${multipla ? 'checkbox' : 'radio'} name="voto-enquete" data-opcao=${o.id} checked=${escolhidas.includes(o.id)} onChange=${() => alternar(o.id)} /><span>${o.texto}</span></label>`)}
      </fieldset>
      ${e.comentarios && html`<${Campo} rotulo="Comentário (opcional)"><textarea id="enquete-comentario" rows="2" value=${comentario} onInput=${(ev) => setComentario(ev.target.value)}></textarea><//>`}
      <small class="sub">${e.secreto ? 'Voto secreto: o síndico vê só os totais.' : 'Voto aberto: o síndico vê o voto de cada unidade.'} Um voto por unidade${e.peso === 'fracao' ? ', com peso pela fração ideal' : ''}.</small>
      <${Erro} texto=${erro} />
      <button type="button" class="btn primario bloco" data-acao="enviar-voto" onClick=${enviar}>${voto ? 'Salvar novo voto' : 'Enviar voto'}</button>
    </div>`}
    ${mostraResultado && html`<h2>${s === 'encerrada' ? textoResultado(estado, e) : 'Parcial'}</h2><${BarrasOpcoes} estado=${estado} e=${e} />`}
    ${voto && !mostraResultado && s === 'aberta' && html`<p class="m-sub">O resultado aparece aqui quando a enquete encerrar.</p>`}
  </section>`;
}

function MEnquetes({ estado, executar, agora, eu, rota }) {
  const e = rota.id ? enquetePorId(estado, rota.id) : null;
  if (e && e.situacao !== 'rascunho' && unidadesDoPublico(estado, e).includes(eu)) return html`<${TelaVoto} key=${e.id} estado=${estado} executar=${executar} agora=${agora} e=${e} eu=${eu} />`;
  const { pendentes, respondidas, encerradas } = enquetesDaUnidade(estado, eu, agora);
  const item = (x, detalhe) => html`<li key=${x.id}><a class="cartao link" href=${`#morador.enquetes.${x.id}`}><strong>${x.pergunta}</strong><span class="sub">${detalhe}</span></a></li>`;
  return html`<section class="m-pagina">
    <h1 class="m-titulo">Enquetes</h1>
    <h2>Para responder</h2>
    ${pendentes.length ? html`<ul class="m-lista">${pendentes.map((x) => item(x, textoDiasRestantes(x, agora)))}</ul>` : html`<${Vazio} texto="Nenhuma enquete esperando sua resposta." />`}
    ${respondidas.length > 0 && html`<h2>Respondidas</h2><ul class="m-lista">${respondidas.map((x) => item(x, `Você já votou · ${textoDiasRestantes(x, agora)}`))}</ul>`}
    <h2>Encerradas</h2>
    ${encerradas.length ? html`<ul class="m-lista">${encerradas.map((x) => item(x, textoResultado(estado, x)))}</ul>` : html`<${Vazio} texto="Nenhuma enquete encerrada." />`}
  </section>`;
}
