function PRegistrar({ estado, executar }) {
  const [unidade, setUnidade] = useState('');
  const [transportadora, setTransportadora] = useState('');
  const [foto, setFoto] = useState(false);
  const [lida, setLida] = useState(null);
  const [erro, setErro] = useState(null);
  const [registrada, setRegistrada] = useState(null);
  const numero = unidade.trim();
  const moradores = moradoresDaUnidade(estado, numero);

  function lerEtiqueta() {
    setUnidade('302');
    setTransportadora('Mercado Livre');
    setFoto(true);
    setErro(null);
    setLida('Etiqueta lida: ANA SOUZA · APTO 302 · MERCADO LIVRE');
  }

  function registrar() {
    const r = executar((e) => registrarEncomenda(e, { unidade: numero, transportadora, foto, porteiro: PORTEIRO_DIA }, new Date()));
    if (r.erro) {
      setErro(r.erro);
      return;
    }
    setRegistrada(r.estado.encomendas.find((x) => x.id === r.id));
    setUnidade('');
    setTransportadora('');
    setFoto(false);
    setLida(null);
    setErro(null);
  }

  return html`<section class="p-grade">
    <div class="p-coluna">
      <button type="button" class="btn grande destaque" onClick=${lerEtiqueta}><${Icone} nome="leitor" tamanho=${26} />Ler etiqueta</button>
      ${lida && html`<p class="dica-ocr">${lida}</p>`}
      <${Campo} rotulo="Unidade"><input id="portaria-unidade" class="entrada-grande" inputmode="numeric" maxlength="3" value=${unidade} onInput=${(ev) => setUnidade(ev.target.value)} placeholder="Ex.: 302" /><//>
      ${numero.length === 3 && html`<p class="dica-unidade">${moradores.length ? moradores.map((m) => m.nome).join(', ') : 'Unidade sem morador cadastrado'}</p>`}
      <p class="rotulo">Transportadora</p>
      <div class="opcoes-grandes" role="group" aria-label="Transportadora">
        ${TRANSPORTADORAS.map((t) => html`<button type="button" key=${t} class=${`btn grande opcao${t === transportadora ? ' sel' : ''}`} aria-pressed=${t === transportadora} onClick=${() => setTransportadora(t)}>${t}</button>`)}
      </div>
    </div>
    <div class="p-coluna">
      ${foto ? html`<${FotoFalsa} rotulo="Foto do volume e da etiqueta" />` : html`<button type="button" class="btn grande secundario" onClick=${() => setFoto(true)}>Fotografar volume</button>`}
      <${Erro} texto=${erro} />
      <button type="button" class="btn grande primario" disabled=${!numero || !transportadora} onClick=${registrar}>Registrar encomenda</button>
      ${registrada && html`<div class="cartao confirmacao" role="status" data-codigo=${registrada.codigo}>
        <strong>Encomenda registrada para o apto ${registrada.unidade}</strong>
        <span>Código de retirada: <b>${registrada.codigo}</b></span>
        <span>Morador avisado por WhatsApp com a foto.</span>
      </div>`}
    </div>
  </section>`;
}

function PEntregar({ estado, executar, agora }) {
  const [busca, setBusca] = useState('');
  const [selecionada, setSelecionada] = useState(null);
  const [codigo, setCodigo] = useState('');
  const [nome, setNome] = useState('');
  const [erro, setErro] = useState(null);
  const [entregue, setEntregue] = useState(null);
  const [lido, setLido] = useState(null);
  const termo = busca.trim();
  const lista = estado.encomendas
    .filter((e) => e.status === 'aguardando' && (!termo || e.unidade.includes(termo) || e.codigo === termo))
    .sort((a, b) => a.chegadaEm.localeCompare(b.chegadaEm));
  const encomenda = selecionada && estado.encomendas.find((e) => e.id === selecionada && e.status === 'aguardando');

  function escolher(id) {
    setSelecionada(id);
    setCodigo('');
    setNome('');
    setErro(null);
    setEntregue(null);
    setLido(null);
    // No celular o painel de entrega fica abaixo da lista: leva o porteiro até ele.
    setTimeout(() => {
      const painel = document.getElementById('painel-entrega');
      const reduzir = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (painel) painel.scrollIntoView({ behavior: reduzir ? 'auto' : 'smooth', block: 'start' });
    }, 0);
  }

  function escanear() {
    setCodigo(encomenda.codigo);
    setLido(`QR lido: código ${encomenda.codigo} (leitura simulada no protótipo)`);
  }

  function confirmar() {
    const r = executar((e) => entregarEncomenda(e, { id: encomenda.id, codigo, nome }, new Date()));
    if (r.erro) {
      setErro(r.erro);
      return;
    }
    setEntregue(`Entrega registrada: apto ${encomenda.unidade}, retirada por ${nome.trim()}.`);
    setSelecionada(null);
    setBusca('');
  }

  return html`<section class="p-grade">
    <div class="p-coluna">
      <${Campo} rotulo="Buscar por código ou unidade"><input id="portaria-busca" class="entrada-grande" inputmode="numeric" value=${busca} onInput=${(ev) => setBusca(ev.target.value)} placeholder="Ex.: 302 ou 481203" /><//>
      ${entregue && html`<p class="sucesso" role="status">${entregue}</p>`}
      <ul class="lista-encomendas">
        ${lista.length
          ? lista.map((e) => html`<li key=${e.id}><button type="button" class=${`item-encomenda${e.id === selecionada ? ' sel' : ''}`} onClick=${() => escolher(e.id)}>
              <strong>Apto ${e.unidade}</strong>
              <span>${e.transportadora} · chegou ${haQuanto(e.chegadaEm, agora)}</span>
              ${encomendaParada(e, agora) && html`<${Etiqueta} tipo="perigo">Parada<//>`}
            </button></li>`)
          : html`<li><${Vazio} texto="Nenhuma encomenda aguardando." /></li>`}
      </ul>
    </div>
    <div class="p-coluna">
      ${encomenda
        ? html`<div class="cartao" id="painel-entrega">
            <h2>Entregar: apto ${encomenda.unidade} · ${encomenda.transportadora}</h2>
            <${Campo} rotulo="Código de retirada"><input id="portaria-codigo" class="entrada-grande" inputmode="numeric" maxlength="6" value=${codigo} onInput=${(ev) => setCodigo(ev.target.value)} /><//>
            <button type="button" class="btn secundario" onClick=${escanear}>Escanear QR do morador</button>
            ${lido && html`<p class="dica-ocr" role="status">${lido}</p>`}
            <${Campo} rotulo="Quem retirou"><input id="portaria-quem" class="entrada-grande" value=${nome} onInput=${(ev) => setNome(ev.target.value)} /><//>
            <div class="sugestoes">${moradoresDaUnidade(estado, encomenda.unidade).map((m) => html`<button type="button" key=${m.id} class="btn secundario" onClick=${() => setNome(m.nome)}>${m.nome}</button>`)}</div>
            <${Erro} texto=${erro} />
            <button type="button" class="btn grande primario" onClick=${confirmar}>Confirmar entrega</button>
          </div>`
        : html`<${Vazio} texto="Escolha uma encomenda na lista." />`}
    </div>
  </section>`;
}

function PReservasHoje({ estado, agora }) {
  const hoje = isoDia(agora);
  const lista = estado.reservas.filter((r) => r.data === hoje && r.status === 'confirmada').sort((a, b) => a.inicio - b.inicio);
  return html`<section>
    <h1>Reservas de hoje</h1>
    ${lista.length
      ? html`<div class="grade-cartoes">${lista.map((r) => html`<article key=${r.id} class="cartao">
          <h3>${areaPorId(estado, r.areaId).nome}</h3>
          <p class="sub">${fmtHora(r.inicio)}–${fmtHora(r.fim)} · Apto ${r.unidade}</p>
          <p class="rotulo">Convidados (${r.convidados.length})</p>
          ${r.convidados.length
            ? html`<ul class="convidados">${r.convidados.map((c, i) => html`<li key=${i}>${c.nome} <small>${c.documento}</small></li>`)}</ul>`
            : html`<${Vazio} texto="Sem lista de convidados." />`}
        </article>`)}</div>`
      : html`<${Vazio} texto="Nenhuma reserva confirmada para hoje." />`}
  </section>`;
}

// ---- src/ui/financeiro-sindico.js ----

const ETQ_COBRANCA = { aberta: 'info', vencida: 'perigo', paga: 'ok', cancelada: 'neutro' };
const NOMES_SITUACAO_COBRANCA = { aberta: 'Em aberto', vencida: 'Vencida', paga: 'Paga', cancelada: 'Cancelada' };

function decimal(n) {
  return String(n).replace('.', ',');
}

function EtqCobranca({ situacao }) {
  return html`<${Etiqueta} tipo=${ETQ_COBRANCA[situacao]}>${NOMES_SITUACAO_COBRANCA[situacao]}<//>`;
}

function Bloqueado({ estado, recurso, titulo }) {
  const minimo = planoMinimo(recurso);
  const unidades = estado.condominio.unidades.length;
  const diferenca = mensalidade(minimo.id, unidades) - mensalidade(estado.plano, unidades);
  return html`<div class="bloqueado"><strong>${titulo}</strong><span>Disponível no plano ${minimo.nome} (+${fmtReais(diferenca)}/mês)</span></div>`;
}

function pendenciasCobranca(estado, hoje) {
  const fin = estado.financeiro;
  const proxima = proximaCompetencia(fin);
  const itens = [];
  if (!fin.emitidas.includes(proxima)) itens.push({ chave: 'emitir', texto: `Emitir cobranças de ${mesExtenso(proxima)} (fechamento dia ${fin.parametros.diaFechamento})`, href: '#sindico.cobranca.previa' });
  for (const d of devedores(estado, hoje).filter((x) => x.dias >= 60)) itens.push({ chave: `juridico-${d.unidade}`, texto: `${d.unidade}: débito há mais de 60 dias, avaliar cobrança jurídica`, href: '#sindico.cobranca.emitidas' });
  itens.push(...alertasAcordos(estado, hoje));
  return itens;
}

// Duas séries (receitas e despesas): legenda sempre presente, rótulo direto só no mês em destaque, tabela para leitores de tela.
function GraficoReceitas({ estado, hoje }) {
  const serie = serieReceitasDespesas(estado, hoje);
  const maximo = Math.max(...serie.flatMap((m) => [m.receitas, m.despesas]));
  const altura = (valor) => `${Math.round((valor / maximo) * 140)}px`;
  return html`<section class="cartao">
    <p class="titulo-grafico">${tituloSerie(serie)}</p>
    <div class="legenda-serie" aria-hidden="true"><span class="leg-receita">Receitas</span><span class="leg-despesa">Despesas</span></div>
    <div class="barras-duplas" aria-hidden="true">
      ${serie.map((m) => {
        const destaque = m.despesas > m.receitas;
        return html`<div key=${m.mes} class=${`mes${destaque ? ' destaque' : ''}`} title=${`${mesExtenso(m.mes)}: receitas ${fmtReaisCurto(m.receitas)}, despesas ${fmtReaisCurto(m.despesas)}`}>
          <span class="valor-destaque">${destaque ? fmtReaisCurto(m.despesas) : ''}</span>
          <div class="par"><span class="b-receita" style=${`height:${altura(m.receitas)}`}></span><span class="b-despesa" style=${`height:${altura(m.despesas)}`}></span></div>
          <span class="rotulo-x">${mesCurto(m.mes)}</span>
        </div>`;
      })}
    </div>
    <table class="so-leitor">
      <caption>Receitas e despesas dos últimos 12 meses</caption>
      <thead><tr><th>Mês</th><th>Receitas</th><th>Despesas</th></tr></thead>
      <tbody>${serie.map((m) => html`<tr key=${m.mes}><td>${nomeMes(m.mes)}</td><td>${fmtReais(m.receitas)}</td><td>${fmtReais(m.despesas)}</td></tr>`)}</tbody>
    </table>
  </section>`;
}

function Categorias({ estado }) {
  const fin = estado.financeiro;
  const linhas = Object.entries(CATEGORIAS_DESPESA).map(([id, nome]) => [nome, fin.despesasMes[id]]).sort((a, b) => b[1] - a[1]);
  const maximo = linhas[0][1];
  return html`<section class="cartao">
    <p class="titulo-grafico">Para onde foi o dinheiro em ${mesExtenso(fin.vigente)}</p>
    <ul class="barras-h">${linhas.map(([nome, valor]) => html`<li key=${nome}><span>${nome}</span><span class="trilho"><span class="b-despesa" style=${`width:${Math.round((valor / maximo) * 100)}%`}></span></span><strong>${fmtReaisCurto(valor)}</strong></li>`)}</ul>
  </section>`;
}

function ListaDevedores({ estado, hoje }) {
  const lista = devedores(estado, hoje);
  return html`<section class="pilha">
    <h2>Devedores</h2>
    ${lista.length
      ? html`<div class="tabela-rolagem"><table class="tabela">
          <thead><tr><th>Unidade</th><th>Responsável</th><th>Cobranças</th><th>Valor atualizado</th><th>Atraso</th><th>Etapa da régua</th><th>Acordo</th></tr></thead>
          <tbody>${lista.map((d) => html`<tr key=${d.unidade}><td>${d.unidade}</td><td>${d.responsavel ? d.responsavel.nome : '—'}</td><td>${d.cobrancas}</td><td>${fmtReais(d.valor)}</td><td>${d.dias} dias</td><td>${d.etapa ? d.etapa.nome : '—'}</td><td>${d.acordo ? html`<${Etiqueta} tipo=${d.acordo === 'ativo' ? 'info' : 'alerta'}>${d.acordo === 'ativo' ? 'acordo ativo' : 'proposta enviada'}<//>` : liberado(estado.plano, 'acordos') ? html`<a class="btn-link" data-propor=${d.unidade} href=${`#sindico.cobranca.novoacordo-${d.unidade}`}>Propor acordo</a>` : '—'}</td></tr>`)}</tbody>
        </table></div>`
      : html`<${Vazio} texto="Nenhuma unidade em atraso." />`}
    <small class="sub">Lista visível só para quem tem acesso financeiro. Nunca aparece para os moradores.</small>
  </section>`;
}

function OrcadoRealizado({ estado }) {
  const fin = estado.financeiro;
  return html`<section class="pilha">
    <h2>Orçado × realizado em ${mesExtenso(fin.vigente)}</h2>
    <div class="tabela-rolagem"><table class="tabela">
      <thead><tr><th>Categoria</th><th>Orçado</th><th>Realizado</th><th>Desvio</th><th>%</th></tr></thead>
      <tbody>${Object.entries(CATEGORIAS_DESPESA).map(([id, nome]) => {
        const orcado = fin.orcamento[id];
        const realizado = fin.despesasMes[id];
        const desvio = realizado - orcado;
        const pct = Math.round((desvio / orcado) * 1000) / 10;
        const sinal = desvio > 0 ? '+' : '';
        return html`<tr key=${id}><td>${nome}</td><td>${fmtReais(orcado)}</td><td>${fmtReais(realizado)}</td><td class=${desvio > 0 ? 'desvio-ruim' : ''}>${sinal}${fmtReais(desvio)}</td><td>${sinal}${decimal(pct)}%</td></tr>`;
      })}</tbody>
    </table></div>
  </section>`;
}

function PainelFinanceiro({ estado, agora }) {
  const hoje = isoDia(agora);
  const ind = indicadoresFinanceiros(estado, hoje);
  const completo = liberado(estado.plano, 'dashboardCompleto');
  const a = ind.arrecadado;
  const numeros = [
    ['Saldo em caixa', fmtReaisCurto(ind.saldo.valor), 'Conta Asaas + banco', ind.saldo.alerta, 'cifrao'],
    [`Arrecadado em ${mesExtenso(a.competencia)}`, `${a.pct}%`, `${fmtReaisCurto(a.recebido)} de ${fmtReaisCurto(a.previsto)}${a.proxima ? ` · ${mesExtenso(a.proxima.competencia)}: ${a.proxima.pagas} de ${a.proxima.total} pagas` : ''}`, a.alerta, 'grafico'],
    ['Inadimplência', `${ind.inadimplencia.unidades} de ${ind.inadimplencia.total}`, `${decimal(ind.inadimplencia.pct)}% das unidades · ${fmtReaisCurto(ind.inadimplencia.valor)}`, ind.inadimplencia.alerta, 'pessoa'],
  ];
  if (completo) numeros.push(['Despesas do mês', fmtReaisCurto(ind.despesas.valor), `${ind.despesas.desvio > 0 ? '+' : ''}${decimal(ind.despesas.desvio)}% em relação ao orçado`, ind.despesas.alerta, 'documento']);
  return html`<div class="pilha">
    <div class="indicadores">
      ${numeros.map(([rotulo, valor, detalhe, alerta, icone]) => html`<div key=${rotulo} class=${`indicador fin ${alerta ? 'ind-perigo' : 'ind-ok'}`}><${QuadroIcone} nome=${icone} cheio=${alerta} /><span class="ind-rotulo">${rotulo}</span><strong>${valor}</strong><small>${detalhe}</small></div>`)}
    </div>
    ${completo
      ? html`<div class="graficos-fin"><${GraficoReceitas} estado=${estado} hoje=${hoje} /><${Categorias} estado=${estado} /></div><${ListaDevedores} estado=${estado} hoje=${hoje} />`
      : html`<${Bloqueado} estado=${estado} recurso="dashboardCompleto" titulo="Despesas do mês, receitas × despesas em 12 meses, para onde foi o dinheiro e lista de devedores" />`}
    ${liberado(estado.plano, 'orcadoRealizado')
      ? html`<${OrcadoRealizado} estado=${estado} />`
      : completo && html`<${Bloqueado} estado=${estado} recurso="orcadoRealizado" titulo="Orçado × realizado por categoria" />`}
  </div>`;
}

const ABAS_COBRANCA = [['previa', 'Prévia e emissão'], ['emitidas', 'Cobranças emitidas'], ['acordos', 'Acordos'], ['regua', 'Régua'], ['parametros', 'Parâmetros']];
const FILTROS_COBRANCA = [['todas', 'Todas'], ['aberta', 'Em aberto'], ['vencida', 'Vencidas'], ['paga', 'Pagas'], ['cancelada', 'Canceladas']];

function SCobranca(props) {
  const idRota = props.rota.id || '';
  const deAcordo = idRota.startsWith('novoacordo') || idRota.startsWith('AC-');
  const aba = deAcordo ? 'acordos' : ABAS_COBRANCA.some(([id]) => id === idRota) ? idRota : 'previa';
  const Conteudo = { previa: CPrevia, emitidas: CEmitidas, acordos: CAcordos, regua: CRegua, parametros: CParametros }[aba];
  return html`<section>
    <h1>Cobrança</h1>
    <p class="faixa-asaas">Conta Asaas ativa · subconta do condomínio. O dinheiro cai direto na conta do condomínio; o CondoFácil só organiza emissão, baixa e relatórios.</p>
    <nav class="chips" aria-label="Cobrança">${ABAS_COBRANCA.map(([id, nome]) => html`<a key=${id} class="chip" href=${`#sindico.cobranca.${id}`} aria-current=${aba === id ? 'page' : undefined}>${nome}</a>`)}</nav>
    <${Conteudo} ...${props} />
  </section>`;
}

function EditorComposicao({ linha, competencia, executar }) {
  const [itens, setItens] = useState(linha.itens.map((i) => ({ ...i, texto: (i.valor / 100).toFixed(2).replace('.', ',') })));
  const [descricao, setDescricao] = useState('');
  const [valor, setValor] = useState('');
  const [mensagem, setMensagem] = useState(null);
  const [erro, setErro] = useState(null);

  function salvar(lista) {
    const r = executar((e) => editarItemPrevia(e, competencia, linha.unidade, lista.map((i) => ({ tipo: i.tipo, descricao: i.descricao, valor: lerPreco(i.texto) }))));
    setErro(r.erro || null);
    setMensagem(r.erro ? null : 'Composição atualizada.');
    if (!r.erro) setItens(lista);
  }

  function incluir() {
    salvar([...itens, { tipo: 'avulso', descricao, texto: valor }]);
    setDescricao('');
    setValor('');
  }

  return html`<div class="pilha">
    <ul class="itens-sacola">${itens.map((i, n) => html`<li key=${`${n}-${i.descricao}`}>
      <span>${i.descricao}</span>
      <input id=${`valor-${linha.unidade}-${n}`} class="valor-item" aria-label=${`Valor de ${i.descricao}`} inputmode="decimal" value=${i.texto} onInput=${(ev) => setItens(itens.map((x, k) => (k === n ? { ...x, texto: ev.target.value } : x)))} />
      ${i.tipo !== 'ordinaria' && html`<button type="button" class="btn-link" onClick=${() => salvar(itens.filter((_, k) => k !== n))}>Remover</button>`}
    </li>`)}</ul>
    <div class="edicao-anuncio">
      <${Campo} rotulo="Novo item"><input id=${`novo-item-${linha.unidade}`} value=${descricao} onInput=${(ev) => setDescricao(ev.target.value)} placeholder="Ex.: Multa por infração" /><//>
      <${Campo} rotulo="Valor (R$)"><input id=${`novo-valor-${linha.unidade}`} inputmode="decimal" value=${valor} onInput=${(ev) => setValor(ev.target.value)} placeholder="Ex.: 120,00" /><//>
    </div>
    <div class="acoes">
      <button type="button" class="btn secundario" onClick=${incluir}>Incluir item</button>
      <button type="button" class="btn primario" onClick=${() => salvar(itens)}>Salvar composição</button>
    </div>
    <${Erro} texto=${erro} />
    <${Sucesso} texto=${mensagem} />
  </div>`;
}

function CPrevia({ estado, executar }) {
  const fin = estado.financeiro;
  const competencia = proximaCompetencia(fin);
  const previa = previaCompetencia(estado, competencia);
  const emitida = fin.emitidas.includes(competencia);
  const [aberta, setAberta] = useState(null);
  const [erro, setErro] = useState(null);
  const emitiveis = previa.linhas.filter((l) => !l.bloqueada);
  const total = emitiveis.reduce((soma, l) => soma + l.total, 0);

  function emitir() {
    const r = executar((e) => emitirCompetencia(e, competencia, 'sindico', new Date()));
    setErro(r.erro || null);
  }

  return html`<div class="pilha">
    <h2>Competência de ${mesExtenso(competencia)} · vencimento ${fmtDataCurta(previa.vencimento)}</h2>
    ${emitida
      ? html`<p class="sucesso">Cobranças de ${mesExtenso(competencia)} emitidas. Acompanhe em Cobranças emitidas.</p>`
      : html`<p class="sub">Revise a composição antes de emitir. Cobrança emitida não é editada: alterações viram cancelamento e reemissão.</p>`}
    <div class="tabela-rolagem"><table class="tabela">
      <thead><tr><th>Unidade</th><th>Responsável financeiro</th><th>Total</th><th>Composição</th></tr></thead>
      <tbody>${previa.linhas.map((l) => [
        html`<tr key=${l.unidade} class=${l.bloqueada ? 'linha-bloqueada' : ''}>
          <td>${l.unidade}</td>
          <td>${l.bloqueada ? html`<strong class="texto-perigo">Sem responsável financeiro: não será emitida</strong>` : `${l.responsavel.nome} (${NOMES_RELACAO[l.responsavel.relacao]})`}</td>
          <td>${fmtReais(l.total)}</td>
          <td><button type="button" class="btn-link" onClick=${() => setAberta(aberta === l.unidade ? null : l.unidade)}>${aberta === l.unidade ? 'Fechar' : 'Ver composição'}</button></td>
        </tr>`,
        aberta === l.unidade && html`<tr key=${`${l.unidade}-composicao`}><td colspan="4">${emitida
          ? html`<ul class="itens-sacola">${l.itens.map((i, n) => html`<li key=${n}><span>${i.descricao}</span><span>${fmtReais(i.valor)}</span></li>`)}</ul>`
          : html`<${EditorComposicao} key=${l.unidade} linha=${l} competencia=${competencia} executar=${executar} />`}</td></tr>`,
      ])}</tbody>
    </table></div>
    <div class="linha-entre total"><span>${emitiveis.length} cobranças · ${previa.linhas.length - emitiveis.length} não emitida(s)</span><strong>${fmtReais(total)}</strong></div>
    <${Erro} texto=${erro} />
    ${!emitida && html`<button type="button" class="btn primario" data-acao="emitir" onClick=${emitir}>Emitir ${emitiveis.length} cobranças</button>`}
  </div>`;
}

function DetalheCobranca({ estado, cobranca, executar, hoje, aoFechar }) {
  const fin = estado.financeiro;
  const [comprovante, setComprovante] = useState('');
  const [data, setData] = useState(hoje);
  const [baixando, setBaixando] = useState(false);
  const [erro, setErro] = useState(null);
  const [mensagem, setMensagem] = useState(null);
  const situacao = situacaoCobranca(cobranca, hoje);
  const v = valorAtualizado(cobranca, fin.parametros, hoje);
  const responsavel = fin.unidades[cobranca.unidade].responsavel;

  function rodar(acao, sucesso) {
    const r = executar(acao);
    setErro(r.erro || null);
    if (!r.erro) {
      setMensagem(sucesso);
      setBaixando(false);
    }
  }

  return html`<article class="cartao">
    <div class="linha-entre"><strong>Apto ${cobranca.unidade} · ${rotuloCobranca(cobranca)}</strong><${EtqCobranca} situacao=${situacao} /></div>
    <small class="sub">${responsavel ? `${responsavel.nome} · ${responsavel.documento}` : 'Sem responsável'} · vencimento ${fmtDataCurta(cobranca.vencimento)}${cobranca.substituiu ? ` · substitui ${cobranca.substituiu}` : ''}</small>
    <ul class="itens-sacola">
      ${cobranca.itens.map((i, n) => html`<li key=${n}><span>${i.descricao}</span><span>${fmtReais(i.valor)}</span></li>`)}
      ${v.dias > 0 && html`<li><span>Multa (${decimal(fin.parametros.multaPct)}%) e juros (${v.dias} dias)</span><span>${fmtReais(v.multa + v.juros)}</span></li>`}
    </ul>
    <div class="linha-entre total"><span>${situacao === 'paga' ? `Pago em ${fmtDataHora(cobranca.pagaEm)} · ${NOMES_FORMA[cobranca.forma]}` : 'Valor atualizado'}</span><strong>${fmtReais(situacao === 'paga' ? cobranca.valorPago : v.total)}</strong></div>
    ${cobranca.baixaManual && html`<small class="sub">Baixa manual por ${cobranca.baixaManual.por} · ${cobranca.baixaManual.comprovante}</small>`}
    ${cobranca.regua.length > 0 && html`<small class="sub">Régua enviada: ${cobranca.regua.map((r) => ETAPAS_REGUA.find((e) => e.id === r.etapa).nome).join(' · ')}</small>`}
    ${['aberta', 'vencida'].includes(situacao) && html`<div class="acoes">
      <button type="button" class="btn secundario" onClick=${() => setBaixando(!baixando)}>Baixa manual</button>
      <button type="button" class="btn secundario" onClick=${() => rodar((e) => cancelarEReemitir(e, cobranca.id, 'sindico', new Date()), 'Cobrança cancelada e reemitida.')}>Cancelar e reemitir</button>
      <button type="button" class="btn secundario" onClick=${() => rodar((e) => enviarSegundaVia(e, cobranca.id, new Date()), '2ª via enviada com valor atualizado.')}>Enviar 2ª via</button>
    </div>`}
    ${baixando && html`<div class="recusa">
      <${Campo} rotulo="Data do pagamento"><input id="baixa-data" type="date" value=${data} onInput=${(ev) => setData(ev.target.value)} /><//>
      <button type="button" class="btn secundario" onClick=${() => setComprovante(`comprovante-${cobranca.unidade}.pdf`)}>${comprovante ? `Anexado: ${comprovante}` : 'Anexar comprovante'}</button>
      <button type="button" class="btn primario" onClick=${() => rodar((e) => baixaManual(e, cobranca.id, { data, comprovante }, 'sindico', new Date()), 'Baixa registrada.')}>Confirmar baixa</button>
    </div>`}
    <${Erro} texto=${erro} />
    <${Sucesso} texto=${mensagem} />
    <button type="button" class="btn-link" onClick=${aoFechar}>Fechar detalhes</button>
  </article>`;
}

function CEmitidas({ estado, executar, agora }) {
  const fin = estado.financeiro;
  const hoje = isoDia(agora);
  const competencias = [...new Set(fin.cobrancas.filter((c) => !c.acordo).map((c) => c.competencia))].sort().reverse();
  const [competencia, setCompetencia] = useState(competencias[0]);
  const [filtro, setFiltro] = useState('todas');
  const [aberta, setAberta] = useState(null);
  const lista = fin.cobrancas
    .filter((c) => !c.acordo && c.competencia === competencia && (filtro === 'todas' || situacaoCobranca(c, hoje) === filtro))
    .sort((a, b) => a.unidade.localeCompare(b.unidade) || a.id.localeCompare(b.id));
  const selecionada = aberta ? fin.cobrancas.find((c) => c.id === aberta) : null;
  return html`<div class="pilha">
    <div class="edicao-anuncio">
      <${Campo} rotulo="Competência"><select id="emitidas-competencia" value=${competencia} onChange=${(ev) => { setCompetencia(ev.target.value); setAberta(null); }}>${competencias.map((c) => html`<option key=${c} value=${c}>${nomeMes(c)}</option>`)}</select><//>
      <${Campo} rotulo="Situação"><select id="emitidas-situacao" value=${filtro} onChange=${(ev) => setFiltro(ev.target.value)}>${FILTROS_COBRANCA.map(([id, nome]) => html`<option key=${id} value=${id}>${nome}</option>`)}</select><//>
    </div>
    ${selecionada && html`<${DetalheCobranca} key=${selecionada.id} estado=${estado} cobranca=${selecionada} executar=${executar} hoje=${hoje} aoFechar=${() => setAberta(null)} />`}
    <div class="tabela-rolagem"><table class="tabela">
      <thead><tr><th>Unidade</th><th>Valor</th><th>Atualizado</th><th>Situação</th><th>Ação</th></tr></thead>
      <tbody>${lista.map((c) => html`<tr key=${c.id}>
        <td>${c.unidade}</td>
        <td>${fmtReais(c.valor)}</td>
        <td>${fmtReais(valorAtualizado(c, fin.parametros, hoje).total)}</td>
        <td><${EtqCobranca} situacao=${situacaoCobranca(c, hoje)} /></td>
        <td><button type="button" class="btn-link" data-cobranca=${c.id} onClick=${() => setAberta(c.id)}>Detalhes</button></td>
      </tr>`)}</tbody>
    </table></div>
    ${!lista.length && html`<${Vazio} texto="Nenhuma cobrança neste filtro." />`}
    <h2>Auditoria</h2>
    ${fin.auditoria.length
      ? html`<ul class="auditoria">${[...fin.auditoria].reverse().map((a, n) => html`<li key=${n}><span class="lt-quando">${fmtDataHora(a.em)}</span> <strong>${a.acao}</strong> · ${a.detalhe} · ${a.quem}</li>`)}</ul>`
      : html`<${Vazio} texto="Nenhuma ação registrada nesta demonstração." />`}
  </div>`;
}

function CRegua({ estado, executar }) {
  const permitidas = etapasNoPlano(estado.plano);
  const [resumo, setResumo] = useState(null);

  function executarHoje() {
    const r = executar((e) => executarRegua(e, new Date()));
    setResumo(r.resumo || []);
  }

  return html`<div class="pilha">
    <div class="tabela-rolagem"><table class="tabela">
      <thead><tr><th>Quando</th><th>Ação automática</th><th>Canais</th><th>No seu plano</th></tr></thead>
      <tbody>${ETAPAS_REGUA.map((e) => html`<tr key=${e.id}>
        <td>${e.nome}</td>
        <td>${e.acao}</td>
        <td>${e.canais.join(' + ')}</td>
        <td>${permitidas.includes(e.id) ? html`<${Etiqueta} tipo="ok">Ativa<//>` : html`<${Etiqueta}>Disponível no ${PLANOS.find((p) => etapasNoPlano(p.id).includes(e.id)).nome}<//>`}</td>
      </tr>`)}</tbody>
    </table></div>
    <small class="sub">A régua para sozinha quando a cobrança é paga.</small>
    <button type="button" class="btn primario" data-acao="executar-regua" onClick=${executarHoje}>Executar a régua de hoje</button>
    ${resumo && (resumo.length
      ? html`<div class="cartao"><strong>${resumo.length} avisos enviados</strong><ul class="itens-sacola">${resumo.map((r, n) => html`<li key=${n}><span>Apto ${r.unidade} · ${r.rotulo}</span><span>${r.etapa.nome}</span></li>`)}</ul></div>`
      : html`<p class="sucesso">Nenhum aviso pendente hoje.</p>`)}
  </div>`;
}

function CParametros({ estado, executar }) {
  const fin = estado.financeiro;
  const [form, setForm] = useState({ ...fin.parametros, formas: [...fin.parametros.formas] });
  const [erro, setErro] = useState(null);
  const [mensagem, setMensagem] = useState(null);
  const completa = liberado(estado.plano, 'composicaoCompleta');
  const c = fin.composicao;
  const campo = (chave) => (ev) => setForm({ ...form, [chave]: ev.target.type === 'number' ? Number(ev.target.value) : ev.target.value });
  const alternarForma = (k) => setForm({ ...form, formas: form.formas.includes(k) ? form.formas.filter((x) => x !== k) : [...form.formas, k] });

  function salvar() {
    const r = executar((e) => salvarParametros(e, form, 'sindico', new Date()));
    setErro(r.erro || null);
    setMensagem(r.erro ? null : 'Parâmetros salvos.');
  }

  return html`<div class="pilha formulario">
    <h2>Parâmetros de cobrança</h2>
    <div class="edicao-anuncio">
      <${Campo} rotulo="Dia do vencimento"><input id="par-vencimento" type="number" min="1" max="28" value=${form.diaVencimento} onInput=${campo('diaVencimento')} /><//>
      <${Campo} rotulo="Dia do fechamento"><input id="par-fechamento" type="number" min="1" max="28" value=${form.diaFechamento} onInput=${campo('diaFechamento')} /><//>
      <${Campo} rotulo="Multa por atraso (%)" dica="Máximo de 2%"><input id="par-multa" type="number" step="0.1" min="0" value=${form.multaPct} onInput=${campo('multaPct')} /><//>
      <${Campo} rotulo="Juros ao mês (%)"><input id="par-juros" type="number" step="0.1" min="0" value=${form.jurosPct} onInput=${campo('jurosPct')} /><//>
      <${Campo} rotulo="Desconto de pontualidade (%)"><input id="par-desconto" type="number" step="0.5" min="0" value=${form.descontoPct} onInput=${campo('descontoPct')} /><//>
      <${Campo} rotulo="Desconto aprovado em" dica="Ata ou cláusula da convenção"><input id="par-desconto-ata" value=${form.descontoAprovadoEm} onInput=${campo('descontoAprovadoEm')} placeholder="Ex.: AGO de 28/03/2026, item 4" /><//>
    </div>
    <fieldset><legend>Formas aceitas</legend>
      ${[['boleto', 'Boleto'], ['pix', 'Pix'], ['cartao', 'Cartão']].map(([k, nome]) => html`<label key=${k} class="check"><input id=${`par-forma-${k}`} type="checkbox" checked=${form.formas.includes(k)} onChange=${() => alternarForma(k)} /><span>${nome}</span></label>`)}
    </fieldset>
    <${Campo} rotulo="Tarifa do Asaas"><select id="par-tarifa" value=${form.tarifa} onChange=${campo('tarifa')}><option value="condominio">Absorvida pelo condomínio</option><option value="despesa">Registrada como despesa bancária</option></select><//>
    <${Erro} texto=${erro} />
    <${Sucesso} texto=${mensagem} />
    <button type="button" class="btn primario" onClick=${salvar}>Salvar parâmetros</button>
    <h2>Composição da taxa</h2>
    <dl class="resumo">
      <dt>${completa ? 'Ordinária · apto tipo A' : 'Valor fixo · apto tipo A'}</dt><dd>${fmtReais(c.ordinaria.A)}</dd>
      <dt>${completa ? 'Ordinária · cobertura' : 'Valor fixo · cobertura'}</dt><dd>${fmtReais(c.ordinaria.cobertura)}</dd>
      ${completa && html`<dt>Fundo de reserva</dt><dd>${c.fundoPct}% da ordinária</dd>`}
      ${completa && html`<dt>Taxa extra</dt><dd>${c.extra.descricao}: ${fmtReais(c.extra.total)} em ${c.extra.parcelas}x (${fmtReais(Math.round(c.extra.total / c.extra.parcelas / c.extra.unidades))} por unidade)</dd>`}
    </dl>
    ${!completa && html`<${Bloqueado} estado=${estado} recurso="composicaoCompleta" titulo="Fundo de reserva e taxa extra parcelada" />`}
  </div>`;
}

// ---- src/ui/acordos.js ----

const ETQ_ACORDO = { aguardando: 'alerta', ativo: 'info', quitado: 'ok', cancelado: 'neutro' };
const NOMES_SITUACAO_ACORDO = { aguardando: 'Aguardando aceite', ativo: 'Ativo', quitado: 'Quitado', cancelado: 'Cancelado' };

function EtqAcordo({ situacao }) {
  return html`<${Etiqueta} tipo=${ETQ_ACORDO[situacao]}>${NOMES_SITUACAO_ACORDO[situacao]}<//>`;
}

function termoDoAcordo(acordo) {
  return { titulo: `Termo de confissão de dívida · ${acordo.id} · apto ${acordo.unidade}`, pasta: 'Financeiro', versoes: [{ versao: 1, data: isoDia(new Date(acordo.criadoEm)) }] };
}

function nomeLinha(numero, de) {
  return numero ? `Parcela ${numero}/${de}` : 'Entrada';
}

function ResumoAcordo({ estado, acordo }) {
  const originais = estado.financeiro.cobrancas.filter((c) => acordo.originais.includes(c.id));
  return html`<dl class="resumo">
    <dt>Débitos incluídos</dt><dd>${originais.map((c) => rotuloCobranca(c)).join(', ')}</dd>
    <dt>Valor original</dt><dd>${fmtReais(acordo.valorOriginal)}</dd>
    <dt>Multa e juros</dt><dd>${fmtReais(acordo.multa + acordo.juros)}</dd>
    <dt>Desconto</dt><dd>${fmtReais(-acordo.desconto)}</dd>
    <dt>Total do acordo</dt><dd><strong>${fmtReais(acordo.total)}</strong></dd>
  </dl>`;
}

function Cronograma({ estado, acordo, hoje, aoAbrir }) {
  if (['aguardando', 'cancelado'].includes(acordo.situacao)) {
    return html`<ul class="itens-sacola">${cronogramaDoAcordo(estado, acordo, hoje).map((l) => html`<li key=${l.numero}><span>${nomeLinha(l.numero, acordo.parcelas)} · ${fmtDataCurta(l.vencimento)}</span><span>${fmtReais(l.valor)}</span></li>`)}</ul>`;
  }
  return html`<ul class="itens-sacola cronograma">${cobrancasDoAcordo(estado, acordo.id).map((c) => html`<li key=${c.id}>
    <span>${nomeLinha(c.acordo.numero, c.acordo.de)} · ${fmtDataCurta(c.vencimento)}</span>
    <span class="cronograma-fim">${fmtReais(c.valor)} <${EtqCobranca} situacao=${situacaoCobranca(c, hoje)} />${aoAbrir && html` <button type="button" class="btn-link" data-cobranca=${c.id} onClick=${() => aoAbrir(c.id)}>Detalhes</button>`}</span>
  </li>`)}</ul>`;
}

function CAcordos(props) {
  const { estado, rota } = props;
  if (!liberado(estado.plano, 'acordos')) return html`<${Bloqueado} estado=${estado} recurso="acordos" titulo="Acordos de inadimplência com parcelamento e desconto" />`;
  const id = rota.id || '';
  if (id.startsWith('novoacordo')) return html`<${NovoAcordo} key=${id} ...${props} unidadeInicial=${id.split('-')[1] || null} />`;
  const acordo = estado.financeiro.acordos.find((a) => a.id === id);
  if (acordo) return html`<${DetalheAcordo} key=${acordo.id} ...${props} acordo=${acordo} />`;
  return html`<${ListaAcordos} ...${props} />`;
}

function ListaAcordos({ estado, agora }) {
  const fin = estado.financeiro;
  const hoje = isoDia(agora);
  const lista = [...fin.acordos].reverse();
  return html`<div class="pilha">
    <div class="linha-entre"><h2>Acordos</h2><a class="btn primario" href="#sindico.cobranca.novoacordo">Novo acordo</a></div>
    ${lista.length
      ? html`<div class="tabela-rolagem"><table class="tabela">
          <thead><tr><th>Acordo</th><th>Unidade</th><th>Situação</th><th>Progresso</th><th>Próxima</th><th>Ação</th></tr></thead>
          <tbody>${lista.map((a) => {
            const p = progressoAcordo(estado, a);
            const r = fin.unidades[a.unidade].responsavel;
            return html`<tr key=${a.id}>
              <td>${a.id}</td>
              <td>${a.unidade} · ${r ? r.nome : '—'}</td>
              <td><${EtqAcordo} situacao=${a.situacao} /></td>
              <td>${p.pagas} de ${p.total} parcelas pagas</td>
              <td>${p.proxima ? html`${fmtDataCurta(p.proxima.vencimento)}${situacaoCobranca(p.proxima, hoje) === 'vencida' ? html` <${EtqCobranca} situacao="vencida" />` : ''}` : '—'}</td>
              <td><a class="btn-link" data-acordo=${a.id} href=${`#sindico.cobranca.${a.id}`}>Abrir</a></td>
            </tr>`;
          })}</tbody>
        </table></div>`
      : html`<${Vazio} texto="Nenhum acordo ainda." />`}
    <small class="sub">As parcelas viram cobranças comuns: pagamento pelo Asaas, baixa manual e régua funcionam igual.</small>
  </div>`;
}

function NovoAcordo({ estado, executar, agora, unidadeInicial }) {
  const hoje = isoDia(agora);
  const fin = estado.financeiro;
  const unidades = estado.condominio.unidades.filter((u) => debitosParaAcordo(estado, u, hoje).length);
  const inicial = unidades.includes(unidadeInicial) ? unidadeInicial : unidades[0] || '';
  const [unidade, setUnidade] = useState(inicial);
  const [marcados, setMarcados] = useState(inicial ? debitosParaAcordo(estado, inicial, hoje).map((c) => c.id) : []);
  const [perdoaMulta, setPerdoaMulta] = useState(false);
  const [jurosPct, setJurosPct] = useState('0');
  const [entrada, setEntrada] = useState('');
  const [parcelas, setParcelas] = useState('3');
  const [erro, setErro] = useState(null);
  const voltar = html`<a class="voltar" href="#sindico.cobranca.acordos">‹ Acordos</a>`;
  if (!unidades.length) return html`<div class="pilha">${voltar}<${Vazio} texto="Nenhuma unidade com débito vencido." /></div>`;
  const debitos = debitosParaAcordo(estado, unidade, hoje);
  const dados = { unidade, originais: marcados, perdoaMulta, jurosPerdoadosPct: Number(jurosPct), entrada: entrada.trim() ? lerPreco(entrada) : 0, parcelas: Number(parcelas) };
  const s = simularAcordo(estado, dados, hoje);

  function trocarUnidade(u) {
    setUnidade(u);
    setMarcados(debitosParaAcordo(estado, u, hoje).map((c) => c.id));
  }

  function enviar() {
    const r = executar((e) => proporAcordo(e, dados, 'sindico', new Date()));
    if (r.erro) setErro(r.erro);
    else ir('sindico', 'cobranca', r.id);
  }

  return html`<div class="pilha formulario">
    ${voltar}
    <h2>Novo acordo</h2>
    <${Campo} rotulo="Unidade"><select id="acordo-unidade" value=${unidade} onChange=${(ev) => trocarUnidade(ev.target.value)}>${unidades.map((u) => html`<option key=${u} value=${u}>${u} · ${fin.unidades[u].responsavel.nome}</option>`)}</select><//>
    <fieldset><legend>Débitos vencidos</legend>
      ${debitos.map((c) => html`<label key=${c.id} class="check"><input id=${`acordo-debito-${c.id}`} type="checkbox" checked=${marcados.includes(c.id)} onChange=${() => setMarcados(marcados.includes(c.id) ? marcados.filter((x) => x !== c.id) : [...marcados, c.id])} /><span>${rotuloCobranca(c)} · ${fmtReais(valorAtualizado(c, fin.parametros, hoje).total)}</span></label>`)}
    </fieldset>
    <label class="check"><input id="acordo-perdoa-multa" type="checkbox" checked=${perdoaMulta} onChange=${() => setPerdoaMulta(!perdoaMulta)} /><span>Perdoar a multa</span></label>
    <div class="edicao-anuncio">
      <${Campo} rotulo="Juros perdoados (%)"><input id="acordo-juros" type="number" min="0" max="100" value=${jurosPct} onInput=${(ev) => setJurosPct(ev.target.value)} /><//>
      <${Campo} rotulo="Entrada (R$)"><input id="acordo-entrada" inputmode="decimal" value=${entrada} onInput=${(ev) => setEntrada(ev.target.value)} placeholder="Ex.: 300,00" /><//>
      <${Campo} rotulo="Parcelas"><select id="acordo-parcelas" value=${parcelas} onChange=${(ev) => setParcelas(ev.target.value)}>${Array.from({ length: 12 }, (_, i) => html`<option key=${i + 1} value=${String(i + 1)}>${i + 1}</option>`)}</select><//>
    </div>
    ${s.ok
      ? html`<div class="cartao simulacao">
          <dl class="resumo">
            <dt>Valor original</dt><dd>${fmtReais(s.valorOriginal)}</dd>
            <dt>Multa e juros</dt><dd>${fmtReais(s.multa + s.juros)}</dd>
            <dt>Desconto</dt><dd>${fmtReais(-s.desconto)}</dd>
            <dt>Total do acordo</dt><dd><strong>${fmtReais(s.total)}</strong></dd>
          </dl>
          <strong>${dados.entrada ? `Entrada de ${fmtReais(dados.entrada)} + ` : ''}${dados.parcelas} × ${fmtReais(s.valorParcela)}${s.ultimaParcela !== s.valorParcela ? ` (a última de ${fmtReais(s.ultimaParcela)})` : ''}</strong>
          <ul class="itens-sacola">${s.cronograma.map((l) => html`<li key=${l.numero}><span>${nomeLinha(l.numero, dados.parcelas)} · ${fmtDataCurta(l.vencimento)}</span><span>${fmtReais(l.valor)}</span></li>`)}</ul>
        </div>`
      : html`<${Erro} texto=${s.motivo} />`}
    <${Erro} texto=${erro} />
    <button type="button" class="btn primario" data-acao="enviar-proposta" disabled=${!s.ok} onClick=${enviar}>Enviar proposta</button>
  </div>`;
}

function DetalheAcordo({ estado, executar, agora, acordo }) {
  const hoje = isoDia(agora);
  const fin = estado.financeiro;
  const [aberta, setAberta] = useState(null);
  const [documento, setDocumento] = useState(null);
  const [erro, setErro] = useState(null);
  const [mensagem, setMensagem] = useState(null);
  const r = fin.unidades[acordo.unidade].responsavel;
  const selecionada = aberta ? fin.cobrancas.find((c) => c.id === aberta) : null;
  const auditoria = fin.auditoria.filter((a) => a.detalhe.startsWith(acordo.id));
  if (documento) return html`<${PrevDoc} documento=${documento} aoFechar=${() => setDocumento(null)} />`;

  function cancelar() {
    const res = executar((e) => cancelarProposta(e, acordo.id, 'sindico', new Date()));
    setErro(res.erro || null);
    setMensagem(res.erro ? null : 'Proposta cancelada. Os débitos originais continuam valendo.');
  }

  return html`<div class="pilha">
    <a class="voltar" href="#sindico.cobranca.acordos">‹ Acordos</a>
    <div class="linha-entre"><h2>Acordo ${acordo.id} · apto ${acordo.unidade}</h2><${EtqAcordo} situacao=${acordo.situacao} /></div>
    <small class="sub">${r ? r.nome : '—'} · proposto em ${fmtDataCurta(acordo.criadoEm)}${acordo.aceitoEm ? ` · aceito em ${fmtDataCurta(acordo.aceitoEm)} por ${acordo.aceitoPor}` : ''}</small>
    <div class="cartao"><${ResumoAcordo} estado=${estado} acordo=${acordo} /></div>
    <h2>${acordo.situacao === 'aguardando' ? 'Cronograma proposto' : 'Cronograma'}</h2>
    ${selecionada && html`<${DetalheCobranca} key=${selecionada.id} estado=${estado} cobranca=${selecionada} executar=${executar} hoje=${hoje} aoFechar=${() => setAberta(null)} />`}
    <div class="cartao"><${Cronograma} estado=${estado} acordo=${acordo} hoje=${hoje} aoAbrir=${setAberta} /></div>
    <div class="acoes">
      ${liberado(estado.plano, 'termoConfissao') && html`<button type="button" class="btn secundario" onClick=${() => setDocumento(termoDoAcordo(acordo))}>Ver termo de confissão</button>`}
      ${acordo.situacao === 'aguardando' && html`<button type="button" class="btn secundario" onClick=${cancelar}>Cancelar proposta</button>`}
    </div>
    <${Erro} texto=${erro} />
    <${Sucesso} texto=${mensagem} />
    <h2>Auditoria</h2>
    <ul class="auditoria">${[...auditoria].reverse().map((a, n) => html`<li key=${n}><span class="lt-quando">${fmtDataHora(a.em)}</span> <strong>${a.acao}</strong> · ${a.detalhe} · ${a.quem}</li>`)}</ul>
  </div>`;
}

function PropostaAcordo({ estado, executar, acordo, hoje, eu }) {
  const [ciente, setCiente] = useState(false);
  const [documento, setDocumento] = useState(null);
  const [erro, setErro] = useState(null);
  const comTermo = liberado(estado.plano, 'termoConfissao');
  if (documento) return html`<${PrevDoc} documento=${documento} aoFechar=${() => setDocumento(null)} />`;

  function lerTermo() {
    executar((e) => marcarTermoLido(e, acordo.id, new Date()));
    setDocumento(termoDoAcordo(acordo));
  }

  function aceitar() {
    const r = executar((e) => aceitarAcordo(e, acordo.id, { quem: pessoaDaUnidade(estado, eu).nome, ciente }, new Date()));
    setErro(r.erro || null);
  }

  return html`<article class="cartao proposta-acordo">
    <div class="linha-entre"><strong>Proposta de acordo ${acordo.id}</strong><${EtqAcordo} situacao=${acordo.situacao} /></div>
    <small class="sub">Enviada pelo síndico em ${fmtDataCurta(acordo.criadoEm)}. Ao aceitar, os débitos incluídos são substituídos pelas parcelas abaixo.</small>
    <${ResumoAcordo} estado=${estado} acordo=${acordo} />
    <${Cronograma} estado=${estado} acordo=${acordo} hoje=${hoje} />
    ${comTermo && html`<button type="button" class="btn secundario" onClick=${lerTermo}>${acordo.termoLidoEm ? 'Abrir de novo o termo' : 'Ler o termo de confissão de dívida'}</button>`}
    <label class="check"><input id="acordo-ciente" type="checkbox" checked=${ciente} onChange=${() => setCiente(!ciente)} /><span>Li e aceito as condições do acordo</span></label>
    <${Erro} texto=${erro} />
    <button type="button" class="btn primario bloco" onClick=${aceitar}>Aceitar acordo</button>
  </article>`;
}

function MeuAcordo({ estado, acordo, hoje }) {
  const p = progressoAcordo(estado, acordo);
  const pct = Math.round((p.pagas / p.total) * 100);
  return html`<article class="cartao">
    <div class="linha-entre"><strong>Meu acordo ${acordo.id}</strong><${EtqAcordo} situacao=${acordo.situacao} /></div>
    <small class="sub">${p.pagas} de ${p.total} parcelas pagas · total ${fmtReais(acordo.total)}</small>
    <div class="barra" role="progressbar" aria-label="Parcelas pagas" aria-valuenow=${p.pagas} aria-valuemin="0" aria-valuemax=${p.total}><span style=${`width:${pct}%`}></span></div>
    <details class="composicao"><summary>Cronograma</summary><${Cronograma} estado=${estado} acordo=${acordo} hoje=${hoje} /></details>
  </article>`;
}

// ---- src/ui/manutencao-sindico.js ----

const CORES_PRIORIDADE = { urgente: 'perigo', alta: 'alerta', normal: 'info', baixa: 'neutro' };
const CORES_STATUS_OS = { aberta: 'info', em_execucao: 'alerta', aguardando_material: 'neutro', aguardando_prestador: 'neutro', concluida: 'ok', validada: 'ok' };
const NOMES_STATUS_COMPRA = { solicitada: 'Aguardando aprovação', aprovada: 'Aprovada', recusada: 'Recusada', recebida: 'Recebida' };
const CORES_STATUS_COMPRA = { solicitada: 'alerta', aprovada: 'info', recusada: 'neutro', recebida: 'ok' };
const ABAS_MANUTENCAO = [['os', 'Ordens de serviço'], ['compras', 'Compras'], ['caixa', 'Caixa pequeno']];

function EtqPrioridade({ prioridade }) {
  return html`<${Etiqueta} tipo=${CORES_PRIORIDADE[prioridade]}>${PRIORIDADES[prioridade].nome}<//>`;
}

function EtqOS({ status }) {
  return html`<${Etiqueta} tipo=${CORES_STATUS_OS[status]}>${NOMES_STATUS_OS[status]}<//>`;
}

function EtqCompra({ status }) {
  return html`<${Etiqueta} tipo=${CORES_STATUS_COMPRA[status]}>${NOMES_STATUS_COMPRA[status]}<//>`;
}

function fmtPrazo(iso) {
  const d = new Date(iso);
  return `${fmtDataCurta(isoDia(d))} ${String(d.getHours()).padStart(2, '0')}h`;
}

function FotosOS({ os }) {
  return html`<div class="fotos-reparo"><${FotoFalsa} rotulo="Foto do antes" />${os.fotoDepois && html`<${FotoFalsa} rotulo="Foto do depois" />`}</div>`;
}

function SManutencao(props) {
  const { estado, rota } = props;
  if (!liberado(estado.plano, 'zelador')) {
    return html`<section><h1>Manutenção</h1><${Bloqueado} estado=${estado} recurso="zelador" titulo="Ordens de serviço, compras com aprovação e caixa pequeno do zelador" /></section>`;
  }
  const id = rota.id || '';
  const os = id.startsWith('OS-') ? estado.manutencao.os.find((o) => o.id === id) : null;
  const compra = id.startsWith('CP-') ? estado.manutencao.compras.find((c) => c.id === id) : null;
  const aba = compra ? 'compras' : os || id === 'novaos' ? 'os' : ABAS_MANUTENCAO.some(([a]) => a === id) ? id : 'os';
  let conteudo;
  if (os) conteudo = html`<${MDetalheOSSindico} key=${os.id} ...${props} os=${os} />`;
  else if (compra) conteudo = html`<${MDetalheCompraSindico} key=${compra.id} ...${props} compra=${compra} />`;
  else if (id === 'novaos') conteudo = html`<${MNovaOSSindico} ...${props} />`;
  else conteudo = { os: html`<${MListaOS} ...${props} />`, compras: html`<${MListaCompras} ...${props} />`, caixa: html`<${MCaixaSindico} ...${props} />` }[aba];
  return html`<section>
    <h1>Manutenção</h1>
    <p class="sub">Ordens de serviço e compras do zelador (${ZELADOR}). Cada compra recebida entra sozinha nas despesas do mês.</p>
    <nav class="chips" aria-label="Manutenção">${ABAS_MANUTENCAO.map(([a, nome]) => html`<a key=${a} class="chip" href=${`#sindico.manutencao.${a}`} aria-current=${aba === a ? 'page' : undefined}>${nome}</a>`)}</nav>
    ${conteudo}
  </section>`;
}

function MListaOS({ estado }) {
  const lista = listaOS(estado);
  return html`<div class="pilha">
    <div class="linha-entre"><h2>Ordens de serviço</h2><a class="btn primario" href="#sindico.manutencao.novaos">Nova OS</a></div>
    <div class="tabela-rolagem"><table class="tabela">
      <thead><tr><th>OS</th><th>Local</th><th>Prioridade</th><th>Responsável</th><th>Prazo</th><th>Status</th><th>Ação</th></tr></thead>
      <tbody>${lista.map((o) => html`<tr key=${o.id}>
        <td>${o.id}${o.notificacao ? html`<br /><small class="sub">${o.notificacao}</small>` : ''}</td>
        <td>${o.local}</td>
        <td><${EtqPrioridade} prioridade=${o.prioridade} /></td>
        <td>${o.responsavel === 'prestador' ? o.prestador : ZELADOR}</td>
        <td>${fmtPrazo(o.prazo)}</td>
        <td><${EtqOS} status=${o.status} /></td>
        <td><a class="btn-link" data-os=${o.id} href=${`#sindico.manutencao.${o.id}`}>Abrir</a></td>
      </tr>`)}</tbody>
    </table></div>
  </div>`;
}

function MNovaOSSindico({ executar }) {
  const [local, setLocal] = useState('');
  const [descricao, setDescricao] = useState('');
  const [prioridade, setPrioridade] = useState('normal');
  const [erro, setErro] = useState(null);

  function criar() {
    const r = executar((e) => abrirOS(e, { local, descricao, prioridade }, 'sindico', new Date()));
    if (r.erro) setErro(r.erro);
    else ir('sindico', 'manutencao', r.id);
  }

  return html`<div class="pilha formulario">
    <a class="voltar" href="#sindico.manutencao.os">‹ Ordens de serviço</a>
    <h2>Nova OS</h2>
    <${Campo} rotulo="Local"><input id="nova-os-local" value=${local} onInput=${(ev) => setLocal(ev.target.value)} placeholder="Ex.: casa de bombas, portão da garagem" /><//>
    <${Campo} rotulo="Descrição"><textarea id="nova-os-descricao" rows="3" value=${descricao} onInput=${(ev) => setDescricao(ev.target.value)}></textarea><//>
    <${Campo} rotulo="Prioridade"><select id="nova-os-prioridade" value=${prioridade} onChange=${(ev) => setPrioridade(ev.target.value)}>${ORDEM_PRIORIDADE.map((p) => html`<option key=${p} value=${p}>${PRIORIDADES[p].nome}</option>`)}</select><//>
    <${Erro} texto=${erro} />
    <button type="button" class="btn primario" onClick=${criar}>Criar OS</button>
  </div>`;
}

function MDetalheOSSindico({ executar, os }) {
  const [erro, setErro] = useState(null);
  const [mensagem, setMensagem] = useState(null);

  function validar() {
    const r = executar((e) => validarOS(e, os.id, 'sindico', new Date()));
    setErro(r.erro || null);
    setMensagem(r.erro ? null : 'OS validada.');
  }

  return html`<div class="pilha">
    <a class="voltar" href="#sindico.manutencao.os">‹ Ordens de serviço</a>
    <div class="linha-entre"><h2>${os.id} · ${os.local}</h2><${EtqOS} status=${os.status} /></div>
    <p class="sub"><${EtqPrioridade} prioridade=${os.prioridade} /> · prazo ${fmtPrazo(os.prazo)} · ${os.responsavel === 'prestador' ? `prestador ${os.prestador}` : `zelador ${ZELADOR}`}${os.notificacao ? html` · notificação <a href=${`#sindico.ocorrencias.${os.notificacao}`}>${os.notificacao}</a>` : ''}</p>
    <p class="texto-longo">${os.descricao}</p>
    <${FotosOS} os=${os} />
    ${(os.materiais || os.horas > 0 || os.observacoes) && html`<dl class="resumo">
      <dt>Materiais</dt><dd>${os.materiais || '—'}</dd>
      <dt>Horas</dt><dd>${String(os.horas).replace('.', ',')} h</dd>
      <dt>Observações</dt><dd>${os.observacoes || '—'}</dd>
    </dl>`}
    <h2>Linha do tempo</h2>
    <${LinhaTempo} linha=${os.linha} nomes=${NOMES_STATUS_OS} />
    ${os.status === 'concluida' && html`<button type="button" class="btn primario" data-acao="validar-os" onClick=${validar}>Validar</button>`}
    <${Erro} texto=${erro} />
    <${Sucesso} texto=${mensagem} />
  </div>`;
}

function MListaCompras({ estado }) {
  const ordem = { solicitada: 0, aprovada: 1, recebida: 2, recusada: 3 };
  const lista = [...estado.manutencao.compras].sort((a, b) => ordem[a.status] - ordem[b.status] || b.criadaEm.localeCompare(a.criadaEm));
  return html`<div class="pilha">
    <h2>Compras</h2>
    ${lista.length
      ? html`<div class="tabela-rolagem"><table class="tabela">
          <thead><tr><th>Compra</th><th>Item</th><th>Valor</th><th>Cotações</th><th>Status</th><th>Ação</th></tr></thead>
          <tbody>${lista.map((c) => html`<tr key=${c.id}>
            <td>${c.id}${c.urgente ? html` <${Etiqueta} tipo="perigo">Urgente<//>` : ''}</td>
            <td>${c.item}</td>
            <td>${fmtReais(c.valorFinal || c.valorEstimado)}</td>
            <td>${c.cotacoes.length}</td>
            <td><${EtqCompra} status=${c.status} /></td>
            <td><a class="btn-link" data-compra=${c.id} href=${`#sindico.manutencao.${c.id}`}>Abrir</a></td>
          </tr>`)}</tbody>
        </table></div>`
      : html`<${Vazio} texto="Nenhuma compra pedida." />`}
  </div>`;
}

function MDetalheCompraSindico({ estado, executar, compra }) {
  const [fornecedor, setFornecedor] = useState('');
  const [valor, setValor] = useState('');
  const [motivo, setMotivo] = useState('');
  const [erro, setErro] = useState(null);
  const [mensagem, setMensagem] = useState(null);
  const comCotacao = liberado(estado.plano, 'cotacoes');
  const minimo = cotacoesMinimas(compra.valorEstimado).minimo;

  function rodar(acao, sucesso, limpar) {
    const r = executar(acao);
    setErro(r.erro || null);
    setMensagem(r.erro ? null : sucesso);
    if (!r.erro && limpar) limpar();
  }

  return html`<div class="pilha">
    <a class="voltar" href="#sindico.manutencao.compras">‹ Compras</a>
    <div class="linha-entre"><h2>${compra.id} · ${compra.item}</h2><${EtqCompra} status=${compra.status} /></div>
    <dl class="resumo">
      <dt>Quantidade</dt><dd>${compra.quantidade}</dd>
      <dt>Valor estimado</dt><dd>${fmtReais(compra.valorEstimado)}</dd>
      <dt>Categoria</dt><dd>${CATEGORIAS_COMPRA[compra.categoria]}</dd>
      <dt>Motivo</dt><dd>${compra.motivo || '—'}</dd>
      <dt>OS</dt><dd>${compra.os ? html`<a href=${`#sindico.manutencao.${compra.os}`}>${compra.os}</a>` : '—'}</dd>
    </dl>
    <h2>Cotações${comCotacao ? ` · mínimo ${minimo}` : ''}</h2>
    ${compra.cotacoes.length
      ? html`<ul class="itens-sacola">${compra.cotacoes.map((q, n) => html`<li key=${n}><span>${q.fornecedor}</span><span>${fmtReais(q.valor)}</span></li>`)}</ul>`
      : html`<${Vazio} texto="Nenhuma cotação anexada." />`}
    ${comCotacao && compra.status === 'solicitada' && html`<div class="edicao-anuncio">
      <${Campo} rotulo="Fornecedor"><input id="cotacao-fornecedor" value=${fornecedor} onInput=${(ev) => setFornecedor(ev.target.value)} /><//>
      <${Campo} rotulo="Valor (R$)"><input id="cotacao-valor" inputmode="decimal" value=${valor} onInput=${(ev) => setValor(ev.target.value)} /><//>
    </div>
    <button type="button" class="btn secundario" onClick=${() => rodar((e) => anexarCotacao(e, compra.id, { fornecedor, valor: lerPreco(valor) }, 'sindico'), 'Cotação anexada.', () => { setFornecedor(''); setValor(''); })}>Anexar cotação</button>`}
    ${compra.status === 'solicitada' && html`<div class="cartao">
      <div class="acoes"><button type="button" class="btn primario" data-acao="aprovar-compra" onClick=${() => rodar((e) => aprovarCompra(e, compra.id, 'sindico', new Date()), 'Compra aprovada.')}>Aprovar</button></div>
      <${Campo} rotulo="Motivo da recusa"><input id="compra-motivo-recusa" value=${motivo} onInput=${(ev) => setMotivo(ev.target.value)} /><//>
      <div class="acoes"><button type="button" class="btn secundario" onClick=${() => rodar((e) => recusarCompra(e, compra.id, motivo, 'sindico'), 'Compra recusada.')}>Recusar</button></div>
    </div>`}
    ${compra.status === 'recusada' && html`<p class="sub">Recusada: ${compra.motivoRecusa}</p>`}
    ${compra.status === 'recebida' && html`<p class="sucesso">Recebida em ${fmtDataHora(compra.recebidaEm)} · ${fmtReais(compra.valorFinal)} · nota ${compra.nota || '—'} · lançada em despesas</p>`}
    <${Erro} texto=${erro} />
    <${Sucesso} texto=${mensagem} />
  </div>`;
}

function ResumoCaixa({ caixa }) {
  return html`<div class="pilha">
    <div class="cartao"><span class="sub">Saldo do caixa pequeno</span><span class="preco grande">${fmtReais(caixa.saldo)}</span><small class="sub">Fundo de ${fmtReais(caixa.fundo)} por mês · gastos até R$ 200,00 com foto do cupom</small></div>
    ${caixa.gastos.length
      ? html`<ul class="itens-sacola">${[...caixa.gastos].reverse().map((g) => html`<li key=${g.id}><span>${g.descricao} · ${fmtDataHora(g.em)} · cupom anexado</span><span>${fmtReais(g.valor)}</span></li>`)}</ul>`
      : html`<${Vazio} texto="Nenhum gasto no mês." />`}

}

function MCaixaSindico({ estado, executar }) {
  const [erro, setErro] = useState(null);
  const [mensagem, setMensagem] = useState(null);
  if (!liberado(estado.plano, 'caixaPequeno')) return html`<${Bloqueado} estado=${estado} recurso="caixaPequeno" titulo="Caixa pequeno do zelador com cupom, saldo e reposição" />`;

    <${Erro} texto=${erro} />
    <${Sucesso} texto=${mensagem} />
  </div>`;
}

// ---- src/ui/escala-sindico.js ----

const ABAS_ESCALA = [['calendario', 'Calendário'], ['pendencias', 'Pendências'], ['equipe', 'Equipe'], ['horas', 'Horas']];

function horaCurta(local) {
  return `${Number(local.slice(11, 13))}h`;
}

function nomeOuDescoberto(t) {
  return t.porteiro ? porteiroPorId(t.porteiro).nome : `Descoberto · ${NOMES_MOTIVO[t.motivoDescoberto] || 'sem porteiro'}`;
}

function SEscala(props) {
  const { estado, rota } = props;
  if (!liberado(estado.plano, 'escala')) {
    return html`<section><h1>Escala</h1><${Bloqueado} estado=${estado} recurso="escala" titulo="Escala de porteiros com trocas, faltas e cobertura" /></section>`;
  }
  const aba = ABAS_ESCALA.some(([id]) => id === rota.id) ? rota.id : 'calendario';
  const Conteudo = { calendario: ECalendario, pendencias: EPendencias, equipe: EEquipe, horas: EHoras }[aba];
  return html`<section>
    <h1>Escala</h1>
    <p class="sub">Escala dos porteiros por posto. Trocas e faltas chegam aqui para aprovação; o sistema avisa (não bloqueia) quando o descanso entre turnos fica abaixo de 11 h.</p>
    <nav class="chips" aria-label="Escala">${ABAS_ESCALA.map(([id, nome]) => html`<a key=${id} class="chip" href=${`#sindico.escala.${id}`} aria-current=${aba === id ? 'page' : undefined}>${nome}</a>`)}</nav>
    <${Conteudo} ...${props} />
  </section>`;
}

function ECalendario({ estado, executar, agora }) {
  const atual = mesAtual(agora);
  const meses = [atual, somarMes(atual, 1)];
  const [mes, setMes] = useState(atual);
  const [posto, setPosto] = useState('portaria');
  const [editando, setEditando] = useState(null);
  const [erro, setErro] = useState(null);
  const [mensagem, setMensagem] = useState(null);
  const m = estado.escala.meses[mes];
  const hoje = isoDia(agora);

  function rodar(acao, sucesso) {
    const r = executar(acao);
    setErro(r.erro || r.alerta || null);
    setMensagem(r.erro ? null : sucesso);
    return r;
  }

  const seletores = html`<div class="edicao-anuncio">
    <${Campo} rotulo="Mês"><select id="escala-mes" value=${mes} onChange=${(ev) => { setMes(ev.target.value); setEditando(null); }}>${meses.map((x) => html`<option key=${x} value=${x}>${nomeDoMesEscala(x)}</option>`)}</select><//>
    <${Campo} rotulo="Posto"><select id="escala-posto" value=${posto} onChange=${(ev) => { setPosto(ev.target.value); setEditando(null); }}>${Object.entries(POSTOS).map(([id, p]) => html`<option key=${id} value=${id}>${p.nome}</option>`)}</select><//>
  </div>`;

  if (!m) {
    return html`<div class="pilha">
      ${seletores}
      <p class="sub">A escala de ${nomeDoMesEscala(mes)} ainda não foi gerada. Ela é montada a partir dos modelos de turno de cada porteiro e já considera as férias.</p>
      <button type="button" class="btn primario" data-acao="gerar-escala" onClick=${() => rodar((e) => gerarEscala(e, mes, 'sindico'), `Escala de ${nomeDoMesEscala(mes)} gerada em rascunho.`)}>Gerar escala de ${nomeDoMesEscala(mes)}</button>
      <${Erro} texto=${erro} />
    </div>`;
  }

  const lista = buracos(estado, mes, posto);
  const descanso = descansoInsuficiente(estado, mes);
  const feriados = Object.fromEntries(feriadosDoMes(mes).map((f) => [f.dia, f.nome]));
  const turnos = m.turnos.filter((t) => t.posto === posto);
  const podeCobrir = PORTEIROS.filter((p) => p.postos.includes(posto));

  return html`<div class="pilha">
    ${seletores}
    <div class="linha-entre">
      <p class="sub">${lista.length} buracos de cobertura · ${descanso.length} alertas de descanso · ${m.situacao === 'publicada' ? `publicada em ${fmtDataCurta(m.publicadaEm.slice(0, 10))}` : 'rascunho'}</p>
      ${m.situacao === 'rascunho' && html`<button type="button" class="btn primario" data-acao="publicar-escala" onClick=${() => rodar((e) => publicarEscala(e, mes, 'sindico', new Date()), 'Escala publicada.')}>Publicar escala</button>`}
    </div>
    <${Erro} texto=${erro} />
    <${Sucesso} texto=${mensagem} />
    <div class="grade-escala">${diasDoMes(mes).map((dia) => html`<div key=${dia} class=${`dia-escala${dia === hoje ? ' hoje' : ''}`}>
      <span class="dia-escala-data">${fmtDia(dia)}${feriados[dia] ? html` <${Etiqueta} tipo="info">${feriados[dia]}<//>` : ''}${dia === hoje ? html` <${Etiqueta} tipo="alerta">hoje<//>` : ''}</span>
      <span class="dia-escala-turnos">
        ${turnos.filter((t) => t.inicio.startsWith(dia)).map((t) => html`<span key=${t.id} class=${`turno-escala${t.porteiro ? '' : ' descoberto'}`}>
          <button type="button" class="btn-link" data-turno=${t.id} onClick=${() => setEditando(editando === t.id ? null : t.id)}>${nomeOuDescoberto(t)}</button>
          <small>${horaCurta(t.inicio)}–${horaCurta(t.fim)}</small>${t.trocado ? html` <${Etiqueta}>troca<//>` : ''}
          ${editando === t.id && html`<select aria-label="Trocar porteiro" value=${t.porteiro || ''} onChange=${(ev) => { rodar((e) => ajustarTurno(e, t.id, ev.target.value || null, 'sindico'), 'Turno ajustado.'); setEditando(null); }}>
            <option value="">Ninguém (descoberto)</option>
            ${podeCobrir.map((p) => html`<option key=${p.id} value=${p.id}>${p.nome}</option>`)}
          </select>`}
        </span>`)}
        ${lista.filter((b) => b.inicio.startsWith(dia)).map((b) => html`<span key=${b.inicio} class="buraco-escala">${horaCurta(b.inicio)}–${horaCurta(b.fim)} sem ninguém</span>`)}
      </span>
    </div>`)}</div>
  </div>`;
}

function EPendencias({ estado, executar, agora }) {
  const [erro, setErro] = useState(null);
  const [mensagem, setMensagem] = useState(null);
  const atual = instanteLocal(agora);
  const trocas = estado.escala.trocas.filter((x) => x.situacao === 'aceita');
  const descobertos = todosTurnos(estado).filter((t) => !t.porteiro && t.fim > atual).sort((a, b) => a.inicio.localeCompare(b.inicio)).slice(0, 8);

  function rodar(acao, sucesso) {
    const r = executar(acao);
    setErro(r.erro || r.alerta || null);
    setMensagem(r.erro ? null : sucesso);
  }

  return html`<div class="pilha">
    <h2>Trocas aguardando aprovação</h2>
    ${trocas.length
      ? html`<ul class="m-lista">${trocas.map((x) => {
          const t = acharTurno(estado, x.turno);
          return html`<li key=${x.id} class="cartao">
            <strong>${porteiroPorId(x.de).nome} → ${porteiroPorId(x.para).nome}</strong>
            <small class="sub">${x.id} · ${POSTOS[t.posto].nome} · ${fmtTurno(t)} · o colega já aceitou</small>
            <div class="acoes">

function responsavelDaPessoa(estado, eu) {
  const responsavel = estado.financeiro.unidades[eu].responsavel;
  const pessoa = pessoaDaUnidade(estado, eu);
  return { responsavel, souResponsavel: !!responsavel && !!pessoa && responsavel.nome === pessoa.nome };
}

function cobrancasDaUnidade(estado, eu, hoje) {
  const minhas = estado.financeiro.cobrancas.filter((c) => c.unidade === eu);
  const todas = minhas.filter((c) => c.status === 'aberta').sort((a, b) => a.vencimento.localeCompare(b.vencimento));
  // Do acordo, só as vencidas ou, se nenhuma venceu, a próxima: o cronograma completo fica em "Meu acordo".
  const comVencida = new Set(todas.filter((c) => c.acordo && c.vencimento < hoje).map((c) => c.acordo.id));
  const vistos = new Set();
  const abertas = todas.filter((c) => {
    if (!c.acordo || c.vencimento < hoje) return true;
    if (comVencida.has(c.acordo.id) || vistos.has(c.acordo.id)) return false;
    vistos.add(c.acordo.id);
    return true;
  });
  return {
    abertas,
    pagas: minhas.filter((c) => c.status === 'paga').sort((a, b) => b.pagaEm.localeCompare(a.pagaEm)),
    substituidas: minhas.filter((c) => c.status === 'cancelada' && c.substituidaPor),
  };
}

function nomeAbreviado(nome) {
  const partes = nome.split(' ');
  return `${partes[0]} ${partes[partes.length - 1][0]}.`;
}

function linhaDigitavel(cobranca, total) {
  const n = cobranca.id.replace(/\D/g, '').padEnd(12, '0').slice(0, 12);
  return `34191.${n.slice(0, 5)} ${n.slice(5, 10)}.${n.slice(10)}0001 23456.789012 1 ${String(total).padStart(10, '0')}`;
}

function CartaoCobrancaInicio({ estado, eu, agora }) {
  const hoje = isoDia(agora);
  if (!responsavelDaPessoa(estado, eu).souResponsavel) return null;
  const proposta = propostaPendente(estado, eu);
  if (proposta) return html`<a class="cartao link cobranca-inicio" href="#morador.financeiro"><strong>Proposta de acordo do síndico</strong><span class="preco grande">${fmtReais(proposta.total)}</span><small class="sub">${proposta.entrada ? `Entrada de ${fmtReais(proposta.entrada)} + ` : ''}${proposta.parcelas} parcelas · toque para ver e aceitar</small><span class="btn primario">Ver proposta</span></a>`;
  const { abertas } = cobrancasDaUnidade(estado, eu, hoje);
  if (!abertas.length) return html`<a class="cartao link" href="#morador.financeiro"><strong>Financeiro em dia</strong><span class="sub">Nenhuma cobrança em aberto.</span></a>`;
  const c = abertas[0];
  const situacao = situacaoCobranca(c, hoje);
  const v = valorAtualizado(c, estado.financeiro.parametros, hoje);
  return html`<a class=${`cartao link cobranca-inicio${situacao === 'vencida' ? ' vencida' : ''}`} href="#morador.financeiro">
    <div class="linha-entre"><strong>${c.acordo ? `Sua cobrança: ${rotuloCobranca(c)}` : `Sua cobrança de ${mesExtenso(c.competencia)}`}</strong><${EtqCobranca} situacao=${situacao} /></div>
    <span class="preco grande">${fmtReais(v.total)}</span>
    <small class="sub">${situacao === 'vencida' ? `Venceu em ${fmtDataCurta(c.vencimento)} · valor com multa e juros` : `Vence em ${fmtDataCurta(c.vencimento)}`}</small>
    <span class="btn primario">Pagar</span>
  </a>`;
}

function CartaoCobranca({ estado, cobranca, executar, hoje }) {
  const fin = estado.financeiro;
  const [forma, setForma] = useState(null);
  const [mensagem, setMensagem] = useState(null);
  const situacao = situacaoCobranca(cobranca, hoje);
  const v = valorAtualizado(cobranca, fin.parametros, hoje);
  const copiaECola = `00020126580014BR.GOV.BCB.PIX0136${cobranca.id}5204000053039865406${(v.total / 100).toFixed(2)}5802BR`;
  const formas = [['pix', 'Pagar com Pix'], ['boleto', 'Boleto'], ['cartao', 'Cartão']].filter(([k]) => fin.parametros.formas.includes(k));

  function copiar() {
    const campo = document.getElementById(`pix-${cobranca.id}`);
    const selecionar = () => {
      campo.select();
      setMensagem('Selecione e copie o código acima.');
    };
    if (!navigator.clipboard) {
      selecionar();
      return;
    }
    navigator.clipboard.writeText(copiaECola).then(() => setMensagem('Código Pix copiado.')).catch(selecionar);
  }

  function confirmar() {
    const r = executar((e) => confirmarPagamentoAsaas(e, cobranca.id, `evt-${cobranca.id}-${forma}`, forma, new Date()));
    if (r.erro) setMensagem(r.erro);
  }

  return html`<article class=${`cartao cobranca${situacao === 'vencida' ? ' vencida' : ''}`}>
    <div class="linha-entre"><strong>${rotuloCobranca(cobranca)}</strong><${EtqCobranca} situacao=${situacao} /></div>
    <span class="preco grande">${fmtReais(v.total)}</span>
    <small class="sub">${situacao === 'vencida'
      ? `Venceu em ${fmtDataCurta(cobranca.vencimento)} · ${fmtReais(cobranca.valor)} + multa ${fmtReais(v.multa)} + juros ${fmtReais(v.juros)} (${v.dias} dias)`
      : `Vence em ${fmtDataCurta(cobranca.vencimento)}`}</small>
    <details class="composicao"><summary>Composição</summary>
      <ul class="itens-sacola">${cobranca.itens.map((i, n) => html`<li key=${n}><span>${i.descricao}</span><span>${fmtReais(i.valor)}</span></li>`)}</ul>
    </details>
    <div class="acoes" role="group" aria-label="Forma de pagamento">
      ${formas.map(([k, nome]) => html`<button type="button" key=${k} class=${forma === k ? 'btn primario' : 'btn secundario'} aria-pressed=${forma === k} onClick=${() => { setForma(k); setMensagem(null); }}>${nome}</button>`)}
    </div>
    ${forma === 'pix' && html`<div class="pagamento">
      <${QrFalso} texto=${cobranca.id} tamanho=${120} />
      <label class="campo"><span>Pix copia e cola</span><input id=${`pix-${cobranca.id}`} readonly value=${copiaECola} /></label>
      <button type="button" class="btn secundario" onClick=${copiar}>Copiar código</button>
    </div>`}
    ${forma === 'boleto' && html`<div class="pagamento">
      <label class="campo"><span>Linha digitável</span><input id=${`boleto-${cobranca.id}`} readonly value=${linhaDigitavel(cobranca, v.total)} /></label>
      <small class="sub">O PDF do boleto chega por e-mail e WhatsApp.</small>
    </div>`}
    ${forma === 'cartao' && html`<div class="pagamento"><small class="sub">O cartão é pago na página segura do Asaas (simulada no protótipo).</small></div>`}
    ${forma && html`<button type="button" class="btn primario bloco" onClick=${confirmar}>Simular confirmação do Asaas</button>`}
    <${Sucesso} texto=${mensagem} />
    <button type="button" class="btn-link" onClick=${() => setMensagem(`2ª via gerada com valor atualizado: ${fmtReais(v.total)}.`)}>Gerar 2ª via</button>
  </article>`;
}

function MFinanceiro({ estado, eu, executar, agora }) {
  const hoje = isoDia(agora);
  const [documento, setDocumento] = useState(null);
  const { responsavel, souResponsavel } = responsavelDaPessoa(estado, eu);
  const pessoa = pessoaDaUnidade(estado, eu);
  if (documento) return html`<section class="m-pagina"><${PrevDoc} documento=${documento} aoFechar=${() => setDocumento(null)} /></section>`;
  if (!souResponsavel) {
    return html`<section class="m-pagina">
      <h1 class="m-titulo">Financeiro</h1>
      <div class="cartao">
        <strong>As cobranças do apto ${eu} vão para o responsável financeiro</strong>
        <span>${responsavel ? `${nomeAbreviado(responsavel.nome)} (${NOMES_RELACAO[responsavel.relacao]})` : 'Responsável ainda não cadastrado'}</span>
        <small class="sub">Se isso mudou, avise o síndico.</small>
      </div>
    </section>`;
  }
  const { abertas, pagas, substituidas } = cobrancasDaUnidade(estado, eu, hoje);
  const proposta = propostaPendente(estado, eu);
  const ativo = acordoAtivo(estado, eu);
  const vencidaSemAcordo = abertas.some((c) => !c.acordo && situacaoCobranca(c, hoje) === 'vencida');
  const ano = hoje.slice(0, 4);
  const recibo = (c) => ({ titulo: `Recibo · ${rotuloCobranca(c)} · apto ${eu}`, pasta: 'Financeiro', versoes: [{ versao: 1, data: isoDia(new Date(c.pagaEm)) }] });
  const temVencida = abertas.some((c) => situacaoCobranca(c, hoje) === 'vencida');
  return html`<section class="m-pagina">
    <h1 class="m-titulo">Financeiro</h1>
    <p class="m-sub">Responsável financeiro: ${responsavel.nome} · ${pessoa && pessoa.naoResidente ? 'proprietário não residente' : `apto ${eu}`}</p>
    ${proposta && html`<${PropostaAcordo} key=${proposta.id} estado=${estado} executar=${executar} acordo=${proposta} hoje=${hoje} eu=${eu} />`}
    ${ativo && html`<${MeuAcordo} estado=${estado} acordo=${ativo} hoje=${hoje} />`}
    <h2>Em aberto</h2>
    ${abertas.length
      ? abertas.map((c) => html`<${CartaoCobranca} key=${c.id} estado=${estado} cobranca=${c} executar=${executar} hoje=${hoje} />`)
      : html`<${Vazio} texto="Nenhuma cobrança em aberto. Tudo em dia!" />`}
    ${!proposta && !ativo && vencidaSemAcordo && html`<small class="sub">Quer parcelar? Fale com o síndico para propor um acordo.</small>`}
    <h2>Histórico</h2>
    ${pagas.length || substituidas.length
      ? html`<ul class="m-lista">${pagas.map((c) => html`<li key=${c.id} class="cartao">
          <div class="linha-entre"><strong>${rotuloCobranca(c)}</strong><span>${fmtReais(c.valorPago)}</span></div>
          <small class="sub">Pago em ${fmtDataCurta(isoDia(new Date(c.pagaEm)))} · ${NOMES_FORMA[c.forma]}</small>
          <button type="button" class="btn-link" onClick=${() => setDocumento(recibo(c))}>Ver recibo</button>
        </li>`)}
          ${substituidas.map((c) => html`<li key=${c.id} class="cartao"><div class="linha-entre"><strong>${nomeMes(c.competencia)}</strong><${EtqCobranca} situacao="cancelada" /></div><small class="sub">Substituída pelo acordo ${c.substituidaPor}</small></li>`)}</ul>`
      : html`<${Vazio} texto="Nenhum pagamento registrado." />`}
    ${temVencida
      ? html`<small class="sub">A declaração de quitação fica disponível quando não houver débitos vencidos.</small>`
      : html`<button type="button" class="btn secundario" onClick=${() => setDocumento({ titulo: `Declaração anual de quitação de débitos ${ano} · apto ${eu}`, pasta: 'Financeiro', versoes: [{ versao: 1, data: hoje }] })}>Declaração de quitação ${ano}</button>`}
  </section>`;
}

}

function TelaVendas(props) {
  const { estado, rota, eu } = props;
  const id = rota.id;
  const pessoa = pessoaDaUnidade(estado, eu);
  const naSacola = estado.sacola.reduce((soma, i) => soma + i.quantidade, 0);
  let conteudo;
  let aba = 'vitrine';
  if (id === 'sacola') {
    conteudo = html`<${VSacola} ...${props} />`;
    aba = 'sacola';
  } else if (id === 'pedidos') {
    conteudo = html`<${VMeusPedidos} ...${props} />`;
    aba = 'pedidos';
  } else if (id === 'loja' || id === 'novo-anuncio') {
    conteudo = id === 'loja' ? html`<${VLoja} ...${props} />` : html`<${VNovoAnuncio} ...${props} />`;
    aba = 'loja';
  } else if (id && id.startsWith('PD-')) {
    const pedido = estado.pedidos.find((p) => p.id === id && (p.comprador === eu || p.vendedor === eu));
    conteudo = pedido ? html`<${VPedido} key=${pedido.id} ...${props} pedido=${pedido} />` : html`<${Vazio} texto="Pedido não encontrado." />`;
    aba = pedido && pedido.vendedor === eu ? 'loja' : 'pedidos';
  } else if (id && anuncioPorId(estado, id)) {
    conteudo = html`<${VAnuncio} key=${id} ...${props} anuncio=${anuncioPorId(estado, id)} />`;
  } else {
    conteudo = html`<${VVitrine} ...${props} />`;
  }
  const links = [['vitrine', 'Vitrine', '#morador.vendas'], ['pedidos', 'Meus pedidos', '#morador.vendas.pedidos'], ['loja', pessoa.vendedor === 'aprovado' ? 'Minha loja' : 'Vender', '#morador.vendas.loja']];
  return html`<section class="m-pagina">
    <h1 class="m-titulo">Vendas</h1>
    <nav class="vendas-nav" aria-label="Vendas">
      ${links.map(([chave, nome, href]) => html`<a key=${chave} href=${href} class=${aba === chave ? 'ativa' : ''} aria-current=${aba === chave ? 'page' : undefined}>${nome}</a>`)}
      <a class=${`sacola${aba === 'sacola' ? ' ativa' : ''}`} href="#morador.vendas.sacola" aria-label=${`Sacola com ${naSacola} ${naSacola === 1 ? 'item' : 'itens'}`}><${Icone} nome="sacola" tamanho=${20} />${naSacola}</a>
    </nav>
    ${conteudo}
  </section>`;
}

function VAnuncio({ estado, eu, executar, anuncio }) {
  const [quantidade, setQuantidade] = useState('1');
  const [erro, setErro] = useState(null);
  const [adicionado, setAdicionado] = useState(false);
  const proprio = anuncio.vendedor === eu;

  function adicionar() {
    const r = executar((e) => adicionarASacola(e, anuncio.id, Number(quantidade)));

    setAdicionado(!r.erro);
  }

  return html`<div class="pilha">
    <a class="voltar" href="#morador.vendas">‹ Vitrine</a>
    <${FotoProduto} categoria=${anuncio.categoria} />
    <p class="anuncio-titulo">${anuncio.titulo}</p>
