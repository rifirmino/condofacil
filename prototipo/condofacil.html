    </div>
    <div class="p-coluna">
      ${foto ? html`<${FotoFalsa} rotulo="Foto do volume e da etiqueta" />` : html`<button type="button" class="btn grande secundario" onClick=${() => setFoto(true)}>Fotografar volume</button>`}
      <${Erro} texto=${erro} />
      <button type="button" class="btn grande primario" disabled=${!numero || !transportadora} onClick=${registrar}>Registrar encomenda</button>
      ${registrada && html`<div class="cartao confirmacao" role="status" data-codigo=${registrada.codigo}>
        <strong>Encomenda registrada para o apto ${registrada.unidade}</strong>
        <span>Código de retirada: <b>${registrada.codigo}</b></span>
        <span>Morador avisado por WhatsApp com a foto.</span>
      </div>`}
    </div>
  </section>`;
}

function PEntregar({ estado, executar, agora }) {
  const [busca, setBusca] = useState('');
  const [selecionada, setSelecionada] = useState(null);
  const [codigo, setCodigo] = useState('');
  const [nome, setNome] = useState('');
  const [erro, setErro] = useState(null);
  const [entregue, setEntregue] = useState(null);
  const [lido, setLido] = useState(null);
  const termo = busca.trim();
  const lista = estado.encomendas
    .filter((e) => e.status === 'aguardando' && (!termo || e.unidade.includes(termo) || e.codigo === termo))
    .sort((a, b) => a.chegadaEm.localeCompare(b.chegadaEm));
  const encomenda = selecionada && estado.encomendas.find((e) => e.id === selecionada && e.status === 'aguardando');

  function escolher(id) {
    setSelecionada(id);
    setCodigo('');
    setNome('');
    setErro(null);
    setEntregue(null);
    setLido(null);
    // No celular o painel de entrega fica abaixo da lista: leva o porteiro até ele.
    setTimeout(() => {
      const painel = document.getElementById('painel-entrega');
      const reduzir = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (painel) painel.scrollIntoView({ behavior: reduzir ? 'auto' : 'smooth', block: 'start' });
    }, 0);
  }

  function escanear() {
    setCodigo(encomenda.codigo);
    setLido(`QR lido: código ${encomenda.codigo} (leitura simulada no protótipo)`);
  }

  function confirmar() {
    const r = executar((e) => entregarEncomenda(e, { id: encomenda.id, codigo, nome }, new Date()));
    if (r.erro) {
      setErro(r.erro);
      return;
    }
    setEntregue(`Entrega registrada: apto ${encomenda.unidade}, retirada por ${nome.trim()}.`);
    setSelecionada(null);
    setBusca('');
  }

  return html`<section class="p-grade">
    <div class="p-coluna">
      <${Campo} rotulo="Buscar por código ou unidade"><input id="portaria-busca" class="entrada-grande" inputmode="numeric" value=${busca} onInput=${(ev) => setBusca(ev.target.value)} placeholder="Ex.: 302 ou 481203" /><//>
      ${entregue && html`<p class="sucesso" role="status">${entregue}</p>`}
      <ul class="lista-encomendas">
        ${lista.length
          ? lista.map((e) => html`<li key=${e.id}><button type="button" class=${`item-encomenda${e.id === selecionada ? ' sel' : ''}`} onClick=${() => escolher(e.id)}>
              <strong>Apto ${e.unidade}</strong>
              <span>${e.transportadora} · chegou ${haQuanto(e.chegadaEm, agora)}</span>
              ${encomendaParada(e, agora) && html`<${Etiqueta} tipo="perigo">Parada<//>`}
            </button></li>`)
          : html`<li><${Vazio} texto="Nenhuma encomenda aguardando." /></li>`}
      </ul>
    </div>
    <div class="p-coluna">
      ${encomenda
        ? html`<div class="cartao" id="painel-entrega">
            <h2>Entregar: apto ${encomenda.unidade} · ${encomenda.transportadora}</h2>
            <${Campo} rotulo="Código de retirada"><input id="portaria-codigo" class="entrada-grande" inputmode="numeric" maxlength="6" value=${codigo} onInput=${(ev) => setCodigo(ev.target.value)} /><//>
            <button type="button" class="btn secundario" onClick=${escanear}>Escanear QR do morador</button>
            ${lido && html`<p class="dica-ocr" role="status">${lido}</p>`}
            <${Campo} rotulo="Quem retirou"><input id="portaria-quem" class="entrada-grande" value=${nome} onInput=${(ev) => setNome(ev.target.value)} /><//>
            <div class="sugestoes">${moradoresDaUnidade(estado, encomenda.unidade).map((m) => html`<button type="button" key=${m.id} class="btn secundario" onClick=${() => setNome(m.nome)}>${m.nome}</button>`)}</div>
            <${Erro} texto=${erro} />
            <button type="button" class="btn grande primario" onClick=${confirmar}>Confirmar entrega</button>
          </div>`
        : html`<${Vazio} texto="Escolha uma encomenda na lista." />`}
    </div>
  </section>`;
}

function PReservasHoje({ estado, agora }) {
  const hoje = isoDia(agora);
  const lista = estado.reservas.filter((r) => r.data === hoje && r.status === 'confirmada').sort((a, b) => a.inicio - b.inicio);
  return html`<section>
    <h1>Reservas de hoje</h1>
    ${lista.length
      ? html`<div class="grade-cartoes">${lista.map((r) => html`<article key=${r.id} class="cartao">
          <h3>${areaPorId(estado, r.areaId).nome}</h3>
          <p class="sub">${fmtHora(r.inicio)}–${fmtHora(r.fim)} · Apto ${r.unidade}</p>
          <p class="rotulo">Convidados (${r.convidados.length})</p>
          ${r.convidados.length
            ? html`<ul class="convidados">${r.convidados.map((c, i) => html`<li key=${i}>${c.nome} <small>${c.documento}</small></li>`)}</ul>`
            : html`<${Vazio} texto="Sem lista de convidados." />`}
        </article>`)}</div>`
      : html`<${Vazio} texto="Nenhuma reserva confirmada para hoje." />`}
  </section>`;
}

// ---- src/ui/vendas.js ----

const ETQ_PEDIDO = { novo: 'alerta', aceito: 'info', entregue: 'ok', recusado: 'perigo', cancelado: 'neutro' };
const ROTULOS_ACAO_PEDIDO = { aceitar: 'Aceitar pedido', recusar: 'Recusar', entregar: 'Marcar como entregue', pago: 'Marcar como pago', cancelar: 'Cancelar pedido' };
const PERIODOS_PAINEL = [['7d', 'Últimos 7 dias'], ['30d', 'Últimos 30 dias'], ['mes', 'Este mês']];

function EtqPedido({ status }) {
  return html`<${Etiqueta} tipo=${ETQ_PEDIDO[status]}>${NOMES_STATUS_PEDIDO[status]}<//>`;
}

function FotoProduto({ categoria }) {
  return html`<div class="foto-produto" role="img" aria-label=${`Foto simulada: ${CATEGORIAS_VENDA[categoria]}`}><${Icone} nome="etiqueta" tamanho=${26} /><span>${CATEGORIAS_VENDA[categoria]}</span></div>`;
}

function CartaoAnuncio({ estado, anuncio, eu }) {
  return html`<a class="cartao link anuncio" href=${`#morador.vendas.${anuncio.id}`}>
    <${FotoProduto} categoria=${anuncio.categoria} />
    <strong>${anuncio.titulo}</strong>
    <span class="preco">${fmtCentavos(anuncio.preco)}</span>
    ${anuncio.quantidade ? html`<small class="sub">Restam ${anuncio.quantidade}</small>` : html`<${Etiqueta} tipo="perigo">Esgotado<//>`}
    <small class="sub">${anuncio.vendedor === eu ? 'Seu anúncio' : `${nomeVizinho(estado, anuncio.vendedor)} · apto ${anuncio.vendedor}`}</small>
  </a>`;
}

function TelaVendas(props) {
  const { estado, rota, eu } = props;
  const id = rota.id;
  const pessoa = pessoaDaUnidade(estado, eu);
  const naSacola = estado.sacola.reduce((soma, i) => soma + i.quantidade, 0);
  let conteudo;
  let aba = 'vitrine';
  if (id === 'sacola') {
    conteudo = html`<${VSacola} ...${props} />`;
    aba = 'sacola';
  } else if (id === 'pedidos') {
    conteudo = html`<${VMeusPedidos} ...${props} />`;
    aba = 'pedidos';
  } else if (id === 'loja' || id === 'novo-anuncio') {
    conteudo = id === 'loja' ? html`<${VLoja} ...${props} />` : html`<${VNovoAnuncio} ...${props} />`;
    aba = 'loja';
  } else if (id && id.startsWith('PD-')) {
    const pedido = estado.pedidos.find((p) => p.id === id && (p.comprador === eu || p.vendedor === eu));
    conteudo = pedido ? html`<${VPedido} key=${pedido.id} ...${props} pedido=${pedido} />` : html`<${Vazio} texto="Pedido não encontrado." />`;
    aba = pedido && pedido.vendedor === eu ? 'loja' : 'pedidos';
  } else if (id && anuncioPorId(estado, id)) {
    conteudo = html`<${VAnuncio} key=${id} ...${props} anuncio=${anuncioPorId(estado, id)} />`;
  } else {
    conteudo = html`<${VVitrine} ...${props} />`;
  }
  const links = [['vitrine', 'Vitrine', '#morador.vendas'], ['pedidos', 'Meus pedidos', '#morador.vendas.pedidos'], ['loja', pessoa.vendedor === 'aprovado' ? 'Minha loja' : 'Vender', '#morador.vendas.loja']];
  return html`<section class="m-pagina">
    <h1 class="m-titulo">Vendas</h1>
    <nav class="vendas-nav" aria-label="Vendas">
      ${links.map(([chave, nome, href]) => html`<a key=${chave} href=${href} class=${aba === chave ? 'ativa' : ''} aria-current=${aba === chave ? 'page' : undefined}>${nome}</a>`)}
      <a class=${`sacola${aba === 'sacola' ? ' ativa' : ''}`} href="#morador.vendas.sacola" aria-label=${`Sacola com ${naSacola} ${naSacola === 1 ? 'item' : 'itens'}`}><${Icone} nome="sacola" tamanho=${20} />${naSacola}</a>
    </nav>
    ${conteudo}
  </section>`;
}

function VVitrine({ estado, eu }) {
  const [categoria, setCategoria] = useState('todas');
  const [busca, setBusca] = useState('');
  const termo = busca.trim().toLowerCase();
  const lista = anunciosVisiveis(estado).filter((a) => (categoria === 'todas' || a.categoria === categoria) && (!termo || `${a.titulo} ${a.descricao}`.toLowerCase().includes(termo)));
  return html`<div class="pilha">
    <${Campo} rotulo="Buscar na vitrine"><input id="vitrine-busca" type="search" value=${busca} onInput=${(ev) => setBusca(ev.target.value)} placeholder="Ex.: brigadeiro, bicicleta" /><//>
    <div class="chips" role="group" aria-label="Categoria">
      ${[['todas', 'Todas'], ...Object.entries(CATEGORIAS_VENDA)].map(([chave, nome]) => html`<button type="button" key=${chave} class="chip" aria-pressed=${categoria === chave} onClick=${() => setCategoria(chave)}>${nome}</button>`)}
    </div>
    ${lista.length
      ? html`<ul class="anuncios">${lista.map((a) => html`<li key=${a.id}><${CartaoAnuncio} estado=${estado} anuncio=${a} eu=${eu} /></li>`)}</ul>`
      : html`<${Vazio} texto="Nenhum anúncio encontrado." />`}
  </div>`;
}

function VAnuncio({ estado, eu, executar, anuncio }) {
  const [quantidade, setQuantidade] = useState('1');
  const [erro, setErro] = useState(null);
  const [adicionado, setAdicionado] = useState(false);
  const proprio = anuncio.vendedor === eu;

  function adicionar() {
    const r = executar((e) => adicionarASacola(e, anuncio.id, Number(quantidade)));
    setErro(r.erro || null);
    setAdicionado(!r.erro);
  }

  return html`<div class="pilha">
    <a class="voltar" href="#morador.vendas">‹ Vitrine</a>
    <${FotoProduto} categoria=${anuncio.categoria} />
    <p class="anuncio-titulo">${anuncio.titulo}</p>
    <p class="preco grande">${fmtCentavos(anuncio.preco)}</p>
    <p class="m-texto">${anuncio.descricao}</p>
    <dl class="resumo">
      <dt>Vendedor</dt><dd>${nomeVizinho(estado, anuncio.vendedor)} · apto ${anuncio.vendedor}</dd>
      <dt>Pagamento</dt><dd>${anuncio.pagamentos.map((k) => PAGAMENTOS[k]).join(', ')}</dd>
      <dt>Entrega</dt><dd>${anuncio.entregas.map((k) => ENTREGAS[k]).join(', ')}</dd>
      <dt>Disponível</dt><dd>${anuncio.quantidade ? `Restam ${anuncio.quantidade}` : 'Esgotado'}</dd>
    </dl>
    ${proprio
      ? html`<p class="sub">Este anúncio é seu. Altere preço e quantidade em Minha loja.</p>`
      : html`<${Campo} rotulo="Quantidade"><input id="anuncio-quantidade" type="number" min="1" max=${anuncio.quantidade} inputmode="numeric" value=${quantidade} onInput=${(ev) => setQuantidade(ev.target.value)} /><//>
        <${Erro} texto=${erro} />
        ${adicionado && html`<p class="sucesso" role="status">Adicionado à sacola. <a href="#morador.vendas.sacola">Ver sacola</a></p>`}
        <button type="button" class="btn primario bloco" disabled=${!anuncio.quantidade} onClick=${adicionar}>Adicionar à sacola</button>`}
  </div>`;
}

function VSacola({ estado, executar }) {
  const grupos = sacolaPorVendedor(estado);
  const [escolhas, setEscolhas] = useState({});
  const [erro, setErro] = useState(null);
  const escolhaDe = (g) => {
    const feita = escolhas[g.vendedor] || {};
    return {
      pagamento: feita.pagamento || (g.pagamentos.length === 1 ? g.pagamentos[0] : ''),
      entrega: feita.entrega || (g.entregas.length === 1 ? g.entregas[0] : ''),
    };
  };

  function escolher(vendedor, campo, valor) {
    setEscolhas({ ...escolhas, [vendedor]: { ...(escolhas[vendedor] || {}), [campo]: valor } });
  }

  function fechar() {
    const finais = Object.fromEntries(grupos.map((g) => [g.vendedor, escolhaDe(g)]));
    const r = executar((e) => fecharPedido(e, finais, new Date()));
    if (r.erro) {
      setErro(r.erro);
      return;
    }
    ir('morador', 'vendas', r.id);
  }

  if (!grupos.length) {
    return html`<div class="pilha"><${Vazio} texto="Sua sacola está vazia." /><a class="btn secundario" href="#morador.vendas">Ver a vitrine</a></div>`;
  }
  const total = grupos.reduce((soma, g) => soma + g.subtotal, 0);
  const opcoes = (g, campo, nomes, lista, vazio) => (lista.length
    ? lista.map((k) => html`<label key=${k} class="check"><input id=${`${campo}-${g.vendedor}-${k}`} type="radio" name=${`${campo}-${g.vendedor}`} checked=${escolhaDe(g)[campo] === k} onChange=${() => escolher(g.vendedor, campo, k)} /><span>${nomes[k]}</span></label>`)
    : html`<small class="sub">${vazio}</small>`);
  return html`<div class="pilha">
    <h2>Sacola</h2>
    ${grupos.map((g) => html`<article key=${g.vendedor} class="cartao">
      <strong>${g.nome} · apto ${g.vendedor}</strong>
      <ul class="itens-sacola">${g.itens.map((i) => html`<li key=${i.anuncio.id}>
        <span>${i.quantidade} × ${i.anuncio.titulo}</span>
        <span>${fmtCentavos(i.subtotal)}</span>
        <button type="button" class="btn-link" onClick=${() => executar((e) => removerDaSacola(e, i.anuncio.id))}>Remover</button>
      </li>`)}</ul>
      <fieldset><legend>Pagamento</legend>${opcoes(g, 'pagamento', PAGAMENTOS, g.pagamentos, 'Estes itens não têm forma de pagamento em comum. Faça pedidos separados.')}</fieldset>
      <fieldset><legend>Entrega</legend>${opcoes(g, 'entrega', ENTREGAS, g.entregas, 'Estes itens não têm forma de entrega em comum. Faça pedidos separados.')}</fieldset>
      <div class="linha-entre"><span class="sub">Subtotal</span><strong>${fmtCentavos(g.subtotal)}</strong></div>
    </article>`)}
    <div class="linha-entre total"><span>Total</span><strong>${fmtCentavos(total)}</strong></div>
    <p class="sub">O pagamento é combinado direto com o vendedor. O app registra o pedido e a conversa.</p>
    <${Erro} texto=${erro} />
    <button type="button" class="btn primario bloco" onClick=${fechar}>Fechar pedido</button>
  </div>`;
}

function LinhaPedido({ estado, pedido, outro }) {
  return html`<a class=${`cartao link${pedido.status === 'novo' ? ' destaque' : ''}`} href=${`#morador.vendas.${pedido.id}`}>
    <div class="linha-entre"><strong>${pedido.id}</strong><${EtqPedido} status=${pedido.status} /></div>
    <span>${nomeVizinho(estado, outro)} · apto ${outro}</span>
    <small class="sub">${pedido.itens.map((i) => `${i.quantidade} × ${i.titulo}`).join(', ')} · ${fmtCentavos(totalPedido(pedido))} · ${fmtDataHora(pedido.criadoEm)}</small>
  </a>`;
}

function VMeusPedidos({ estado, eu }) {
  const lista = estado.pedidos.filter((p) => p.comprador === eu).sort((a, b) => b.criadoEm.localeCompare(a.criadoEm));
  return html`<div class="pilha">
    <h2>Meus pedidos</h2>
    ${lista.length
      ? html`<ul class="m-lista">${lista.map((p) => html`<li key=${p.id}><${LinhaPedido} estado=${estado} pedido=${p} outro=${p.vendedor} /></li>`)}</ul>`
      : html`<${Vazio} texto="Você ainda não fez pedidos." />`}
  </div>`;
}

function VPedido({ estado, eu, executar, pedido }) {
  const [mensagem, setMensagem] = useState('');
  const [recusando, setRecusando] = useState(false);
  const [motivo, setMotivo] = useState('');
  const [erro, setErro] = useState(null);
  const souVendedor = pedido.vendedor === eu;
  const outro = souVendedor ? pedido.comprador : pedido.vendedor;
  const acoes = acoesPedido(pedido, eu);
  const botoes = acoes.filter((a) => a !== 'conversar');

  function rodar(acao) {
    const r = executar(acao);
    setErro(r.erro || null);
    return r;
  }

  function agir(acao) {
    if (acao === 'recusar') {
      setRecusando(true);
      return;
    }
    const funcoes = { aceitar: aceitarPedido, entregar: marcarEntregue, pago: marcarPago, cancelar: cancelarPedido };
    rodar((e) => funcoes[acao](e, pedido.id, eu, new Date()));
  }

  function recusar() {
    if (!rodar((e) => recusarPedido(e, pedido.id, eu, motivo, new Date())).erro) setRecusando(false);
  }

  function enviar() {
    if (!rodar((e) => enviarMensagem(e, pedido.id, eu, mensagem, new Date())).erro) setMensagem('');
  }

  return html`<div class="pilha">
    <a class="voltar" href=${souVendedor ? '#morador.vendas.loja' : '#morador.vendas.pedidos'}>‹ ${souVendedor ? 'Minha loja' : 'Meus pedidos'}</a>
    <p class="protocolo">Pedido ${pedido.id}</p>
    <div class="linha-entre">
      <strong>${souVendedor ? 'Comprador' : 'Vendedor'}: ${nomeVizinho(estado, outro)} · apto ${outro}</strong>
      <span class="etq-linha"><${EtqPedido} status=${pedido.status} />${pedido.pago && html`<${Etiqueta} tipo="ok">Pago<//>`}</span>
    </div>
    <ul class="itens-sacola">${pedido.itens.map((i, n) => html`<li key=${n}><span>${i.quantidade} × ${i.titulo}</span><span>${fmtCentavos(i.preco * i.quantidade)}</span></li>`)}</ul>
    <div class="linha-entre total"><span>Total</span><strong>${fmtCentavos(totalPedido(pedido))}</strong></div>
    <p class="sub">${PAGAMENTOS[pedido.pagamento]} · ${ENTREGAS[pedido.entrega]}${pedido.motivo ? ` · Motivo: ${pedido.motivo}` : ''}</p>
    ${botoes.length > 0 && html`<div class="acoes">${botoes.map((a) => html`<button type="button" key=${a} class=${['aceitar', 'entregar'].includes(a) ? 'btn primario' : 'btn secundario'} onClick=${() => agir(a)}>${ROTULOS_ACAO_PEDIDO[a]}</button>`)}</div>`}
    ${recusando && html`<div class="cartao">
      <${Campo} rotulo="Motivo da recusa"><input id="pedido-motivo" value=${motivo} onInput=${(ev) => setMotivo(ev.target.value)} placeholder="Ex.: sem ingredientes hoje" /><//>
      <div class="acoes">
        <button type="button" class="btn perigo" onClick=${recusar}>Confirmar recusa</button>
        <button type="button" class="btn secundario" onClick=${() => setRecusando(false)}>Voltar</button>
      </div>
    </div>`}
    <${Erro} texto=${erro} />
    <h2>Andamento</h2>
    <ol class="linha-tempo">${pedido.linha.map((l, n) => html`<li key=${n} class=${l.status ? 'marco' : 'comentario'}>
      <span class="lt-quando">${fmtDataHora(l.em)}</span>
      <strong>${l.status ? NOMES_STATUS_PEDIDO[l.status] : 'Pagamento'}</strong>
      <span>${l.texto}</span>
    </li>`)}</ol>
    <h2>Conversa</h2>
    <ul class="conversa">
      ${pedido.mensagens.length
        ? pedido.mensagens.map((m, n) => html`<li key=${n} class=${m.autor === eu ? 'minha' : 'outra'}><span>${m.texto}</span><small>${m.autor === eu ? 'Você' : nomeVizinho(estado, m.autor)} · ${fmtDataHora(m.em)}</small></li>`)
        : html`<li class="sem-mensagem">Nenhuma mensagem ainda.</li>`}
    </ul>
    ${acoes.includes('conversar') && html`<div class="enviar-mensagem">
      <${Campo} rotulo="Mensagem"><input id="pedido-mensagem" value=${mensagem} onInput=${(ev) => setMensagem(ev.target.value)} placeholder=${`Escreva para ${nomeVizinho(estado, outro).split(' ')[0]}`} /><//>
      <button type="button" class="btn primario" onClick=${enviar}>Enviar</button>
    </div>`}
  </div>`;
}

function VLoja(props) {
  const { estado, eu } = props;
  const [aba, setAba] = useState('pedidos');
  const pessoa = pessoaDaUnidade(estado, eu);
  if (pessoa.vendedor !== 'aprovado') return html`<${VConvite} ...${props} />`;
  const recebidos = estado.pedidos
    .filter((p) => p.vendedor === eu)
    .sort((a, b) => Number(b.status === 'novo') - Number(a.status === 'novo') || b.criadoEm.localeCompare(a.criadoEm));
  const novos = recebidos.filter((p) => p.status === 'novo').length;
  const abas = [['pedidos', novos ? `Pedidos (${novos} ${novos === 1 ? 'novo' : 'novos'})` : 'Pedidos'], ['anuncios', 'Meus anúncios'], ['painel', 'Painel']];
  return html`<div class="pilha">
    <div class="chips" role="group" aria-label="Minha loja">
      ${abas.map(([chave, nome]) => html`<button type="button" key=${chave} class="chip" aria-pressed=${aba === chave} onClick=${() => setAba(chave)}>${nome}</button>`)}
    </div>
    ${aba === 'pedidos' && (recebidos.length
      ? html`<ul class="m-lista">${recebidos.map((p) => html`<li key=${p.id}><${LinhaPedido} estado=${estado} pedido=${p} outro=${p.comprador} /></li>`)}</ul>`
      : html`<${Vazio} texto="Nenhum pedido recebido ainda." />`)}
    ${aba === 'anuncios' && html`<${VMeusAnuncios} ...${props} />`}
    ${aba === 'painel' && html`<${VPainel} ...${props} />`}
  </div>`;
}

function VMeusAnuncios({ estado, eu, executar }) {
  const meus = estado.anuncios.filter((a) => a.vendedor === eu).sort((a, b) => b.criadoEm.localeCompare(a.criadoEm));
  return html`<a class="btn primario bloco" href="#morador.vendas.novo-anuncio">Novo anúncio</a>
    ${meus.length
      ? html`<ul class="m-lista">${meus.map((a) => html`<li key=${a.id}><${EditorAnuncio} anuncio=${a} eu=${eu} executar=${executar} /></li>`)}</ul>`
      : html`<${Vazio} texto="Você ainda não tem anúncios." />`}`;
}

function EditorAnuncio({ anuncio, eu, executar }) {
  const [preco, setPreco] = useState((anuncio.preco / 100).toFixed(2).replace('.', ','));
  const [quantidade, setQuantidade] = useState(String(anuncio.quantidade));
  const [mensagem, setMensagem] = useState(null);
  const [erro, setErro] = useState(null);

  function salvar(mudanca) {
    const r = executar((e) => editarAnuncio(e, eu, anuncio.id, mudanca));
    setErro(r.erro || null);
    setMensagem(r.erro ? null : 'Anúncio atualizado.');
  }

  let situacao = html`<${Etiqueta} tipo="ok">Na vitrine<//>`;
  if (anuncio.oculto) situacao = html`<${Etiqueta} tipo="perigo">Oculto pelo síndico<//>`;
  else if (!anuncio.ativo) situacao = html`<${Etiqueta}>Pausado<//>`;
  return html`<article class="cartao">
    <div class="linha-entre"><strong>${anuncio.titulo}</strong>${situacao}</div>
    ${anuncio.oculto && html`<small class="sub">Motivo: ${anuncio.motivoOculto}</small>`}
    <div class="edicao-anuncio">
      <${Campo} rotulo="Preço (R$)"><input id=${`preco-${anuncio.id}`} inputmode="decimal" value=${preco} onInput=${(ev) => setPreco(ev.target.value)} /><//>
      <${Campo} rotulo="Disponível"><input id=${`quantidade-${anuncio.id}`} type="number" min="0" value=${quantidade} onInput=${(ev) => setQuantidade(ev.target.value)} /><//>
    </div>
    <${Erro} texto=${erro} />
    <${Sucesso} texto=${mensagem} />
    <div class="acoes">
      <button type="button" class="btn secundario" onClick=${() => salvar({ preco: lerPreco(preco), quantidade: quantidade === '' ? NaN : Number(quantidade) })}>Salvar</button>
      <button type="button" class="btn secundario" onClick=${() => salvar({ ativo: !anuncio.ativo })}>${anuncio.ativo ? 'Pausar' : 'Retomar'}</button>
    </div>
  </article>`;
}

function VNovoAnuncio({ estado, eu, executar }) {
  const [titulo, setTitulo] = useState('');
  const [descricao, setDescricao] = useState('');
  const [categoria, setCategoria] = useState('doces');
  const [preco, setPreco] = useState('');
  const [quantidade, setQuantidade] = useState('');
  const [pagamentos, setPagamentos] = useState([]);
  const [entregas, setEntregas] = useState([]);
  const [erro, setErro] = useState(null);
  if (pessoaDaUnidade(estado, eu).vendedor !== 'aprovado') return html`<${VConvite} estado=${estado} eu=${eu} executar=${executar} />`;
  const alternar = (lista, definir, chave) => definir(lista.includes(chave) ? lista.filter((x) => x !== chave) : [...lista, chave]);

  function publicar() {
    const dados = { titulo, descricao, categoria, preco: lerPreco(preco), quantidade: quantidade === '' ? NaN : Number(quantidade), pagamentos, entregas };
    const r = executar((e) => publicarAnuncio(e, eu, dados, new Date()));
    if (r.erro) {
      setErro(r.erro);
      return;
    }
    ir('morador', 'vendas', 'loja');
  }

  return html`<div class="pilha">
    <a class="voltar" href="#morador.vendas.loja">‹ Minha loja</a>
    <h2>Novo anúncio</h2>
    <${Campo} rotulo="Título"><input id="novo-titulo" value=${titulo} onInput=${(ev) => setTitulo(ev.target.value)} placeholder="Ex.: Bolo de cenoura com chocolate" /><//>
    <${Campo} rotulo="Descrição"><textarea id="novo-descricao" rows="3" value=${descricao} onInput=${(ev) => setDescricao(ev.target.value)}></textarea><//>
    <${Campo} rotulo="Categoria"><select id="novo-categoria" value=${categoria} onChange=${(ev) => setCategoria(ev.target.value)}>${Object.entries(CATEGORIAS_VENDA).map(([chave, nome]) => html`<option key=${chave} value=${chave}>${nome}</option>`)}</select><//>
    <div class="edicao-anuncio">
      <${Campo} rotulo="Preço (R$)"><input id="novo-preco" inputmode="decimal" value=${preco} onInput=${(ev) => setPreco(ev.target.value)} placeholder="Ex.: 18,00" /><//>
      <${Campo} rotulo="Quantidade"><input id="novo-quantidade" type="number" min="0" value=${quantidade} onInput=${(ev) => setQuantidade(ev.target.value)} /><//>
    </div>
    <fieldset><legend>Pagamento aceito</legend>
      ${Object.entries(PAGAMENTOS).map(([chave, nome]) => html`<label key=${chave} class="check"><input id=${`novo-pagamento-${chave}`} type="checkbox" checked=${pagamentos.includes(chave)} onChange=${() => alternar(pagamentos, setPagamentos, chave)} /><span>${nome}</span></label>`)}
    </fieldset>
    <fieldset><legend>Entrega</legend>
      ${Object.entries(ENTREGAS).map(([chave, nome]) => html`<label key=${chave} class="check"><input id=${`novo-entrega-${chave}`} type="checkbox" checked=${entregas.includes(chave)} onChange=${() => alternar(entregas, setEntregas, chave)} /><span>${nome}</span></label>`)}
    </fieldset>
    <p class="sub">No protótipo, a foto do produto é simulada.</p>
    <${Erro} texto=${erro} />
    <button type="button" class="btn primario bloco" onClick=${publicar}>Publicar anúncio</button>
  </div>`;
}

// Gráfico de uma série: sem legenda (o título nomeia), barras em laranja escuro (contraste ≥ 3:1),
// valor visível só na maior barra e nas demais ao passar o mouse ou focar; tabela para leitores de tela.
function VPainel({ estado, eu, agora }) {
  const [periodo, setPeriodo] = useState('7d');
  const d = painelVendas(estado, eu, periodo, agora);
  const maximo = Math.max(...d.barras.map((b) => b.valor));
  const unidadeTempo = periodo === '7d' ? 'dia' : 'semana';
  const rotuloBarra = (b) => (periodo === '7d' ? fmtDataCurta(b.rotulo).slice(0, 5) : `sem. ${fmtDataCurta(b.rotulo).slice(0, 5)}`);
  const numeros = [['Faturamento', fmtCentavos(d.faturamento)], ['Pedidos', d.pedidos], ['Ticket médio', fmtCentavos(d.ticket)], ['Itens vendidos', d.itens]];
  return html`<div class="pilha">
    <div class="chips" role="group" aria-label="Período">
      ${PERIODOS_PAINEL.map(([chave, nome]) => html`<button type="button" key=${chave} class="chip" aria-pressed=${periodo === chave} onClick=${() => setPeriodo(chave)}>${nome}</button>`)}
    </div>
    <div class="numeros">${numeros.map(([rotulo, valor]) => html`<div key=${rotulo} class="numero"><span>${rotulo}</span><strong>${valor}</strong></div>`)}</div>
    <h2>Faturamento por ${unidadeTempo}</h2>
    <div class="grafico-barras" aria-hidden="true">
      ${d.barras.map((b) => html`<div key=${b.rotulo} class=${`coluna${maximo && b.valor === maximo ? ' maior' : ''}`} title=${`${rotuloBarra(b)}: ${fmtCentavos(b.valor)}`}>
        <span class="valor">${fmtCentavos(b.valor).replace(',00', '')}</span>
        <span class="barra-v" style=${`height:${maximo ? Math.round((b.valor / maximo) * 110) : 0}px`}></span>
        <span class="rotulo-x">${rotuloBarra(b)}</span>
      </div>`)}
    </div>
    <table class="so-leitor">
      <caption>Faturamento por ${unidadeTempo}</caption>
      <thead><tr><th>${periodo === '7d' ? 'Dia' : 'Semana a partir de'}</th><th>Faturamento</th></tr></thead>
      <tbody>${d.barras.map((b) => html`<tr key=${b.rotulo}><td>${fmtDataCurta(b.rotulo)}</td><td>${fmtCentavos(b.valor)}</td></tr>`)}</tbody>
    </table>
    <h2>Mais vendidos</h2>
    ${d.maisVendidos.length
      ? html`<ol class="mais-vendidos">${d.maisVendidos.map((m) => html`<li key=${m.titulo}><span>${m.titulo}</span><strong>${m.quantidade}</strong></li>`)}</ol>`
      : html`<${Vazio} texto="Nenhuma venda entregue no período." />`}
    <h2>Pedidos por situação</h2>
    <dl class="situacao-pedidos">
      <dt>Entregues</dt><dd>${d.situacao.entregues}</dd>
      <dt>Em andamento</dt><dd>${d.situacao.andamento}</dd>
      <dt>Recusados</dt><dd>${d.situacao.recusados}</dd>
      <dt>Cancelados</dt><dd>${d.situacao.cancelados}</dd>
    </dl>
  </div>`;
}

function VConvite({ estado, eu, executar }) {
  const [texto, setTexto] = useState('');
  const [erro, setErro] = useState(null);
  const pessoa = pessoaDaUnidade(estado, eu);

  function pedir() {
    const r = executar((e) => pedirParaVender(e, eu, texto, new Date()));
    setErro(r.erro || null);
  }

  if (pessoa.vendedor === 'pendente') {
    return html`<div class="cartao"><strong>Aguardando aprovação do síndico</strong><span class="sub">Você pediu para vender: ${pessoa.pedidoVenda.texto}</span></div>`;
  }
  if (pessoa.vendedor === 'suspenso') {
    return html`<p class="erro">Suas vendas estão suspensas pelo síndico. Motivo: ${pessoa.motivoVendedor}</p>`;
  }
  return html`<div class="pilha">
    <div class="convite">
      <${QuadroIcone} nome="loja" />
      <div><strong>Quer vender para os vizinhos?</strong><span class="sub">Doces, salgados, artesanato, desapego ou serviços. O síndico aprova e você começa a anunciar.</span></div>
    </div>
    ${pessoa.motivoVendedor && html`<p class="erro">Pedido anterior recusado: ${pessoa.motivoVendedor}</p>`}
    <${Campo} rotulo="O que você pretende vender?"><textarea id="convite-texto" rows="3" value=${texto} onInput=${(ev) => setTexto(ev.target.value)} placeholder="Ex.: bolos caseiros por encomenda"></textarea><//>
    <${Erro} texto=${erro} />
    <button type="button" class="btn primario bloco" onClick=${pedir}>Pedir para vender</button>
  </div>`;
}

// ---- src/ui/morador.js ----

const ABAS_MORADOR = [['inicio', 'Início', 'casa'], ['reservas', 'Reservas', 'calendario'], ['avisos', 'Avisos', 'megafone'], ['ocorrencias', 'Ocorrências', 'prancheta'], ['vendas', 'Vendas', 'loja'], ['mais', 'Mais', 'menu']];

function relogio(d) {
  return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}

function lerConvidados(texto) {
  return texto.split('\n').map((l) => l.trim()).filter(Boolean).map((linha) => {
    const [nome, ...resto] = linha.split(',');
    return { nome: nome.trim(), documento: resto.join(',').trim() || 'não informado' };
  });
}

function textoAntecedencia(area) {
  const limite = area.limiteMes ? ` · até ${area.limiteMes} por mês` : '';
  return area.antecedenciaMin === 0
    ? `Reserve com até ${area.antecedenciaMax} dias de antecedência${limite}`
    : `Reserve de ${area.antecedenciaMin} a ${area.antecedenciaMax} dias antes${limite}`;
}

function tipoEtiquetaAviso(c) {
  return c.tipo === 'urgente' ? 'perigo' : 'info';
}

function TelaMorador(props) {
  const eu = props.estado.moradorAtual;
  const telas = { inicio: MInicio, reservas: MReservas, avisos: MAvisos, ocorrencias: MOcorrencias, mais: MMais, documentos: MDocumentos, encomendas: MEncomendas, preferencias: MPreferencias, vendas: TelaVendas };
  const Conteudo = telas[props.rota.tela] || MInicio;
  const aba = ['documentos', 'encomendas', 'preferencias'].includes(props.rota.tela) ? 'mais' : props.rota.tela;
  return html`<div class="celular">
    <div class="cel-status" aria-hidden="true"><span>${relogio(props.agora)}</span><span>CondoFácil</span></div>
    <div class="cel-pessoa" role="group" aria-label="Morador da demonstração">
      ${MORADORES_DEMO.map(([unidade, nome]) => html`<button type="button" key=${unidade} aria-pressed=${unidade === eu} onClick=${() => props.executar((e) => trocarMorador(e, unidade))}>${nome} · ${unidade}</button>`)}
    </div>
    <div class="cel-conteudo"><${Conteudo} ...${props} eu=${eu} /></div>
    <nav class="cel-abas" aria-label="Navegação do morador">
      ${ABAS_MORADOR.map(([id, nome, icone]) => html`<a key=${id} href=${`#morador.${id}`} class=${id === aba ? 'ativa' : ''} aria-current=${id === aba ? 'page' : undefined}><${Icone} nome=${icone} />${nome}</a>`)}
    </nav>
  </div>`;
}

function MCartaoEncomenda({ encomenda, agora }) {
  return html`<article class="cartao encomenda" data-codigo=${encomenda.codigo}>
    <div>
      <strong>${encomenda.transportadora}</strong>
      <span class="sub">Chegou ${haQuanto(encomenda.chegadaEm, agora)}</span>
      ${encomendaParada(encomenda, agora) && html`<${Etiqueta} tipo="alerta">Retire em breve<//>`}
      <span class="m-codigo">Código <b>${encomenda.codigo}</b></span>
      <small class="sub">Mostre o QR Code na portaria.</small>
    </div>
    <${QrFalso} texto=${encomenda.codigo} tamanho=${104} />
  </article>`;
}

function MInicio({ estado, agora, eu }) {
  const hoje = isoDia(agora);
  const pacotes = estado.encomendas.filter((e) => e.unidade === eu && e.status === 'aguardando');
  const fixado = comunicadosDaUnidade(estado, eu).find((c) => c.fixado);
  const novidades = anunciosVisiveis(estado).filter((a) => a.vendedor !== eu).slice(0, 2);
  const proxima = estado.reservas
    .filter((r) => r.unidade === eu && STATUS_ATIVOS.includes(r.status) && r.data >= hoje)
    .sort((a, b) => a.data.localeCompare(b.data) || a.inicio - b.inicio)[0];
  return html`<section class="m-pagina">
    <h1 class="m-titulo">Olá, ${pessoaDaUnidade(estado, eu).nome.split(' ')[0]}</h1>
    <p class="m-sub">Apto ${eu} · Residencial Ipê Amarelo</p>
    <h2>Encomendas na portaria</h2>
    ${pacotes.length ? pacotes.map((e) => html`<${MCartaoEncomenda} key=${e.id} encomenda=${e} agora=${agora} />`) : html`<${Vazio} texto="Nenhuma encomenda esperando por você." />`}
    ${fixado && html`<h2>Fixado pelo síndico</h2>
      <a class="cartao link" href=${`#morador.avisos.${fixado.id}`}>
        <${Etiqueta} tipo=${tipoEtiquetaAviso(fixado)}>${TIPOS_COMUNICADO[fixado.tipo]}<//>
        <strong>${fixado.titulo}</strong>
        ${!fixado.leituras.includes(eu) && html`<span class="m-nao-lido">Toque para confirmar a leitura</span>`}
      </a>`}
    <h2>Próxima reserva</h2>
    ${proxima
      ? html`<a class="cartao link" href="#morador.reservas">
          <div class="linha-entre"><strong>${areaPorId(estado, proxima.areaId).nome}</strong><${EtqReserva} status=${proxima.status} /></div>
          <span>${fmtDia(proxima.data)} · ${fmtHora(proxima.inicio)}–${fmtHora(proxima.fim)}</span>
        </a>`
      : html`<${Vazio} texto="Você não tem reservas futuras." />`}
    <h2>Novidades na vitrine</h2>
    ${novidades.length
      ? html`<ul class="anuncios">${novidades.map((a) => html`<li key=${a.id}><${CartaoAnuncio} estado=${estado} anuncio=${a} eu=${eu} /></li>`)}</ul>`
      : html`<${Vazio} texto="Nenhum anúncio na vitrine." />`}
    <a class="voltar" href="#morador.vendas">Ver a vitrine</a>
    <a class="btn primario bloco" href="#morador.ocorrencias.nova">Abrir ocorrência</a>
  </section>`;
}

function MReservas({ estado, executar, agora, eu }) {
  const hoje = isoDia(agora);
  const [areaId, setAreaId] = useState(null);
  const [anoMes, setAnoMes] = useState(hoje.slice(0, 7));
  const [data, setData] = useState(null);
  const [horario, setHorario] = useState(null);
  const [termo, setTermo] = useState(false);
  const [convidados, setConvidados] = useState('');
  const [erro, setErro] = useState(null);
  const [mensagem, setMensagem] = useState(null);
  const area = areaId ? areaPorId(estado, areaId) : null;

  function recomecar(texto) {
    setAreaId(null);
    setData(null);
    setHorario(null);
    setTermo(false);
    setConvidados('');
    setErro(null);
    setMensagem(texto || null);
  }

  function solicitar() {
    const pedido = { areaId, unidade: eu, data, inicio: horario.inicio, fim: horario.fim, convidados: lerConvidados(convidados), aceiteTermo: termo };
    const r = executar((e) => solicitarReserva(e, pedido, new Date()));
    if (r.erro) {
      setErro(r.erro);
      return;
    }
    const status = r.estado.reservas.find((x) => x.id === r.id).status;
    recomecar(status === 'pendente'
      ? 'Reserva solicitada! Aguardando aprovação do síndico. O horário já está guardado para você.'
      : 'Reserva confirmada!');
  }

  if (!area) {
    return html`<section class="m-pagina">
      <h1 class="m-titulo">Reservas</h1>
      <${Sucesso} texto=${mensagem} />
      <h2>Escolha a área</h2>
      ${estado.areas.map((a) => html`<button type="button" key=${a.id} class="cartao link" onClick=${() => { setAreaId(a.id); setMensagem(null); }}>
        <strong>${a.nome}</strong>
        <span>${a.tipo === 'periodo' ? 'Por período' : 'Por hora'} · ${a.taxa ? fmtMoeda(a.taxa) : 'Sem taxa'}</span>
        <small class="sub">${a.aprovacao === 'manual' ? 'Precisa de aprovação do síndico' : 'Confirmação na hora'}</small>
      </button>`)}
      <${MMinhasReservas} estado=${estado} executar=${executar} agora=${agora} eu=${eu} />
    </section>`;
  }

  if (!horario) {
    const horarios = data ? horariosDaArea(estado, area.id, data, agora) : [];
    const statusDe = (iso) => {
      const dias = diferencaDias(iso, hoje);
      return dias < area.antecedenciaMin || dias > area.antecedenciaMax ? 'indisponivel' : statusDia(estado, area.id, iso);
    };
    return html`<section class="m-pagina">
      <button type="button" class="voltar" onClick=${() => recomecar()}>‹ Áreas</button>
      <h1 class="m-titulo">${area.nome}</h1>
      <p class="m-sub">${textoAntecedencia(area)}</p>
      <${Calendario} anoMes=${anoMes} statusDe=${statusDe} selecionado=${data} aoEscolher=${(iso) => { setData(iso); setErro(null); }} aoMudarMes=${(n) => setAnoMes(somarMes(anoMes, n))} />
      ${data && html`<h2>${fmtDia(data)}</h2>
        <div class="m-horarios">
          ${horarios.map((h) => html`<button type="button" key=${h.inicio} class="btn opcao" disabled=${!h.livre} onClick=${() => setHorario(h)}>${h.rotulo}${h.motivo && html`<small>${h.motivo}</small>`}</button>`)}
        </div>`}
    </section>`;
  }

  return html`<section class="m-pagina">
    <button type="button" class="voltar" onClick=${() => { setHorario(null); setErro(null); }}>‹ Horários</button>
    <h1 class="m-titulo">Confirmar reserva</h1>
    <dl class="resumo">
      <dt>Área</dt><dd>${area.nome}</dd>
      <dt>Quando</dt><dd>${fmtDia(data)}, ${fmtHora(horario.inicio)}–${fmtHora(horario.fim)}</dd>
      <dt>Taxa</dt><dd>${area.taxa ? `${fmtMoeda(area.taxa)} no próximo boleto` : 'Sem taxa'}</dd>
      <dt>Aprovação</dt><dd>${area.aprovacao === 'manual' ? 'Pelo síndico em até 48 h; o horário fica guardado para você' : 'Automática'}</dd>
      <dt>Inclui</dt><dd>${area.itens}</dd>
    </dl>
    <p class="m-regulamento">${area.regulamento} Cancelamento sem multa até 72 h antes.</p>
    <${Campo} rotulo="Convidados (opcional)" dica="Um por linha: nome, documento. A lista vai para a portaria."><textarea id="reserva-convidados" rows="3" value=${convidados} onInput=${(ev) => setConvidados(ev.target.value)}></textarea><//>
    <label class="check"><input id="reserva-termo" type="checkbox" checked=${termo} onChange=${(ev) => setTermo(ev.target.checked)} /><span>Li e aceito o termo de responsabilidade</span></label>
    <${Erro} texto=${erro} />
    <button type="button" class="btn primario bloco" disabled=${!termo} onClick=${solicitar}>Solicitar reserva</button>
  </section>`;
}

function MMinhasReservas({ estado, executar, agora, eu }) {
  const [cancelando, setCancelando] = useState(null);
  const [aviso, setAviso] = useState(null);
  const hoje = isoDia(agora);
  const minhas = estado.reservas.filter((r) => r.unidade === eu).sort((a, b) => b.data.localeCompare(a.data));

  function confirmar(id) {
    const r = executar((e) => cancelarReserva(e, id, new Date()));
    setCancelando(null);
    setAviso(r.erro || (r.aviso.multa ? 'Reserva cancelada fora do prazo: a taxa será retida conforme o regulamento.' : 'Reserva cancelada sem multa.'));
  }

  return html`<h2>Minhas reservas</h2>
    <${Sucesso} texto=${aviso} />
    ${minhas.length
      ? html`<ul class="m-lista">${minhas.map((r) => {
          const podeCancelar = STATUS_ATIVOS.includes(r.status) && r.data >= hoje;
          return html`<li key=${r.id} class="cartao">
            <div class="linha-entre"><strong>${areaPorId(estado, r.areaId).nome}</strong><${EtqReserva} status=${r.status} /></div>
            <span>${fmtDia(r.data)} · ${fmtHora(r.inicio)}–${fmtHora(r.fim)}</span>
            ${r.motivo && html`<small class="sub">Motivo: ${r.motivo}</small>`}
            ${podeCancelar && (cancelando === r.id
              ? html`<div class="cartao">
                  <p class="m-texto">${avisoCancelamento(r, agora).texto}</p>
                  <div class="acoes">
                    <button type="button" class="btn perigo" onClick=${() => confirmar(r.id)}>Confirmar cancelamento</button>
                    <button type="button" class="btn secundario" onClick=${() => setCancelando(null)}>Manter reserva</button>
                  </div>
                </div>`
              : html`<button type="button" class="btn secundario" onClick=${() => setCancelando(r.id)}>Cancelar</button>`)}
          </li>`;
        })}</ul>`
      : html`<${Vazio} texto="Você ainda não fez reservas." />`}`;
}

function MAvisos({ estado, rota, executar, eu }) {
  const lista = comunicadosDaUnidade(estado, eu);
  const c = rota.id ? lista.find((x) => x.id === rota.id) : null;
  if (c) {
    const lido = c.leituras.includes(eu);
    return html`<section class="m-pagina">
      <a class="voltar" href="#morador.avisos">‹ Avisos</a>
      <div><${Etiqueta} tipo=${tipoEtiquetaAviso(c)}>${TIPOS_COMUNICADO[c.tipo]}<//></div>
      <h1 class="m-titulo">${c.titulo}</h1>
      <p class="m-sub">${fmtDataHora(c.publicadoEm)} · Roberto Lima, síndico</p>
      <p class="m-texto">${c.texto}</p>
      ${c.anexo && html`<p class="anexo"><${Icone} nome="clipe" tamanho=${18} />${c.anexo}</p>`}
      ${lido
        ? html`<p class="sucesso">✓ Você confirmou a leitura</p>`
        : html`<button type="button" class="btn primario bloco" onClick=${() => executar((e) => marcarLido(e, c.id, eu))}>Li e estou ciente</button>`}
      <div class="reacoes" role="group" aria-label="Reações">
        ${[['util', 'Útil'], ['duvida', 'Tenho dúvida']].map(([tipo, nome]) => html`<button type="button" key=${tipo} class="btn secundario" aria-pressed=${c.reacoes[tipo].includes(eu)} onClick=${() => executar((e) => reagir(e, c.id, eu, tipo))}>${nome} · ${c.reacoes[tipo].length}</button>`)}
      </div>
    </section>`;
  }
  return html`<section class="m-pagina">
    <h1 class="m-titulo">Avisos</h1>
    <ul class="m-lista">${lista.map((x) => {
      const lido = x.leituras.includes(eu);
      return html`<li key=${x.id}><a class=${`cartao link${lido ? '' : ' nao-lido'}`} href=${`#morador.avisos.${x.id}`}>
        <div class="linha-entre"><${Etiqueta} tipo=${tipoEtiquetaAviso(x)}>${TIPOS_COMUNICADO[x.tipo]}<//>${x.fixado && html`<small class="fixado"><${Icone} nome="alfinete" tamanho=${16} />Fixado</small>`}</div>
        <strong>${x.titulo}</strong>
        <small class="sub">${fmtDataHora(x.publicadoEm)}${lido ? '' : ' · não lido'}</small>
      </a></li>`;
    })}</ul>
  </section>`;
}

function MOcorrencias(props) {
  const { estado, rota, eu } = props;
  if (rota.id === 'nova') return html`<${MNovaOcorrencia} ...${props} />`;
  const oc = rota.id ? estado.ocorrencias.find((o) => o.id === rota.id && (o.unidade === eu || o.publica)) : null;
  if (oc) return html`<${MDetalheOcorrencia} executar=${props.executar} oc=${oc} eu=${eu} />`;
  const minhas = estado.ocorrencias.filter((o) => o.unidade === eu);
  const publicas = estado.ocorrencias.filter((o) => o.publica && o.unidade !== eu);
  const item = (o) => html`<li key=${o.id}><a class="cartao link" href=${`#morador.ocorrencias.${o.id}`}>
    <div class="linha-entre"><strong>${CATEGORIAS[o.categoria].nome}</strong><${EtqOcorrencia} status=${o.status} arquivada=${o.arquivada} /></div>
    <span>${o.descricao}</span>
    <small class="sub">${o.id}${o.publica ? ` · ${o.eutambem.length} "eu também"` : ''}</small>
  </a></li>`;
  return html`<section class="m-pagina">
    <h1 class="m-titulo">Ocorrências</h1>
    <a class="btn primario bloco" href="#morador.ocorrencias.nova">Abrir ocorrência</a>
    <h2>Minhas</h2>
    ${minhas.length ? html`<ul class="m-lista">${minhas.map(item)}</ul>` : html`<${Vazio} texto="Você não abriu ocorrências." />`}
    <h2>Públicas do condomínio</h2>
    ${publicas.length ? html`<ul class="m-lista">${publicas.map(item)}</ul>` : html`<${Vazio} texto="Nenhuma ocorrência pública." />`}
  </section>`;
}

function MNovaOcorrencia({ executar, eu }) {
  const [categoria, setCategoria] = useState('');
  const [local, setLocal] = useState('');
  const [descricao, setDescricao] = useState('');
  const [foto, setFoto] = useState(false);
  const [anonima, setAnonima] = useState(false);
  const [publica, setPublica] = useState(false);
  const [erro, setErro] = useState(null);

  function enviar() {
    const r = executar((e) => abrirOcorrencia(e, { categoria, local, descricao, foto, anonima, publica, unidade: eu }, new Date()));
    if (r.erro) {
      setErro(r.erro);
      return;
    }
    ir('morador', 'ocorrencias', r.id);
  }

  return html`<section class="m-pagina">
    <a class="voltar" href="#morador.ocorrencias">‹ Ocorrências</a>
    <h1 class="m-titulo">Abrir ocorrência</h1>
    <${Campo} rotulo="Categoria"><select id="ocorrencia-categoria" value=${categoria} onChange=${(ev) => setCategoria(ev.target.value)}>
      <option value="">Escolha…</option>
      ${Object.entries(CATEGORIAS).map(([id, c]) => html`<option key=${id} value=${id}>${c.nome}</option>`)}
    </select><//>
    <${Campo} rotulo="Local"><input id="ocorrencia-local" value=${local} onInput=${(ev) => setLocal(ev.target.value)} placeholder="Ex.: garagem, 5º andar, salão" /><//>
    <${Campo} rotulo="Descrição"><textarea id="ocorrencia-descricao" rows="4" value=${descricao} onInput=${(ev) => setDescricao(ev.target.value)}></textarea><//>
    ${foto ? html`<${FotoFalsa} rotulo="Foto anexada" />` : html`<button type="button" class="btn secundario" onClick=${() => setFoto(true)}>Anexar foto</button>`}
    <label class="check"><input id="ocorrencia-anonima" type="checkbox" checked=${anonima} onChange=${(ev) => setAnonima(ev.target.checked)} /><span>Enviar como anônima</span></label>
    <small class="m-ajuda">O síndico vê o conteúdo, mas não quem enviou.</small>
    <label class="check"><input id="ocorrencia-publica" type="checkbox" checked=${publica} onChange=${(ev) => setPublica(ev.target.checked)} /><span>Tornar pública</span></label>
    <small class="m-ajuda">Todos os moradores veem e podem marcar "eu também".</small>
    <${Erro} texto=${erro} />
    <button type="button" class="btn primario bloco" onClick=${enviar}>Enviar ocorrência</button>
  </section>`;
}

function MDetalheOcorrencia({ executar, oc, eu }) {
  const [nota, setNota] = useState(0);
  const [erro, setErro] = useState(null);
  const minha = oc.unidade === eu;
  const podeAvaliar = minha && ['resolvida', 'fechada'].includes(oc.status) && !oc.avaliacao;

  function avaliar() {
    const r = executar((e) => avaliarOcorrencia(e, oc.id, nota));
    setErro(r.erro || null);
  }

  return html`<section class="m-pagina">
    <a class="voltar" href="#morador.ocorrencias">‹ Ocorrências</a>
    <p class="protocolo">Protocolo ${oc.id}</p>
    <h1 class="m-titulo">${CATEGORIAS[oc.categoria].nome}</h1>
    <div><${EtqOcorrencia} status=${oc.status} arquivada=${oc.arquivada} /></div>
    <p class="m-texto">${oc.descricao}</p>
    ${oc.local && html`<p class="m-sub">Local: ${oc.local}</p>`}
    ${oc.foto && html`<${FotoFalsa} rotulo="Foto enviada" />`}
    ${oc.publica && html`<button type="button" class="btn secundario" aria-pressed=${oc.eutambem.includes(eu)} onClick=${() => executar((e) => euTambem(e, oc.id, eu))}>Eu também · ${oc.eutambem.length}</button>`}
    <h2>Andamento</h2>
    <${LinhaTempo} linha=${oc.linha} />
    ${podeAvaliar && html`<div class="cartao">
      <strong>Como foi o atendimento?</strong>
      <${Estrelas} valor=${nota} aoEscolher=${setNota} />
      <${Erro} texto=${erro} />
      <button type="button" class="btn primario" disabled=${!nota} onClick=${avaliar}>Enviar avaliação</button>
    </div>`}
    ${minha && oc.avaliacao && html`<div class="cartao"><strong>Sua avaliação</strong><${Estrelas} valor=${oc.avaliacao} /></div>`}
  </section>`;
}

function MMais() {
  return html`<section class="m-pagina">
    <h1 class="m-titulo">Mais</h1>
    <a class="cartao link com-icone" href="#morador.encomendas"><${QuadroIcone} nome="pacote" /><span><strong>Encomendas</strong><span class="sub">Na portaria e histórico de retiradas</span></span></a>
    <a class="cartao link com-icone" href="#morador.documentos"><${QuadroIcone} nome="documento" /><span><strong>Documentos</strong><span class="sub">Convenção, regimento, atas e laudos</span></span></a>
    <a class="cartao link com-icone" href="#morador.preferencias"><${QuadroIcone} nome="pessoa" /><span><strong>Minhas preferências</strong><span class="sub">Avisos de anúncios e situação de vendedor</span></span></a>

}

function MDocumentos({ estado }) {
  const [aberto, setAberto] = useState(null);
  const visiveis = estado.documentos.filter((d) => d.visibilidade === 'todos');
  const pastas = [...new Set(visiveis.map((d) => d.pasta))];
  const doc = aberto ? visiveis.find((d) => d.id === aberto) : null;
  if (doc) return html`<section class="m-pagina"><${PrevDoc} documento=${doc} aoFechar=${() => setAberto(null)} /></section>`;
  return html`<section class="m-pagina">
    <a class="voltar" href="#morador.mais">‹ Mais</a>
    <h1 class="m-titulo">Documentos</h1>
    ${pastas.map((p) => html`<div key=${p}>
      <h2>${p}</h2>
      <ul class="m-lista">${visiveis.filter((d) => d.pasta === p).map((d) => {
        const atual = d.versoes[d.versoes.length - 1];
        return html`<li key=${d.id}><button type="button" class="cartao link" onClick=${() => setAberto(d.id)}>
          <strong>${d.titulo}</strong>
          <small class="sub">Versão ${atual.versao} · ${fmtDataCurta(atual.data)}</small>
        </button></li>`;
      })}</ul>
    </div>`)}
  </section>`;
}

function MEncomendas({ estado, agora, eu }) {
  const minhas = estado.encomendas.filter((e) => e.unidade === eu);
  const aguardando = minhas.filter((e) => e.status === 'aguardando');
  const retiradas = minhas.filter((e) => e.status === 'retirada').sort((a, b) => b.retiradaEm.localeCompare(a.retiradaEm));
  return html`<section class="m-pagina">
    <a class="voltar" href="#morador.mais">‹ Mais</a>
    <h1 class="m-titulo">Encomendas</h1>
    <h2>Na portaria</h2>
    ${aguardando.length ? aguardando.map((e) => html`<${MCartaoEncomenda} key=${e.id} encomenda=${e} agora=${agora} />`) : html`<${Vazio} texto="Nada esperando por você." />`}
    <h2>Retiradas</h2>
    ${retiradas.length
      ? html`<ul class="m-lista">${retiradas.map((e) => html`<li key=${e.id} class="cartao"><strong>${e.transportadora}</strong><small class="sub">Retirada por ${e.retiradaPor} em ${fmtDataHora(e.retiradaEm)}</small></li>`)}</ul>`
      : html`<${Vazio} texto="Nenhuma retirada ainda." />`}

}

const SITUACAO_VENDEDOR = { nao: 'Você ainda não vende', pendente: 'Pedido para vender aguardando o síndico', aprovado: 'Vendedor aprovado', suspenso: 'Vendas suspensas pelo síndico' };

function MPreferencias({ estado, executar, eu }) {

// ---- src/ui/sindico.js ----

const MENU_SINDICO = [['inicio', 'Início', 'grafico'], ['reservas', 'Reservas', 'calendario'], ['comunicados', 'Comunicados', 'megafone'], ['ocorrencias', 'Ocorrências', 'prancheta'], ['documentos', 'Documentos', 'documento'], ['encomendas', 'Encomendas', 'pacote'], ['vendas', 'Vendas', 'loja']];
const MOTIVOS_RECUSA = ['Data reservada para manutenção', 'Conflito com evento do condomínio', 'Unidade com pendência no regulamento', 'Documentação incompleta'];
const FILTROS_OCORRENCIA = [['ativas', 'Em aberto'], ['todas', 'Todas'], ...FLUXO_OCORRENCIA.map((s) => [s, NOMES_STATUS[s]]), ['arquivadas', 'Arquivadas']];

function textoAlerta(alerta) {
  const n = Math.abs(alerta.dias);
  const dias = n === 1 ? '1 dia' : `${n} dias`;
  if (alerta.dias < 0) return `Vencido há ${dias}`;
  if (alerta.dias === 0) return 'Vence hoje';
  return `Vence em ${dias}`;
}

function textoPrazo(oc) {
  const sla = CATEGORIAS[oc.categoria].sla;
  if (!sla) return 'Sem prazo';
  return oc.status === 'aberta' ? `${sla} h para atender` : 'Atendida';
}

function tipoEtiquetaComunicado(c) {
  return c.tipo === 'urgente' ? 'perigo' : 'info';
}

function TelaSindico(props) {
  const tela = MENU_SINDICO.some(([id]) => id === props.rota.tela) ? props.rota.tela : 'inicio';
  const Conteudo = { inicio: SInicio, reservas: SReservas, comunicados: SComunicados, ocorrencias: SOcorrencias, documentos: SDocumentos, encomendas: SEncomendas, vendas: SVendas }[tela];
  return html`<div class="painel">
    <nav class="painel-menu" aria-label="Menu do síndico">
      <p class="painel-usuario"><strong>Roberto Lima</strong><small>Síndico · apto 801</small></p>
      ${MENU_SINDICO.map(([id, nome, icone]) => html`<a key=${id} href=${`#sindico.${id}`} class=${id === tela ? 'ativa' : ''} aria-current=${id === tela ? 'page' : undefined}><${Icone} nome=${icone} tamanho=${20} />${nome}</a>`)}
    </nav>
    <div class="painel-conteudo"><${Conteudo} ...${props} /></div>
  </div>`;
}

function SInicio({ estado, agora }) {
  const ind = indicadoresSindico(estado, agora);
  const pendentes = estado.reservas.filter((r) => r.status === 'pendente');
  const vencidas = estado.ocorrencias.filter((o) => slaVencido(o, agora));
  const paradas = estado.encomendas.filter((e) => encomendaParada(e, agora));
  const alertas = alertasDocumentos(estado.documentos, isoDia(agora));
  const vendedoresPendentes = estado.pessoas.filter((p) => p.vendedor === 'pendente');
  const pct = Math.round((ind.adesao.com / ind.adesao.total) * 100);
  const cartoes = [
    ['Reservas pendentes', ind.pendentes, '#sindico.reservas', ind.pendentes ? 'alerta' : 'ok', 'Aguardando sua aprovação', 'calendario'],
    ['Ocorrências abertas', ind.abertas, '#sindico.ocorrencias', ind.slaVencidas ? 'perigo' : 'info', ind.slaVencidas ? `${ind.slaVencidas} com prazo vencido` : 'Todas dentro do prazo', 'prancheta'],
    ['Encomendas paradas', ind.paradas, '#sindico.encomendas', ind.paradas ? 'alerta' : 'ok', 'Há mais de 3 dias na portaria', 'pacote'],
    ['Documentos vencendo', ind.vencendo, '#sindico.documentos', ind.vencendo ? 'perigo' : 'ok', 'Vencidos ou nos próximos 60 dias', 'documento'],
  ];
  const semPendencias = !pendentes.length && !vencidas.length && !paradas.length && !alertas.length && !vendedoresPendentes.length;
  return html`<section>
    <h1>Olá, Roberto</h1>
    <div class="indicadores">
      ${cartoes.map(([rotulo, valor, href, tipo, detalhe, icone]) => html`<a key=${rotulo} class=${`indicador ind-${tipo}`} href=${href}><${QuadroIcone} nome=${icone} cheio=${tipo === 'perigo' || tipo === 'alerta'} /><span class="ind-rotulo">${rotulo}</span><strong>${valor}</strong><small>${detalhe}</small></a>`)}
    </div>
    <div class="cartao adesao">
      <div class="linha-entre"><strong>Adesão dos moradores</strong><span>${ind.adesao.com} de ${ind.adesao.total} unidades com app</span></div>
      <div class="barra" role="progressbar" aria-label="Adesão" aria-valuenow=${pct} aria-valuemin="0" aria-valuemax="100"><span style=${`width:${pct}%`}></span></div>
      <small class="sub">Meta do piloto: 60% das unidades em 30 dias. Hoje: ${pct}%.</small>
    </div>
    <h2>Precisa da sua atenção</h2>
    ${semPendencias
      ? html`<${Vazio} texto="Nada pendente. Bom trabalho!" />`
      : html`<ul class="atencao">
          ${pendentes.map((r) => html`<li key=${r.id}><a href="#sindico.reservas">Aprovar reserva: ${areaPorId(estado, r.areaId).nome}, apto ${r.unidade}, ${fmtDia(r.data)}</a></li>`)}
          ${vencidas.map((o) => html`<li key=${o.id}><a href=${`#sindico.ocorrencias.${o.id}`}>Prazo vencido: ${o.id} · ${CATEGORIAS[o.categoria].nome}</a></li>`)}
          ${paradas.map((e) => html`<li key=${e.id}><a href="#sindico.encomendas">Encomenda parada: apto ${e.unidade}, chegou ${haQuanto(e.chegadaEm, agora)}</a></li>`)}
          ${alertas.map((a) => html`<li key=${a.documento.id}><a href="#sindico.documentos">${textoAlerta(a)}: ${a.documento.titulo}</a></li>`)}
          ${vendedoresPendentes.map((p) => html`<li key=${`v${p.unidade}`}><a href="#sindico.vendas">Aprovar vendedor: ${p.nome}, apto ${p.unidade}</a></li>`)}
        </ul>`}
  </section>`;
}

function SReservas({ estado, executar, agora }) {
  const hoje = isoDia(agora);
  const [areaId, setAreaId] = useState('salao');
  const [anoMes, setAnoMes] = useState(hoje.slice(0, 7));
  const [dia, setDia] = useState(hoje);
  const [recusando, setRecusando] = useState(null);
  const [motivo, setMotivo] = useState(MOTIVOS_RECUSA[0]);
  const [erro, setErro] = useState(null);
  const pendentes = estado.reservas.filter((r) => r.status === 'pendente').sort((a, b) => a.data.localeCompare(b.data));
  const doDia = estado.reservas.filter((r) => r.data === dia && r.areaId === areaId && r.status !== 'cancelada').sort((a, b) => a.inicio - b.inicio);
  const bloqueios = estado.bloqueios.filter((b) => b.data === dia && b.areaId === areaId);

  function aprovar(id) {
    const r = executar((e) => aprovarReserva(e, id));
    setErro(r.erro || null);
  }

  function recusar(id) {
    const r = executar((e) => recusarReserva(e, id, motivo));
    if (r.erro) {
      setErro(r.erro);
      return;
    }
    setRecusando(null);
    setErro(null);
  }

  return html`<section>
    <h1>Reservas</h1>
    <h2>Pendentes de aprovação</h2>
    <${Erro} texto=${erro} />
    ${pendentes.length
      ? html`<ul class="lista-cartoes">${pendentes.map((r) => html`<li key=${r.id} class="cartao">
          <div class="linha-entre"><strong>${areaPorId(estado, r.areaId).nome} · apto ${r.unidade}</strong><span>${fmtDia(r.data)}, ${fmtHora(r.inicio)}–${fmtHora(r.fim)}</span></div>
          <small class="sub">Solicitada ${haQuanto(r.criadaEm, agora)} · ${r.convidados.length} convidados · aprovação automática em 48 h se não houver resposta</small>
          ${recusando === r.id
            ? html`<div class="recusa">
                <${Campo} rotulo="Motivo da recusa"><select id=${`motivo-${r.id}`} value=${motivo} onChange=${(ev) => setMotivo(ev.target.value)}>${MOTIVOS_RECUSA.map((m) => html`<option key=${m} value=${m}>${m}</option>`)}</select><//>
                <button type="button" class="btn perigo" onClick=${() => recusar(r.id)}>Confirmar recusa</button>
                <button type="button" class="btn secundario" onClick=${() => setRecusando(null)}>Voltar</button>
              </div>`
            : html`<div class="acoes">
                <button type="button" class="btn primario" data-acao=${`aprovar-${r.id}`} onClick=${() => aprovar(r.id)}>Aprovar</button>
                <button type="button" class="btn secundario" data-acao=${`recusar-${r.id}`} onClick=${() => setRecusando(r.id)}>Recusar</button>

        </li>`)}</ul>`

    <div class="chips" role="group" aria-label="Área">
      ${estado.areas.map((a) => html`<button type="button" key=${a.id} class="chip" aria-pressed=${a.id === areaId} onClick=${() => setAreaId(a.id)}>${a.nome}</button>`)}
    </div>
    <div class="agenda">
      <${Calendario} anoMes=${anoMes} statusDe=${(iso) => statusDia(estado, areaId, iso)} selecionado=${dia} aoEscolher=${setDia} aoMudarMes=${(n) => setAnoMes(somarMes(anoMes, n))} />
      <div>
        <h3>${fmtDia(dia)}</h3>
        ${bloqueios.map((b) => html`<p key=${b.id} class="cartao bloqueio">Bloqueado ${fmtHora(b.inicio)}–${fmtHora(b.fim)}: ${b.motivo}</p>`)}
        ${doDia.length
          ? html`<ul class="lista-cartoes">${doDia.map((r) => html`<li key=${r.id} class="cartao"><div class="linha-entre"><span>${fmtHora(r.inicio)}–${fmtHora(r.fim)} · apto ${r.unidade}</span><${EtqReserva} status=${r.status} /></div></li>`)}</ul>`
          : !bloqueios.length && html`<${Vazio} texto="Nenhuma reserva neste dia." />`}
      </div>
    </div>
    <h2>Regras das áreas</h2>
    <div class="tabela-rolagem"><table class="tabela">
      <thead><tr><th>Área</th><th>Tipo</th><th>Taxa</th><th>Aprovação</th><th>Antecedência</th><th>Limite</th></tr></thead>
      <tbody>${estado.areas.map((a) => html`<tr key=${a.id}>
        <td>${a.nome}</td>
        <td>${a.tipo === 'periodo' ? 'Período' : 'Por hora'}</td>
        <td>${a.taxa ? fmtMoeda(a.taxa) : '—'}</td>
        <td>${a.aprovacao === 'manual' ? 'Manual' : 'Automática'}</td>
        <td>${a.antecedenciaMin} a ${a.antecedenciaMax} dias</td>
        <td>${a.limiteMes ? `${a.limiteMes} por mês` : 'Sem limite'}</td>
      </tr>`)}</tbody>
    </table></div>
  </section>`;
}

function BarraLeitura({ lidas, total }) {
  const pct = total ? Math.round((lidas / total) * 100) : 0;
  return html`<div class="leitura">
    <div class="barra" role="progressbar" aria-label="Leitura" aria-valuenow=${pct} aria-valuemin="0" aria-valuemax="100"><span style=${`width:${pct}%`}></span></div>
    <small class="sub">${lidas} de ${total} unidades leram</small>
  </div>`;
}

function SComunicados(props) {
  const { estado, rota } = props;
  if (rota.id === 'novo') return html`<${SNovoComunicado} executar=${props.executar} />`;
  const c = rota.id ? estado.comunicados.find((x) => x.id === rota.id) : null;
  if (c) return html`<${SDetalheComunicado} estado=${estado} c=${c} />`;
  const lista = [...estado.comunicados].sort((a, b) => b.publicadoEm.localeCompare(a.publicadoEm));
  return html`<section>
    <div class="linha-entre"><h1>Comunicados</h1><a class="btn primario" href="#sindico.comunicados.novo">Novo comunicado</a></div>

      <div class="linha-entre"><span class="etq-linha"><${Etiqueta} tipo=${tipoEtiquetaComunicado(x)}>${TIPOS_COMUNICADO[x.tipo]}<//>${x.fixado && html`<small class="fixado"><${Icone} nome="alfinete" tamanho=${16} />Fixado</small>`}</span><small class="sub">${fmtDataHora(x.publicadoEm)}</small></div>
      <strong>${x.titulo}</strong>

}

function SNovoComunicado({ executar }) {
  const [tipo, setTipo] = useState('geral');
  const [titulo, setTitulo] = useState(MODELOS_COMUNICADO.geral.titulo);
  const [texto, setTexto] = useState(MODELOS_COMUNICADO.geral.texto);
  const [publicoTipo, setPublicoTipo] = useState('todos');
  const [andar, setAndar] = useState('1');
  const [unidades, setUnidades] = useState('');
  const [canais, setCanais] = useState(['push', 'email', 'whatsapp']);
  const [fixado, setFixado] = useState(false);
  const [anexo, setAnexo] = useState(null);
  const [erro, setErro] = useState(null);
  const urgente = tipo === 'urgente';

  function trocarTipo(novo) {
    setTipo(novo);
    setTitulo(MODELOS_COMUNICADO[novo].titulo);
    setTexto(MODELOS_COMUNICADO[novo].texto);
  }

  function alternarCanal(k) {
    setCanais(canais.includes(k) ? canais.filter((x) => x !== k) : [...canais, k]);
  }

  function publicar() {
    let publico = { tipo: 'todos' };
    if (publicoTipo === 'andar') publico = { tipo: 'andar', valor: andar };
    if (publicoTipo === 'unidades') publico = { tipo: 'unidades', valor: unidades.split(/[\s,;]+/).filter(Boolean) };
    const r = executar((e) => publicarComunicado(e, { tipo, titulo, texto, publico, canais, fixado, anexo }, new Date()));
    if (r.erro) {
      setErro(r.erro);
      return;
    }
    ir('sindico', 'comunicados', r.id);
  }

  return html`<section class="formulario">
    <a class="voltar" href="#sindico.comunicados">‹ Comunicados</a>
    <h1>Novo comunicado</h1>
    <${Campo} rotulo="Tipo" dica="Trocar o tipo preenche um modelo pronto."><select id="comunicado-tipo" value=${tipo} onChange=${(ev) => trocarTipo(ev.target.value)}>${Object.entries(TIPOS_COMUNICADO).map(([id, nome]) => html`<option key=${id} value=${id}>${nome}</option>`)}</select><//>
    <${Campo} rotulo="Título"><input id="comunicado-titulo" value=${titulo} onInput=${(ev) => setTitulo(ev.target.value)} /><//>
    <${Campo} rotulo="Texto"><textarea id="comunicado-texto" rows="7" value=${texto} onInput=${(ev) => setTexto(ev.target.value)}></textarea><//>
    <fieldset>
      <legend>Público</legend>
      ${[['todos', 'Todo o condomínio'], ['andar', 'Um andar'], ['unidades', 'Unidades específicas']].map(([id, nome]) => html`<label key=${id} class="check"><input id=${`publico-${id}`} type="radio" name="publico" checked=${publicoTipo === id} onChange=${() => setPublicoTipo(id)} /><span>${nome}</span></label>`)}
      ${publicoTipo === 'andar' && html`<${Campo} rotulo="Andar"><select id="comunicado-andar" value=${andar} onChange=${(ev) => setAndar(ev.target.value)}>${[1, 2, 3, 4, 5, 6, 7, 8].map((n) => html`<option key=${n} value=${String(n)}>${n}º andar</option>`)}</select><//>`}
      ${publicoTipo === 'unidades' && html`<${Campo} rotulo="Unidades" dica="Separe por vírgula. Ex.: 302, 303"><input id="comunicado-unidades" value=${unidades} onInput=${(ev) => setUnidades(ev.target.value)} /><//>`}
    </fieldset>
    <fieldset>
      <legend>Canais</legend>
      ${Object.entries(NOMES_CANAL).map(([k, nome]) => {
        const travado = k === 'sms' && urgente;
        return html`<label key=${k} class="check"><input id=${`canal-${k}`} type="checkbox" checked=${travado || canais.includes(k)} disabled=${travado} onChange=${() => alternarCanal(k)} /><span>${nome}${travado ? ' (obrigatório em urgentes)' : ''}</span></label>`;
      })}
    </fieldset>
    <label class="check"><input id="comunicado-fixar" type="checkbox" checked=${fixado} onChange=${(ev) => setFixado(ev.target.checked)} /><span>Fixar no topo</span></label>
    ${anexo
      ? html`<p class="anexo"><${Icone} nome="clipe" tamanho=${18} />${anexo} <button type="button" class="btn-link" onClick=${() => setAnexo(null)}>remover</button></p>`
      : html`<button type="button" class="btn secundario" onClick=${() => setAnexo('comunicado-anexo.pdf')}>Anexar PDF</button>`}
    <${Erro} texto=${erro} />
    <button type="button" class="btn primario" onClick=${publicar}>Publicar comunicado</button>
  </section>`;
}

function SOcorrencias(props) {
  const { estado, rota, agora } = props;
  const [filtro, setFiltro] = useState('ativas');
  const oc = rota.id ? estado.ocorrencias.find((o) => o.id === rota.id) : null;
  if (oc) return html`<${SDetalheOcorrencia} executar=${props.executar} agora=${agora} oc=${oc} />`;
  const lista = estado.ocorrencias
    .filter((o) => {
      if (filtro === 'arquivadas') return o.arquivada;
      if (o.arquivada) return false;
      if (filtro === 'todas') return true;
      if (filtro === 'ativas') return !['resolvida', 'fechada'].includes(o.status);
      return o.status === filtro;
    })
    .sort((a, b) => b.criadaEm.localeCompare(a.criadaEm));
  return html`<section>
    <h1>Ocorrências</h1>
    <div class="formulario"><${Campo} rotulo="Mostrar"><select id="ocorrencias-filtro" value=${filtro} onChange=${(ev) => setFiltro(ev.target.value)}>${FILTROS_OCORRENCIA.map(([id, nome]) => html`<option key=${id} value=${id}>${nome}</option>`)}</select><//></div>
    <div class="tabela-rolagem"><table class="tabela">
      <thead><tr><th>Protocolo</th><th>Categoria</th><th>Unidade</th><th>Status</th><th>Prazo</th><th>Aberta</th></tr></thead>
      <tbody>${lista.map((o) => html`<tr key=${o.id} class="clicavel" onClick=${() => ir('sindico', 'ocorrencias', o.id)}>
        <td><a href=${`#sindico.ocorrencias.${o.id}`}>${o.id}</a></td>
        <td>${CATEGORIAS[o.categoria].nome}${o.publica && html` <${Etiqueta}>Pública<//>`}</td>
        <td>${o.anonima ? 'Anônima' : o.unidade}</td>
        <td><${EtqOcorrencia} status=${o.status} arquivada=${o.arquivada} /></td>
        <td>${slaVencido(o, agora) ? html`<${Etiqueta} tipo="perigo">Vencido<//>` : textoPrazo(o)}</td>
        <td>${haQuanto(o.criadaEm, agora)}</td>
      </tr>`)}</tbody>
    </table></div>
    ${!lista.length && html`<${Vazio} texto="Nenhuma ocorrência neste filtro." />`}
  </section>`;
}

function SDetalheOcorrencia({ executar, agora, oc }) {
  const [texto, setTexto] = useState('');
  const [erro, setErro] = useState(null);
  const acoes = acoesOcorrencia(oc);

  function fazer(acao) {
    const r = executar((e) => {
      if (acao === 'avancar') return avancarOcorrencia(e, oc.id, new Date(), texto);
      if (acao === 'comentar') return comentarOcorrencia(e, oc.id, texto, new Date());
      return arquivarOcorrencia(e, oc.id);
    });
    if (r.erro) {
      setErro(r.erro);
      return;
    }
    setErro(null);
    setTexto('');
  }

  return html`<section>
    <a class="voltar" href="#sindico.ocorrencias">‹ Ocorrências</a>
    <p class="protocolo">Protocolo ${oc.id}</p>
    <div class="linha-entre"><h1>${CATEGORIAS[oc.categoria].nome}</h1><${EtqOcorrencia} status=${oc.status} arquivada=${oc.arquivada} /></div>
    <p class="sub">${oc.anonima ? 'Autor anônimo' : `Apto ${oc.unidade}`}${oc.local ? ` · ${oc.local}` : ''} · aberta ${haQuanto(oc.criadaEm, agora)}${slaVencido(oc, agora) ? ' · prazo vencido' : ''}</p>
    <p class="texto-longo">${oc.descricao}</p>
    ${oc.foto && html`<${FotoFalsa} rotulo="Foto enviada pelo morador" />`}
    ${oc.publica && html`<p class="sub">Pública · ${oc.eutambem.length} moradores marcaram "eu também"</p>`}
    ${oc.avaliacao && html`<div><span class="sub">Avaliação do morador</span><${Estrelas} valor=${oc.avaliacao} /></div>`}
    <h2>Linha do tempo</h2>
    <${LinhaTempo} linha=${oc.linha} />
    ${acoes.length
      ? html`<div class="cartao">
          <${Campo} rotulo="Mensagem ao morador" dica="Opcional ao mudar o status; obrigatória para comentar."><textarea id="ocorrencia-mensagem" rows="2" value=${texto} onInput=${(ev) => setTexto(ev.target.value)}></textarea><//>
          <${Erro} texto=${erro} />
          <div class="acoes">${acoes.map((a) => html`<button type="button" key=${a.id} class=${a.id === 'avancar' ? 'btn primario' : 'btn secundario'} onClick=${() => fazer(a.id)}>${a.rotulo}</button>`)}</div>
        </div>`
      : html`<p class="sub">Ocorrência arquivada. O histórico fica guardado para auditoria e não pode ser apagado.</p>`}
  </section>`;
}

function SDocumentos({ estado, agora }) {
  const [busca, setBusca] = useState('');
  const [aberto, setAberto] = useState(null);
  const [historico, setHistorico] = useState(null);
  const alertas = alertasDocumentos(estado.documentos, isoDia(agora));
  const termo = busca.trim().toLowerCase();
  const docs = estado.documentos.filter((d) => !termo || d.titulo.toLowerCase().includes(termo) || d.pasta.toLowerCase().includes(termo));
  const pastas = [...new Set(docs.map((d) => d.pasta))];
  const doc = aberto ? estado.documentos.find((d) => d.id === aberto) : null;
  if (doc) return html`<section><${PrevDoc} documento=${doc} aoFechar=${() => setAberto(null)} /></section>`;
  return html`<section>
    <h1>Documentos</h1>
    ${alertas.length > 0 && html`<div class="alertas">${alertas.map((a) => html`<p key=${a.documento.id} class=${`alerta-doc faixa-${a.faixa}`}><strong>${textoAlerta(a)}</strong> · ${a.documento.titulo} (${fmtDataCurta(a.documento.vencimento)})</p>`)}</div>`}
    <div class="formulario"><${Campo} rotulo="Buscar documento"><input id="documentos-busca" type="search" value=${busca} onInput=${(ev) => setBusca(ev.target.value)} placeholder="Ex.: ata, AVCB, regimento" /><//></div>
    ${pastas.map((p) => html`<div key=${p}>
      <h2>${p}</h2>
      <ul class="lista-cartoes">${docs.filter((d) => d.pasta === p).map((d) => {
        const atual = d.versoes[d.versoes.length - 1];
        return html`<li key=${d.id} class="cartao">
          <div class="linha-entre"><button type="button" class="btn-link" onClick=${() => setAberto(d.id)}>${d.titulo}</button>${d.visibilidade === 'conselho' && html`<${Etiqueta}>Só conselho<//>`}</div>
          <small class="sub">Vigente: versão ${atual.versao} de ${fmtDataCurta(atual.data)}${d.vencimento ? ` · vence em ${fmtDataCurta(d.vencimento)}` : ''}</small>
          ${d.versoes.length > 1 && html`<button type="button" class="btn-link" onClick=${() => setHistorico(historico === d.id ? null : d.id)}>${historico === d.id ? 'Ocultar histórico' : `Histórico (${d.versoes.length} versões)`}</button>`}
          ${historico === d.id && html`<ul class="historico">${[...d.versoes].reverse().map((v) => html`<li key=${v.versao}>Versão ${v.versao} · ${fmtDataCurta(v.data)}</li>`)}</ul>`}
        </li>`;
      })}</ul>
    </div>`)}
    ${!docs.length && html`<${Vazio} texto="Nenhum documento encontrado." />`}
  </section>`;
}
